name: Remove tool mode and scope Timeline sources

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_remove_tool_mode_scope_timeline_v1.py'
      - '.github/workflows/apply-remove-tool-mode-scope-timeline-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply optimizer and Timeline cleanup
        run: python scripts/patch_remove_tool_mode_scope_timeline_v1.py
      - name: Verify removed policy and scoped source footer
        shell: bash
        run: |
          grep -q 'REMOVE_TOOL_MODE_SCOPE_TIMELINE_V1' index.html
          grep -q 'Best overall acquisition efficiency' index.html
          grep -q 'class="timelineSources"' index.html
          grep -q "title:'Witching Hours'" index.html
          grep -q "title:'Crossed Paths'" index.html
          ! grep -q 'preserveRealmTools' index.html
          ! grep -q 'REALM_SAVED_TOOL_EFFICIENCY_HURDLE' index.html
          ! grep -q 'REALM_PAID_REFRESH_EFFICIENCY_HURDLE' index.html
          ! grep -q 'acquisitionEffortWinsAfterToolHurdle' index.html
          ! grep -q 'Minimize tools' index.html
      - name: Install browser smoke dependency
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Run site runtime smoke
        run: node scripts/site_smoke_test.mjs
      - name: Remove obsolete Minimize-tools audit harness
        shell: bash
        run: rm -f scripts/minimize_tools_audit.mjs .github/workflows/minimize-tools-audit.yml
      - name: Commit generated cleanup
        shell: bash
        run: |
          if git diff --quiet -- index.html scripts/minimize_tools_audit.mjs .github/workflows/minimize-tools-audit.yml; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A index.html scripts/minimize_tools_audit.mjs .github/workflows/minimize-tools-audit.yml
          git commit -m 'Remove Minimize tools mode and scope Timeline sources'
          git push origin HEAD:main
