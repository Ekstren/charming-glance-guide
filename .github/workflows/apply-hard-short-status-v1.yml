name: Apply hard short status styling

on:
  push:
    paths:
      - '.github/workflows/apply-hard-short-status-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply hard short status
        run: python .github/patch-hard-short-status-v1.py
      - name: Verify
        run: |
          grep -q 'HARD_SHORT_STATUS_V1' index.html
          grep -q 'Extra ${itemName} will not cover requirements' index.html
          grep -q "line2Class='hardShort'" index.html
          ! grep -q 'Still short:' index.html
      - name: Commit generated index
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Style hard resource shortfalls as errors'
          git push
