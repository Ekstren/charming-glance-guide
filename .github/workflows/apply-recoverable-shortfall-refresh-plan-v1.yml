name: Apply recoverable shortfall refresh plan

on:
  push:
    paths:
      - '.github/workflows/apply-recoverable-shortfall-refresh-plan-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply refresh-plan messaging
        run: python .github/patch-recoverable-shortfall-refresh-plan-v1.py
      - name: Verify
        run: |
          grep -q 'RECOVERABLE_SHORTFALL_REFRESH_PLAN_V1' index.html
          grep -q 'Hammers needed' index.html || true
          grep -q 'Recommended:' index.html
          grep -q 'Goal is achievable with the recommended Material Realm refresh plan' index.html
          grep -q 'hard short · Extra' index.html
      - name: Commit generated index
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Show recommended Realm plan on recoverable shortages'
          git push
