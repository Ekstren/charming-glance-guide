name: Site runtime smoke

on:
  push:
    paths:
      - 'index.html'
      - 'scripts/site_smoke_test.mjs'
      - 'scripts/guardian_valor_smoke.mjs'
      - 'scripts/build_swap_smoke.mjs'
      - '.github/workflows/site-runtime-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium
      - name: Run browser smoke test
        run: node scripts/site_smoke_test.mjs
      - name: Run Guardian Valor smoke
        run: node scripts/guardian_valor_smoke.mjs
      - name: Run all-build swap smoke
        run: node scripts/build_swap_smoke.mjs
