name: Apply Realm purchase and shop restock labels

on:
  push:
    paths:
      - 'scripts/patch_purchase_restock_labels_v1.py'
      - '.github/workflows/apply-purchase-restock-labels-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply terminology patch
        run: python scripts/patch_purchase_restock_labels_v1.py
      - name: Verify labels
        run: |
          grep -q 'Daily Realm purchase plan' index.html
          grep -q 'Ore Realm purchases / day' index.html
          grep -q 'Shop restocks / day' index.html
          grep -q 'PURCHASE_RESTOCK_LABELS_V1' index.html
      - name: Commit generated index
        run: |
          git config user.name 'ekstren'
          git config user.email '38091958+Ekstren@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Rename Realm refreshes to purchases and shop refreshes to restocks'
          git push
