name: Apply Cabbage Dog collab confirmation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-veggie-cabbage-dog-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply Cabbage Dog collab update
        run: python .github/patch-veggie-cabbage-dog-v1.py
      - name: Verify
        run: |
          grep -q 'Vegetables Fairy Part Two · Cabbage Dog' index.html
          grep -q 'Do not change Main/Alt build recommendations until the live Global release' index.html
      - name: Commit generated index
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Identify Cabbage Dog in confirmed collab'
          git push
