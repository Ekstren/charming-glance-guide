name: Modernize whole site v1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/modernize_site_structure_v1.py'
      - 'scripts/site_refactor_equivalence_v1.mjs'
      - 'scripts/check_timeline_duplicates.py'
      - '.github/workflows/modernize-whole-site-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  modernize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Snapshot current production site
        run: |
          mkdir -p /tmp/charming-before
          cp index.html /tmp/charming-before/index.html
          cp -a assets /tmp/charming-before/assets
          echo "BEFORE_INDEX_BYTES=$(wc -c < index.html)" >> "$GITHUB_ENV"
          echo "BEFORE_WORKFLOWS=$(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | wc -l)" >> "$GITHUB_ENV"
          echo "BEFORE_STYLES=$(grep -oi '<style\b' index.html | wc -l)" >> "$GITHUB_ENV"
          echo "BEFORE_INLINE_SCRIPTS=$(python3 - <<'PY'
          import re
          s=open('index.html',encoding='utf-8').read()
          print(sum(1 for m in re.finditer(r'<script\b([^>]*)>.*?</script>',s,re.S|re.I) if not re.search(r'\bsrc\s*=',m.group(1),re.I)))
          PY
          )" >> "$GITHUB_ENV"

      - name: Correct extraction ownership and body styles
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/modernize_site_structure_v1.py')
          s=p.read_text(encoding='utf-8')
          replacements={
            "if git diff --quiet -- assets/runtime.js; then":"if git diff --quiet -- assets/builds.js; then",
            "grep -Fq 'PANDARIAL_RELEASE_V1' assets/runtime.js":"grep -Fq 'PANDARIAL_RELEASE_V1' assets/builds.js",
            "grep -Fq \"pick('Pandarial','Burst/front-load alt\" assets/runtime.js":"grep -Fq \"pick('Pandarial','Burst/front-load alt\" assets/builds.js",
            "grep -Fq \"pick('Pandarial','Main aggressive Guardian lead\" assets/runtime.js":"grep -Fq \"pick('Pandarial','Main aggressive Guardian lead\" assets/builds.js",
            "grep -Fq \"pick('Pandarial','Main healer/hybrid lead\" assets/runtime.js":"grep -Fq \"pick('Pandarial','Main healer/hybrid lead\" assets/builds.js",
            "git add assets/runtime.js":"git add assets/builds.js",
            "- Pandarial recommendations remain staged until the Oct 14 release gate and update `assets/runtime.js`.":"- Pandarial recommendations remain staged until the Oct 14 release gate and update `assets/builds.js`.",
            "new = \"TARGETS = [ROOT / 'assets' / 'runtime.js']\"":"new = \"TARGETS = [ROOT / 'assets' / 'builds.js']\"",
            "if 'const FANTO={' not in runtime:\n        raise SystemExit('Pandarial FANTO source did not land in assets/runtime.js')":"if 'const FANTO={' not in builds:\n        raise SystemExit('Pandarial FANTO source did not land in assets/builds.js')",
          }
          for old,new in replacements.items():
            if old not in s:
              raise SystemExit(f'missing correction anchor: {old}')
            s=s.replace(old,new)

          start=s.index('def externalize_css(text: str) -> str:')
          end=s.index('\ndef externalize_js(text: str) -> str:', start)
          new_css=r'''def externalize_css(text: str) -> str:
              tag_re = re.compile(r'<style\b([^>]*)>(.*?)</style>|<link\b([^>]*\brel=["\']stylesheet["\'][^>]*)>', re.S | re.I)
              parts = []
              matches = []
              for m in tag_re.finditer(text):
                  if m.group(2) is not None:
                      attrs, body = m.group(1), m.group(2)
                      sid = re.search(r'\bid=["\']([^"\']+)', attrs or '', re.I)
                      label = sid.group(1) if sid else 'legacy-base'
                      parts.append(f'\n/* ---- {label} ---- */\n{body.strip()}\n')
                      matches.append(m)
                  else:
                      attrs = m.group(3) or ''
                      href = re.search(r'\bhref=["\']([^"\']+)', attrs, re.I)
                      if not href:
                          raise SystemExit('Stylesheet link without href')
                      href = href.group(1)
                      if href != 'assets/build-layout-icons-v1.css':
                          raise SystemExit(f'Unexpected stylesheet during consolidation: {href}')
                      source = ROOT / href
                      if not source.exists():
                          raise SystemExit(f'Missing stylesheet: {href}')
                      parts.append(f'\n/* ---- build layout icons ---- */\n{source.read_text(encoding="utf-8").strip()}\n')
                      matches.append(m)
              style_count = sum(1 for m in matches if m.group(2) is not None)
              if style_count < 50:
                  raise SystemExit(f'Expected layered legacy CSS; found only {style_count} style tags')
              ASSETS.mkdir(exist_ok=True)
              (ASSETS / 'site.css').write_text(''.join(parts).lstrip(), encoding='utf-8')
              out=[]; cursor=0; first=True
              for m in matches:
                  out.append(text[cursor:m.start()])
                  if first:
                      out.append('<link rel="stylesheet" href="assets/site.css">')
                      first=False
                  cursor=m.end()
              out.append(text[cursor:])
              return ''.join(out)
          '''
          import textwrap
          s=s[:start]+textwrap.dedent(new_css)+s[end:]
          p.write_text(s,encoding='utf-8')
          PY

      - name: Externalize and consolidate runtime
        run: python3 scripts/modernize_site_structure_v1.py --refactor

      - name: Validate extracted architecture
        run: |
          test -s assets/site.css
          test -s assets/runtime.js
          test -s assets/companions.js
          test -s assets/builds.js
          grep -Fq '<link rel="stylesheet" href="assets/site.css">' index.html
          grep -Fq '<script src="assets/runtime.js"></script>' index.html
          grep -Fq '<script src="assets/companions.js"></script>' index.html
          grep -Fq '<script src="assets/builds.js"></script>' index.html
          grep -Fq 'assets/build-layout-icons-v1.js' index.html
          test "$(grep -oi '<style\b' index.html | wc -l)" -eq 0
          python3 - <<'PY'
          import re
          s=open('index.html',encoding='utf-8').read()
          inline=sum(1 for m in re.finditer(r'<script\b([^>]*)>.*?</script>',s,re.S|re.I) if not re.search(r'\bsrc\s*=',m.group(1),re.I))
          assert inline==0, inline
          print('0 inline scripts')
          PY
          node --check assets/runtime.js
          node --check assets/companions.js
          node --check assets/builds.js
          node --check assets/build-layout-icons-v1.js
          python3 -m py_compile scripts/activate_pandarial_build_prep_v1.py scripts/activate_warlords_rest_roll_guide_v1.py
          grep -Fq "TARGETS = [ROOT / 'assets' / 'builds.js']" scripts/activate_pandarial_build_prep_v1.py
          grep -Fq "FILES = [Path('assets/builds.js'), Path('scripts/patch_build_roll_guide_v2.py')]" scripts/activate_warlords_rest_roll_guide_v1.py

      - name: Install browser dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Require exact pre/post visual equivalence
        run: node scripts/site_refactor_equivalence_v1.mjs /tmp/charming-before/index.html index.html

      - name: Run runtime regressions before pruning
        run: |
          python3 scripts/check_timeline_duplicates.py index.html
          node scripts/calculator_perf_check.mjs
          node scripts/build_swap_smoke.mjs
          node scripts/build_visual_stability_benchmark_v2.mjs | tee /tmp/build-visual.log
          python3 - <<'PY'
          import json
          line=next(x for x in open('/tmp/build-visual.log',encoding='utf-8') if x.startswith('BUILD_VISUAL_JSON='))
          row=json.loads(line.split('=',1)[1]); n=row['switches']
          assert not row['errors'], row['errors']
          assert row['immediateFullyReady']==n and row['firstFrameStable']==n and row['zeroTabTransition']==n and row['maxHeightDelta']==0, row
          print(f'Build visual stability exact: {n}/{n}, 0px shift')
          PY
          node scripts/site_smoke_test.mjs

      - name: Prune historical patch machinery
        run: python3 scripts/modernize_site_structure_v1.py --prune

      - name: Validate lean repository
        run: |
          test "$(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | wc -l)" -eq 4
          for f in site-ci.yml pandarial-build-release-trigger.yml sxs-discord-feed.yml warlords-rest-roll-guide-trigger.yml; do test -f ".github/workflows/$f"; done
          test ! -e .github/build-fantomons-inject.html
          test ! -e .github/build-role-toggle-inject.html
          test ! -e assets/build-layout-icons-v1.css
          test ! -e data/site-cleanup-audit.txt
          test ! -e build-fantomons.trigger
          test -f .github/build-maintenance.md
          python3 scripts/check_timeline_duplicates.py index.html
          node --check assets/runtime.js
          node --check assets/companions.js
          node --check assets/builds.js
          node --check assets/build-layout-icons-v1.js
          python3 -m py_compile scripts/fetch_discord_feed.py scripts/activate_pandarial_build_prep_v1.py scripts/validate_pandarial_build_prep_v1.py scripts/activate_warlords_rest_roll_guide_v1.py scripts/validate_warlords_rest_roll_guide_v1.py scripts/patch_build_roll_guide_v2.py
          python3 -m json.tool data/pandarial-build-prep-v1.json >/dev/null
          python3 -m json.tool data/warlords-rest-roll-guide-v1.json >/dev/null

      - name: Run final browser regressions
        run: |
          node scripts/calculator_perf_check.mjs
          node scripts/build_swap_smoke.mjs
          node scripts/site_smoke_test.mjs

      - name: Report cleanup metrics
        run: |
          echo "Before index: $BEFORE_INDEX_BYTES bytes · after: $(wc -c < index.html) bytes"
          echo "Before styles: $BEFORE_STYLES inline · after: $(grep -oi '<style\b' index.html | wc -l) inline"
          echo "Before inline scripts: $BEFORE_INLINE_SCRIPTS · after: 0"
          echo "Before workflows: $BEFORE_WORKFLOWS · lean target: $(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | wc -l)"
          echo "Maintained scripts: $(find scripts -maxdepth 1 -type f | wc -l)"
          echo "Assets:"
          ls -lh assets

      - name: Publish validated cleanup candidate branch
        run: |
          set -euo pipefail
          # Preserve the four generated canonical workflows outside .github so the
          # connected maintainer can install them atomically after validation.
          rm -rf .migration-workflows
          mkdir .migration-workflows
          cp .github/workflows/*.yml .migration-workflows/

          # The Actions token is intentionally not allowed to rewrite workflow files.
          # Restore the current workflow tree so this candidate contains zero workflow
          # changes, then publish it to a non-main branch.
          rm -rf .github/workflows
          git checkout HEAD -- .github/workflows

          # Test-only dependencies/cache must never enter the repository.
          rm -rf node_modules scripts/__pycache__
          rm -f package.json package-lock.json
          find . -name '*.pyc' -delete

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Prepare validated modular site cleanup candidate'
          git push --force origin HEAD:refs/heads/site-cleanup-candidate
