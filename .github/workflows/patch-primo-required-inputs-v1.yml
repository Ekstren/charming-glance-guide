name: Repair runtime viewer-time syntax

on:
  push:
    paths:
      - .github/workflows/patch-primo-required-inputs-v1.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair broken viewer-local timezone strings
        run: python3 scripts/fix_runtime_viewer_apostrophe_v1.py
      - name: Verify runtime JavaScript syntax
        run: node --check assets/runtime.js
      - name: Commit repaired runtime
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Ekstren@users.noreply.github.com'
          git add assets/runtime.js
          git commit -m 'Fix viewer-local time runtime syntax'
          git push origin HEAD:main
