name: Runtime smoke test

on:
  push:
    paths:
      - .github/workflows/patch-primo-required-inputs-v1.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check runtime JavaScript syntax
        run: node --check assets/runtime.js
      - name: Check required startup hooks
        run: |
          grep -q "setupNavigation();" assets/runtime.js
          grep -q "setupTimeline();" assets/runtime.js
          grep -q "setupCalculator();" assets/runtime.js
          grep -q '<script src="assets/runtime.js"></script>' index.html
