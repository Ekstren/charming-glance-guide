name: Fix regular goal progress window

# REGULAR_GOAL_PROGRESS_V1_WORKFLOW
on:
  push:
    paths:
      - .github/workflows/patch-primo-required-inputs-v1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply regular goal progress fix
        run: python3 scripts/patch_regular_goal_progress_v1.py
      - name: Verify runtime JavaScript syntax
        run: node --check assets/runtime.js
      - name: Verify progress job hooks
        run: |
          grep -q 'REGULAR_GOAL_PROGRESS_V1' assets/runtime.js
          grep -q 'queueRegularGoalOptimizerProgress' assets/runtime.js
          grep -q 'Preparing goal calculation' assets/runtime.js
          grep -q 'Searching .* Primostar upgrade combinations' assets/runtime.js
          grep -q 'COOPERATIVE_OPTIMIZER_BOOTSTRAP_V2' assets/runtime.js
      - name: Commit verified site changes
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898258+github-actions[bot]@users.noreply.github.com'
          git add assets/runtime.js
          git commit -m 'Show cancellable progress for regular Primostar goals'
          git push origin HEAD:main
