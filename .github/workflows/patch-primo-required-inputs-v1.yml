name: Patch S2 auto-reset and 680 default v1

on:
  push:
    paths:
      - .github/workflows/patch-primo-required-inputs-v1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply S2 auto-reset and target defaults patch
        run: python3 scripts/patch_s2_autoreset_and_680_v1.py
      - name: Commit S2 calculator behavior
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Ekstren@users.noreply.github.com'
          git add assets/runtime.js index.html
          git commit -m 'Auto-reset stale S1 calculator state and default target to 680'
          git push origin HEAD:main
