name: Fast no-extra Finish Early Max

on:
  push:
    paths:
      - .github/workflows/patch-primo-required-inputs-v1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fast no-extra Finish Early Max patch
        run: python3 scripts/patch_finish_early_max_fast_noextra_v3.py
      - name: Verify runtime JavaScript syntax
        run: node --check assets/runtime.js
      - name: Verify patch markers
        run: |
          grep -q 'FINISH_EARLY_MAX_FAST_NOEXTRA_V3' assets/runtime.js
          grep -q 'id="finishEarlyMax"' index.html
      - name: Commit verified site changes
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Ekstren@users.noreply.github.com'
          git add index.html assets/runtime.js
          git commit -m 'Make Finish Early Max fast and no-extra-purchase'
          git push origin HEAD:main
