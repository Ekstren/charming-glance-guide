name: Finish Early Max + device timezone

# DEPLOY_VERIFIED_MAX_TIMEZONE_V2
on:
  push:
    paths:
      - .github/workflows/patch-primo-required-inputs-v1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Finish Early Max and device timezone patch
        run: python3 scripts/patch_finish_early_max_timezone_v2.py
      - name: Verify runtime JavaScript syntax
        run: node --check assets/runtime.js
      - name: Verify patch markers
        run: |
          grep -q 'FINISH_EARLY_MAX_V2' assets/runtime.js
          grep -q 'VIEWER_DEVICE_TIMEZONE_V2' assets/runtime.js
          grep -q 'id="finishEarlyMax"' index.html
      - name: Commit verified site changes
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Ekstren@users.noreply.github.com'
          git add index.html assets/runtime.js assets/site.css
          git commit -m 'Restore Finish Early Max and enforce device-local times'
          git push origin HEAD:main
