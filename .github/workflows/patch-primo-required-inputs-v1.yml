name: Fix goal switching and optimizer prep

# GOAL_CHANGE_FINISH_EARLY_RESET_V1_WORKFLOW
on:
  push:
    paths:
      - .github/workflows/patch-primo-required-inputs-v1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply goal switching and optimizer prep fix
        run: python3 scripts/patch_goal_switch_reset_v1.py
      - name: Verify runtime JavaScript syntax
        run: node --check assets/runtime.js
      - name: Verify target reset and responsive prep hooks
        run: |
          grep -q 'GOAL_CHANGE_FINISH_EARLY_RESET_V1' assets/runtime.js
          grep -q 'RESPONSIVE_GOAL_PREP_V1' assets/runtime.js
          grep -q 'resetFinishEarlyForGoalChange' assets/runtime.js
          grep -q 'goalSwitchCache={fingerprint,rawCeiling:null,solutions:new Map()}' assets/runtime.js
          grep -q 'COOPERATIVE_OPTIMIZER_BOOTSTRAP_V2' assets/runtime.js
      - name: Commit verified site changes
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898258+github-actions[bot]@users.noreply.github.com'
          git add assets/runtime.js
          git commit -m 'Reset Finish Early when Primostar goal changes'
          git push origin HEAD:main
