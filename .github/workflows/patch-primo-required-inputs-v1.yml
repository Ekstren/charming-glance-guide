name: Finish Early input width

on:
  push:
    paths:
      - .github/workflows/patch-primo-required-inputs-v1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Widen Finish Early decimal input
        run: python3 scripts/patch_finish_early_input_width_v1.py
      - name: Verify runtime JavaScript syntax
        run: node --check assets/runtime.js
      - name: Verify patch marker
        run: grep -q 'FINISH_EARLY_INPUT_WIDTH_V1' assets/site.css
      - name: Commit verified site changes
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Ekstren@users.noreply.github.com'
          git add assets/site.css
          git commit -m 'Widen Finish Early decimal input'
          git push origin HEAD:main
