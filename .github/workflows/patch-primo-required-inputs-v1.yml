name: Apply mined S2 Realm yields

# S2_MINED_REALM_YIELDS_V1_WORKFLOW
on:
  push:
    paths:
      - .github/workflows/patch-primo-required-inputs-v1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply independently computed mined S2 Realm averages
        run: python3 scripts/patch_s2_mined_realm_yields_v1.py
      - name: Verify runtime JavaScript syntax
        run: node --check assets/runtime.js
      - name: Verify mined-data marker
        run: grep -q 'S2_MINED_REALM_YIELDS_V1' assets/runtime.js
      - name: Verify exact max-bracket Realm constants
        run: |
          grep -q 'ore:1888.455092195316' assets/runtime.js
          grep -q 'essence:2645.717313492359' assets/runtime.js
          grep -q 'sand:1797.432822048046' assets/runtime.js
          grep -q 'rolla:19169.242644394664' assets/runtime.js
      - name: Commit verified site changes
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Ekstren@users.noreply.github.com'
          git add assets/runtime.js
          git commit -m 'Use mined S2 max-bracket Realm yields'
          git push origin HEAD:main
