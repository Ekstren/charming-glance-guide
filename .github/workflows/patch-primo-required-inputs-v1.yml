name: Emergency rollback finish-early Max

on:
  push:
    paths:
      - .github/workflows/patch-primo-required-inputs-v1.yml

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Roll back finish-early Max patch
        run: python3 scripts/rollback_finish_early_max_v1.py
      - name: Commit rollback
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Ekstren@users.noreply.github.com'
          git add index.html assets/runtime.js assets/site.css
          git commit -m 'Rollback finish-early Max button'
          git push origin HEAD:main
