name: Patch Primostar required inputs v2

on:
  push:
    paths:
      - .github/workflows/patch-primo-required-inputs-v1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply calculator patch
        run: python3 scripts/patch_primo_required_inputs_v1.py
      - name: Commit calculator patch
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/runtime.js
          git commit -m 'Require all Primostar production inputs before solve'
          git push origin HEAD:main
