name: Patch projected level geometry v1

on:
  push:
    paths:
      - .github/workflows/patch-primo-required-inputs-v1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply projected level geometry patch
        run: python3 scripts/patch_projected_level_geometry_v1.py
      - name: Commit projected level styling
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Ekstren@users.noreply.github.com'
          git add assets/site.css
          git commit -m 'Match projected level geometry to Character inputs'
          git push origin HEAD:main
