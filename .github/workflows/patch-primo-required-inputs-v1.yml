name: Patch finish-early Max v1

on:
  push:
    paths:
      - .github/workflows/patch-primo-required-inputs-v1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply finish-early Max patch
        run: python3 scripts/patch_finish_early_max_v1.py
      - name: Commit finish-early Max button
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Ekstren@users.noreply.github.com'
          git add index.html assets/runtime.js assets/site.css
          git commit -m 'Add Max button for finish-early target'
          git push origin HEAD:main
