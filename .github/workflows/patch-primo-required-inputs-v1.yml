name: Patch Bed-only character projection v1

on:
  push:
    paths:
      - .github/workflows/patch-primo-required-inputs-v1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Bed-only Character projection patch
        run: python3 scripts/patch_bed_only_character_projection_v1.py
      - name: Commit Character projection behavior
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Ekstren@users.noreply.github.com'
          git add assets/runtime.js
          git commit -m 'Project Character from Bed EXP before full Primostar solve'
          git push origin HEAD:main
