name: Patch mobile calculator pass v1

on:
  push:
    paths:
      - .github/workflows/patch-primo-required-inputs-v1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply mobile calculator pass
        run: python3 scripts/patch_mobile_calculator_pass_v1.py
      - name: Commit mobile calculator cleanup
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Ekstren@users.noreply.github.com'
          git add assets/site.css
          git commit -m 'Mobile calculator layout pass'
          git push origin HEAD:main
