name: Fix cancellable Finish Early Max

# COOPERATIVE_FINISH_EARLY_MAX_V4_WORKFLOW
on:
  push:
    paths:
      - .github/workflows/patch-primo-required-inputs-v1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply cooperative Max and bootstrap fix
        run: python3 scripts/patch_cooperative_max_and_bootstrap_v2.py
      - name: Verify runtime JavaScript syntax
        run: node --check assets/runtime.js
      - name: Verify cooperative checkpoints
        run: |
          grep -q 'COOPERATIVE_OPTIMIZER_BOOTSTRAP_V2' assets/runtime.js
          grep -q 'COOPERATIVE_FINISH_EARLY_MAX_V4' assets/runtime.js
          grep -q 'await checkpoint(true)' assets/runtime.js
          grep -q 'Finding max Finish Early' assets/runtime.js
      - name: Commit verified site changes
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898258+github-actions[bot]@users.noreply.github.com'
          git add assets/runtime.js
          git commit -m 'Make Finish Early Max cancellable and responsive'
          git push origin HEAD:main
