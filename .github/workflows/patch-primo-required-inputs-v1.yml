name: Patch character deadline UI v2

on:
  push:
    paths:
      - .github/workflows/patch-primo-required-inputs-v1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply character deadline UI patch
        run: python3 scripts/patch_character_deadline_ui_v2.py
      - name: Commit character deadline UI fixes
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Ekstren@users.noreply.github.com'
          git add index.html assets/runtime.js assets/site.css
          git commit -m 'Clean up Character deadline row and refresh finish-early planning'
          git push origin HEAD:main
