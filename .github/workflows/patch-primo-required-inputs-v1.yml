name: Apply cooperative cancellable optimizer

# COOPERATIVE_OPTIMIZER_V1_WORKFLOW
on:
  push:
    paths:
      - .github/workflows/patch-primo-required-inputs-v1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply cooperative optimizer UI and cancellation
        run: python3 scripts/patch_cooperative_optimizer_v1.py
      - name: Verify runtime JavaScript syntax
        run: node --check assets/runtime.js
      - name: Verify cooperative optimizer markers
        run: |
          grep -q 'COOPERATIVE_OPTIMIZER_V1' assets/runtime.js
          grep -q 'solveTargetWithAutoStaminaCooperative' assets/runtime.js
          grep -q 'optimizerProgressPanel' assets/runtime.js
          grep -q 'COOPERATIVE_OPTIMIZER_V1_STYLE' assets/site.css
      - name: Verify async visible calculator path
        run: |
          grep -q 'async function updateCalculator()' assets/runtime.js
          grep -q 'await solveTargetWithAutoStaminaCooperative' assets/runtime.js
      - name: Commit verified site changes
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Ekstren@users.noreply.github.com'
          git add assets/runtime.js assets/site.css
          git commit -m 'Keep Primostar calculations responsive and cancellable'
          git push origin HEAD:main
