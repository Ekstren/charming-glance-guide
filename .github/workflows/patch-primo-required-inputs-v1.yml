name: Guard cancellable optimizer generations

# COOPERATIVE_OPTIMIZER_GENERATION_V1_WORKFLOW
on:
  push:
    paths:
      - .github/workflows/patch-primo-required-inputs-v1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply optimizer generation guard
        run: python3 scripts/patch_cooperative_optimizer_generation_v1.py
      - name: Verify runtime JavaScript syntax
        run: node --check assets/runtime.js
      - name: Verify cooperative optimizer remains present
        run: |
          grep -q 'COOPERATIVE_OPTIMIZER_V1' assets/runtime.js
          grep -q 'COOPERATIVE_OPTIMIZER_GENERATION_V1' assets/runtime.js
          grep -q 'await solveTargetWithAutoStaminaCooperative' assets/runtime.js
      - name: Commit verified site changes
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Ekstren@users.noreply.github.com'
          git add assets/runtime.js
          git commit -m 'Prevent stale optimizer jobs from overwriting newer goals'
          git push origin HEAD:main
