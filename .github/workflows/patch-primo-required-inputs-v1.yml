name: Patch historical Primostars default v1

on:
  push:
    paths:
      - .github/workflows/patch-primo-required-inputs-v1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply historical Primostars default patch
        run: python3 scripts/patch_default_historical_stars_v1.py
      - name: Commit historical Primostars default
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Ekstren@users.noreply.github.com'
          git add index.html
          git commit -m 'Default carried Primostars to 128'
          git push origin HEAD:main
