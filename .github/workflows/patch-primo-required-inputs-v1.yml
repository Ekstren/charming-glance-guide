name: Finish Early commit on blur

# DEPLOY_FINISH_EARLY_COMMIT_ON_BLUR_V1_PAGES
on:
  push:
    paths:
      - .github/workflows/patch-primo-required-inputs-v1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make Finish Early commit only after editing
        run: python3 scripts/patch_finish_early_commit_on_blur_v1.py
      - name: Verify runtime JavaScript syntax
        run: node --check assets/runtime.js
      - name: Verify patch marker
        run: grep -q 'FINISH_EARLY_COMMIT_ON_BLUR_V1' assets/runtime.js
      - name: Commit verified site changes
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Ekstren@users.noreply.github.com'
          git add assets/runtime.js
          git commit -m 'Commit Finish Early only after editing'
          git push origin HEAD:main
