name: Patch routine calculator defaults v1

on:
  push:
    paths:
      - .github/workflows/patch-primo-required-inputs-v1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply calculator defaults patch
        run: python3 scripts/patch_default_routine_inputs_v1.py
      - name: Commit calculator defaults
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Ekstren@users.noreply.github.com'
          git add assets/runtime.js index.html
          git commit -m 'Default Realm plan to 2/2/2 and shop buyout to 1'
          git push origin HEAD:main
