name: Patch device-local visible times v1

on:
  push:
    paths:
      - .github/workflows/patch-primo-required-inputs-v1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply device-local visible time patch
        run: python3 scripts/patch_device_local_times_v1.py
      - name: Commit device-local time handling
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Ekstren@users.noreply.github.com'
          git add index.html assets/runtime.js
          git commit -m 'Display guide times in viewer local timezone'
          git push origin HEAD:main
