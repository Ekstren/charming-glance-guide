name: Apply Acme Nexus timing conflict tag

on:
  push:
    paths:
      - '.github/workflows/apply-acme-nexus-timing-conflict-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/patch-acme-nexus-timing-conflict-v1.py
      - name: Verify marker
        run: grep -F "UNCONFIRMED TIMING. QY-derived Season 2 scheduling" index.html
      - name: Validate inline JavaScript
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]);
          scripts.forEach((s,i)=>{try{new Function(s)}catch(e){console.error(i+1,e.message);process.exit(1)}});
          console.log(`Validated ${scripts.length} inline script(s)`);
          NODE
      - name: Commit generated correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Tag Acme Nexus timing conflict"
          git push origin HEAD:main
