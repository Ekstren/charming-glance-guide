name: Apply corrected build Fantomon column

on:
  push:
    branches: [main]
    paths:
      - '.github/build-fanto-column-v2.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply build card/Fantomon layout
        run: python .github/patch-build-fanto-column-v2.py
      - name: Validate diff
        run: |
          git diff --check
          grep -q "SHOP_SOURCE_FANTOMONS=new Set(\['Aegiswing','Nyxarchon'\])" .github/build-fantomons-inject.html
          grep -q "F2P / No Shop" .github/build-fantomons-inject.html
          grep -q "buildLoadoutColumn" .github/build-fantomons-inject.html
          grep -q "grid-template-columns:minmax(0,1.08fr) minmax(340px,.92fr)" .github/build-fantomons-inject.html
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install chromium
      - name: Run full desktop/mobile browser smoke
        run: node scripts/site_smoke_test.mjs
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/build-fantomons-inject.html scripts/site_smoke_test.mjs
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Split build loadout and Fantomon columns"
          git push origin HEAD:main
