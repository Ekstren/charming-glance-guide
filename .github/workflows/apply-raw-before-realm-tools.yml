name: Apply raw-before-Realm-tools optimizer

on:
  push:
    paths:
      - '.github/patch-raw-before-realm-tools.py'
      - '.github/workflows/apply-raw-before-realm-tools.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply optimizer priority patch
        run: python .github/patch-raw-before-realm-tools.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          if not scripts:
              raise SystemExit('no inline script found')
          Path('/tmp/site-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/site-inline.js
      - name: Verify raw-before-tools policy
        run: |
          grep -q 'RAW_BEFORE_REALM_TOOLS_V1' index.html
          grep -q 'function candidateRealmToolBurden' index.html
          grep -q 'paidRuns:realms.reduce' index.html
          grep -q 'totalRuns:realms.reduce' index.html
          grep -q 'const toolCmp=betterToolBurden(candidate,best)' index.html
      - name: Commit site update
        run: |
          if git diff --quiet -- index.html; then
            echo 'No site change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Prefer raw resources before Realm tools'
          git push origin main
