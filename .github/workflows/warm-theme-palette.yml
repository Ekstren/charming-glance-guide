name: Warm theme palette

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/warm_theme_palette.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply warm palette
        run: python .github/scripts/warm_theme_palette.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          if not scripts: raise SystemExit('No inline scripts')
          Path('/tmp/sxs.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/sxs.js
      - name: Verify palettes
        run: |
          grep -q -- '--bg:#ddd5c8' index.html
          grep -q -- '--bg:#151310' index.html
          grep -q -- '--accent-strong:#667451' index.html
          grep -q -- '--accent-strong:#566447' index.html
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Warm up light and dark theme palettes'
          git push origin main
