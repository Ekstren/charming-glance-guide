name: Apply post-target stamina planner

on:
  push:
    paths:
      - .github/workflows/patch-post-target-stamina-v1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply post-target stamina patch
        run: python3 scripts/patch_post_target_stamina_v1.py
      - name: Verify runtime JavaScript syntax
        run: node --check assets/runtime.js
      - name: Verify post-target controls
        run: |
          grep -q 'postTargetStaminaMode' index.html
          grep -q 'POST_TARGET_STAMINA_V1' assets/site.css
          grep -q "requested==='save'?null:requested" assets/runtime.js
          grep -q "optimizerSummary').hidden=true" assets/runtime.js
      - name: Commit verified site changes
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898258+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/runtime.js assets/site.css
          git commit -m 'Add post-target stamina override and simplify goal summary'
          git push origin HEAD:main
