name: Clean calculator planning chrome

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/clean_calc_header.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply calculator cleanup
        run: python .github/scripts/clean_calc_header.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          if not scripts: raise SystemExit('No inline scripts')
          Path('/tmp/sxs.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/sxs.js
      - name: Verify cleanup
        run: |
          grep -q 'CALC_HEADER_CLEANUP_V1' index.html
          grep -q 'Projected season-end level' index.html
          grep -q 'id="reserveHours".*hidden' index.html
          grep -q 'id="seasonRulesHint" hidden' index.html
          grep -q 'id="optimizerSummary" hidden' index.html
          grep -q 'class="finalLevelLine" hidden' index.html
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Simplify calculator planning header'
          git push origin main
