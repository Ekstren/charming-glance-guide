name: One-shot timeline summary tweak

on:
  push:
    paths:
      - '.github/workflows/one-shot-summary-tweak.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply summary tweak
        run: python scripts/one_shot_summary_tweak.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          if not scripts:
              raise SystemExit('No inline scripts found')
          Path('/tmp/charming-inline.js').write_text('\n;\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/charming-inline.js
      - name: Commit patch and cleanup
        run: |
          rm .github/workflows/one-shot-summary-tweak.yml scripts/one_shot_summary_tweak.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/one-shot-summary-tweak.yml scripts/one_shot_summary_tweak.py
          git commit -m 'Tighten timeline summary layout'
          git pull --rebase origin main
          git push origin HEAD:main
