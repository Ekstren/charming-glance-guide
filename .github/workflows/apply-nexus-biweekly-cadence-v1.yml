name: Apply Nexus biweekly cadence update

on:
  push:
    paths:
      - '.github/workflows/apply-nexus-biweekly-cadence-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply Nexus cadence patch
        run: python .github/patch-nexus-biweekly-cadence-v1.py
      - name: Verify Nexus projections
        run: |
          grep -F "STRONGLY SUPPORTED / UNCONFIRMED FOR CHARMING GLANCE" index.html
          grep -F "['2026-09-27',75,'Event','Nexus Tournament · 4v4'" index.html
          grep -F "['2026-10-11',89,'Event','Nexus Tournament · 4v4'" index.html
          grep -F "['2026-10-25',103,'Event','Nexus Tournament · 4v4'" index.html
      - name: Validate inline JavaScript syntax
        run: |
          python - <<'PY'
          import re, pathlib, subprocess, tempfile
          s=pathlib.Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          js='\n'.join(blocks)
          with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
              f.write(js); name=f.name
          subprocess.run(['node','--check',name],check=True)
          PY
      - name: Commit generated timeline update
        run: |
          if git diff --quiet -- index.html; then
            echo 'No generated change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add biweekly Nexus 4v4 projections'
          git push origin main
