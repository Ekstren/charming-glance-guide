name: Fix post-target stamina math

on:
  push:
    paths:
      - .github/workflows/patch-post-target-stamina-fix-v1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply post-target stamina fix
        run: python3 scripts/patch_post_target_stamina_fix_v1.py
      - name: Verify runtime JavaScript syntax
        run: node --check assets/runtime.js
      - name: Verify post-target stamina behavior
        run: |
          ! grep -q 'Save Stamina' index.html
          grep -q "Math.floor(wallHours\*5)" assets/runtime.js
          grep -q 'Number(map\[destination\])' assets/runtime.js
      - name: Commit verified site changes
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898258+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/runtime.js
          git commit -m 'Fix post-target stamina calculation'
          git push origin HEAD:main
