name: Apply S2 build activity audit corrections

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_s2_build_activity_audit_v1.py'
      - '.github/workflows/apply-s2-build-activity-audit-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply audited activity corrections
        run: python3 scripts/patch_s2_build_activity_audit_v1.py

      - name: Verify
        run: |
          grep -Fq "['Swirling Blade','Lunarwater Threads','Seismic Tide','Star Shattering Slash']" index.html
          grep -Fq "['Formation Breaker','Tempest Sphere','Wind Blade Spiral',\"Wind's Delight\"]" index.html
          grep -Fq "['Swirling Blade','Lunarwater Threads','Seismic Tide','Star Shattering Slash']" .github/build-fantomons-inject.html
          grep -Fq "['Formation Breaker','Tempest Sphere','Wind Blade Spiral',\"Wind's Delight\"]" scripts/patch_meta_build_modes_v1.py
          grep -Fq "['Swirling Blade','Lunarwater Threads','Seismic Tide','Star Shattering Slash']" scripts/patch_guardian_tank_dps_toggle_v1.py
          grep -Fq "'Star Shattering Slash':I('Heavy direct-damage Technique inherited from Paladin" scripts/patch_build_skill_tooltips_v1.py
          grep -Fq "'Formation Breaker':I('Core Destroyer Technique" scripts/patch_build_skill_tooltips_v1.py
          python3 -m py_compile scripts/patch_s2_build_activity_audit_v1.py scripts/patch_meta_build_modes_v1.py scripts/patch_guardian_tank_dps_toggle_v1.py scripts/patch_build_skill_tooltips_v1.py
          python3 scripts/validate_pandarial_build_prep_v1.py
          python3 scripts/validate_warlords_rest_roll_guide_v1.py

      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/build-fantomons-inject.html scripts/patch_meta_build_modes_v1.py scripts/patch_guardian_tank_dps_toggle_v1.py scripts/patch_build_skill_tooltips_v1.py
          git commit -m 'Tighten Guardian ST and Destroyer Arena builds'
          git push
