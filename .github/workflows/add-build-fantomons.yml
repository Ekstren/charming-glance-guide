name: Add build Fantomon recommendations
# Maintenance policy: S1/T3 is maintained only until Charming Glance enters S2; after handoff, S2/T4 is the active build/Fantomon target. See .github/build-maintenance.md.
on:
  push:
    paths:
      - .github/workflows/add-build-fantomons.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch build Fantomon pairs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='/* BUILD_FANTOMON_PAIRS_V1 */'
          if marker in s:
              print('Fantomon patch already present.')
              raise SystemExit(0)
          inject=Path('.github/build-fantomons-inject.html').read_text()
          if '</body>' not in s:
              raise SystemExit('missing </body>')
          p.write_text(s.replace('</body>',inject+'</body>',1))
          PY
      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/inline.js').write_text('\n;\n'.join(blocks))
          PY
          node --check /tmp/inline.js
      - name: Commit patch
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index change needed.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Add main and alt Fantomons to build loadouts'
          git push origin main
