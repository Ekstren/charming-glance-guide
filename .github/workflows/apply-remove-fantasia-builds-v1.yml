name: Apply Fantasia build removal

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-remove-fantasia-builds-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply removal patch
        run: python3 scripts/remove_fantasia_builds_v1.py
      - name: Validate patch
        run: |
          python3 -m py_compile scripts/remove_fantasia_builds_v1.py
          node --check scripts/site_smoke_test.mjs
          node --check scripts/guardian_valor_smoke.mjs
          node --check scripts/build_swap_smoke.mjs
          git diff --check
          grep -q "const META_MODES=\['Dungeon','Crucible / Conquest','Arena','Tournament'\]" .github/build-fantomons-inject.html
          ! grep -q "Fantasia Ascent" .github/build-fantomons-inject.html
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Run full site smoke
        run: node scripts/site_smoke_test.mjs
      - name: Run Guardian smoke
        run: node scripts/guardian_valor_smoke.mjs
      - name: Run all-build swap smoke
        run: node scripts/build_swap_smoke.mjs
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/build-fantomons-inject.html scripts/site_smoke_test.mjs
          if git diff --cached --quiet; then
            echo 'Fantasia build removal already applied.'
            exit 0
          fi
          git commit -m 'Remove Fantasia Ascent from Builds'
          git pull --rebase origin main
          git push origin main
