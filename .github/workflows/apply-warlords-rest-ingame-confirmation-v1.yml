name: Apply Warlord's Rest in-game confirmation

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_warlords_rest_ingame_confirmation_v1.py'
      - '.github/workflows/apply-warlords-rest-ingame-confirmation-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Warlord's Rest confirmation
        run: python3 scripts/apply_warlords_rest_ingame_confirmation_v1.py

      - name: Validate Warlord's Rest row
        run: |
          grep -Fq "'2026-09-12',60,'Dungeon','Warlord’s Rest'" index.html
          grep -Fq 'CONFIRMED CHARMING GLANCE DATE + NORMAL REQUIREMENTS' index.html
          grep -Fq 'Sep. 12, 2026 6:00 AM PDT server reset' index.html
          grep -Fq 'Player Lv.130 and 3.55M Power for Normal' index.html

      - name: Validate timeline duplicates
        run: python3 scripts/check_timeline_duplicates.py index.html

      - name: Validate inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          out=Path('/tmp/inline-js')
          out.mkdir(exist_ok=True)
          for i,body in enumerate(scripts):
              (out/f'{i}.js').write_text(body,encoding='utf-8')
          print(f'extracted {len(scripts)} inline scripts')
          PY
          for f in /tmp/inline-js/*.js; do node --check "$f"; done

      - name: Install browser smoke dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Run full site browser smoke
        run: node scripts/site_smoke_test.mjs

      - name: Commit and push
        run: |
          if git diff --quiet -- index.html; then
            echo "Warlord's Rest timeline row is already current."
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m "Confirm Warlord's Rest Sep. 12 unlock"
            git pull --rebase origin main
            git push origin main
          fi
