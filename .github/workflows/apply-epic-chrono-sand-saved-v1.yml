name: Apply Epic Chrono Sand saved material v1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/add_epic_chrono_sand_saved_v1.py'
      - 'scripts/epic_chrono_sand_smoke_v1.mjs'
      - '.github/workflows/apply-epic-chrono-sand-saved-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Epic Chrono Sand patch
        run: python3 scripts/add_epic_chrono_sand_saved_v1.py

      - name: Verify intended changes
        run: |
          grep -Fq 'id="sandEpicCurrent"' index.html
          grep -Fq 'Saved · Epic (Purple)' index.html
          grep -Fq 'SAND_EPIC_EQ=25' index.html
          grep -Fq "n('sandEpicCurrent')" index.html
          grep -Fq 'EPIC_CHRONO_SAND_SAVED_V1' index.html

      - name: Validate inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          out=Path('/tmp/inline-js')
          out.mkdir(exist_ok=True)
          for i,body in enumerate(scripts):
              (out/f'{i}.js').write_text(body,encoding='utf-8')
          print(f'extracted {len(scripts)} inline scripts')
          PY
          for f in /tmp/inline-js/*.js; do node --check "$f"; done

      - name: Install browser smoke dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Run Epic Chrono Sand regression smoke
        run: node scripts/epic_chrono_sand_smoke_v1.mjs

      - name: Run full site browser smoke
        run: node scripts/site_smoke_test.mjs

      - name: Commit and push
        run: |
          if git diff --quiet -- index.html; then
            echo 'Epic Chrono Sand saved-material support is already current.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Add Epic Chrono Sand saved material'
            git push
          fi
