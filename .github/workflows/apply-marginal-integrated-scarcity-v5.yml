name: Apply marginal integrated scarcity v5

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_marginal_integrated_scarcity_v5.py'
      - '.github/workflows/apply-marginal-integrated-scarcity-v5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Apply marginal integrated scarcity v5
        run: python3 scripts/apply_marginal_integrated_scarcity_v5.py

      - name: Validate marker and inline JavaScript
        run: |
          grep -Fq 'MARGINAL_INTEGRATED_SCARCITY_V5' index.html
          grep -Fq 'POST_PLAN_SCARCITY_MAX=3.50' index.html
          grep -Fq 'POST_PLAN_SCARCITY_EXPONENT=2.40' index.html
          grep -Fq 'const power=POST_PLAN_SCARCITY_EXPONENT+1' index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          out=Path('/tmp/jsv5');out.mkdir(exist_ok=True)
          for i,b in enumerate(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)):
              (out/f'{i}.js').write_text(b,encoding='utf-8')
          PY
          for f in /tmp/jsv5/*.js; do node --check "$f"; done

      - name: Verify marginal integration numerically
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const html=fs.readFileSync('index.html','utf8');
          const cStart=html.indexOf('  const SURPLUS_ACQUISITION_FLOORS=');
          const cEnd=html.indexOf('\n\n  /* OPTIMIZER_AUDIT_V3',cStart);
          const fStart=html.indexOf('  function marginalWeightedSpend(amount,key,resources){');
          const fEnd=html.indexOf('\n\n  function marginalWeightedCosts',fStart);
          if(cStart<0||cEnd<0||fStart<0||fEnd<0) throw new Error('Could not extract scarcity kernel from index.html');
          const kernel=html.slice(cStart,cEnd)+'\n'+html.slice(fStart,fEnd)+'\nthis.marginalWeightedSpend=marginalWeightedSpend;';
          const ctx={};
          vm.createContext(ctx);
          vm.runInContext(kernel,ctx);
          const resources={
            acquisitionHeadroomCosts:{ore:200000},
            acquisitionSupplyEquiv:{ore:100000}
          };
          const vals={
            c10:ctx.marginalWeightedSpend(10000,'ore',resources),
            c25:ctx.marginalWeightedSpend(25000,'ore',resources),
            c100:ctx.marginalWeightedSpend(100000,'ore',resources),
            c110:ctx.marginalWeightedSpend(110000,'ore',resources)
          };
          const near=(a,b,t=0.02)=>Math.abs(a-b)<=t;
          if(!near(vals.c10,2538.0543618911433)) throw new Error('10k integrated scarcity mismatch: '+JSON.stringify(vals));
          if(!near(vals.c25,7107.828504995488)) throw new Error('25k integrated scarcity mismatch: '+JSON.stringify(vals));
          if(!near(vals.c100,120588.23529411765)) throw new Error('100k integrated scarcity mismatch: '+JSON.stringify(vals));
          if(!near(vals.c110,155588.23529411765)) throw new Error('beyond-pool scarcity mismatch: '+JSON.stringify(vals));
          if(!(vals.c25/25000 > vals.c10/10000)) throw new Error('average scarcity did not rise with depletion');
          console.log('Marginal integration numeric check passed.',vals);
          NODE

      - name: Existing scarcity regression
        run: node scripts/scarcity_adjusted_acquisition_smoke_v1.mjs

      - name: Total-pool regression
        run: node scripts/total_pool_smart_balance_smoke_v1.mjs

      - name: Goal-stop regression
        run: node scripts/smart_balance_goal_stop_smoke_v2.mjs

      - name: Calculator performance check
        run: node scripts/calculator_perf_check.mjs

      - name: Full browser smoke
        run: node scripts/site_smoke_test.mjs

      - name: Commit and push
        run: |
          if git diff --quiet -- index.html; then
            echo 'Marginal integrated scarcity v5 already current'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Integrate Smart Balance scarcity marginally'
            git pull --rebase origin main
            git push origin main
          fi
