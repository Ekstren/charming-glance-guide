name: Apply collapsible Character and Materials

on:
  push:
    paths:
      - '.github/workflows/apply-collapsible-character-materials.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/patch-collapsible-character-materials.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          for i,js in enumerate(scripts):
              if not js.strip(): continue
              f=tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8')
              f.write(js); f.close()
              subprocess.run(['node','--check',f.name],check=True)
          print(f'validated {len(scripts)} script blocks')
          PY
      - name: Verify collapsible cards
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'id="characterDetails"' in s
          assert '<summary class="characterSummary"><span>Character</span></summary>' in s
          assert 'id="materialsDetails"' in s
          assert '<span class="materialsSummaryTitle">Materials</span>' in s
          assert "const PANEL_OPEN_IDS = ['characterDetails','materialsDetails'];" in s
          assert 'COLLAPSIBLE_CHARACTER_MATERIALS_V1' in s
          assert 'id="skillLevel"' in s[s.index('id="characterDetails"'):s.index('id="materialsDetails"')]
          print('collapsible Character/Materials layout verified')
          PY
      - name: Commit
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Make Character and Materials cards collapsible'
          git push
