name: Destroyer S2 balance and simple substats

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_destroyer_s2_balance_and_simple_substats_v1.py'
      - '.github/workflows/apply-destroyer-s2-balance-simple-substats-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Destroyer S2 balance and simple substats
        run: python scripts/patch_destroyer_s2_balance_and_simple_substats_v1.py
      - name: Verify build data
        shell: bash
        run: |
          grep -q "ATK ≈ Elemental Mastery > Crit > SPD" index.html
          grep -q "Crit Rate / Crit DMG > ATK ≈ Elemental Mastery > Accuracy > SPD" index.html
          grep -q "Crit Rate / Crit DMG > Accuracy > Elemental Mastery > SPD > ATK" index.html
          grep -q "Block Rate > DEF > SPD > HP" index.html
          grep -q "Effect Hit Rate > Crit Rate / Crit DMG > Elemental Mastery > ATK > SPD" index.html
          grep -q "Healing Boost > SPD > HP > DMG RES" index.html
          grep -q "S2 community testing" index.html
          grep -q "ATK ≈ Elemental Mastery > Crit > SPD" scripts/patch_restore_rich_builds_v1.py
      - name: Commit generated update
        shell: bash
        run: |
          if git diff --quiet -- index.html scripts/patch_restore_rich_builds_v1.py; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html scripts/patch_restore_rich_builds_v1.py
          git commit -m 'Rebalance Destroyer S2 stats and simplify substats'
          git push origin HEAD:main
