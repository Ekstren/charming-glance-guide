name: Fix Lucky Scratch Summary
on:
  push:
    paths:
      - .github/workflows/fix-lucky-scratch-summary.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch timeline summary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old1="if(title.startsWith('Lucky Scratch')) return 'Spend saved Material Realm tools to generate scratch cards. Aug 26–31 overlaps Oceanic, so Realm activity can also progress Beach Shovel objectives.';"
          new1="if(title.startsWith('Lucky Scratch')) return 'Aug 26–Sep 2. Spend saved Material Realm tools to generate scratch cards; through Aug 31, Realm activity also overlaps Oceanic Beach Shovel objectives.';"
          old2="[/lucky scratch/i, 'Starts Aug 26. Save Material Realm tools now, then spend them while Lucky Scratch is active to feed its ticket missions.'],"
          new2="[/lucky scratch/i, 'Aug 26–Sep 2. Spend saved Material Realm tools while Lucky Scratch is active to generate scratch cards; Oceanic overlaps through Aug 31.'],"
          assert old1 in s, 'primary Lucky Scratch summary not found'
          assert old2 in s, 'compact Lucky Scratch summary not found'
          s=s.replace(old1,new1,1).replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/inline.js').write_text('\n;\n'.join(blocks))
          PY
          node --check /tmp/inline.js
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Fix Lucky Scratch active summary"
          git push
