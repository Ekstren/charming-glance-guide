name: Apply joint reacquisition optimizer

on:
  push:
    branches: [main]
    paths:
      - '.github/patch-joint-reacquisition.py'
      - '.github/workflows/apply-joint-reacquisition.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply joint reacquisition patch
        run: python .github/patch-joint-reacquisition.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          import re, pathlib, subprocess, tempfile
          html=pathlib.Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I)
          for i,src in enumerate(scripts):
              if not src.strip():
                  continue
              p=pathlib.Path(tempfile.gettempdir())/f'inline-{i}.js'
              p.write_text(src,encoding='utf-8')
              subprocess.run(['node','--check',str(p)],check=True)
          print(f'Validated {len(scripts)} inline scripts')
          PY
      - name: Check diff
        run: git diff --check
      - name: Verify optimizer markers
        run: |
          grep -q 'JOINT_REACQUISITION_V1' index.html
          grep -q 'jointReacquisitionHours' index.html
          grep -q 'acquisition.preserveHours' index.html
          grep -q 'shared-Stamina reacquisition effort' index.html
          if grep -q 'POST_TARGET_SURPLUS_TOPUP_V1' index.html; then
            echo 'Unexpected post-target surplus top-up is present.'
            exit 1
          fi
      - name: Commit joint reacquisition optimizer
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Model joint Cart and Stamina reacquisition'
          git push origin main
