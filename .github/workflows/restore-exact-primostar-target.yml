name: Restore exact Primostar target

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-exact-primostar-target.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Restore exact target
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "    const thresholdScore=Math.max(0,(targetStars-historical-cfg.starBase)*cfg.scorePerStar);\n    // Plan 5% above the exact score threshold so rounding/data drift does not leave the target barely missed.\n    const scoreSafetyMargin=0.05;\n    const desired=Math.ceil(thresholdScore*(1+scoreSafetyMargin));"
          new = "    const desired=Math.max(0,(targetStars-historical-cfg.starBase)*cfg.scorePerStar);"
          if old not in s:
              raise SystemExit('5 percent formula not found')
          s = s.replace(old, new, 1)
          s = s.replace('<label>Target Primostars <small style="color:var(--status-positive);font-weight:800">+5% score safety</small><input id="targetStars" type="number" value="200"></label>', '<label>Target Primostars<input id="targetStars" type="number" value="200"></label>', 1)
          s = s.replace('The optimizer deliberately targets 5% above the exact score threshold for the requested Primostar goal as a safety margin. ', '', 1)
          p.write_text(s, encoding='utf-8')

      - name: Validate inline JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          if 'scoreSafetyMargin' in text or '+5% score safety' in text:
              raise SystemExit('5 percent safety still present')
          if 'const desired=Math.max(0,(targetStars-historical-cfg.starBase)*cfg.scorePerStar);' not in text:
              raise SystemExit('exact Primostar target formula missing')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,flags=re.S|re.I)
          if not scripts:
              raise SystemExit('No inline scripts found')
          Path('/tmp/sxs.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/sxs.js

      - name: Commit and self-clean
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/restore-exact-primostar-target.yml
          if [ -f .github/workflows/remove-score-safety-margin.yml ]; then git rm .github/workflows/remove-score-safety-margin.yml; fi
          git add index.html
          git commit -m 'Restore exact Primostar target planning'
          git push origin main
