name: Apply Guardian Tournament Valor

on:
  push:
    branches: [main]
    paths:
      - '.github/guardian-tournament-valor.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Guardian Tournament Valor update
        run: python .github/patch-guardian-tournament-valor-v1.py
      - name: Validate diff
        run: |
          git diff --check
          grep -q "Tournament · 2v2 · Tank.*\['Valor Surge','Hamper Strike','Luminous Shield','Desperate Protection'\]" .github/build-fantomons-inject.html
          grep -q "Tournament · 4v4 · Tank.*\['Valor Surge','Heart of Challenge','Luminous Shield','Desperate Protection'\]" .github/build-fantomons-inject.html
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium
      - name: Run full site browser smoke
        run: node scripts/site_smoke_test.mjs
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/build-fantomons-inject.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Restore Valor Surge to Guardian Tournament tank builds"
          git push origin HEAD:main
