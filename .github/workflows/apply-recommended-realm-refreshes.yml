name: Apply recommended Realm refreshes

on:
  push:
    branches: [main]
    paths:
      - '.github/patch-apply-recommended-realm-refreshes.py'
      - '.github/workflows/apply-recommended-realm-refreshes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python .github/patch-apply-recommended-realm-refreshes.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          code='\n'.join(scripts)
          with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
              f.write(code); name=f.name
          subprocess.run(['node','--check',name],check=True)
          PY
      - name: Verify button behavior hooks
        run: |
          grep -q 'APPLY_RECOMMENDED_REALM_REFRESHES_V1' index.html
          grep -q 'applyRecommendedRealmRefreshes' index.html
          grep -q 'Apply refreshes' index.html
          grep -q 'realmDailyOre:clamp' index.html
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add one-click recommended Realm refreshes'
          git push
