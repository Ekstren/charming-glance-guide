name: Fix rich timeline render

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-rich-timeline-render.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch rich timeline rendering
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          rich_line = "    if(full.includes('launchChecklist')) return '<div class=\"timelineRichBody\">'+full+'</div>';"
          if rich_line not in s:
              fn = s.find('  function timelineDetailHtml(e){')
              if fn < 0:
                  raise SystemExit('timelineDetailHtml function not found')
              needle = '    const summary=timelineSummaryText(e);'
              anchor = s.find(needle, fn)
              if anchor < 0:
                  raise SystemExit('timelineDetailHtml summary line not found')
              addition = "    // Rich entries contain complete markup; do not truncate their raw HTML.\n" + rich_line + "\n"
              s = s[:anchor] + addition + s[anchor:]

          start = s.find('<style id="s2-launch-checklist-layout-fix">')
          if start < 0:
              raise SystemExit('checklist layout style not found')
          end = s.find('</style>', start)
          if end < 0:
              raise SystemExit('checklist layout style end not found')
          end += len('</style>')
          new_css = '''<style id="s2-launch-checklist-layout-fix">
          .entry:has(.launchChecklist){grid-template-columns:160px minmax(0,1fr)}
          .entry:has(.launchChecklist)>div:last-child{min-width:0;width:100%}
          .timelineRichBody{display:block;min-width:0;width:100%}
          .entry .launchChecklist{display:grid;width:100%;max-width:none;min-width:0}
          @media(width<=720px){.entry:has(.launchChecklist){grid-template-columns:1fr}}
          </style>'''.replace('          ', '')
          s = s[:start] + new_css + s[end:]

          p.write_text(s, encoding='utf-8')

      - name: Validate inline JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          if "if(full.includes('launchChecklist'))" not in text:
              raise SystemExit('rich checklist bypass missing')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, re.S | re.I)
          if not scripts:
              raise SystemExit('No inline scripts found')
          Path('/tmp/sxs.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/sxs.js

      - name: Commit and self-clean
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-rich-timeline-render.yml
          if [ -f .github/workflows/fix-rich-timeline-entry.yml ]; then
            git rm .github/workflows/fix-rich-timeline-entry.yml
          fi
          git add index.html
          git commit -m 'Fix rich Season 2 checklist rendering'
          git push origin main
