name: Apply projection placement

on:
  push:
    paths:
      - '.github/workflows/apply-move-projection-up.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/patch-move-projection-up.py
      - name: Verify placement
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          a=s.index('id="findMaxStars"')
          b=s.index('id="projectedCharacter"')
          c=s.index('id="seasonDeadlineLabel"')
          d=s.index('id="skillLevel"')
          assert a < b < c < d, (a,b,c,d)
          assert s.count('id="projectedCharacter"') == 1
          assert s.count('id="seasonDeadlineLabel"') == 1
          print('placement verified')
          PY
      - name: Commit
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Move season projection above progression inputs'
          git push
