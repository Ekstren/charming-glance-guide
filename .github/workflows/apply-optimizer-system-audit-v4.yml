name: Apply optimizer system audit v4

on:
  push:
    branches: [main]
    paths:
      - '.github/patch-optimizer-system-audit-v4.py'
      - '.github/workflows/apply-optimizer-system-audit-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Make acquisition hot-path replacement robust
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/patch-optimizer-system-audit-v4.py')
          t=p.read_text(encoding='utf-8')
          old="""def sub_once(pattern, repl, label, flags=re.S):
    global s
    ns, count = re.subn(pattern, lambda m: repl, s, count=1, flags=flags)
    if count != 1:
        raise SystemExit(f'expected one match for {label}, got {count}')
    s = ns
"""
          new="""def sub_once(pattern, repl, label, flags=re.S):
    global s
    ns, count = re.subn(pattern, lambda m: repl, s, count=1, flags=flags)
    if count != 1 and label == 'acquisition hot path':
        start = s.find('  function acquisitionEffortFor(costs,resources,cfg=activeCalcConfig()){')
        header = '  function makePlanCandidate(go,so,ro,fo,score,desired,resources,realms){'
        end = s.find(header, start + 1)
        if start >= 0 and end >= 0:
            ns = s[:start] + repl + s[end + len(header):]
            count = 1
    if count != 1:
        raise SystemExit(f'expected one match for {label}, got {count}')
    s = ns
"""
          if old not in t:
              raise SystemExit('sub_once helper anchor not found')
          p.write_text(t.replace(old,new,1),encoding='utf-8')
          PY
      - name: Apply optimizer audit
        run: python .github/patch-optimizer-system-audit-v4.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          if not scripts:
              raise SystemExit('no inline script found')
          Path('/tmp/site-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/site-inline.js
      - name: Verify optimizer audit
        run: |
          grep -q 'OPTIMIZER_SYSTEM_AUDIT_V4' index.html
          grep -q 'AUTO_STAMINA_THREE_WAY_V2' index.html
          grep -q 'id="findMaxStars"' index.html
          grep -q 'Hard Realm-cap max' index.html
          grep -q 'unknownPriceRefreshes' index.html
          ! grep -q 'UNKNOWN_REALM_PRICE_PENALTY' index.html
          ! grep -q 'const ORE_PRESERVE_PREMIUM' index.html
          ! grep -q 'preserveAcquisitionScore' index.html
          ! grep -q 'fallbackTreatRate' index.html
          ! grep -q 'complete Ore / Essence / Sand Stamina split' index.html
      - name: Commit site update
        run: |
          if git diff --quiet -- index.html; then
            echo 'No site change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Audit and optimize Primostar planner'
          git push origin main
