name: Clean timeline event copy

on:
  push:
    branches: [main]
    paths:
      - 'scripts/clean_timeline_event_copy_v1.py'
      - '.github/workflows/clean-timeline-event-copy-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply copy cleanup
        run: python3 scripts/clean_timeline_event_copy_v1.py

      - name: Validate timeline copy
        run: |
          grep -Fq "'Warlord’s Rest','Player Lv.130 · Normal 3.55M · Hard 5M · Nightmare 6M'" index.html
          grep -Fq 'TIMELINE_PLAIN_EVENT_COPY_V1' index.html
          grep -Fq "if(title==='Nexus Tournament · 4v4')" index.html
          ! grep -Fq "'Warlord’s Rest','CONFIRMED" index.html
          python3 scripts/check_timeline_duplicates.py index.html

      - name: Validate inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          out=Path('/tmp/inline-js')
          out.mkdir(exist_ok=True)
          for i,body in enumerate(scripts):
              (out/f'{i}.js').write_text(body,encoding='utf-8')
          print(f'extracted {len(scripts)} inline scripts')
          PY
          for f in /tmp/inline-js/*.js; do node --check "$f"; done

      - name: Install browser smoke dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Run full site browser smoke
        run: node scripts/site_smoke_test.mjs

      - name: Commit and push
        run: |
          if git diff --quiet -- index.html; then
            echo 'Timeline event copy is already current.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Simplify timeline event copy'
            git pull --rebase origin main
            git push origin main
          fi
