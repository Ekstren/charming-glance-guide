name: Post-target options layout v1

on:
  push:
    paths:
      - '.github/workflows/patch-post-target-options-layout-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply post-target options layout patch
        run: python scripts/patch_post_target_options_layout_v1.py
      - name: Verify changes
        run: |
          ! grep -F 'Stop tool purchases' index.html
          grep -F 'POST_TARGET_OPTIONS_SIDE_BY_SIDE_V1' assets/site.css
          grep -F 'value="custom"> Custom' index.html
          grep -F 'postTargetStaminaMode' index.html
      - name: Commit verified site changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/site.css
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Polish post-target plan options layout'
          git push
