name: Apply Realm tool efficiency v4

on:
  push:
    paths:
      - '.github/patch-realm-tool-efficiency-v4.py'
      - '.github/workflows/apply-realm-tool-efficiency-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python .github/patch-realm-tool-efficiency-v4.py
      - name: Verify Minimize tools behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile

          text = Path('index.html').read_text(encoding='utf-8')
          checks = [
              ('v4 marker', 'REALM_TOOL_EFFICIENCY_V4'),
              ('toggle name', '<span>Minimize tools</span>'),
              ('saved hurdle', 'REALM_SAVED_TOOL_EFFICIENCY_HURDLE=0.10'),
              ('paid hurdle', 'REALM_PAID_REFRESH_EFFICIENCY_HURDLE=0.20'),
              ('hurdle comparator', 'function acquisitionEffortWinsAfterToolHurdle(candidate,best)'),
              ('Lv120 Realm values', 'realmMaxLevel:120,realm:{ore:1200,essence:1500,sand:1000,rolla:11800}'),
              ('S2 score constants', 'scoreFloor:130,relicFloor:13,starBase:45,scorePerStar:27,weights:{character:100,gear:18,skill:7,relic:33,fanto:8}'),
              ('S2 benchmark', 'S2_PRIMO_BENCHMARK_V2'),
              ('Bed reserve', 'reserveHours:34'),
          ]
          for label, needle in checks:
              assert needle in text, f'missing {label}: {needle}'
          assert 'REALM_TOOL_PRESERVE_EFFICIENCY_WINDOW=0.05' not in text
          assert 'acquisitionEffortWithinRealmPreserveWindow' not in text

          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S|re.I)
          checked = 0
          for i, script in enumerate(scripts):
              if not script.strip():
                  continue
              with tempfile.NamedTemporaryFile('w', suffix='.js', encoding='utf-8', delete=False) as f:
                  f.write(script)
                  name = f.name
              result = subprocess.run(['node', '--check', name], capture_output=True, text=True)
              if result.returncode != 0:
                  raise SystemExit(f'inline script {i} failed node --check:\n{result.stderr}')
              checked += 1
          print(f'Verified {checked} inline JS blocks')
          PY

          # Exercise the actual comparator functions with threshold-boundary scenarios.
          node <<'JS'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          let minimize=true;
          global.$=(id)=>id==='preserveRealmTools'?{checked:minimize}:null;

          function extractFunction(name){
            const sig=`function ${name}(`;
            const start=html.indexOf(sig);
            if(start<0) throw new Error(`missing function ${name}`);
            const brace=html.indexOf('{',start);
            let depth=0, quote=null, esc=false;
            for(let i=brace;i<html.length;i++){
              const ch=html[i];
              if(quote){
                if(esc){esc=false;continue;}
                if(ch==='\\'){esc=true;continue;}
                if(ch===quote) quote=null;
                continue;
              }
              if(ch==='"'||ch==="'"||ch==='`'){quote=ch;continue;}
              if(ch==='{') depth++;
              else if(ch==='}' && --depth===0) return html.slice(start,i+1);
            }
            throw new Error(`unterminated function ${name}`);
          }

          const saved=html.match(/const REALM_SAVED_TOOL_EFFICIENCY_HURDLE=([0-9.]+);/);
          const paid=html.match(/const REALM_PAID_REFRESH_EFFICIENCY_HURDLE=([0-9.]+);/);
          if(!saved||!paid) throw new Error('missing threshold constants');
          global.REALM_SAVED_TOOL_EFFICIENCY_HURDLE=Number(saved[1]);
          global.REALM_PAID_REFRESH_EFFICIENCY_HURDLE=Number(paid[1]);

          const names=[
            'candidateResourceMetric','compareAcquisitionEffort','candidateRealmToolBurden','betterToolBurden',
            'candidateRealmStage','preserveRealmToolsEnabled','acquisitionImprovementFraction',
            'realmToolHurdleForMoreEfficientRoute','acquisitionEffortWinsAfterToolHurdle','betterFeasibleCandidate'
          ];
          eval(names.map(extractFunction).join('\n'));

          function realm({runs=0,paid=0,banked=0,packs=0}={}){
            return {runsNeeded:runs,planRuns:runs,paidRunsUsed:paid,bankedUsed:banked,packs};
          }
          function candidate(name,hours,stage,{runs=0,paid=0,banked=0,dawnium=0}={}){
            let r;
            if(stage===0) r=realm();
            else if(stage===1) r=realm({runs,banked:banked||runs});
            else r=realm({runs,paid:paid||runs,banked,packs:1});
            return {
              name,acquisitionHours:hours,dawniumCost:dawnium,unknownPriceRefreshes:0,
              overshoot:0,maxShare:0,sumShare:0,
              realm:{ore:r,essence:realm(),sand:realm()}
            };
          }
          function pick(a,b){return betterFeasibleCandidate(a,b)?a:b;}
          function assertPick(label,a,b,expected){
            const got=pick(a,b).name;
            if(got!==expected) throw new Error(`${label}: expected ${expected}, got ${got}`);
            console.log(`PASS ${label}: ${got}`);
          }

          minimize=true;
          // Saved tools: <=10% improvement should be preserved; >10% may win.
          assertPick('saved tools at 8% do not win', candidate('tools',92,1,{runs:20}), candidate('raw',100,0), 'raw');
          assertPick('saved tools at exactly 10% do not win', candidate('tools',90,1,{runs:20}), candidate('raw',100,0), 'raw');
          assertPick('saved tools above 10% may win', candidate('tools',89,1,{runs:20}), candidate('raw',100,0), 'tools');

          // Paid refreshes: <=20% improvement should not spend Dawnium; >20% may win.
          assertPick('paid route at 15% does not win', candidate('paid',85,2,{runs:20,paid:20,dawnium:500}), candidate('raw',100,0), 'raw');
          assertPick('paid route at exactly 20% does not win', candidate('paid',80,2,{runs:20,paid:20,dawnium:500}), candidate('raw',100,0), 'raw');
          assertPick('paid route above 20% may win', candidate('paid',79,2,{runs:20,paid:20,dawnium:500}), candidate('raw',100,0), 'paid');

          // If the faster route also uses fewer tools, efficiency wins immediately.
          assertPick('faster and fewer tools always wins', candidate('lean',90,0), candidate('tools',100,1,{runs:20}), 'lean');

          // Toggle off restores strict pure efficiency for tiny gains.
          minimize=false;
          assertPick('pure efficiency lets 1% saved-tool gain win', candidate('tools',99,1,{runs:20}), candidate('raw',100,0), 'tools');
          assertPick('pure efficiency lets 2% paid gain win', candidate('paid',98,2,{runs:20,paid:20,dawnium:500}), candidate('raw',100,0), 'paid');
          JS
      - name: Commit optimizer policy
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Use Minimize tools efficiency hurdles'
          git push origin main
