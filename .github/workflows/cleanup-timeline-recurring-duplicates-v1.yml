name: Cleanup recurring timeline duplicates

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/cleanup_timeline_recurring_duplicates_v1.py'
      - 'scripts/check_timeline_duplicates.py'
      - '.github/workflows/cleanup-timeline-recurring-duplicates-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cleanup recurring timeline rows
        run: python3 scripts/cleanup_timeline_recurring_duplicates_v1.py

      - name: Block semantic recurring duplicates
        run: python3 scripts/check_timeline_duplicates.py index.html

      - name: Validate inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          out=Path('/tmp/inline-js')
          out.mkdir(exist_ok=True)
          for i,body in enumerate(scripts):
              (out/f'{i}.js').write_text(body,encoding='utf-8')
          print(f'extracted {len(scripts)} inline scripts')
          PY
          for f in /tmp/inline-js/*.js; do node --check "$f"; done

      - name: Verify recurring generator remains intact
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'function addRecurringEvents()' in s
          print('Recurring event generator present.')
          PY

      - name: Install browser smoke dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Run site browser smoke
        run: node scripts/site_smoke_test.mjs

      - name: Commit and push cleanup
        run: |
          if git diff --quiet -- index.html; then
            echo 'Timeline recurring rows are already clean.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Remove duplicate combined recurring event rows'
            git push
          fi
