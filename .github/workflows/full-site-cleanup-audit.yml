name: Whole-site cleanup audit

on:
  push:
    branches: [main]
    paths:
      - 'scripts/full_site_cleanup_audit.py'
      - '.github/workflows/full-site-cleanup-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit repository and runtime structure
        run: python3 scripts/full_site_cleanup_audit.py | tee data/site-cleanup-audit.txt
      - name: Persist audit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/site-cleanup-audit.txt
          if git diff --cached --quiet; then
            echo 'Audit report unchanged.'
          else
            git commit -m 'Record whole-site cleanup audit'
            git pull --rebase origin main
            git push origin main
          fi
