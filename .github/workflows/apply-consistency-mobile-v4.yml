name: Apply calculator consistency and mobile cleanup v4

on:
  push:
    paths:
      - 'scripts/patch_consistency_mobile_v4.py'
      - '.github/workflows/apply-consistency-mobile-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply consistency and mobile cleanup
        run: python scripts/patch_consistency_mobile_v4.py
      - name: Basic source checks
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          required = [
              'CONSISTENCY_MOBILE_V4',
              'Daily purchase plan',
              'Ore purchases / day',
              'Essence purchases / day',
              'Sand purchases / day',
              'Planner default: 0/day',
              'Today excluded to avoid double-counting Saved materials.',
              'Hammers · +',
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit(f'Missing expected output: {missing}')
          PY
      - name: Commit generated index
        run: |
          git config user.name 'ekstren'
          git config user.email '38091958+Ekstren@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Polish calculator wording and mobile layout'
          git push
