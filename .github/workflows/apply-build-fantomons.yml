name: Apply build Fantomon recommendations
on:
  push:
    paths:
      - build-fantomons.trigger
      - .github/build-fantomons-inject.html
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Sync build Fantomon block
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          inject=Path('.github/build-fantomons-inject.html').read_text().strip()+"\n"
          start='<!-- BUILD_FANTOMON_PAIRS_START -->'
          end='<!-- BUILD_FANTOMON_PAIRS_END -->'
          marker='/* BUILD_FANTOMON_PAIRS_V1 */'

          if start in s and end in s:
              a=s.index(start)
              b=s.index(end,a)+len(end)
              s=s[:a]+inject.rstrip()+s[b:]
          elif marker in s:
              m=s.index(marker)
              a=s.rfind('<style>',0,m)
              b=s.find('</script>',m)
              if a<0 or b<0:
                  raise SystemExit('Could not locate existing Fantomon block boundaries')
              b+=len('</script>')
              s=s[:a]+inject.rstrip()+s[b:]
          else:
              if '</body>' not in s:
                  raise SystemExit('missing </body>')
              s=s.replace('</body>',inject+'</body>',1)

          p.write_text(s)
          PY
      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/inline.js').write_text('\n;\n'.join(blocks))
          PY
          node --check /tmp/inline.js
      - name: Commit patch
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index change needed.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Refresh build Fantomon recommendations'
          git push origin main
