name: Mark VEGGIE active

on:
  push:
    paths:
      - '.github/workflows/mark-veggie-active.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Mark VEGGIE active through exact expiry
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="['2026-09-07',55,'Event','Gift code · VEGGIE','Confirmed by the official Sword x Staff Global Discord gift-code announcement: 10 Rare Auroral Badges + 80 Dawnium. Official validity ends Sep. 8 at 00:00 (UTC-5), which is Sep. 7 at 10:00 PM PDT for Charming Glance. Redeem before 10:00 PM PDT Sep. 7.','event'],"
          new="['2026-09-01',49,'Event','Gift code · VEGGIE','Confirmed by the official Sword x Staff Global Discord gift-code announcement: 10 Rare Auroral Badges + 80 Dawnium. Active now. Official validity ends Sep. 8 at 00:00 (UTC-5), which is Sep. 7 at 10:00 PM PDT for Charming Glance. Redeem before 10:00 PM PDT Sep. 7.','event','2026-09-08',null,'2026-09-08T05:00:00Z'],"
          if old not in s:
              raise SystemExit('VEGGIE row not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script>([\s\S]*?)</script>',s)
          if not scripts:
              raise SystemExit('No inline script found')
          with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False) as f:
              f.write('\n'.join(scripts)); name=f.name
          subprocess.run(['node','--check',name],check=True)
          PY
      - name: Commit patch and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/mark-veggie-active.yml
          git commit -m "Show VEGGIE as active"
          git pull --rebase origin main
          git push origin HEAD:main
