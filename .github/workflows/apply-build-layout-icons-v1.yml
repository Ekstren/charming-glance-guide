name: Apply build layout and icons

on:
  push:
    branches: [main]
    paths:
      - 'assets/build-layout-icons-v1.css'
      - 'assets/build-layout-icons-v1.js'
      - 'scripts/apply_build_layout_icons_v1.py'
      - 'scripts/build_roll_responsive_smoke.mjs'
      - 'scripts/build_gem_priority_smoke.mjs'
      - 'scripts/topbar_scroll_smoke.mjs'
      - 'scripts/patch_s2_late_event_rotation_v1.py'
      - 'scripts/patch_conqueror_4v4_gale_swap_v1.py'
      - 'scripts/patch_guardian_4v4_control_tank_v1.py'
      - '.github/workflows/apply-build-layout-icons-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate assets
        run: |
          python3 -m py_compile scripts/apply_build_layout_icons_v1.py
          python3 -m py_compile scripts/patch_s2_late_event_rotation_v1.py
          python3 -m py_compile scripts/patch_conqueror_4v4_gale_swap_v1.py
          python3 -m py_compile scripts/patch_guardian_4v4_control_tank_v1.py
          node --check assets/build-layout-icons-v1.js
          node --check scripts/build_roll_responsive_smoke.mjs
          node --check scripts/build_gem_priority_smoke.mjs
          node --check scripts/topbar_scroll_smoke.mjs
          grep -Fq 'BUILD_HERO_LAYOUT_ICONS_V1' assets/build-layout-icons-v1.css
          grep -Fq 'BUILD_HERO_LAYOUT_ICONS_V1' assets/build-layout-icons-v1.js

      - name: Link assets into the site
        run: python3 scripts/apply_build_layout_icons_v1.py

      - name: Apply late S2 event rotation
        run: python3 scripts/patch_s2_late_event_rotation_v1.py

      - name: Apply Conqueror 4v4 Gale swap guidance
        run: python3 scripts/patch_conqueror_4v4_gale_swap_v1.py

      - name: Apply Guardian 4v4 control tank guidance
        run: python3 scripts/patch_guardian_4v4_control_tank_v1.py

      - name: Verify site wiring
        run: |
          grep -Fq 'BUILD_HERO_LAYOUT_ICONS_V1_ASSETS' index.html
          grep -Fq 'assets/build-layout-icons-v1.css' index.html
          grep -Fq 'assets/build-layout-icons-v1.js' index.html
          grep -Fq 'Treasure Hunt 16 + Feneck' index.html
          grep -Fq 'swap Flash Fire → Gale Dance' index.html
          grep -Fq "['Team SPD / Gale Dance','Flash Fire','Gale Dance']" index.html
          grep -Fq "['Valor Surge','Heart of Challenge','Lunarwater Threads','Luminous Shield']" index.html
          grep -Fq 'Full-team control tank: pull + Taunt + self-survival' index.html
          grep -Fq 'Water · Pull · Control · Cold setup' index.html

      - name: Install browser smoke dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Run full site browser smoke
        run: node scripts/site_smoke_test.mjs

      - name: Run responsive Roll Guide smoke
        run: node scripts/build_roll_responsive_smoke.mjs

      - name: Run gem priority smoke
        run: node scripts/build_gem_priority_smoke.mjs

      - name: Run topbar scroll smoke
        run: node scripts/topbar_scroll_smoke.mjs

      - name: Commit and push
        run: |
          if git diff --quiet -- index.html; then
            echo 'Layout assets and timeline patches are already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Apply build layout and timeline patches'
          git push
