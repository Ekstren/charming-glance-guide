name: Apply build layout and icons

on:
  push:
    branches: [main]
    paths:
      - 'assets/build-layout-icons-v1.css'
      - 'assets/build-layout-icons-v1.js'
      - 'scripts/apply_build_layout_icons_v1.py'
      - '.github/workflows/apply-build-layout-icons-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate assets
        run: |
          python3 -m py_compile scripts/apply_build_layout_icons_v1.py
          node --check assets/build-layout-icons-v1.js
          grep -Fq 'BUILD_HERO_LAYOUT_ICONS_V1' assets/build-layout-icons-v1.css
          grep -Fq 'BUILD_HERO_LAYOUT_ICONS_V1' assets/build-layout-icons-v1.js

      - name: Link assets into the site
        run: python3 scripts/apply_build_layout_icons_v1.py

      - name: Verify site wiring
        run: |
          grep -Fq 'BUILD_HERO_LAYOUT_ICONS_V1_ASSETS' index.html
          grep -Fq 'assets/build-layout-icons-v1.css' index.html
          grep -Fq 'assets/build-layout-icons-v1.js' index.html

      - name: Commit and push
        run: |
          if git diff --quiet -- index.html; then
            echo 'Layout/icon assets are already linked.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Apply build layout and icons'
          git push
