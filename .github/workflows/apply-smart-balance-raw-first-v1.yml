name: Apply Smart Balance raw first v1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_smart_balance_raw_first_v1.py'
      - 'scripts/fix_smart_balance_planstars_v1.py'
      - 'scripts/smart_balance_raw_first_smoke_v1.mjs'
      - '.github/workflows/apply-smart-balance-raw-first-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Smart Balance patch
        run: |
          python3 scripts/apply_smart_balance_raw_first_v1.py
          python3 scripts/fix_smart_balance_planstars_v1.py

      - name: Verify intended changes
        run: |
          grep -Fq 'SMART_BALANCE_RAW_FIRST_V1' index.html
          grep -Fq 'SMART_BALANCE_RAW_CEILING_V1' index.html
          grep -Fq 'const effectiveTargetStars=Math.max(targetStars' index.html
          grep -Fq "if(planSourceStage===0) brief.push('raw projected materials only')" index.html
          grep -Fq 'Smart Balance season-end result' index.html
          grep -Fq 'extra Realm purchases beyond the selected daily plan' index.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          fn=s[s.index('function betterFeasibleCandidate'):s.index('function betterDiagnosticCandidate')]
          stage=fn.index('const cStage=candidateRealmStage')
          effort=fn.index('const effortCmp=compareAcquisitionEffort')
          if stage >= effort:
              raise SystemExit('Realm stage must rank before acquisition effort in betterFeasibleCandidate')
          if s.count('const planStars=historical+cfg.starBase+Math.floor(plan.score/cfg.scorePerStar);') != 1:
              raise SystemExit('Smart Balance planStars declaration must be singular')
          print('Strict source ordering verified: raw -> planned tools -> extra purchases.')
          PY

      - name: Validate inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          out=Path('/tmp/inline-js')
          out.mkdir(exist_ok=True)
          for i,body in enumerate(scripts):
              (out/f'{i}.js').write_text(body,encoding='utf-8')
          print(f'extracted {len(scripts)} inline scripts')
          PY
          for f in /tmp/inline-js/*.js; do node --check "$f"; done

      - name: Install browser smoke dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Run Smart Balance regression smoke
        run: node scripts/smart_balance_raw_first_smoke_v1.mjs

      - name: Run full site browser smoke
        run: node scripts/site_smoke_test.mjs

      - name: Commit and push
        run: |
          if git diff --quiet -- index.html; then
            echo 'Smart Balance raw-first behavior is already current.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Make Smart Balance raw-first by default'
            git push
          fi
