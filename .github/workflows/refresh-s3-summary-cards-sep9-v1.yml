name: Refresh S3 summary cards Sep9 v1
on:
  push:
    paths:
      - 'scripts/refresh_s3_summary_cards_sep9_v1.py'
      - '.github/workflows/refresh-s3-summary-cards-sep9-v1.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply S3 summary refresh
        run: python3 scripts/refresh_s3_summary_cards_sep9_v1.py
      - name: Check semantic duplicates
        run: python3 scripts/check_timeline_duplicates.py index.html
      - name: Enforce summary-only timeline
        run: |
          grep -Fq 'TIMELINE_SUMMARY_ONLY_V1' index.html
          ! grep -Fq '<details class="entryMore">' index.html
      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          out=Path('/tmp/inline-js'); out.mkdir(exist_ok=True)
          for i,body in enumerate(scripts): (out/f'{i}.js').write_text(body,encoding='utf-8')
          print(f'extracted {len(scripts)} inline scripts')
          PY
          for f in /tmp/inline-js/*.js; do node --check "$f"; done
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Full site browser smoke
        run: node scripts/site_smoke_test.mjs
      - name: Commit and push
        run: |
          if git diff --quiet -- index.html; then
            echo 'No timeline changes.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Clean S3 timeline summaries and add companions Sep 9'
            git pull --rebase origin main
            git push origin main
          fi
