name: Apply mobile timeline layout v1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_mobile_timeline_layout_v1.py'
      - '.github/workflows/apply-mobile-timeline-layout-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply mobile layout patch
        run: python3 scripts/patch_mobile_timeline_layout_v1.py

      - name: Verify mobile CSS
        run: |
          grep -q 'MOBILE_TIMELINE_LAYOUT_V1' index.html
          grep -q "content:'Current'" index.html
          grep -q 'grid-template-columns:repeat(2,minmax(0,1fr))' index.html

      - name: Commit and push
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix mobile timeline layout'
          git push
