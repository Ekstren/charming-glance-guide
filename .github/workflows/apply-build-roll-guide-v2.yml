name: Apply build roll guide v2

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_build_roll_guide_v2.py'
      - '.github/workflows/apply-build-roll-guide-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch roll guide
        run: python3 scripts/patch_build_roll_guide_v2.py

      - name: Verify compact class-specific guide
        run: |
          grep -Fq 'BUILD_ROLL_GUIDE_V2' index.html
          grep -Fq "Conqueror:['crit','critdmg','critpair','acc','critacc','em','spd','atk']" index.html
          grep -Fq "Guardian:['block','blockpair','def','spd','hp']" index.html
          grep -Fq "heals:['heal','healpair','spd','hp','dmgres']" index.html
          grep -Fq 'Only substats recommended above are shown' index.html
          grep -Fq 'rollGuideGrid{display:grid;grid-template-columns:repeat(2' index.html

      - name: Commit and push
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Compact roll guide by class recommendations'
          git push
