name: Remove score safety margin

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-score-safety-margin.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Remove score safety margin
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old='''    const thresholdScore=Math.max(0,(targetStars-historical-cfg.starBase)*cfg.scorePerStar);
    // Plan 5% above the exact score threshold so rounding/data drift does not leave the target barely missed.
    const scoreSafetyMargin=0.05;
    const desired=Math.ceil(thresholdScore*(1+scoreSafetyMargin));'''
          new='''    const desired=Math.max(0,(targetStars-historical-cfg.starBase)*cfg.scorePerStar);'''
          if old not in s:
              raise SystemExit('5% safety formula not found')
          s=s.replace(old,new,1)

          old_label='<label>Target Primostars <small style="color:var(--status-positive);font-weight:800">+5% score safety</small><input id="targetStars" type="number" value="200"></label>'
          new_label='<label>Target Primostars<input id="targetStars" type="number" value="200"></label>'
          s=s.replace(old_label,new_label,1)

          s=s.replace('The optimizer deliberately targets 5% above the exact score threshold for the requested Primostar goal as a safety margin. ','',1)

          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate calculator JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          required='const desired=Math.max(0,(targetStars-historical-cfg.starBase)*cfg.scorePerStar);'
          if required not in text:
              raise SystemExit('original target formula not restored')
          if 'scoreSafetyMargin' in text or '+5% score safety' in text:
              raise SystemExit('5% safety remnants remain')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,flags=re.S|re.I)
          if not scripts:
              raise SystemExit('No inline scripts found')
          Path('/tmp/sxs.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/sxs.js

      - name: Commit and self-clean
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/remove-score-safety-margin.yml
          git add index.html
          git commit -m 'Remove Primostar score safety margin'
          git push origin main
