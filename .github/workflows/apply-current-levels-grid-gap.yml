name: Current levels grid spacing

on:
  push:
    branches: [main]
    paths:
      - '.github/patch-current-levels-grid-gap.py'
      - '.github/workflows/apply-current-levels-grid-gap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply spacing patch
        run: python .github/patch-current-levels-grid-gap.py
      - name: Verify spacing
        run: grep -Fq '.currentProgressGrid{grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:11px}' index.html
      - name: Commit site update
        run: |
          if git diff --quiet -- index.html; then
            echo "No site change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Match current level row spacing"
          git push
