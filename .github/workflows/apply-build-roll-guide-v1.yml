name: Apply build roll guide v1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_build_roll_guide_v1.py'
      - '.github/workflows/apply-build-roll-guide-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch roll guide
        run: python3 scripts/patch_build_roll_guide_v1.py

      - name: Verify roll guide
        run: |
          grep -Fq 'BUILD_ROLL_GUIDE_V1' index.html
          grep -Fq 'Crit Rate + Crit DMG' index.html
          grep -Fq '5.12% + 7.68%' index.html
          grep -Fq 'Approximate; not confirmed' index.html

      - name: Commit and push
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add early S2 roll guide to Builds'
          git push
