name: Apply conditional Realm tool remainder

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_conditional_tool_remaining_v1.py'
      - '.github/workflows/apply-conditional-tool-remaining-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply conditional remainder display
        run: python scripts/patch_conditional_tool_remaining_v1.py
      - name: Verify
        shell: bash
        run: |
          grep -q 'CONDITIONAL_TOOL_REMAINING_V1' index.html
          grep -q 'dailyGapRuns<=0 && remainingTools>0' index.html
          grep -q '<i>Remaining:</i>' index.html
          ! grep -q '<i>Saved left:</i>' index.html
      - name: Check inline script syntax
        shell: bash
        run: |
          python - <<'PY'
          import re, pathlib, subprocess, tempfile
          s=pathlib.Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          for i,body in enumerate(scripts):
              with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
                  f.write(body)
                  name=f.name
              subprocess.run(['node','--check',name],check=True)
          print(f'checked {len(scripts)} inline scripts')
          PY
      - name: Commit generated page
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Show Realm tool remainder only without extra need'
          git push origin HEAD:main
