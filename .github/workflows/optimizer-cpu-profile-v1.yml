name: Optimizer CPU profile v1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/optimizer_cpu_profile_v1.mjs'
      - '.github/workflows/optimizer-cpu-profile-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install browser dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Profile current v7
        run: node scripts/optimizer_cpu_profile_v1.mjs

      - name: Profile pre-v7 exact baseline
        run: |
          git show 6d248c8fa4d961cf4185328b773cb9146994aba7:index.html > index.html
          node scripts/optimizer_cpu_profile_v1.mjs
