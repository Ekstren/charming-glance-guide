name: Apply calculator size consistency pass

on:
  push:
    paths:
      - '.github/workflows/apply-calculator-size-consistency-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply size and consistency pass
        run: python .github/patch-calculator-size-consistency-v1.py
      - name: Verify
        run: |
          grep -q 'CALCULATOR_SIZE_CONSISTENCY_V1' index.html
          grep -q 'calculator-size-consistency-v1' index.html
          grep -q '.primostarRewardRow' index.html
          grep -q '.realmInventory' index.html
          grep -q '.planCosts>span' index.html
      - name: Commit generated index
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Normalize calculator sizing and spacing'
          git push
