name: Clarify Pandarial timing
on:
  push:
    paths:
      - '.github/workflows/apply-pandarial-day92-wording.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python .github/patch-pandarial-day92-wording.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          import re, pathlib, subprocess
          text=pathlib.Path('index.html').read_text(encoding='utf-8')
          for i,js in enumerate(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)):
              f=pathlib.Path(f'/tmp/inline-{i}.js'); f.write_text(js,encoding='utf-8'); subprocess.run(['node','--check',str(f)],check=True)
          PY
      - name: Verify clarification
        run: grep -q 'S2 Day 46' index.html && grep -q 'Server Day 92' index.html
      - name: Commit change
        run: |
          rm -f .github/patch-pandarial-day92-wording.py .github/workflows/apply-pandarial-day92-wording.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/patch-pandarial-day92-wording.py .github/workflows/apply-pandarial-day92-wording.yml
          git commit -m 'Clarify Pandarial server-day timing'
          git push
