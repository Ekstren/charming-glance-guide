name: Apply 20-refresh Realm tool accounting

on:
  push:
    paths:
      - '.github/workflows/apply-realm-20-refresh-tools.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/patch-realm-20-refresh-tools.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          js='\n'.join(scripts)
          p=Path('/tmp/calculator-inline.js'); p.write_text(js,encoding='utf-8')
          subprocess.run(['node','--check',str(p)],check=True)
          PY
      - name: Verify 20-refresh accounting
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'REALM_20_REFRESH_TOOL_COUNT_V1' in s
          assert 'const MAX_REALM_REFRESHES_PER_DAY=20;' in s
          assert 'return clamp(Math.floor(n(id,4)),0,MAX_REALM_REFRESHES_PER_DAY);' in s
          assert s.count('max="20" step="1" value="0"') >= 3
          assert 'Each refresh = 5 tools · max 20/day per Realm' in s
          assert 'Refreshes 11–20 count fully toward tool capacity' in s
          print('20 refreshes = 100 tools accounting verified for Ore, Essence, and Sand')
          PY
      - name: Commit
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix 20-refresh Material Realm tool accounting'
          git push
