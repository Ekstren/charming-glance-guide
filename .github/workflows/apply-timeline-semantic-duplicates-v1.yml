name: Apply timeline semantic duplicate cleanup

on:
  push:
    paths:
      - '.github/workflows/apply-timeline-semantic-duplicates-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply semantic duplicate cleanup
        run: python .github/patch-timeline-semantic-duplicates-v1.py
      - name: Verify timeline cleanup
        run: |
          ! grep -F "'Eternal Flower Garden'" index.html
          ! grep -F "'Rainbow Star Spirit'" index.html
          ! grep -F "['2026-12-08',147,'Fantomon','Prismora'" index.html
          ! grep -F "'Harpadia / Tier 6 boundary'" index.html
          grep -F "'Eternal Blossom Courtyard'" index.html
          grep -F "['2026-12-20',159,'Fantomon','Prismora'" index.html
          grep -F "['2027-02-25',226,'Region','Hapadi opens'" index.html
      - name: Validate inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          for i,src in enumerate(scripts):
              if not src.strip(): continue
              fn=f'/tmp/inline-{i}.js'
              Path(fn).write_text(src,encoding='utf-8')
              subprocess.run(['node','--check',fn],check=True)
          print(f'validated {len(scripts)} inline script blocks')
          PY
      - name: Commit generated cleanup
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Clean remaining timeline duplicates'
          git push
