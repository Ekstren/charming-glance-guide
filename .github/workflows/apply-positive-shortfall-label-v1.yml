name: Apply positive shortfall label

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-positive-shortfall-label-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Normalize shortfall display
        run: python .github/patch-positive-shortfall-label-v1.py
      - name: Verify
        run: |
          grep -q 'POSITIVE_SHORTFALL_LABEL_V1' index.html
          grep -q 'fmt(Math.abs(shortfall))' index.html
      - name: Commit generated index
        run: |
          if git diff --quiet -- index.html; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Normalize reserve shortfall labels'
          git push
