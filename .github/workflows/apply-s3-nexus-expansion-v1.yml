name: Apply S3 Nexus expansion timeline

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_s3_nexus_expansion_v1.py'
      - '.github/workflows/apply-s3-nexus-expansion-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply timeline patch
        run: python3 scripts/patch_s3_nexus_expansion_v1.py

      - name: Validate inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          out=Path('/tmp/inline-js')
          out.mkdir(exist_ok=True)
          for i,body in enumerate(scripts):
              (out/f'{i}.js').write_text(body,encoding='utf-8')
          print(f'extracted {len(scripts)} inline scripts')
          PY
          for f in /tmp/inline-js/*.js; do node --check "$f"; done

      - name: Verify intended timeline change
        run: |
          grep -Fq "PROJECTED NEXUS CHANGE: multiple Global community reports agree that the cross-server Nexus group grows from 4 servers in S2 to 8 servers in S3/Aethyris." index.html
          test "$(grep -Fc "PROJECTED NEXUS CHANGE:" index.html)" -eq 1

      - name: Install browser smoke dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Run site browser smoke
        run: node scripts/site_smoke_test.mjs

      - name: Commit and push
        run: |
          if git diff --quiet -- index.html; then
            echo 'S3 Nexus expansion timeline note is already current.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Add projected S3 Nexus expansion note'
            git pull --rebase origin main
            git push origin main
          fi
