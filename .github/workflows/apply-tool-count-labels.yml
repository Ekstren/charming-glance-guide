name: Apply Material Realm tool labels

on:
  push:
    paths:
      - '.github/patch-tool-count-labels.py'
      - '.github/workflows/apply-tool-count-labels.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply tool-count labels
        run: python .github/patch-tool-count-labels.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          if not scripts:
              raise SystemExit('no inline script found')
          Path('/tmp/site-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/site-inline.js
      - name: Verify tool labels
        run: |
          grep -q 'TOOL_COUNT_LABELS_V15' index.html
          grep -q '${fmt(planRuns)} ${planToolLabel}' index.html
          grep -q '${fmt(remainingTools)} ${remainingToolLabel}' index.html
          grep -q '${fmt(missing)} ${missingToolLabel}' index.html
      - name: Commit site update
        run: |
          if git diff --quiet -- index.html; then
            echo 'No site change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Label Material Realm tool counts clearly'
          git push origin main
