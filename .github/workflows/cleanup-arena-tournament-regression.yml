name: Cleanup Arena Tournament regression

on:
  push:
    paths:
      - '.github/workflows/cleanup-arena-tournament-regression.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore maintained build structure
        run: |
          git checkout ad8cf024d6b8ca33571ba1053376c878f9fcf3a7 -- index.html .github/build-fantomons-inject.html
          rm -f .github/patch-restore-arena-tournament-builds.py
          rm -f .github/workflows/apply-restore-arena-tournament-builds.yml
          rm -f .github/workflows/cleanup-arena-tournament-regression.yml
      - name: Verify intended loadout structure
        run: |
          python - <<'PY'
          from pathlib import Path
          expected={
            'Berserker':['Generic PvE','Dragon','PvP'],
            'Paladin':['Dungeon Tank','Water Offensive','Boss DPS / Off-Tank'],
            'Archmage':['AoE','Single Target'],
            'Arcanist':['AoE DPS','Single Target DPS','Healing'],
            'Conqueror':['All-Content','Dragon'],
            'Guardian':['Dungeon Tank','Water Offensive','Support / Boss'],
            'Destroyer':['AoE','Single Target','Fire AoE'],
            'Dominator':['AoE DPS','Single Target DPS','Healing'],
          }
          for fn in ['index.html','.github/build-fantomons-inject.html']:
            s=Path(fn).read_text(encoding='utf-8')
            assert 'ARENA_TOURNAMENT_RESTORE_V2' not in s
            for cls,names in expected.items():
              start=s.index(f'    {cls}:[')
              end=s.find('\n    ]',start)
              block=s[start:end]
              assert "role('Arena'" not in block and "role('Tournament'" not in block
              for name in names:
                assert f"role('{name}'" in block, (fn,cls,name)
          print('Maintained loadout structure verified')
          PY
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          import re, pathlib, subprocess, tempfile
          s=pathlib.Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          for i,js in enumerate(scripts):
            if not js.strip(): continue
            p=pathlib.Path(f'/tmp/inline-{i}.js')
            p.write_text(js,encoding='utf-8')
            subprocess.run(['node','--check',str(p)],check=True)
          print('Inline JavaScript validation passed')
          PY
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Remove Arena Tournament build regression'
          git push
