name: Apply build guide consensus PvP audit

on:
  push:
    paths:
      - '.github/workflows/apply-build-guide-consensus-pvp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply build audit
        run: python .github/patch-build-guide-consensus-pvp.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          for name in ['index.html','.github/build-fantomons-inject.html']:
              s=Path(name).read_text(encoding='utf-8')
              scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
              p=Path('/tmp/'+Path(name).name+'.js')
              p.write_text('\n'.join(scripts),encoding='utf-8')
              subprocess.run(['node','--check',str(p)],check=True)
              print('validated',name)
          PY
      - name: Verify audited builds and PvP coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['index.html','.github/build-fantomons-inject.html']:
              s=Path(name).read_text(encoding='utf-8')
              assert 'BUILD_GUIDE_CONSENSUS_PVP_V1' in s
              assert s.count("role('PvP'") >= 8, (name,s.count("role('PvP'"))
              assert "role('PvP','Mobility, burst and cheat-death'" in s
              assert "role('PvP','Reflect / block pressure with team protection'" in s
              assert "role('PvP','Fast elemental burst without Divine Wrath targeting RNG'" in s
              assert "role('PvP','Mobility, dispel and durable elemental pressure'" in s
              assert "role('PvP','Taunt, reflection and ally protection'" in s
              assert "role('PvP','Wind pressure / action-tempo burst'" in s
              assert "role('PvP','Solo Arena burst / utility'" in s
              assert "['Abyssal Hand','Dark Starburst','Dark Bullet','Shadow of Termination']" in s
              assert "['Formation Breaker','Howling Hurricane','Meteoric Flames','Wind Blade Spiral']" in s
              print('PvP coverage verified',name)
          PY
      - name: Commit
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/build-fantomons-inject.html
          git commit -m 'Audit S1 and S2 builds and add PvP loadouts'
          git push
