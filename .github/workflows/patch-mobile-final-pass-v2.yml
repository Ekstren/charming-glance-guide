name: Mobile final pass v2

on:
  push:
    paths:
      - '.github/workflows/patch-mobile-final-pass-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final mobile pass
        run: python scripts/patch_mobile_final_pass_v2.py
      - name: Verify responsive rules
        run: |
          grep -F 'MOBILE_FINAL_PASS_V2' assets/site.css
          grep -F 'grid-template-columns:repeat(2,minmax(0,1fr))!important' assets/site.css
          grep -F '.calculatorLayout{grid-template-columns:1fr!important}' assets/site.css
          grep -F '.postTargetCustom{grid-template-columns:1fr!important}' assets/site.css
      - name: Commit verified site changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/site.css
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Polish mobile layout across site'
          git push
