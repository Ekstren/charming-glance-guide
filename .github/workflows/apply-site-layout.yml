name: Apply site layout

on:
  push:
    branches: [main]
    paths:
      - '.github/patch-site-layout.py'
      - '.github/workflows/apply-site-layout.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply site layout patch
        run: python .github/patch-site-layout.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          import re, pathlib, subprocess, tempfile
          html=pathlib.Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I)
          for i,src in enumerate(scripts):
              if not src.strip():
                  continue
              p=pathlib.Path(tempfile.gettempdir())/f'inline-{i}.js'
              p.write_text(src,encoding='utf-8')
              subprocess.run(['node','--check',str(p)],check=True)
          print(f'Validated {len(scripts)} inline scripts')
          PY
      - name: Check diff
        run: git diff --check
      - name: Commit site layout
        run: |
          if git diff --quiet -- index.html; then
            echo "No index change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Match calculator width and polish mobile layout"
          git push
