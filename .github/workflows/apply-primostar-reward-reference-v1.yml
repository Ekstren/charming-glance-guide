name: Apply Primostar reward reference

on:
  push:
    paths:
      - '.github/workflows/apply-primostar-reward-reference-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Add Primostar reward reference
        run: python .github/patch-primostar-reward-reference-v1.py
      - name: Verify
        run: |
          grep -q 'PRIMOSTAR_REWARD_REFERENCE_V1' index.html
          grep -q 'Primostar rewards' index.html
          grep -q 'primostarRewardSeasons' index.html
          grep -q 'renderPrimostarRewardReference(stars)' index.html
          grep -q 'Season 1 · Witching Hours' index.html
          grep -q 'Season 2 · Crossed Paths' index.html
      - name: Commit generated index
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add expandable Primostar reward reference'
          git push
