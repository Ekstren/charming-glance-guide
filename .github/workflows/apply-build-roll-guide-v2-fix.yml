name: Apply corrected build roll guide v2

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_build_roll_guide_v2.py'
      - '.github/workflows/apply-build-roll-guide-v2-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch roll guide
        run: python3 scripts/patch_build_roll_guide_v2.py

      - name: Verify corrected markers
        run: |
          grep -Fq "crit:['Crit Rate','≈ 5.00%',1" index.html
          grep -Fq "em:['Elemental Mastery','Gear-level scaling',1" index.html
          grep -Fq "critacc:['Crit Rate + Accuracy','5.12% + 5.12%',1" index.html
          grep -Fq 'Double-Crit is directly documented' index.html

      - name: Commit and push
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Correct S2 roll guide confidence markers'
          git push
