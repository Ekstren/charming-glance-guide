name: Apply raw material shortfall display

on:
  push:
    paths:
      - '.github/patch-material-shortfall-display.py'
      - '.github/workflows/apply-material-shortfall-display.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply raw material shortfall display
        run: python .github/patch-material-shortfall-display.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          if not scripts:
              raise SystemExit('no inline script found')
          Path('/tmp/site-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/site-inline.js
      - name: Verify raw shortfall display
        run: |
          grep -q 'RAW_MATERIAL_SHORTFALL_DISPLAY_V1' index.html
          grep -q 'const rawStillShort=Math.max(0,Math.ceil(Number(hardShort)||0));' index.html
          grep -q 'Still short:</i><b>${fmt(rawStillShort)} ${materialName}' index.html
          ! grep -q 'Still short:</i><b>${fmt(missing)} ${missingToolLabel}' index.html
      - name: Commit site update
        run: |
          if git diff --quiet -- index.html; then
            echo 'No site change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Show raw material remaining shortfall'
          git push origin main
