name: Inline Dominator role toggle

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_dominator_toggle_inline_v1.py'
      - '.github/workflows/apply-dominator-toggle-inline-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move role toggle beside Dominator
        run: python scripts/patch_dominator_toggle_inline_v1.py
      - name: Verify
        shell: bash
        run: |
          grep -q 'DOMINATOR_TOGGLE_INLINE_V1' index.html
          grep -q 'dominatorHeadingRow' index.html
          grep -q '<strong>Dominator</strong><div class="dominatorModeTabs"' index.html
      - name: Commit generated page
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Move Dominator DPS Heals toggle beside title'
          git push origin HEAD:main
