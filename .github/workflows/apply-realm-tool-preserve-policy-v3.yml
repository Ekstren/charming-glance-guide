name: Apply Realm tool preservation policy v3

on:
  push:
    paths:
      - '.github/patch-realm-tool-preserve-policy-v3.py'
      - '.github/workflows/apply-realm-tool-preserve-policy-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python .github/patch-realm-tool-preserve-policy-v3.py
      - name: Verify policy and optimizer behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile

          text = Path('index.html').read_text(encoding='utf-8')
          checks = [
              ('policy marker', 'REALM_TOOL_PRESERVE_POLICY_V3'),
              ('policy checkbox', 'id="preserveRealmTools" checked type="checkbox"'),
              ('5 percent window', 'REALM_TOOL_PRESERVE_EFFICIENCY_WINDOW=0.05'),
              ('state persistence', "const CHECK_IDS = ['holdExp','preserveRealmTools'];"),
              ('Lv120 Realm values', 'realmMaxLevel:120,realm:{ore:1200,essence:1500,sand:1000,rolla:11800}'),
              ('S2 score constants', 'scoreFloor:130,relicFloor:13,starBase:45,scorePerStar:27,weights:{character:100,gear:18,skill:7,relic:33,fanto:8}'),
              ('S2 benchmark', 'S2_PRIMO_BENCHMARK_V2'),
              ('Bed reserve default', 'reserveHours:34'),
          ]
          for label, needle in checks:
              assert needle in text, f'missing {label}: {needle}'
          for stale in ['Reserve S2 Ore</label>','Reserve S2 Essence</label>','Reserve S2 Sand</label>','Reserve S2 Treats</label>']:
              assert stale not in text, f'legacy visible reserve toggle remains: {stale}'

          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S|re.I)
          checked = 0
          for i, script in enumerate(scripts):
              if not script.strip():
                  continue
              with tempfile.NamedTemporaryFile('w', suffix='.js', encoding='utf-8', delete=False) as f:
                  f.write(script)
                  name = f.name
              result = subprocess.run(['node', '--check', name], capture_output=True, text=True)
              if result.returncode != 0:
                  raise SystemExit(f'inline script {i} failed node --check:\n{result.stderr}')
              checked += 1
          print(f'Verified {checked} inline JS blocks')
          PY

          # Exercise the actual comparator functions from index.html with synthetic plans.
          node <<'JS'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          let preserve=true;
          global.$=(id)=>id==='preserveRealmTools'?{checked:preserve}:null;

          function extractFunction(name){
            const sig=`function ${name}(`;
            const start=html.indexOf(sig);
            if(start<0) throw new Error(`missing function ${name}`);
            const brace=html.indexOf('{',start);
            let depth=0, quote=null, esc=false;
            for(let i=brace;i<html.length;i++){
              const ch=html[i];
              if(quote){
                if(esc){esc=false;continue;}
                if(ch==='\\'){esc=true;continue;}
                if(ch===quote) quote=null;
                continue;
              }
              if(ch==='"'||ch==="'"||ch==='`'){quote=ch;continue;}
              if(ch==='{') depth++;
              else if(ch==='}' && --depth===0) return html.slice(start,i+1);
            }
            throw new Error(`unterminated function ${name}`);
          }

          const constMatch=html.match(/const REALM_TOOL_PRESERVE_EFFICIENCY_WINDOW=([0-9.]+);/);
          if(!constMatch) throw new Error('missing preserve-window constant');
          global.REALM_TOOL_PRESERVE_EFFICIENCY_WINDOW=Number(constMatch[1]);

          const names=[
            'candidateResourceMetric','compareAcquisitionEffort','preserveRealmToolsEnabled',
            'acquisitionEffortWithinRealmPreserveWindow','candidateRealmToolBurden','betterToolBurden',
            'candidateRealmStage','betterFeasibleCandidate'
          ];
          eval(names.map(extractFunction).join('\n'));

          function realm({runs=0,paid=0,banked=0,packs=0}={}){
            return {runsNeeded:runs,planRuns:runs,paidRunsUsed:paid,bankedUsed:banked,packs};
          }
          function candidate(name,hours,stage,{runs=0,paid=0,banked=0,dawnium=0}={}){
            let r;
            if(stage===0) r=realm();
            else if(stage===1) r=realm({runs,banked:runs});
            else r=realm({runs,paid:paid||runs,banked,packs:1});
            return {
              name,acquisitionHours:hours,dawniumCost:dawnium,unknownPriceRefreshes:0,
              overshoot:0,maxShare:0,sumShare:0,
              realm:{ore:r,essence:realm(),sand:realm()}
            };
          }
          function pick(a,b){return betterFeasibleCandidate(a,b)?a:b;}
          function assertPick(label,a,b,expected){
            const got=pick(a,b).name;
            if(got!==expected) throw new Error(`${label}: expected ${expected}, got ${got}`);
            console.log(`PASS ${label}: ${got}`);
          }

          preserve=true;
          assertPick('1% gain does not burn saved tools', candidate('tools',9.9,1,{runs:10}), candidate('raw',10,0), 'raw');
          assertPick('inside 5% window still preserves tools', candidate('tools',9.53,1,{runs:10}), candidate('raw',10,0), 'raw');
          assertPick('outside 5% window is allowed to use tools', candidate('tools',9.4,1,{runs:10}), candidate('raw',10,0), 'tools');
          assertPick('2.5% paid gain does not spend Dawnium', candidate('paid',7.8,2,{runs:10,paid:10,dawnium:200}), candidate('saved',8.0,1,{runs:5}), 'saved');
          assertPick('materially better paid route can win', candidate('paid',9.0,2,{runs:10,paid:10,dawnium:200}), candidate('raw',10.0,0), 'paid');

          preserve=false;
          assertPick('pure efficiency mode restores 1% win', candidate('tools',9.9,1,{runs:10}), candidate('raw',10,0), 'tools');
          assertPick('pure efficiency mode allows small paid win', candidate('paid',7.8,2,{runs:10,paid:10,dawnium:200}), candidate('saved',8.0,1,{runs:5}), 'paid');
          JS
      - name: Commit policy change
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Preserve Realm tools on near-equal S2 paths'
          git push origin main
