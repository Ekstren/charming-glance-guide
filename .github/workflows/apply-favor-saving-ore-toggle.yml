name: Favor saving Ore toggle

on:
  push:
    branches: [main]
    paths:
      - '.github/patch-favor-saving-ore-toggle.py'
      - '.github/workflows/apply-favor-saving-ore-toggle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply optimizer toggle patch
        run: python .github/patch-favor-saving-ore-toggle.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          if not scripts:
              raise SystemExit('no inline script found')
          Path('/tmp/site-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/site-inline.js
      - name: Verify favor Ore toggle
        run: |
          grep -q 'FAVOR_SAVING_ORE_TOGGLE_V1' index.html
          grep -q 'id="favorOre"' index.html
          grep -q 'Favor saving Ore' index.html
          ! grep -q 'data-optimizer-mode=' index.html
          ! grep -q 'id="optimizerMode"' index.html
      - name: Commit site update
        run: |
          if git diff --quiet -- index.html; then
            echo 'No site change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Replace optimizer selector with Favor saving Ore toggle'
          git push origin main
