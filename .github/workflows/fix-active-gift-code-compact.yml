name: Fix Active gift-code compact summary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-active-gift-code-compact.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Repair compact gift-code summaries
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="    [/gift code|4p7y2r9m/i, 'Expired at the reported Aug 25 00:00 UTC-5 cutoff (Aug 24, 10:00 PM PDT). Reward was 2,000 Rolla + 120 Dawnium.'],"
          new="""    [/gift code · summer|gift code summer/i, 'UNCONFIRMED cutoff: Summer gives 160 Dawnium and is reported valid through Sep 1; redeem promptly.'],
    [/weekly gift code|4p7y2r9m/i, 'Expired at the reported Aug 25 00:00 UTC-5 cutoff (Aug 24, 10:00 PM PDT). Reward was 2,000 Rolla + 120 Dawnium.'],"""
          if old not in s:
              if 'gift code · summer|gift code summer' not in s:
                  raise SystemExit('compact gift-code anchor not found')
          else:
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

      - name: Validate inline JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          required=[
            'gift code · summer|gift code summer',
            'weekly gift code|4p7y2r9m',
            'Summer gives 160 Dawnium and is reported valid through Sep 1'
          ]
          for item in required:
            if item not in text:
              raise SystemExit(f'Missing expected compact-summary repair: {item}')
          scripts=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',text,flags=re.S|re.I)
          if not scripts:
            raise SystemExit('No inline scripts found')
          Path('/tmp/sxs.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/sxs.js

      - name: Commit and self-clean
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-active-gift-code-compact.yml
          git add index.html
          git commit -m 'Fix Summer code Active-now summary'
          git push origin main
