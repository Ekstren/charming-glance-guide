name: Apply post-plan scarcity balance v4

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_post_plan_scarcity_v4.py'
      - 'scripts/post_plan_scarcity_profile_v4.mjs'
      - '.github/workflows/apply-post-plan-scarcity-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Profile current balance
        continue-on-error: true
        run: node scripts/post_plan_scarcity_profile_v4.mjs | tee /tmp/post-plan-before.txt

      - name: Benchmark before v4
        continue-on-error: true
        run: node scripts/calculator_perf_check.mjs | tee /tmp/perf-v4-before.txt

      - name: Apply v4
        run: python3 scripts/apply_post_plan_scarcity_v4.py

      - name: Validate marker and inline JS
        run: |
          grep -Fq 'POST_PLAN_SCARCITY_V4' index.html
          grep -Fq 'POST_PLAN_SCARCITY_MAX=2.50' index.html
          grep -Fq 'spentFraction' index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          out=Path('/tmp/jsv4');out.mkdir(exist_ok=True)
          for i,b in enumerate(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)):
              (out/f'{i}.js').write_text(b,encoding='utf-8')
          PY
          for f in /tmp/jsv4/*.js; do node --check "$f"; done

      - name: Existing scarcity regression
        run: node scripts/scarcity_adjusted_acquisition_smoke_v1.mjs

      - name: Goal-stop regression
        run: node scripts/smart_balance_goal_stop_smoke_v2.mjs

      - name: Profile v4 balance
        run: node scripts/post_plan_scarcity_profile_v4.mjs | tee /tmp/post-plan-after.txt

      - name: Benchmark after v4
        run: node scripts/calculator_perf_check.mjs | tee /tmp/perf-v4-after.txt

      - name: Full browser smoke
        run: node scripts/site_smoke_test.mjs

      - name: Commit and push
        run: |
          if git diff --quiet -- index.html; then
            echo 'v4 already current'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Balance Smart Balance by post-plan scarcity'
            git pull --rebase origin main
            git push origin main
          fi
