name: Apply plain tool lines

on:
  push:
    paths:
      - '.github/patch-plain-tool-lines.py'
      - '.github/workflows/apply-plain-tool-lines.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply plain Realm tool helper lines
        run: python .github/patch-plain-tool-lines.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          if not scripts:
              raise SystemExit('no inline script found')
          Path('/tmp/site-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/site-inline.js
      - name: Verify tool helper style
        run: |
          grep -q 'PLAIN_TOOL_LINES_V10' index.html
          grep -q 'toolFree.*left' index.html
          grep -q 'toolSep{display:none!important}' index.html
      - name: Commit site update
        run: |
          if git diff --quiet -- index.html; then
            echo 'No site change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Simplify Realm tool result styling'
          git push origin main
