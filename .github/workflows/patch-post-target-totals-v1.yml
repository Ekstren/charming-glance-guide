name: Apply post-target totals

on:
  push:
    paths:
      - scripts/patch_post_target_totals_v1.py
      - .github/workflows/patch-post-target-totals-v1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply post-target totals patch
        run: python3 scripts/patch_post_target_totals_v1.py
      - name: Verify runtime JavaScript syntax
        run: node --check assets/runtime.js
      - name: Verify post-target totals
        run: |
          grep -q 'Estimated post-target totals' index.html
          grep -q 'function postTargetCarryAt' assets/runtime.js
          grep -q 'Hammers total' assets/runtime.js
          ! grep -q 'value="save"> Save Stamina' index.html
      - name: Commit verified site changes
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898258+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/runtime.js
          git commit -m 'Show post-target season-end totals'
          git push origin HEAD:main
