name: Refresh remaining T4 stat priorities

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_other_t4_stat_prio_v1.py'
      - '.github/workflows/apply-other-t4-stat-prio-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply audited T4 stat guidance
        run: python scripts/patch_other_t4_stat_prio_v1.py
      - name: Verify refreshed profiles
        shell: bash
        run: |
          grep -q "Current T4 evidence supports ATK ≥ Elemental Mastery" index.html
          grep -q "Block is Guardian’s defining stat" index.html
          grep -q "Effect Hit Rate is a threshold stat" index.html
          grep -q "Healing scales from Max HP" index.html
          grep -q "Current T4 evidence supports ATK ≥ Elemental Mastery" scripts/patch_restore_rich_builds_v1.py
      - name: Commit generated update
        shell: bash
        run: |
          if git diff --quiet -- index.html scripts/patch_restore_rich_builds_v1.py; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html scripts/patch_restore_rich_builds_v1.py
          git commit -m 'Refresh Conqueror Guardian and Dominator stat priorities'
          git push origin HEAD:main
