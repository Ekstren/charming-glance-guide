name: Apply VEGGIE timeline code

on:
  push:
    paths:
      - '.github/patch-add-veggie-code-v1.py'
      - '.github/workflows/apply-veggie-code-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply VEGGIE timeline patch
        run: python .github/patch-add-veggie-code-v1.py
      - name: Verify VEGGIE entry
        run: |
          grep -q 'TIMELINE_VEGGIE_CODE_V1' index.html
          grep -q 'Gift code · VEGGIE' index.html
          grep -q '10 Rare Auroral Badges + 80 Dawnium' index.html
      - name: Validate inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I)
          if not scripts:
              raise SystemExit('No inline scripts found')
          for i,src in enumerate(scripts):
              p=Path(tempfile.gettempdir())/f'sxs-inline-{i}.js'
              p.write_text(src,encoding='utf-8')
              subprocess.run(['node','--check',str(p)],check=True)
          PY
      - name: Commit generated timeline update
        run: |
          if git diff --quiet -- index.html; then
            echo 'No generated change needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add VEGGIE gift code to timeline'
          git push
