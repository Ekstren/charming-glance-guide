# trigger: Charming Glance in-game countdown confirmation
name: Confirm S2 countdown
on:
  push:
    paths:
      - .github/workflows/confirm-s2-countdown.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update timeline confirmation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          reps={
          "Season 2 / <b>Crossed Paths</b> is currently expected around <b>Server Day 47 / Aug 30</b>. Prydwen supports the Day-47 model, while QY warns mergers can shift Loong Haven entry timing, so the in-game Telescope/countdown remains the final authority.":"Season 2 / <b>Crossed Paths</b> is confirmed for <b>Server Day 47 / Aug 30 at the 6:00 AM PDT reset</b> by the Charming Glance in-game season countdown observed Aug 26 (3d 21h remaining). Prydwen's Day-47 model independently agrees; QY's merger caveat remains useful for other servers.",
          "Expected final prep day if Charming Glance follows the Day-47 S2 model. QY Maple currently says S1 can last ~44–46 days and that server mergers can alter Loong Haven entry timing, so verify the in-game Telescope/countdown before waiting until this date.":"Confirmed final prep day for Charming Glance: the Aug 26 in-game season countdown showed 3d 21h remaining, aligning with the Aug 30 6:00 AM PDT reset.",
          "EXPECTED from the common Server Day-47 model: Season 2 Day 1 on Aug 30 at the 6:00 AM PT reset. Prydwen says T4 begins around Day 47, but QY Maple currently says S1 lasts ~44–46 days and explicitly warns that server mergers can alter the day Loong Haven becomes available. No Charming Glance-specific Telescope/countdown confirmation has been found yet, so verify in game.":"CONFIRMED for Charming Glance: Season 2 Day 1 begins Aug 30 at the 6:00 AM PDT reset. The Aug 26 in-game season countdown showed 3d 21h remaining, matching the Day-47 model; Prydwen independently places T4 around Day 47.",
          "The Aug 30 date follows the expected Charming Glance S2 anchor, so verify the in-game Telescope/countdown.":"The Aug 30 date is confirmed for Charming Glance by the in-game season countdown observed Aug 26.",
          "Expected Aug 29 prep if S2 lands Aug 30; verify the in-game Telescope/countdown because QY warns mergers can shift Loong Haven timing. Save dungeon attempts and treat 36h Bed EXP banking as unconfirmed.":"Aug 29 is the confirmed final prep day before the Aug 30 6:00 AM PDT S2 reset. Save dungeon attempts; treat 36h Bed EXP banking as unconfirmed.",
          "Expected Aug 30 from the Day-47 model; QY warns mergers can shift Loong Haven timing, so verify Telescope/countdown. Gates: Lv.106 T4, Lv.108 Fantomon Adult, Lv.116 Demonbind Tower.":"Confirmed Aug 30 at 6:00 AM PDT by the Charming Glance in-game season countdown. Gates: Lv.106 T4, Lv.108 Fantomon Adult, Lv.116 Demonbind Tower.",
          "S2 feature: Mythic+ gear can reroll or transfer affixes; same-season transfer is free. Aug 30 follows the expected S2 anchor, so verify Telescope/countdown.":"S2 feature: Mythic+ gear can reroll or transfer affixes; same-season transfer is free. Aug 30 is confirmed for Charming Glance by the in-game season countdown."
          }
          for old,new in reps.items():
              if old not in s:
                  raise SystemExit('missing expected text: '+old[:80])
              s=s.replace(old,new)
          s=s.replace("'feature',null,'unconfirmed'],\n    ['2026-08-30',47,'Region','Loong Haven opens'", "'feature'],\n    ['2026-08-30',47,'Region','Loong Haven opens'",1)
          s=s.replace("'region',null,'unconfirmed'],\n    ['2026-08-30',47,'Feature','Gear Refinement & Affix Transfer'", "'region'],\n    ['2026-08-30',47,'Feature','Gear Refinement & Affix Transfer'",1)
          s=s.replace("'feature',null,'unconfirmed'],\n    ['2026-08-30',47,'Feature','Season 2 launch checklist'", "'feature'],\n    ['2026-08-30',47,'Feature','Season 2 launch checklist'",1)
          p.write_text(s)
          PY
      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/inline.js').write_text('\n;\n'.join(blocks))
          PY
          node --check /tmp/inline.js
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Confirm Charming Glance Aug 30 Season 2 reset"
          git push
