name: Apply Material Realm visual cleanup v2

on:
  push:
    paths:
      - '.github/workflows/apply-material-realm-visual-cleanup-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply Material Realm cleanup
        run: python .github/patch-material-realm-visual-cleanup-v1.py
      - name: Verify presentation patch
        run: |
          grep -q 'MATERIAL_REALM_VISUAL_CLEANUP_V1' index.html
          grep -q 'material-realm-visual-cleanup-v1' index.html
          grep -q '.realmPlanSummary' index.html
      - name: Commit generated index
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Polish Material Realm layout'
          git push
