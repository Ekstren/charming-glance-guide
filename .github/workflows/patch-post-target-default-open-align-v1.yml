name: Post-target default open + align v1

on:
  push:
    paths:
      - '.github/workflows/patch-post-target-default-open-align-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply post-target default-open alignment patch
        run: python scripts/patch_post_target_default_open_align_v1.py
      - name: Verify post-target markup and styling
        run: |
          grep -F '<details class="postTargetOptions" open>' index.html
          grep -F '<span>Ore purchases/day</span>' index.html
          grep -F '<span>Essence purchases/day</span>' index.html
          grep -F '<span>Sand purchases/day</span>' index.html
          grep -F 'POST_TARGET_CUSTOM_ALIGN_V1' assets/site.css
      - name: Commit verified site changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/site.css
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Open and align post-target plan options'
          git push
