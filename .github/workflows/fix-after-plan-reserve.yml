name: Fix Material Realm reserve display

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-after-plan-reserve.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix reserve double-counting in after-plan display
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""    const afterPlanTools={
      ore:Math.max(0,(plan.realm?.ore?.bankedRemaining||0)+(plan.realm?.ore?.sparePurchasedRuns||0)),
      essence:Math.max(0,(plan.realm?.essence?.bankedRemaining||0)+(plan.realm?.essence?.sparePurchasedRuns||0)+protectedKnuckles),
      sand:Math.max(0,(plan.realm?.sand?.bankedRemaining||0)+(plan.realm?.sand?.sparePurchasedRuns||0)+protectedShovels)
    };
"""
          new="""    const afterPlanTools={
      ore:Math.max(0,(plan.realm?.ore?.bankedRemaining||0)+(plan.realm?.ore?.sparePurchasedRuns||0)),
      essence:Math.max(0,(plan.realm?.essence?.bankedRemaining||0)+(plan.realm?.essence?.sparePurchasedRuns||0)),
      sand:Math.max(0,(plan.realm?.sand?.bankedRemaining||0)+(plan.realm?.sand?.sparePurchasedRuns||0))
    };
"""
          if old not in s:
              raise SystemExit('afterPlanTools block not found')
          s=s.replace(old,new,1)
          old2="el.textContent=`After plan: ${fmt(value)} left${protectedCount?` · ${fmt(protectedCount)} S2 reserve`:''}`;"
          new2="el.textContent=`After recommended plan: ${fmt(value)} spendable left${protectedCount?` · ${fmt(protectedCount)} S2 reserve`:''}`;"
          if old2 not in s:
              raise SystemExit('after plan label not found')
          s=s.replace(old2,new2,1)
          old3="el.textContent=`Suggested: ${suggested[d.key]}/day`;"
          new3="el.textContent=`Suggested: up to ${suggested[d.key]}/day`;"
          if old3 in s:
              s=s.replace(old3,new3,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          if not scripts: raise SystemExit('No inline scripts found')
          Path('/tmp/sxs.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/sxs.js
      - name: Commit and self-clean
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-after-plan-reserve.yml
          git add index.html
          git commit -m 'Fix Material Realm reserve display math'
          git push origin main
