name: Add Summer code lead

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-summer-code-lead.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch timeline
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          anchor="    ['2026-08-19',36,'Global Gift','Weekly gift code · 4P7Y2R9M','2,000 Rolla + 120 Dawnium · MEmu reports expiry Aug 25 at 00:00 UTC-5, which is Aug 24 at 10:00 PM PDT.','event','2026-08-25',null,'2026-08-24T22:00:00-07:00'],\n"
          addition="    ['2026-08-25',42,'Global Gift','Gift code · Summer','UNCONFIRMED community lead: a current Sword × Staff code tracker updated Aug 25 lists Summer as a new working code. Reward and expiry have not been independently confirmed; try it promptly and treat availability as provisional.','event',null,'unconfirmed'],\n"
          if "'Gift code · Summer'" not in s:
              if anchor not in s:
                  raise SystemExit('gift-code anchor not found')
              s=s.replace(anchor,anchor+addition,1)

          sum_anchor="    if(title.startsWith('Weekly gift code')) return '2,000 Rolla + 120 Dawnium. Expired at the reported Aug 25 00:00 UTC-5 cutoff (Aug 24, 10:00 PM PDT).';\n"
          sum_add="    if(title==='Gift code · Summer') return 'UNCONFIRMED Aug 25 community lead: code Summer is reported working; reward and expiry are not yet independently confirmed, so try it promptly.';\n"
          if "if(title==='Gift code · Summer')" not in s:
              if sum_anchor not in s:
                  raise SystemExit('summary anchor not found')
              s=s.replace(sum_anchor,sum_anchor+sum_add,1)

          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate inline JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          if "'Gift code · Summer'" not in text or "if(title==='Gift code · Summer')" not in text:
              raise SystemExit('Summer code timeline patch missing')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          if not scripts:
              raise SystemExit('No inline scripts found')
          Path('/tmp/sxs.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/sxs.js

      - name: Commit and self-clean
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/add-summer-code-lead.yml
          git add index.html
          git commit -m 'Add unconfirmed Summer gift code lead'
          git push origin main
