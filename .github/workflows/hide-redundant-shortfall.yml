name: Hide redundant calculator shortfall details

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hide-redundant-shortfall.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Hide redundant shortfall detail rows
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='.planCosts small.shortfallBreakdown .planShort{display:none!important}'
          new='.planCosts small.shortfallBreakdown{display:none!important}'
          if new not in s:
              if old not in s:
                  raise SystemExit('goal cleanup CSS marker not found')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          Path('/tmp/sxs.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/sxs.js
      - name: Commit and self-clean
        run: |
          git rm .github/workflows/hide-redundant-shortfall.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Show only goal-level resource shortfall warning'
          git push origin main
