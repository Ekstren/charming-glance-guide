name: Move optimizer details and match projection

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_optimizer_formula_layout_v1.py'
      - '.github/workflows/move-optimizer-details-and-match-projection.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply layout cleanup
        run: python3 scripts/patch_optimizer_formula_layout_v1.py
      - name: Validate
        run: |
          node --check assets/runtime.js
          python3 scripts/check_timeline_duplicates.py index.html
      - name: Commit layout cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/site.css
          git commit -m 'Move optimizer details into formula checks'
          git push
