name: Smart Balance result layout v1
on:
  push:
    paths:
      - '.github/workflows/patch-smart-balance-result-v1.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Smart Balance result patch
        run: python scripts/patch_smart_balance_result_v1.py
      - name: Verify runtime JavaScript syntax
        run: node --check assets/runtime.js
      - name: Verify UI hooks
        run: |
          grep -q 'id="targetCharacterAtGoal"' index.html
          grep -q 'id="seasonEndCharacterResult"' index.html
          grep -q 'Estimated next-season inventory' index.html
          grep -q 'postTargetOptions' index.html
          grep -q 'targetCharacterAtGoal' assets/runtime.js
          grep -q 'seasonEndCharacterResult' assets/runtime.js
          grep -q 'SMART_BALANCE_RESULT_V1' assets/site.css
          grep -q '.calcResults .planCosts{display:none!important}' assets/site.css
      - name: Commit verified site changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898258+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/runtime.js assets/site.css
          git diff --cached --quiet || git commit -m "Streamline Smart Balance result and show target Character"
          git push
