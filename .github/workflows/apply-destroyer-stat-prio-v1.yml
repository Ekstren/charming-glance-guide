name: Update Destroyer stat priorities

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_destroyer_stat_prio_v1.py'
      - '.github/workflows/apply-destroyer-stat-prio-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Destroyer stat priorities
        run: python scripts/patch_destroyer_stat_prio_v1.py
      - name: Verify Destroyer profile
        shell: bash
        run: |
          grep -q "Flat ATK ≥ Elemental Mastery > Crit > SPD" index.html
          grep -q "Do not value ATK% like flat ATK" index.html
          grep -q "Flat ATK ≥ Elemental Mastery > Crit > SPD" scripts/patch_restore_rich_builds_v1.py
      - name: Commit generated update
        shell: bash
        run: |
          if git diff --quiet -- index.html scripts/patch_restore_rich_builds_v1.py; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html scripts/patch_restore_rich_builds_v1.py
          git commit -m 'Update Destroyer stat priorities for T4'
          git push origin HEAD:main
