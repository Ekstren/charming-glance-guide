name: Optimize Builds class switching v1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_build_switch_no_flicker_v1.py'
      - 'scripts/build_class_switch_benchmark_v1.mjs'
      - '.github/workflows/optimize-build-class-switch-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install browser dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Benchmark current class switching
        run: node scripts/build_class_switch_benchmark_v1.mjs | tee /tmp/build-before.log
      - name: Apply no-flicker Builds patch
        run: python3 scripts/patch_build_switch_no_flicker_v1.py
      - name: Validate patch markers
        run: |
          grep -Fq 'BUILD_SWITCH_NO_FLICKER_V1' index.html
          grep -Fq '__applyBuildMetaNow' index.html
          grep -Fq 'buildTemplateForClass' index.html
      - name: Validate timeline duplicates
        run: python3 scripts/check_timeline_duplicates.py index.html
      - name: Validate inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          out=Path('/tmp/inline-js'); out.mkdir(exist_ok=True)
          for i,body in enumerate(scripts): (out/f'{i}.js').write_text(body,encoding='utf-8')
          print(f'extracted {len(scripts)} inline scripts')
          PY
          for f in /tmp/inline-js/*.js; do node --check "$f"; done
      - name: Benchmark optimized class switching
        run: node scripts/build_class_switch_benchmark_v1.mjs | tee /tmp/build-after.log
      - name: Require structural flicker removal
        run: |
          python3 - <<'PY'
          import json
          def row(path):
              line=next(x for x in open(path,encoding='utf-8') if x.startswith('BUILD_SWITCH_JSON='))
              return json.loads(line.split('=',1)[1])
          before=row('/tmp/build-before.log'); after=row('/tmp/build-after.log')
          print('BEFORE',before)
          print('AFTER ',after)
          if before['tabChildMutations'] < 5:
              raise SystemExit('baseline did not reproduce class-tab reconstruction')
          if after['tabChildMutations'] != 0:
              raise SystemExit('optimized Builds still reconstructs class-tab nodes')
          if not after['stableTabs']:
              raise SystemExit('optimized class tabs do not retain DOM identity')
          if after['immediateMetaReady'] != after['switches']:
              raise SystemExit(f"META layer was not ready synchronously on every switch: {after['immediateMetaReady']}/{after['switches']}")
          if after['averageMs'] > max(40,before['averageMs']*1.35):
              raise SystemExit('optimized class switch became materially slower')
          PY
      - name: Run complete build variant smoke
        run: node scripts/build_swap_smoke.mjs
      - name: Run full site browser smoke
        run: node scripts/site_smoke_test.mjs
      - name: Commit and push
        run: |
          if git diff --quiet -- index.html; then
            echo 'Build switch optimization already applied.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Eliminate Builds class-switch flicker'
            git pull --rebase origin main
            git push origin main
          fi
