name: Apply Builds and calculator performance patch

on:
  push:
    paths:
      - 'scripts/patch_build_dominator_reset_perf_v1.py'
      - '.github/workflows/apply-build-dominator-reset-perf-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch index
        run: python scripts/patch_build_dominator_reset_perf_v1.py
      - name: Verify repair anchors
        run: |
          grep -q 'BUILD_DOMINATOR_RESET_PERF_V1' index.html
          grep -q 'data-dominator-mode="dps"' index.html
          grep -q 'data-dominator-role="heals"' index.html
          grep -q 'FUTURE_RESET_COUNT_CACHE' index.html
          ! grep -q '<div class="buildsNavCell">' index.html
      - name: Commit generated index
        run: |
          if git diff --quiet -- index.html; then
            echo 'No generated changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Center Builds, restore Dominator roles, speed S2 reset math'
          git push
