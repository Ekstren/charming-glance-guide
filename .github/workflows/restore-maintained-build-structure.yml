name: Restore maintained build structure
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-maintained-build-structure.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove artificial Arena/Tournament build cards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          lines=p.read_text().splitlines(True)
          out=[]
          in_roles=False
          cls=None
          removed_arena=removed_tourney=0
          converted=0
          classes={'Berserker','Paladin','Archmage','Arcanist','Conqueror','Guardian','Destroyer','Dominator'}
          for line in lines:
              if 'const ROLE_PRESETS={' in line:
                  in_roles=True
              if in_roles:
                  stripped=line.strip()
                  for c in classes:
                      if stripped.startswith(c+':['):
                          cls=c
                          break
                  if "role('Arena'" in line:
                      if cls=='Berserker':
                          line=line.replace("role('Arena'","role('PvP'",1).replace("'Prydwen Arena'","'Prydwen PvP'",1)
                          converted+=1
                      else:
                          removed_arena+=1
                          continue
                  elif "role('Tournament'" in line:
                      removed_tourney+=1
                      continue
                  if in_roles and line.startswith('  };'):
                      in_roles=False
                      cls=None
              out.append(line)
          if converted != 1 or removed_arena != 7 or removed_tourney != 8:
              raise SystemExit(f'Unexpected role cleanup counts: converted={converted}, arena={removed_arena}, tournament={removed_tourney}')
          s=''.join(out)
          block=s.split('const ROLE_PRESETS={',1)[1].split('\n  };',1)[0]
          if "role('Arena'" in block or "role('Tournament'" in block:
              raise SystemExit('Arena/Tournament role cards remain in ROLE_PRESETS')
          expected={
            'Berserker':['Generic PvE','Dragon','PvP'],
            'Paladin':['Dungeon Tank','Water Offensive','Boss DPS / Off-Tank'],
            'Archmage':['AoE','Single Target'],
            'Arcanist':['AoE DPS','Single Target DPS','Healing'],
            'Conqueror':['All-Content','Dragon'],
            'Guardian':['Dungeon Tank','Water Offensive','Support / Boss'],
            'Destroyer':['AoE','Single Target','Fire AoE'],
            'Dominator':['AoE DPS','Single Target DPS','Healing'],
          }
          import re
          for i,(c,names) in enumerate(expected.items()):
              start=block.index(c+':[')
              next_starts=[block.find(n+':[',start+1) for n in expected if block.find(n+':[',start+1)>=0]
              end=min(next_starts) if next_starts else len(block)
              sec=block[start:end]
              found=re.findall(r"role\('([^']+)'",sec)
              if found != names:
                  raise SystemExit(f'{c} roles mismatch: {found} != {names}')
          p.write_text(s)
          print('Restored intended ROLE_PRESETS structure.')
          PY
      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          import re, pathlib, subprocess, tempfile, sys
          text=pathlib.Path('index.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, re.S|re.I)
          for src in scripts:
              with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False) as f:
                  f.write(src); name=f.name
              r=subprocess.run(['node','--check',name],capture_output=True,text=True)
              if r.returncode:
                  print(r.stderr); sys.exit(r.returncode)
          print(f'Validated {len(scripts)} inline script block(s).')
          PY
      - name: Commit cleanup and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/restore-maintained-build-structure.yml
          git add index.html .github/workflows/restore-maintained-build-structure.yml
          git commit -m 'Restore maintained build card structure'
          git push