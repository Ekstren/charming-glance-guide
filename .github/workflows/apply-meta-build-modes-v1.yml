name: Apply S2 meta build mode redesign

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_meta_build_modes_v1.py'
      - '.github/workflows/apply-meta-build-modes-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Builds
        run: python3 scripts/patch_meta_build_modes_v1.py

      - name: Verify meta modes
        run: |
          grep -Fq 'META_BUILD_MODES_V1' index.html
          grep -Fq "role('Dungeon'" .github/build-fantomons-inject.html
          grep -Fq "role('Crucible / Conquest'" .github/build-fantomons-inject.html
          grep -Fq "role('Tournament · 2v2'" .github/build-fantomons-inject.html
          grep -Fq "role('Tournament · 4v4'" .github/build-fantomons-inject.html
          grep -Fq 'data-meta-mode' index.html
          grep -Fq 'data-tournament-size' index.html
          grep -Fq 'activity-driven by META_BUILD_MODES_V1' index.html
          grep -Fq "'META_BUILD_MODES_V1'" scripts/patch_restore_rich_builds_v1.py
          python3 -m py_compile scripts/patch_meta_build_modes_v1.py scripts/patch_restore_rich_builds_v1.py

      - name: Commit and push
        run: |
          if git diff --quiet -- index.html .github/build-fantomons-inject.html scripts/patch_restore_rich_builds_v1.py; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/build-fantomons-inject.html scripts/patch_restore_rich_builds_v1.py
          git commit -m 'Restructure Builds around S2 meta activities'
          git push
