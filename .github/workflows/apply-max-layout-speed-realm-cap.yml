name: Apply max layout speed realm cap

on:
  push:
    branches: [main]
    paths:
      - '.github/patch-max-layout-speed-realm-cap.py'
      - '.github/workflows/apply-max-layout-speed-realm-cap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UI and Realm corrections
        run: python .github/patch-max-layout-speed-realm-cap.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          js='\n'.join(blocks)
          with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
              f.write(js); name=f.name
          subprocess.run(['node','--check',name],check=True)
          PY
      - name: Verify changes
        run: |
          grep -q 'MAX_LAYOUT_SPEED_REALM_CAP_V1' index.html
          grep -q 'Maximum target' index.html
          grep -q 'max 10/day per Realm' index.html
          grep -q 'MAX_REALM_REFRESHES_PER_DAY=MATERIAL_REALM_BUY_COSTS.length' index.html
          ! grep -q 'id="freeSpeed"' index.html
          ! grep -q "\$('freeSpeed')" index.html
          ! grep -q 'max 20/day per Realm' index.html
      - name: Commit site update
        run: |
          if git diff --quiet -- index.html; then
            echo 'No site changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Move max finder, assume daily boost, correct Realm cap'
          git push
