name: Rename planner cost labels

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-plan-cost-labels.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Rename resource cost suffixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='.planCosts>span>b::after{content:" used";'
          new='.planCosts>span>b::after{content:" needed";'
          if old not in s:
              raise SystemExit('generic plan cost suffix not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          if not scripts: raise SystemExit('No inline scripts found')
          Path('/tmp/sxs.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/sxs.js
      - name: Commit and clean
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/rename-plan-cost-labels.yml
          git add index.html
          git commit -m 'Clarify planner resource costs as needed'
          git push origin main
