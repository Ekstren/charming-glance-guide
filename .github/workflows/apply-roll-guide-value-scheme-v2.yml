name: Apply hardened roll guide value styling

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_roll_guide_value_scheme_v2.py'
      - '.github/workflows/apply-roll-guide-value-scheme-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Roll guide styling
        run: python3 scripts/patch_roll_guide_value_scheme_v2.py

      - name: Verify
        run: |
          grep -Fq '.rollGuideRow .rollGuideValue{color:var(--body-text)!important' index.html
          grep -Fq 'text-transform:none!important' index.html
          grep -Fq '.rollGuideRow .rollGuideName{min-width:0;color:var(--green)!important' index.html
          grep -Fq '.rollGuideRow .rollGuideValue{color:var(--body-text)!important' scripts/patch_build_roll_guide_v2.py

      - name: Commit and push
        run: |
          if git diff --quiet -- index.html scripts/patch_build_roll_guide_v2.py; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html scripts/patch_build_roll_guide_v2.py
          git commit -m 'Make roll guide values match gear stat styling'
          git push
