name: One-shot S3 T5 timeline names

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-s3-t5-names.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch S3 Tier 5 timeline detail
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="['2026-11-05',114,'Class Advancement','Tier 5 class advancement','Player Lv.136 · Class Lv.180 · Tier 4 class Lv.40 · Aethyris Five','class-advancement'],"
          new="['2026-11-05',114,'Class Advancement','Tier 5 class advancement','Player Lv.136 · Class Lv.180 · Tier 4 class Lv.40 · Aethyris Five. Global-English T5 names now published by Prydwen (guides updated Sep. 1, 2026) confirm Destroyer → Magister and Dominator → Prophet. The Duelist- and Knight-line T5 Global-English names are not yet published there, so this row remains generic for those two lines.','class-advancement'],"
          if old not in s:
              raise SystemExit('expected Tier 5 row not found; refusing blind patch')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Validate timeline patch
        run: |
          grep -Fq 'Destroyer → Magister' index.html
          grep -Fq 'Dominator → Prophet' index.html
          grep -Fq "['2026-11-05',114,'Class Advancement','Tier 5 class advancement'" index.html
      - name: Install browser smoke dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Run full site browser smoke
        run: node scripts/site_smoke_test.mjs
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Confirm Magister and Prophet T5 names on S3 timeline'
          git push
