name: Patch all S1 priority panels
on:
  issues:
    types: [opened]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.issue.title == 'apply-build-fantomons-2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch build Fantomon pairs
        env:
          INJECT_B64: 
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os,base64
          p=Path('index.html')
          s=p.read_text()
          marker='/* BUILD_FANTOMON_PAIRS_V1 */'
          if marker in s:
              raise SystemExit('already patched')
          inject=base64.b64decode(os.environ['INJECT_B64']).decode()
          if '</body>' not in s:
              raise SystemExit('missing </body>')
          p.write_text(s.replace('</body>',inject+'</body>',1))
          PY
      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/inline.js').write_text('\n;\n'.join(blocks))
          PY
          node --check /tmp/inline.js
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Add main and alt Fantomons to build loadouts"
          git push
