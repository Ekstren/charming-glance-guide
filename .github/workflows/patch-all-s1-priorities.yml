name: Patch all S1 priority panels

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-all-s1-priorities.yml'
      - '.github/scripts/patch_all_s1_priority_copies.py'
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name != 'issues' || github.event.issue.title == 'Run all S1 priority panels'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch all S1 build copies
        run: python .github/scripts/patch_all_s1_priority_copies.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          if not scripts:
            raise SystemExit('No inline scripts found')
          Path('/tmp/sxs.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/sxs.js
      - name: Verify live priority panels
        run: |
          test "$(grep -o 'Star Shattering Slash first' index.html | wc -l)" -ge 2
          test "$(grep -o 'Rapid Cast is mandatory' index.html | wc -l)" -ge 2
          test "$(grep -o 'Stack Erosion faster' index.html | wc -l)" -ge 2
      - name: Commit change
        run: |
          if git diff --quiet -- index.html; then
            echo 'No change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix live S1 technique and charm priorities'
          git push origin main
