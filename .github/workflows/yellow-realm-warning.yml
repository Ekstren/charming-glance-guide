name: Yellow Material Realm warning

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/yellow-realm-warning.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch caution warning
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          danger = '.targetMessage.warning.danger{border:1px solid color-mix(in srgb,var(--status-negative) 62%,var(--line));background:color-mix(in srgb,var(--status-negative) 11%,var(--surface));color:var(--status-negative)!important;border-radius:11px;padding:10px 12px!important}'
          caution = '.targetMessage.warning.caution{border:1px solid color-mix(in srgb,var(--status-warning) 62%,var(--line));background:color-mix(in srgb,var(--status-warning) 11%,var(--surface));color:var(--status-warning)!important;border-radius:11px;padding:10px 12px!important}'
          if caution not in s:
              if danger not in s:
                  raise SystemExit('danger style missing')
              s = s.replace(danger, danger + '\n' + caution, 1)
          reset_old = "$('targetMessage')?.classList.remove('danger');"
          reset_new = "$('targetMessage')?.classList.remove('danger','caution');"
          if reset_old in s:
              s = s.replace(reset_old, reset_new, 1)
          add_old = "$('targetMessage').classList.add('warning');\n        const route=dailySuggested.changed"
          add_new = "$('targetMessage').classList.add('warning','caution');\n        const route=dailySuggested.changed"
          if add_old not in s:
              raise SystemExit('achievable warning class assignment missing')
          s = s.replace(add_old, add_new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, re.S | re.I)
          if not scripts:
              raise SystemExit('No inline scripts found')
          Path('/tmp/sxs.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/sxs.js
      - name: Commit and clean
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/yellow-realm-warning.yml
          git add index.html
          git commit -m 'Style achievable Realm warning as yellow block'
          git push origin main
