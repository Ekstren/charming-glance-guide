name: Yellow Material Realm warning

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yellow-realm-warning.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Style achievable Realm warning as caution block
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old=".targetMessage.warning.danger{border:1px solid color-mix(in srgb,var(--status-negative) 62%,var(--line));background:color-mix(in srgb,var(--status-negative) 11%,var(--surface));color:var(--status-negative)!important;border-radius:11px;padding:10px 12px!important}"
          new=old+"\n.targetMessage.warning.caution{border:1px solid color-mix(in srgb,var(--status-warning) 62%,var(--line));background:color-mix(in srgb,var(--status-warning) 11%,var(--surface));color:var(--status-warning)!important;border-radius:11px;padding:10px 12px!important}"
          if old not in s:
              raise SystemExit('danger warning style not found')
          s=s.replace(old,new,1)

          old2="$('targetMessage')?.classList.remove('danger');"
          new2="$('targetMessage')?.classList.remove('danger','caution');"
          if old2 not in s:
              raise SystemExit('target message reset not found')
          s=s.replace(old2,new2,1)

          old3="""        $('targetMessage').hidden=false;
        $('targetMessage').classList.add('warning');
        const route=dailySuggested.changed
          ? ` Recommended refreshes/day: Ore ${dailySuggested.ore} · Essence ${dailySuggested.essence} · Sand ${dailySuggested.sand}.`
          : '';
        $('targetMessage').textContent=`⚠ Goal is achievable, but your current Material Realm refresh plan is too low.${route}`;
"""
          new3="""        $('targetMessage').hidden=false;
        $('targetMessage').classList.add('warning','caution');
        const route=dailySuggested.changed
          ? ` Recommended refreshes/day: Ore ${dailySuggested.ore} · Essence ${dailySuggested.essence} · Sand ${dailySuggested.sand}.`
          : '';
        $('targetMessage').textContent=`⚠ Goal is achievable, but your current Material Realm refresh plan is too low.${route}`;
"""
          if old3 not in s:
              raise SystemExit('achievable warning block not found')
          s=s.replace(old3,new3,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          if not scripts: raise SystemExit('No inline scripts found')
          Path('/tmp/sxs.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/sxs.js
      - name: Commit and self-clean
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/yellow-realm-warning.yml
          git add index.html
          git commit -m 'Style achievable Realm warning as yellow block'
          git push origin main
