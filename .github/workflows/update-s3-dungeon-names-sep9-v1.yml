name: Update S3 dungeon localization Sep 9
on:
  push:
    paths:
      - 'scripts/update_s3_dungeon_names_sep9_v1.py'
      - '.github/workflows/update-s3-dungeon-names-sep9-v1.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install browser dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Apply S3 dungeon localization update
        run: python3 scripts/update_s3_dungeon_names_sep9_v1.py
      - name: Validate summary-only and localization markers
        run: |
          grep -Fq 'TIMELINE_SUMMARY_ONLY_V1' index.html
          grep -Fq 'S3_DUNGEON_LOCALIZATION_SEP9_V1' index.html
          grep -Fq "'Eternal Garden'" index.html
          ! grep -Fq "'Eternal Blossom Courtyard'" index.html
          ! grep -Fq '<details class="entryMore"' index.html
      - name: Validate timeline duplicates
        run: python3 scripts/check_timeline_duplicates.py index.html
      - name: Validate inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          out=Path('/tmp/inline-js'); out.mkdir(exist_ok=True)
          for i,body in enumerate(scripts): (out/f'{i}.js').write_text(body,encoding='utf-8')
          print(f'extracted {len(scripts)} inline scripts')
          PY
          for f in /tmp/inline-js/*.js; do node --check "$f"; done
      - name: Run site browser smoke
        run: node scripts/site_smoke_test.mjs
      - name: Commit and push
        run: |
          if git diff --quiet -- index.html; then
            echo 'S3 dungeon localization already applied.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Refresh S3 dungeon localization Sep 9'
            git pull --rebase origin main
            git push origin main
          fi
