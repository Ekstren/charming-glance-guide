name: One-shot collab timeline dedupe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/timeline-collab-dedupe.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove conflicting duplicate projection and consolidate Cabbage Dog
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old7="    ['2026-09-07',55,'Collab','Vegetables Fairy Part Two · Cabbage Dog','CONFIRMED by the official Sword x Staff Global announcements channel on Aug. 31: Sword x Staff × Vegetables Fairy Collab Pt. 2 is coming soon, with the announcement headline naming Cabbage Dog and the body teasing that the Fantomon is coming too. Existing Fantomon databases also identify Cabbage Dog as a Fantomon. The previously reported Sep. 7 date remains expected only because the official announcement did not state an exact launch date; keep the date unconfirmed until the in-game Event screen or an official dated notice confirms it. Do not change Main/Alt build recommendations until the live Global release establishes Cabbage Dog’s actual availability and performance.','event',null,'confirmed'],\n"
          old9="    ['2026-09-09',57,'Event','Vegetables Fairy Collab Pt. 2 · projected launch','Projected/expected date, not a confirmed Global launch date. The mirrored official Global Discord announced Pt. 2 on Sep. 2 and confirmed collab-exclusive Visages including Spicy Chick Plush, Rose Dog Plush, Violet Kitty, Chili/Eggplant/Rose weapons, and themed headwear, but did not publish a start date. Sep. 9 is a useful projection because the original CN Pt. 2 was teased Aug. 11, 2025 and launched Aug. 18 (7 days later), while Global code VEGGIE is reported to expire Sep. 8. Re-date this row as soon as Global posts the exact event window.','event'],"
          new9="    ['2026-09-09',57,'Collab','Vegetables Fairy Collab Pt. 2 · projected launch','PROJECTED / EXPECTED, not a confirmed Global launch date. Official Global announcements on Aug. 31 confirmed Pt. 2 is coming soon and specifically teased the Cabbage Dog Fantomon; the mirrored official Discord showcase on Sep. 2 also confirmed collab-exclusive Visages including Spicy Chick Plush, Rose Dog Plush, Violet Kitty, Chili/Eggplant/Rose weapons, and themed headwear. Neither announcement gave an exact launch date. Sep. 9 remains the single lead projection because the original CN Pt. 2 was teased Aug. 11, 2025 and launched Aug. 18 (7 days later), while Global code VEGGIE expires immediately beforehand on Sep. 8. The older Sep. 7 Cabbage Dog projection was removed to avoid showing two conflicting launch dates for the same collab. Re-date this row as soon as Global posts the exact event window.','event'],"
          if old7 not in s:
              raise SystemExit('Expected Sep 7 Cabbage Dog row not found')
          if old9 not in s:
              raise SystemExit('Expected Sep 9 collab row not found')
          s=s.replace(old7,'',1).replace(old9,new9,1)
          p.write_text(s)
          PY
      - name: Validate timeline and inline JavaScript
        run: |
          grep -Fq "Vegetables Fairy Collab Pt. 2 · projected launch" index.html
          ! grep -Fq "['2026-09-07',55,'Collab','Vegetables Fairy Part Two · Cabbage Dog'" index.html
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',s,re.S)
          if not scripts: raise SystemExit('No inline scripts found')
          for i,code in enumerate(scripts):
              if not code.strip(): continue
              f=Path('/tmp')/f'inline-{i}.js'
              f.write_text(code)
              subprocess.run(['node','--check',str(f)],check=True)
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Consolidate Vegetables Fairy Pt. 2 projection'
          git push
