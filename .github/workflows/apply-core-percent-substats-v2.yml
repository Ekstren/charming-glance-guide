name: Apply corrected core percentage substat patch

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_core_percent_substats_v2.py'
      - '.github/workflows/apply-core-percent-substats-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch core stat variants
        run: python3 scripts/patch_core_percent_substats_v2.py

      - name: Verify live and staged data
        run: |
          grep -Fq "atkpct:['ATK%','Max unconfirmed',1" index.html
          grep -Fq "spdpct:['SPD%','Max unconfirmed',1" index.html
          grep -Fq "substats:'Crit Rate / Crit DMG > Accuracy > Elemental Mastery > SPD / SPD% > ATK / ATK%'" index.html
          grep -Fq "Guardian:['block','blockpair','def','spd','hp','defpct','spdpct','hppct']" index.html
          grep -Fq "'atkpct': \"['ATK%','Lv162 max unconfirmed',1" scripts/activate_warlords_rest_roll_guide_v1.py
          grep -Fq '"ATK%": {' data/warlords-rest-roll-guide-v1.json
          python3 -m py_compile scripts/activate_warlords_rest_roll_guide_v1.py scripts/validate_warlords_rest_roll_guide_v1.py
          python3 -m json.tool data/warlords-rest-roll-guide-v1.json >/dev/null
          python3 scripts/validate_warlords_rest_roll_guide_v1.py

      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html scripts/patch_build_roll_guide_v2.py scripts/patch_restore_rich_builds_v1.py scripts/activate_warlords_rest_roll_guide_v1.py scripts/validate_warlords_rest_roll_guide_v1.py data/warlords-rest-roll-guide-v1.json
          git commit -m 'Separate flat and percentage core substats'
          git push
