name: Apply Realm tool daily-gap display

on:
  push:
    paths:
      - '.github/patch-tool-need-gap.py'
      - '.github/workflows/apply-tool-need-gap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply Realm tool daily-gap display
        run: python .github/patch-tool-need-gap.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          if not scripts:
              raise SystemExit('no inline script found')
          Path('/tmp/site-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/site-inline.js
      - name: Verify Realm tool daily-gap behavior
        run: |
          grep -q 'TOOL_DAILY_GAP_V13' index.html
          grep -q 'dailyGapRuns' index.html
          grep -q '<i>Need:</i>' index.html
          grep -q 'if(remainingTools>0)' index.html
          grep -q 'paidRunsUsed' index.html
      - name: Commit site update
        run: |
          if git diff --quiet -- index.html; then
            echo 'No site change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Show daily Realm tool gaps'
          git push origin main
