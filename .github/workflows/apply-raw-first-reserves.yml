name: Apply raw-first reserves

on:
  push:
    paths:
      - '.github/patch-raw-first-reserves.py'
      - '.github/workflows/apply-raw-first-reserves.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply raw-first reserve patch
        run: python .github/patch-raw-first-reserves.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          if not scripts:
              raise SystemExit('no inline script found')
          Path('/tmp/site-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/site-inline.js
      - name: Verify reserve/tool behavior markers
        run: |
          grep -q 'RAW_FIRST_TOOL_GAPS_V1' index.html
          grep -q 'S2 reserve gap' index.html
          grep -q 'projectedRawReserveSupply' index.html
      - name: Commit update
        run: |
          if git diff --quiet -- index.html; then
            echo 'No site change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Use raw-first reserves and concise tool gaps'
          git push origin main
