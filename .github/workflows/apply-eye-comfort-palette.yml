name: Apply eye comfort palette

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply_eye_comfort_palette.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply palette
        run: python .github/scripts/apply_eye_comfort_palette.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          if not scripts: raise SystemExit('No inline scripts')
          Path('/tmp/sxs.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/sxs.js
      - name: Verify palette
        run: |
          grep -q 'EYE_COMFORT_PALETTE_V1' index.html
          grep -q -- '--bg:#f2e5bc' index.html
          grep -q -- '--bg:#232a2e' index.html
          grep -q -- '--calc-accent-strong:var(--accent-strong)' index.html
          grep -q 'category-event.*color-mix' index.html
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Apply eye-comfort light and dark palettes'
          git push origin main
