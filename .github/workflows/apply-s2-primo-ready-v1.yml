name: Apply Season 2 Primostar readiness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-s2-primo-ready-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Prepare parallel S2 calculator
        run: python .github/patch-s2-primo-ready-v1.py

      - name: Verify S1 stayed live and S2 is ready
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks={
            'S2 readiness marker': 'S2_PRIMO_READY_V1' in s,
            'S1 profile preserved': "s1:{key:'s1',name:'Season 1'" in s,
            'S2 profile preserved': "s2:{key:'s2',name:'Season 2'" in s,
            'automatic S1-to-S2 boundary preserved': "const seasonKeyAt = (ms=Date.now()) => ms < S1_END.getTime() ? 's1' : 's2';" in s,
            'S2 scoring constants': "scoreFloor:130,relicFloor:13,starBase:45,scorePerStar:27" in s,
            'S2 weights': "weights:{character:100,gear:18,skill:7,relic:33,fanto:8}" in s,
            'S2 quick targets': 'data-s2-target="530"' in s and 'data-s2-target="680"' in s and 'data-s2-target="920"' in s,
            'S2 milestone strip': 'id="s2ProgressionGates"' in s and '<b>106</b>T4' in s and '<b>130</b>Scoring + Dungeon' in s,
            'rollover guard retained': "const mismatch=snapshotSeason!==cfg.key;" in s,
            'S2 explicit snapshot confirmation retained': "snapshotSeason=cfg.key; snapshotAtMs=Date.now();" in s,
          }
          failed=[name for name,ok in checks.items() if not ok]
          if failed:
            raise SystemExit('Verification failed: '+', '.join(failed))
          print('Verified:', ', '.join(checks))
          PY

      - name: Commit generated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index.html changes needed."
            exit 0
          fi
          git commit -m "Prepare Season 2 Primostar calculator"
          git push
