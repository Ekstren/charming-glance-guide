name: Remove recurring timeline duplicates

on:
  push:
    paths:
      - '.github/workflows/apply-remove-recurring-event-duplicates-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply recurring-event cleanup
        run: python .github/patch-remove-recurring-event-duplicates-v1.py
      - name: Verify duplicate combined rows are gone
        run: |
          ! grep -Eq "'Event','Grand Treasure Hunt \([0-9]+\) · " index.html
          grep -F "Grand Treasure Hunt · Phase \${phase}" index.html
          grep -F "UNCONFIRMED recurring server-age projection" index.html
      - name: Validate inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          if not scripts: raise SystemExit('No inline scripts found')
          with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
              f.write('\n'.join(scripts)); name=f.name
          subprocess.run(['node','--check',name],check=True)
          PY
      - name: Commit generated cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Remove duplicate recurring timeline cards'
          git push
