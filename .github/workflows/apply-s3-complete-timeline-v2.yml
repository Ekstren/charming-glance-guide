name: Apply comprehensive S3 timeline corrections

on:
  push:
    paths:
      - '.github/workflows/apply-s3-complete-timeline-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply S3 completion patch
        run: python .github/patch-s3-complete-timeline-v2.py
      - name: Verify corrected and added milestones
        run: |
          grep -F "Grand Treasure Hunt (17) · Bingo Draw (6)" index.html
          grep -F "Eternal Flower Garden" index.html
          grep -F "Starry Sea Cruise" index.html
          grep -F "Rainbow Star Spirit" index.html
          grep -F "Grand Treasure Hunt (30) · Lucky Scratch (10)" index.html
          grep -F "2027-02-14',215,'Region','Harpadia / Tier 6 boundary" index.html
          if grep -Fq "Harpadia / Season 4 boundary" index.html; then echo 'stale Day 212 boundary remains'; exit 1; fi
      - name: Validate inline JavaScript
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]);
          if(!scripts.length) throw new Error('No inline scripts found');
          scripts.forEach((s,i)=>{try{new Function(s)}catch(e){console.error(`Inline script ${i+1}: ${e.message}`);process.exit(1)}});
          console.log(`Validated ${scripts.length} inline script(s)`);
          NODE
      - name: Commit generated timeline correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "Complete and correct Season 3 timeline"
          git push origin HEAD:main
