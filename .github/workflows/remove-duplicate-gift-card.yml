name: Remove duplicate gift code card

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/remove_duplicate_gift_card.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove duplicate gift code injection
        run: python .github/scripts/remove_duplicate_gift_card.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          if not scripts: raise SystemExit('No inline scripts')
          Path('/tmp/sxs.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/sxs.js
      - name: Verify
        run: |
          ! grep -q 'function injectCodeAlert' index.html
          ! grep -q 'data-code-alert="4P7Y2R9M"' index.html
          grep -q 'Weekly gift code · 4P7Y2R9M' index.html
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Remove duplicate active gift code card'
          git push origin main
