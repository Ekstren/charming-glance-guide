name: Apply mobile timeline layout v2

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_mobile_timeline_layout_v2.py'
      - '.github/workflows/apply-mobile-timeline-layout-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final mobile layout patch
        run: python3 scripts/patch_mobile_timeline_layout_v2.py

      - name: Verify final mobile CSS
        run: |
          grep -q 'MOBILE_TIMELINE_LAYOUT_FINAL_V2' index.html
          grep -q 'mobile-timeline-layout-final-v2' index.html
          ! grep -q 'MOBILE_TIMELINE_LAYOUT_V1' index.html

      - name: Commit and push
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Finish mobile timeline layout fix'
          git push
