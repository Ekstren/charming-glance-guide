name: One-shot VEGGIE timeline patch

on:
  push:
    paths:
      - '.github/workflows/one-shot-veggie-code.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add VEGGIE gift-code expiry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          row="    ['2026-09-08',56,'Event','Gift code · VEGGIE','Community-reported weekly gift code: 10 Rare Auroral Badges + 80 Dawnium. Multiple current code trackers report a Sep. 8, 2026 expiry; redeem promptly. Exact cutoff time is not yet confirmed by the mirrored official Global feed.','event'],\n"
          if "['2026-09-08',56,'Event','Gift code · VEGGIE'" not in s:
              anchor="    ['2026-09-12',60,'Dungeon','Warlord’s Rest'"
              i=s.find(anchor)
              if i < 0:
                  raise SystemExit('Warlord Rest anchor not found')
              s=s[:i]+row+s[i:]
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate inline JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          if not scripts:
              raise SystemExit('No inline scripts found')
          Path('/tmp/charming-inline.js').write_text('\n;\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/charming-inline.js

      - name: Commit patch and cleanup
        shell: bash
        run: |
          rm .github/workflows/one-shot-veggie-code.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/one-shot-veggie-code.yml
          git commit -m 'Add VEGGIE gift-code expiry to timeline'
          git pull --rebase origin main
          git push origin HEAD:main
