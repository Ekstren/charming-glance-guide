name: Apply Guardian Tank and DPS toggle

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_guardian_tank_dps_toggle_v1.py'
      - 'scripts/fix_guardian_toggle_patch_meta_source_v1.py'
      - '.github/workflows/apply-guardian-tank-dps-toggle-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix patch source
        run: python3 scripts/fix_guardian_toggle_patch_meta_source_v1.py

      - name: Patch Guardian roles
        run: python3 scripts/patch_guardian_tank_dps_toggle_v1.py

      - name: Verify Guardian role toggle
        run: |
          grep -Fq 'GUARDIAN_ROLE_TOGGLE_V1' index.html
          grep -Fq "role('Dungeon · Tank'" index.html
          grep -Fq "role('Dungeon · DPS'" index.html
          grep -Fq 'data-guardian-mode="tank"' index.html
          grep -Fq 'data-guardian-role' index.html
          grep -Fq "Guardian:{" scripts/patch_build_roll_guide_v2.py
          grep -Fq "tank:['block','blockpair'" scripts/patch_build_roll_guide_v2.py
          grep -Fq "dps:['block','blockpair','crit'" scripts/patch_build_roll_guide_v2.py
          grep -Fq 'const GUARDIAN_PRIORITY=' scripts/patch_restore_rich_builds_v1.py
          grep -Fq "role('Tournament · 4v4 · DPS'" .github/build-fantomons-inject.html
          python3 -m py_compile scripts/fix_guardian_toggle_patch_meta_source_v1.py scripts/patch_guardian_tank_dps_toggle_v1.py scripts/patch_meta_build_modes_v1.py scripts/patch_restore_rich_builds_v1.py scripts/patch_build_roll_guide_v2.py scripts/activate_pandarial_build_prep_v1.py scripts/validate_pandarial_build_prep_v1.py
          python3 scripts/validate_pandarial_build_prep_v1.py
          python3 scripts/validate_warlords_rest_roll_guide_v1.py

      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/build-fantomons-inject.html scripts/patch_guardian_tank_dps_toggle_v1.py scripts/patch_meta_build_modes_v1.py scripts/patch_restore_rich_builds_v1.py scripts/patch_build_roll_guide_v2.py
          git commit -m 'Add Guardian Tank and DPS build roles'
          git push
