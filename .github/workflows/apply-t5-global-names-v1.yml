name: Apply T5 Global timeline names

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_t5_global_names_v1.py'
      - '.github/workflows/apply-t5-global-names-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply timeline patch
        run: python3 scripts/patch_t5_global_names_v1.py

      - name: Validate inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          out=Path('/tmp/inline-js')
          out.mkdir(exist_ok=True)
          for i,body in enumerate(scripts):
              (out/f'{i}.js').write_text(body,encoding='utf-8')
          print(f'extracted {len(scripts)} inline scripts')
          PY
          for f in /tmp/inline-js/*.js; do node --check "$f"; done

      - name: Verify intended timeline change
        run: |
          grep -Fq 'Conqueror → Ravager, Guardian → Templar, Destroyer → Magister, and Dominator → Prophet' index.html
          grep -Fq "['2026-11-05',114,'Class Advancement','Tier 5 class advancement'" index.html

      - name: Commit and push
        run: |
          if git diff --quiet -- index.html; then
            echo 'Tier 5 timeline names are already current.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Update Tier 5 Global class names on timeline'
            git push
          fi

      - name: Install browser smoke dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Run site browser smoke
        run: node scripts/site_smoke_test.mjs
