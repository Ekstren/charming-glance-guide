name: Add S1 shard rollover tip
on:
  push:
    paths:
      - '.github/workflows/add-s1-shard-rollover-tip.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch final-day prep
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="['2026-08-29',46,'Feature','Season 2 final-day prep','Confirmed final prep day for Charming Glance: the Aug 26 in-game season countdown aligns Season 2 with the Aug 30 6:00 AM PDT reset. Dungeon runs: buy 2 extra attempts and use none so you enter S2 at 4/2, then buy 2 more after reset for up to 6 day-one runs. Bed EXP historically banks up to 36h, but Aug 21 community reports say recent maintenance behavior may auto-claim stored EXP; verify the transition notice before relying on the full bank.','feature'],"
          new="['2026-08-29',46,'Feature','Season 2 final-day prep','Confirmed final prep day for Charming Glance: the Aug 26 in-game season countdown aligns Season 2 with the Aug 30 6:00 AM PDT reset. Sell unused S1 dungeon shards before rollover unless crafting them will push you into another Season Power / Primostar tier: repeated S2-transition reports say S1 shards do not become S2 Divinecraft reroll material, and older shards lose sale utility once superseded. Dungeon runs: buy 2 extra attempts and use none so you enter S2 at 4/2, then buy 2 more after reset for up to 6 day-one runs. Bed EXP historically banks up to 36h, but Aug 21 community reports say recent maintenance behavior may auto-claim stored EXP; verify the transition notice before relying on the full bank.','feature'],"
          if old not in s:
              raise SystemExit('final-day prep entry not found')
          s=s.replace(old,new,1)
          old2="if(title==='Season 2 final-day prep') return 'Aug 29 is the confirmed final prep day before the Aug 30 6:00 AM PDT S2 reset. Save dungeon attempts; treat 36h Bed EXP banking as unconfirmed.';"
          new2="if(title==='Season 2 final-day prep') return 'Aug 29: sell unused S1 dungeon shards unless they buy another Primostar tier, and save dungeon attempts for S2. Treat 36h Bed EXP banking as unconfirmed.';"
          if old2 not in s:
              raise SystemExit('compact final-day summary not found')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          import re, pathlib, subprocess
          text=pathlib.Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          if not scripts: raise SystemExit('No inline scripts found')
          for i,js in enumerate(scripts):
              f=pathlib.Path(f'/tmp/inline-{i}.js')
              f.write_text(js,encoding='utf-8')
              subprocess.run(['node','--check',str(f)],check=True)
          print('validated',len(scripts),'inline scripts')
          PY
          grep -q "sell unused S1 dungeon shards" index.html
      - name: Commit update
        run: |
          rm -f .github/workflows/add-s1-shard-rollover-tip.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/add-s1-shard-rollover-tip.yml
          git commit -m 'Add S1 shard rollover prep tip'
          git push
