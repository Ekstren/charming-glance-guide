name: Add seasonal build switch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-seasonal-builds.yml'
      - '.github/scripts/add_seasonal_builds.py'
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name != 'issues' || github.event.issue.title == 'Run seasonal build switch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add season-aware build library
        run: python .github/scripts/add_seasonal_builds.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          if not scripts:
            raise SystemExit('No inline scripts found')
          Path('/tmp/charming-builds.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/charming-builds.js
      - name: Verify seasonal build anchors
        run: |
          grep -q "Season 1 · Tier III build guide" index.html
          grep -q "function buildHtmlS1" index.html
          grep -q "S1_BUILD_CLASSES=\['Berserker','Paladin','Archmage','Arcanist'\]" index.html
          grep -q "S2_BUILD_CLASSES=\['Conqueror','Guardian','Destroyer','Dominator'\]" index.html
      - name: Commit change
        run: |
          if git diff --quiet -- index.html; then
            echo "No change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Show Season 1 builds until Season 2 reset"
          git push origin main
