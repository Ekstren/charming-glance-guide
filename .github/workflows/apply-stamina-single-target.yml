name: Apply single-target Auto Stamina

on:
  push:
    paths:
      - '.github/patch-stamina-single-target.py'
      - '.github/workflows/apply-stamina-single-target.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply single-target Auto Stamina
        run: python .github/patch-stamina-single-target.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          if not scripts:
              raise SystemExit('no inline script found')
          Path('/tmp/site-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/site-inline.js
      - name: Verify single-target Auto Stamina
        run: |
          grep -q 'STAMINA_AUTO_SINGLE_TARGET_V1' index.html
          grep -q 'singleTargetCandidates' index.html
          if grep -q 'for(let essenceNodes=0;essenceNodes<=total;essenceNodes++)' index.html; then
            echo 'Old split-search loop still present.'
            exit 1
          fi
      - name: Commit site update
        run: |
          if git diff --quiet -- index.html; then
            echo 'No site change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Keep Auto Stamina on one resource'
          git push origin main
