name: Apply Pacific reset performance v1

on:
  push:
    paths:
      - 'scripts/patch_pacific_reset_perf_v1.py'
      - '.github/workflows/apply-pacific-reset-perf-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply Pacific reset performance patch
        run: python scripts/patch_pacific_reset_perf_v1.py
      - name: Verify optimized reset helpers
        run: |
          grep -Fq 'PACIFIC_RESET_PERF_V1' index.html
          grep -Fq 'const PACIFIC_DATE_FORMATTER' index.html
          grep -Fq 'isoDayOrdinal(lastIso)-isoDayOrdinal(firstIso)+1' index.html
          ! grep -Fq 'while(t<cutoffMs && safety++<500)' index.html
      - name: Commit generated index
        run: |
          git config user.name 'ekstren'
          git config user.email '38091958+Ekstren@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Speed up long-season reset calculations'
          git push
