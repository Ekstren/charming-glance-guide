name: Apply raw-first S2 tool reserve

on:
  push:
    paths:
      - '.github/workflows/apply-raw-first-s2-tool-reserve-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply raw-first reserve logic
        run: python .github/patch-raw-first-s2-tool-reserve-v1.py
      - name: Verify
        run: |
          grep -q 'RAW_FIRST_S2_TOOL_RESERVE_V1' index.html
          grep -q 'function rawFirstReserveSplit' index.html
          ! grep -q 'function toolsFirstReserveSplit' index.html
          ! grep -q 'toolsFirstReserveSplit(' index.html
          grep -q 'Raw Essence covers the reserve first' index.html
          grep -q 'Raw Sand covers the reserve first' index.html
      - name: Commit generated index
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Use raw materials before reserving Realm tools'
          git push
