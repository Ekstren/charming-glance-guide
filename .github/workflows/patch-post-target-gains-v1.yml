name: Apply post-target gains planner

on:
  push:
    paths:
      - .github/workflows/patch-post-target-gains-v1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply post-target gains patch
        run: python3 scripts/patch_post_target_gains_v1.py
      - name: Verify runtime JavaScript syntax
        run: node --check assets/runtime.js
      - name: Verify post-target UI and logic
        run: |
          grep -q 'POST_TARGET_GAINS_V1' index.html
          grep -q 'Post-target tool plan' index.html
          grep -q 'renderPostTargetGains(reached,cfg)' assets/runtime.js
          grep -q 'POST_TARGET_GAINS_V1' assets/site.css
          ! grep -q 'FINISH EARLY MODE' index.html
      - name: Commit verified site changes
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898258+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/runtime.js assets/site.css
          git commit -m 'Add post-target gains and tool override planner'
          git push origin HEAD:main
