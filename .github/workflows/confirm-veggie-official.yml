name: Confirm official VEGGIE timing

on:
  push:
    paths:
      - '.github/workflows/confirm-veggie-official.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Confirm official VEGGIE deadline
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="['2026-09-08',56,'Event','Gift code · VEGGIE','Community-reported weekly gift code: 10 Rare Auroral Badges + 80 Dawnium. Current trackers agree on a Sep. 8 expiry; one reports a 00:00 UTC-5 cutoff (Sep. 7, 10:00 PM PDT), but the mirrored official Global feed has not independently confirmed the cutoff time. Redeem before then.','event'],"
          new="['2026-09-07',55,'Event','Gift code · VEGGIE','Confirmed by the official Sword x Staff Global Discord gift-code announcement: 10 Rare Auroral Badges + 80 Dawnium. Official validity ends Sep. 8 at 00:00 (UTC-5), which is Sep. 7 at 10:00 PM PDT for Charming Glance. Redeem before 10:00 PM PDT Sep. 7.','event'],"
          if old not in s:
              raise SystemExit('VEGGIE timeline row not found')
          s=s.replace(old,new,1)
          old2="if(title==='Gift code · VEGGIE') return 'VEGGIE: 10 Rare Auroral Badges + 80 Dawnium. Reported Sep 1 with a Sep 8 expiry; redeem promptly.';"
          new2="if(title==='Gift code · VEGGIE') return 'Official Global Discord: 10 Rare Auroral Badges + 80 Dawnium. Expires Sep 8 at 00:00 UTC-5 = Sep 7 at 10:00 PM PDT; redeem before then.';"
          if old2 not in s:
              raise SystemExit('VEGGIE helper text not found')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          if not scripts:
              raise SystemExit('No inline JavaScript found')
          Path('/tmp/site-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/site-inline.js
      - name: Commit patch and cleanup
        run: |
          rm .github/workflows/confirm-veggie-official.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/confirm-veggie-official.yml
          git commit -m 'Confirm official VEGGIE deadline'
          git push origin main
