name: Hide result tools until used

on:
  push:
    branches: [main]
    paths:
      - '.github/patch-hide-tools-until-used.py'
      - '.github/workflows/apply-hide-reserve-tools-when-raw-remains.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply hide-until-used display patch
        run: python .github/patch-hide-tools-until-used.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          if not scripts:
              raise SystemExit('no inline script found')
          Path('/tmp/site-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/site-inline.js
      - name: Verify tool rows hide until use
        run: |
          grep -q 'HIDE_TOOL_ROWS_UNTIL_USED_V2' index.html
          grep -q "if(planRuns<=0 && missing<=0){ el.innerHTML=''; el.hidden=true; return; }" index.html
      - name: Commit site update
        run: |
          if git diff --quiet -- index.html; then
            echo 'No site change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Hide result tool rows until actually used'
          git push origin main
