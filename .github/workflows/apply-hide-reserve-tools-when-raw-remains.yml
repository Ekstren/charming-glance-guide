name: Hide reserve tools when raw remains

on:
  push:
    branches: [main]
    paths:
      - '.github/patch-hide-reserve-tools-when-raw-remains.py'
      - '.github/workflows/apply-hide-reserve-tools-when-raw-remains.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply display patch
        run: python .github/patch-hide-reserve-tools-when-raw-remains.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          if not scripts:
              raise SystemExit('no inline script found')
          Path('/tmp/site-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/site-inline.js
      - name: Verify raw-remains tool hiding
        run: |
          grep -q 'HIDE_RESERVE_TOOLS_WHEN_RAW_REMAINS_V1' index.html
          grep -q 'visibleRawRemaining>0.5' index.html
          grep -q 'rawEssenceRemaining' index.html
          grep -q 'rawSandRemaining' index.html
      - name: Commit site update
        run: |
          if git diff --quiet -- index.html; then
            echo 'No site change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Hide reserve tool counts when raw remains'
          git push origin main
