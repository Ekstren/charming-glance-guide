name: Apply S2 Ore preservation premium

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-s2-ore-premium-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply S2 Ore premium
        run: python .github/patch-s2-ore-premium-v1.py
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks=[
            'id="reserveS2Ore" checked',
            'Ore gets a 50% premium in optimizer comparisons',
            'const orePremium=(cfg.key===\'s1\' && $(\'reserveS2Ore\')?.checked)?1.5:1;',
            "const CHECK_IDS = ['holdExp','reserveS2Ore','reserveS2Essence','reserveS2Sand','reserveS2Treats'];",
            'S2_ORE_PREMIUM_V1'
          ]
          for c in checks:
            assert c in s, c
          assert 'marginalWeightedCosts(costs,resources,cfg)' in s
          print('verified')
          PY
      - name: Commit generated index
        run: |
          if git diff --quiet -- index.html; then
            echo "No index change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add S2 Ore preservation preference"
          git push
