name: Fix calculator result spacing

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_results_spacing.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply spacing cleanup
        run: python .github/scripts/fix_results_spacing.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          if not scripts: raise SystemExit('No inline scripts')
          Path('/tmp/sxs.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/sxs.js
      - name: Verify cleanup
        run: |
          grep -q 'RESULTS_SPACING_CLEANUP_V1' index.html
          grep -q 'secondaryCostNote{display:none!important}' index.html
          grep -q 'suggestedGear{margin-bottom:18px!important}' index.html
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix calculator result spacing and hide refined cost strip'
          git push origin main
