name: Compact progression gear average

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compact-progression-gear-average.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace five Gear editors with average plus exact override
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # ---------- markup ----------
          p=Path('index.html')
          s=p.read_text()
          old='''          <div class="calcGrid currentProgressGrid">\n            <label>Average Skill level<input id="skillLevel" type="number" step="0.125" value="100"></label>\n            <label>Average Relic level<input id="relicLevel" min="10" type="number" step="0.05" value="10"></label>\n            <label>Average Fantomon level<input id="fantomonLevel" min="100" type="number" step="0.25" value="100"></label>\n          </div>\n          <div class="calcGrid gearFields">\n            <label>Weapon<input id="gearWeapon" type="number" value="100"></label>\n            <label>Off-hand<input id="gearOffhand" type="number" value="100"></label>\n            <label>Helmet<input id="gearHelmet" type="number" value="100"></label>\n            <label>Armor<input id="gearArmor" type="number" value="100"></label>\n            <label>Boots<input id="gearBoots" type="number" value="100"></label>\n          </div>\n          <details class="exactInputs progressionExactInputs compactExactInputs">\n            <summary><span>Exact slot levels</span><small>Optional · overrides averages</small></summary>\n            <div class="exactInputsBody exactProgressGrid">\n              <label>Skills · 8 slots<input id="exactSkillLevels" type="text" placeholder="Example: 7x130, 1x129"></label>\n              <label>Relics · 20 slots<input id="exactRelicLevels" type="text" placeholder="Example: 13x14, 7x13"></label>\n              <label>Fantomons · 4 slots<input id="exactFantoLevels" type="text" placeholder="Example: 2x136, 2x135"></label>\n              <small id="exactProgressStatus">Leave blank to keep using the balanced average model.</small>\n            </div>\n          </details>\n        </div>\n        <small class="seasonPlanningNote" id="graceText">Cart income, Stamina generation, Realm purchase availability, and upgrade timing run through the season reset.</small>'''
          new='''          <div class="calcGrid currentProgressGrid">\n            <label>Average Skill level<input id="skillLevel" type="number" step="0.125" value="100"></label>\n            <label>Average Relic level<input id="relicLevel" min="10" type="number" step="0.05" value="10"></label>\n            <label>Average Fantomon level<input id="fantomonLevel" min="100" type="number" step="0.25" value="100"></label>\n            <label>Average Gear level<input id="gearLevel" min="100" type="number" step="0.2" value="100"></label>\n          </div>\n          <details class="exactInputs progressionExactInputs compactExactInputs">\n            <summary><span>Exact slot levels</span><small>Optional · overrides averages</small></summary>\n            <div class="exactInputsBody exactProgressGrid">\n              <label>Skills · 8 slots<input id="exactSkillLevels" type="text" placeholder="Example: 7x130, 1x129"></label>\n              <label>Relics · 20 slots<input id="exactRelicLevels" type="text" placeholder="Example: 13x14, 7x13"></label>\n              <label>Fantomons · 4 slots<input id="exactFantoLevels" type="text" placeholder="Example: 2x136, 2x135"></label>\n              <label>Gear · 5 slots<input id="exactGearLevels" type="text" placeholder="Example: 3x143, 2x142"></label>\n              <small id="exactProgressStatus">Leave blank to keep using the balanced average model.</small>\n            </div>\n          </details>\n        </div>'''
          if old not in s:
              raise SystemExit('progression markup anchor missing')
          p.write_text(s.replace(old,new,1))

          # ---------- runtime ----------
          p=Path('assets/runtime.js')
          s=p.read_text()

          s=s.replace(
            "    skillLevel:130,relicLevel:13,fantomonLevel:130,\n    gearWeapon:130,gearOffhand:130,gearHelmet:130,gearArmor:130,gearBoots:130,",
            "    skillLevel:130,relicLevel:13,fantomonLevel:130,gearLevel:130,\n    exactGearLevels:'',",
            1
          )
          s=s.replace(
            "    const gear=[d.gearWeapon,d.gearOffhand,d.gearHelmet,d.gearArmor,d.gearBoots];",
            "    const gear=Array(5).fill(Number(d.gearLevel)||0);",
            1
          )
          old="""  const GEAR_IDS = ['gearWeapon','gearOffhand','gearHelmet','gearArmor','gearBoots'];\n  const INPUT_IDS = [\n    'targetStars','historicalStars','charLevel','charExp','bedExp','skillLevel','relicLevel','fantomonLevel',\n    ...GEAR_IDS,'oreCurrent','oreRate','essenceCurrent','essenceRate','sandCurrent','sandBlueCurrent','sandEpicCurrent','sandRate','treatCurrent','treatPremiumCurrent','treatDeluxeCurrent','treatRate','shopRefreshesDaily',\n    'hammerCurrent','knucklesCurrent','shovelCurrent','staminaMode','realmDailyOre','realmDailyEssence','realmDailySand','refinedOreCurrent','exactSkillLevels','exactRelicLevels','exactFantoLevels'\n  ];"""
          new="""  const LEGACY_GEAR_IDS = ['gearWeapon','gearOffhand','gearHelmet','gearArmor','gearBoots'];\n  const GEAR_OUTPUT_IDS = ['targetGearWeapon','targetGearOffhand','targetGearHelmet','targetGearArmor','targetGearBoots'];\n  const INPUT_IDS = [\n    'targetStars','historicalStars','charLevel','charExp','bedExp','skillLevel','relicLevel','fantomonLevel','gearLevel',\n    'oreCurrent','oreRate','essenceCurrent','essenceRate','sandCurrent','sandBlueCurrent','sandEpicCurrent','sandRate','treatCurrent','treatPremiumCurrent','treatDeluxeCurrent','treatRate','shopRefreshesDaily',\n    'hammerCurrent','knucklesCurrent','shovelCurrent','staminaMode','realmDailyOre','realmDailyEssence','realmDailySand','refinedOreCurrent','exactSkillLevels','exactRelicLevels','exactFantoLevels','exactGearLevels'\n  ];"""
          if old not in s:
              raise SystemExit('input ID anchor missing')
          s=s.replace(old,new,1)

          # Add a Gear state helper immediately after the generic category helper.
          anchor="""  function categoryStateFromUser(avgId,exactId,count,minLevel,maxLevel,floor,weight,fallback){\n    const parsed=parseExactLevelInput(exactId,count,minLevel,maxLevel);\n    if(parsed.active&&parsed.valid){\n      const levels=parsed.levels.slice();\n      return {levels,avg:averageLevels(levels),score:categoryScoreFromLevels(levels,floor,weight),exact:true};\n    }\n    return categoryStateFromAverage(n(avgId,fallback),count,minLevel,maxLevel,floor,weight);\n  }"""
          replacement=anchor+"""\n  function gearStateFromUser(cfg,maxLevel,fallback){\n    return categoryStateFromUser('gearLevel','exactGearLevels',5,100,maxLevel,cfg.scoreFloor,cfg.weights.gear,fallback);\n  }"""
          if anchor not in s:
              raise SystemExit('categoryStateFromUser anchor missing')
          s=s.replace(anchor,replacement,1)

          s=s.replace(
            "    const baseGear=GEAR_IDS.map(id=>Math.max(100,Math.floor(n(id,143))));",
            "    const baseGear=gearStateFromUser(cfg,currentCaps.gear,cfg.key==='s2'?130:143).levels.slice();",
            1
          )
          s=s.replace(
            "      GEAR_IDS.forEach(id=>{if($(id)) $(id).min='100';});",
            "      if($('gearLevel')){$('gearLevel').min='100';setInputMax('gearLevel',currentCaps.gear);$('gearLevel').step='0.2';}",
            1
          )
          s=s.replace(
            "      GEAR_IDS.forEach(id=>{if($(id)) $(id).min='100';});",
            "      if($('gearLevel')){$('gearLevel').min='100';setInputMax('gearLevel',currentCaps.gear);$('gearLevel').step='0.2';}",
            1
          )

          # Replace both current-Gear reads with the average/exact model.
          old="    const gear=GEAR_IDS.map(id=>Math.max(normalInputFloor,Math.floor(n(id,cfg.key==='s2'?130:143))));"
          new="    const gearState=gearStateFromUser(cfg,currentCaps.gear,cfg.key==='s2'?130:143);\n    const gear=gearState.levels;"
          if s.count(old)!=2:
              raise SystemExit(f'expected 2 current Gear reads, got {s.count(old)}')
          s=s.replace(old,new)

          s=s.replace(
            "      ['exactFantoLevels',4,normalInputFloor,currentCaps.fanto,'Fantomons']",
            "      ['exactFantoLevels',4,normalInputFloor,currentCaps.fanto,'Fantomons'],\n      ['exactGearLevels',5,normalInputFloor,currentCaps.gear,'Gear']",
            1
          )
          s=s.replace(
            "      GEAR_IDS.forEach((id,i)=>$(['targetGearWeapon','targetGearOffhand','targetGearHelmet','targetGearArmor','targetGearBoots'][i]).textContent=gear[i]);",
            "      GEAR_OUTPUT_IDS.forEach((id,i)=>$(id).textContent=gear[i]);",
            1
          )
          s=s.replace(
            "    $('graceText').textContent=`Effective Cart/Stamina production: ${resources.cartHours.toFixed(1)}h (${resources.wallResourceHours.toFixed(1)} wall hours + ${resources.boostResets} reset boost${resources.boostResets===1?'':'s'}). Runs through the ${cfg.name} reset.`;\n",
            "",
            1
          )

          # Migrate stored five-slot Gear values into the new average + optional exact override.
          migration_anchor="""      INPUT_IDS.forEach(id => { if (state[id] !== undefined && $(id)) $(id).value = state[id]; });"""
          migration="""      if(hadState && state.gearLevel===undefined){\n        const legacy=LEGACY_GEAR_IDS.map(id=>Number(state[id])).filter(Number.isFinite);\n        if(legacy.length===5){\n          state.gearLevel=String(legacy.reduce((a,b)=>a+b,0)/legacy.length);\n          if(state.exactGearLevels===undefined && new Set(legacy).size>1) state.exactGearLevels=legacy.join(', ');\n        }\n      }\n      INPUT_IDS.forEach(id => { if (state[id] !== undefined && $(id)) $(id).value = state[id]; });"""
          if migration_anchor not in s:
              raise SystemExit('loadState migration anchor missing')
          s=s.replace(migration_anchor,migration,1)
          p.write_text(s)

          # ---------- calculator regression ----------
          p=Path('scripts/calculator_perf_check.mjs')
          s=p.read_text()
          old="""  skillLevel:'130',relicLevel:'13',fantomonLevel:'130',\n  gearWeapon:'130',gearOffhand:'130',gearHelmet:'130',gearArmor:'130',gearBoots:'130',"""
          new="""  skillLevel:'130',relicLevel:'13',fantomonLevel:'130',gearLevel:'130',exactGearLevels:'',"""
          if old not in s:
              raise SystemExit('calculator test Gear fields anchor missing')
          s=s.replace(old,new,1)
          probe_anchor="""console.log(`S2 GATES relic all +15 @${resonance.relicAll15}, first +16 @${resonance.relicFirst16} · Fanto all 150 @${resonance.fantoAll150}, first 151 @${resonance.fantoFirst151}`);\n"""
          probe=probe_anchor+"""\nconst gearEditor=await page.evaluate(()=>({\n  average:!!document.getElementById('gearLevel'),\n  exact:!!document.getElementById('exactGearLevels'),\n  legacy:['gearWeapon','gearOffhand','gearHelmet','gearArmor','gearBoots'].filter(id=>document.getElementById(id)).length,\n  cartLine:!!document.getElementById('graceText')\n}));\nif(!gearEditor.average || !gearEditor.exact || gearEditor.legacy!==0 || gearEditor.cartLine){\n  throw new Error(`compact Gear editor regression: ${JSON.stringify(gearEditor)}`);\n}\nconsole.log('GEAR EDITOR average + exact override · legacy five-field row removed · cart production line removed');\n"""
          if probe_anchor not in s:
              raise SystemExit('calculator probe insertion anchor missing')
          s=s.replace(probe_anchor,probe,1)
          p.write_text(s)

          # ---------- styling ----------
          p=Path('assets/site.css')
          s=p.read_text()
          marker='/* COMPACT_AVERAGE_GEAR_EDITOR_V1 */'
          if marker in s:
              raise SystemExit('average Gear CSS already exists')
          s += '''\n\n/* COMPACT_AVERAGE_GEAR_EDITOR_V1\n   Four average progression editors replace the old five-slot Gear row. Exact overrides\n   get a little more breathing room so detailed entry stays easy when needed. */\n.currentProgressGrid{grid-template-columns:repeat(4,minmax(0,1fr))!important}\n.compactExactInputs>summary{padding:13px 14px!important;font-size:11px!important}\n.compactExactInputs>summary small{font-size:9px!important}\n.compactExactInputs .exactInputsBody{padding:14px!important}\n.compactExactInputs .exactProgressGrid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px 12px!important}\n.compactExactInputs .exactInputsBody input{min-height:44px!important;padding:9px 11px!important;font-size:12px!important}\n@media(max-width:700px){\n  .currentProgressGrid{grid-template-columns:repeat(2,minmax(0,1fr))!important}\n}\n@media(max-width:520px){\n  .compactExactInputs .exactProgressGrid{grid-template-columns:1fr!important}\n}\n'''
          p.write_text(s)
          PY
          node --check assets/runtime.js
          python3 scripts/check_timeline_duplicates.py index.html
      - name: Commit compact progression editor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/runtime.js assets/site.css scripts/calculator_perf_check.mjs
          git commit -m 'Use average Gear level with exact slot override'
          git push
