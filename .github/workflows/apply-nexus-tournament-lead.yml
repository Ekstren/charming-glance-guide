name: Apply Nexus Tournament lead

on:
  push:
    paths:
      - '.github/workflows/apply-nexus-tournament-lead.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python .github/patch-nexus-tournament.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          import re, subprocess, pathlib
          text=pathlib.Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          if not scripts:
              raise SystemExit('No inline scripts found')
          for i,js in enumerate(scripts):
              f=pathlib.Path(f'/tmp/inline-{i}.js')
              f.write_text(js,encoding='utf-8')
              subprocess.run(['node','--check',str(f)],check=True)
          print(f'Validated {len(scripts)} inline scripts')
          PY
      - name: Verify marker
        run: grep -q 'NEXUS_TOURNAMENT_AUG30_LEAD_V1' index.html
      - name: Commit update
        run: |
          rm -f .github/patch-nexus-tournament.py .github/workflows/apply-nexus-tournament-lead.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/patch-nexus-tournament.py .github/workflows/apply-nexus-tournament-lead.yml
          git commit -m 'Add unconfirmed Aug 30 Nexus Tournament lead'
          git push
