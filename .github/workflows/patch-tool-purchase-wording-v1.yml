name: Tool purchase wording v1

on:
  push:
    paths:
      - '.github/workflows/patch-tool-purchase-wording-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply tool-purchase wording patch
        run: python scripts/patch_tool_purchase_wording_v1.py
      - name: Verify runtime JavaScript syntax
        run: node --check assets/runtime.js
      - name: Verify wording
        run: |
          grep -F 'Recommended purchases/day:' assets/runtime.js
          ! grep -F 'Recommended refreshes/day:' assets/runtime.js
      - name: Commit verified site changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/runtime.js
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Rename Realm recommendation to purchases per day'
          git push
