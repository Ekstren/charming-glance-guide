name: Site polish smoke

on:
  push:
    branches: [main]
    paths:
      - 'scripts/site_polish_smoke.mjs'
      - '.github/workflows/site-polish-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium
      - name: Run polish browser checks
        run: node scripts/site_polish_smoke.mjs
