name: Apply tool value display

on:
  push:
    paths:
      - '.github/patch-tool-value-display.py'
      - '.github/workflows/apply-tool-value-display.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply tool value display patch
        run: python .github/patch-tool-value-display.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          if not scripts:
              raise SystemExit('no inline script found')
          Path('/tmp/site-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/site-inline.js
      - name: Verify tool value display
        run: |
          grep -q 'TOOL_VALUE_DISPLAY_V5' index.html
          grep -q 'leftPer=reserveRuns>0&&reservePer>0' index.html
      - name: Commit update
        run: |
          if git diff --quiet -- index.html; then
            echo 'No site change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Align tool values and compact rows'
          git push origin main
