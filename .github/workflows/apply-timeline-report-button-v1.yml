name: Apply timeline report button

on:
  push:
    paths:
      - '.github/workflows/apply-timeline-report-button-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add timeline Report buttons
        run: python .github/patch-timeline-report-button-v1.py

      - name: Verify report workflow UI
        run: |
          grep -q 'TIMELINE_REPORT_BUTTON_V1' index.html
          grep -q 'function timelineReportUrl(e)' index.html
          grep -q '\[Timeline Report\]' index.html
          grep -q 'timelineReportLink' index.html

      - name: Validate inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I)
          if not scripts:
              raise SystemExit('No inline script found')
          Path('/tmp/inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/inline.js

      - name: Commit generated site update
        run: |
          if git diff --quiet -- index.html; then
            echo 'No generated change needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add timeline report links'
          git push
