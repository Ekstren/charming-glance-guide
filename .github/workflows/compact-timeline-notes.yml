name: Compact timeline notes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compact-timeline-notes.yml'
      - '.github/scripts/patch_compact_timeline.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Summarize timeline cards
        run: python .github/scripts/patch_compact_timeline.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, re.S)
          if not scripts:
              raise SystemExit('No inline script found')
          Path('/tmp/site.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/site.js
      - name: Restore temporary workflow changes and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout 5ac964cd0f97196a34e50c6b0ce391ded9e2fd22 -- .github/workflows/generic-first-run-defaults.yml
          git rm .github/workflows/compact-timeline-notes.yml .github/scripts/patch_compact_timeline.py
          git add index.html .github/workflows/generic-first-run-defaults.yml
          git commit -m "Summarize long timeline entries by default"
          git push origin main
