name: Apply matching Character and Materials headers

on:
  push:
    paths:
      - '.github/workflows/apply-match-character-materials-headers.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/patch-match-character-materials-headers.py
      - name: Verify matching headers
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'MATCH_CHARACTER_MATERIALS_HEADERS_V1' in s
          assert '#characterDetails,\n#materialsDetails{padding:0!important;overflow:hidden}' in s
          assert '#characterDetails>summary.characterSummary,\n#materialsDetails>summary.materialsSummary{' in s
          assert 'min-height:44px!important;' in s
          assert 'padding:12px 16px!important;' in s
          print('matching header geometry verified')
          PY
      - name: Commit
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Match Character and Materials card headers'
          git push
