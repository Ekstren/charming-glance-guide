name: Excess note inside score v1

on:
  push:
    paths:
      - '.github/workflows/patch-excess-note-inside-score-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply excess-note placement patch
        run: python scripts/patch_excess_note_inside_score_v1.py
      - name: Verify runtime JavaScript syntax
        run: node --check assets/runtime.js
      - name: Verify UI placement
        run: |
          grep -q 'SEASON_END_EXCESS_NOTE_IN_CARD_V1' assets/site.css
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          card=s[s.index('<div class="resultScoreLine">'):s.index('<div class="targetTiming"')]
          assert 'id="seasonEndExcessNote"' in card
          assert card.index('id="seasonEndExcessNote"') < card.rindex('</div>')
          print('score-card note placement verified')
          PY
      - name: Commit verified site changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898258+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/site.css
          if git diff --cached --quiet; then
            echo 'No site changes needed.'
          else
            git commit -m 'Move excess explanation into score card'
            git push origin main
          fi
