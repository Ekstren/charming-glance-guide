name: Apply all section top spacing

on:
  push:
    paths:
      - '.github/workflows/apply-all-section-top-spacing.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/patch-all-section-top-spacing.py
      - name: Verify spacing override
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'ALL_SECTION_TOP_SPACING_V1' in s
          assert '.siteSection{' in s
          assert 'padding-top:0!important;' in s
          assert '.siteSection > :first-child{' in s
          print('all section spacing override verified')
          PY
      - name: Commit
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Tighten top spacing across all tabs'
          git push
