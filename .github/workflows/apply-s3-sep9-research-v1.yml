name: Apply Sep 9 Season 3 research

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_s3_sep9_research_v1.py'
      - '.github/workflows/apply-s3-sep9-research-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Season 3 research refresh
        run: python3 scripts/apply_s3_sep9_research_v1.py

      - name: Validate intended Season 3 updates
        run: |
          grep -Fq 'S3_AETHYRIS_SEP9_RESEARCH_V1' index.html
          grep -Fq 'Skyrend Cliff, Unbroken Camp, and Harmonic Crystal' index.html
          grep -Fq 'S3_T5_GUIDE_STATUS_SEP9_V1' index.html
          grep -Fq 'dedicated T5 build guides for Ravager, Magister, and Prophet' index.html
          grep -Fq "Season 3 · Aethyris · Tier 5 · Skyrend Cliff, Unbroken Camp and Harmonic Crystal" index.html
          ! grep -Fq 'Ravager/Templar are visible in Prydwen' index.html

      - name: Validate timeline duplicates
        run: |
          if [ -f scripts/check_timeline_duplicates.py ]; then
            python3 scripts/check_timeline_duplicates.py index.html
          fi

      - name: Validate inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          out=Path('/tmp/inline-js'); out.mkdir(exist_ok=True)
          for i,body in enumerate(scripts): (out/f'{i}.js').write_text(body,encoding='utf-8')
          print(f'extracted {len(scripts)} inline scripts')
          PY
          for f in /tmp/inline-js/*.js; do node --check "$f"; done

      - name: Install browser smoke dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Run full site browser smoke
        run: node scripts/site_smoke_test.mjs

      - name: Commit and push
        run: |
          if git diff --quiet -- index.html; then
            echo 'Sep. 9 Season 3 research refresh already applied.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Refresh Season 3 Aethyris details Sep 9'
            git pull --rebase origin main
            git push origin main
          fi
