name: Persist active section and timeline panels

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/persist-active-section.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Persist site section and timeline panel state
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          # Existing active-section persistence remains intact; only install it if missing.
          if "const SECTION_STORAGE_KEY='sxs-active-section';" not in text:
              old = """  function setSection(name){
                document.querySelectorAll('.siteSection').forEach(s=>s.hidden=true);
                const map={timeline:'timelineSection',builds:'buildsSection',calculator:'calculatorSection'};
                $(map[name]).hidden=false;
                document.querySelectorAll('.sectionSwitch button').forEach(b=>{const active=b.dataset.section===name;b.classList.toggle('active',active);b.setAttribute('aria-selected',String(active));});
                window.scrollTo({top:0,behavior:'smooth'});
                if(name==='builds') initializeBuildsIfNeeded();
                if(name==='calculator') initializeCalculatorIfNeeded();
              }"""
              new = """  const SECTION_STORAGE_KEY='sxs-active-section';
              function setSection(name){
                const map={timeline:'timelineSection',builds:'buildsSection',calculator:'calculatorSection'};
                if(!map[name]) name='timeline';
                document.querySelectorAll('.siteSection').forEach(s=>s.hidden=true);
                $(map[name]).hidden=false;
                document.querySelectorAll('.sectionSwitch button').forEach(b=>{const active=b.dataset.section===name;b.classList.toggle('active',active);b.setAttribute('aria-selected',String(active));});
                try{ localStorage.setItem(SECTION_STORAGE_KEY,name); }catch(_){}
                window.scrollTo({top:0,behavior:'smooth'});
                if(name==='builds') initializeBuildsIfNeeded();
                if(name==='calculator') initializeCalculatorIfNeeded();
              }"""
              if old not in text:
                  raise SystemExit('Expected setSection block was not found.')
              text = text.replace(old, new, 1)
              old_start = "  setSection('timeline');"
              new_start = """  let initialSection='timeline';
              try{ const savedSection=localStorage.getItem(SECTION_STORAGE_KEY); if(['timeline','builds','calculator'].includes(savedSection)) initialSection=savedSection; }catch(_){}
              setSection(initialSection);"""
              if old_start not in text:
                  raise SystemExit('Expected startup setSection call was not found.')
              text = text.replace(old_start, new_start, 1)

          panel_replacements = [
            ('<details class="timelineIntel" open>\n      <summary><span>Timeline coverage & source confidence</span>', '<details class="timelineIntel" id="timelineCoverageDetails">\n      <summary><span>Timeline coverage & source confidence</span>'),
            ('<details class="timelineIntel" open>\n      <summary><span>Recurring event rotation</span>', '<details class="timelineIntel" id="recurringEventsDetails">\n      <summary><span>Recurring event rotation</span>'),
            ('<details class="timelineIntel">\n      <summary><span>Season 5 · Ignis long-range reference</span>', '<details class="timelineIntel" id="ignisReferenceDetails">\n      <summary><span>Season 5 · Ignis long-range reference</span>'),
          ]
          for old, new in panel_replacements:
              if new not in text:
                  if old not in text:
                      raise SystemExit(f'Expected timeline panel markup not found: {old[:70]}')
                  text = text.replace(old, new, 1)

          state_code = """    const timelinePanelState=[
      ['timelineCoverageDetails','sxs-timeline-panel-coverage'],
      ['recurringEventsDetails','sxs-timeline-panel-events'],
      ['ignisReferenceDetails','sxs-timeline-panel-ignis']
    ];
    timelinePanelState.forEach(([id,key])=>{
      const panel=$(id);
      if(!panel) return;
      let saved=null;
      try{ saved=localStorage.getItem(key); }catch(_){}
      panel.open=saved==='1';
      panel.addEventListener('toggle',()=>{try{localStorage.setItem(key,panel.open?'1':'0');}catch(_){}});
    });
"""
          if "sxs-timeline-panel-coverage" not in text:
              marker = "  function setupTimeline(){\n    renderLocalTimeLabels();\n"
              if marker not in text:
                  raise SystemExit('Could not find setupTimeline marker.')
              text = text.replace(marker, marker + state_code, 1)

          path.write_text(text, encoding='utf-8')

      - name: Validate inline JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S)
          Path('/tmp/site.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/site.js

      - name: Commit change
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Collapse and remember timeline info panels'
          git push origin main
