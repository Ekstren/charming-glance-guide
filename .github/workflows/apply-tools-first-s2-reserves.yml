name: Apply tools-first S2 reserves

on:
  push:
    paths:
      - '.github/patch-tools-first-s2-reserves.py'
      - '.github/workflows/apply-tools-first-s2-reserves.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply tools-first S2 reserve patch
        run: python .github/patch-tools-first-s2-reserves.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          if not scripts:
              raise SystemExit('no inline script found')
          Path('/tmp/site-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/site-inline.js
      - name: Verify tools-first reserve behavior
        run: |
          grep -q 'TOOLS_FIRST_S2_RESERVES_V1' index.html
          grep -q 'toolsFirstReserveSplit' index.html
          grep -q "reserveTarget<=0) return realmTopupFor" index.html
          grep -q 'reserve-only tools stay visible' index.html
          grep -q 'Material Realm tools cover the reserve first' index.html
          grep -q "plan.realm?.essence?.reserveRuns" index.html
          grep -q 'TOOLS_FIRST_RAW_RESERVE_DISPLAY_V6' index.html
      - name: Commit update
        run: |
          if git diff --quiet -- index.html; then
            echo 'No site change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Use Material Realm tools first for S2 reserves'
          git push origin main
