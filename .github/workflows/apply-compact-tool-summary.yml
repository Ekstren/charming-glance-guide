name: Apply compact tool summary

on:
  push:
    paths:
      - '.github/patch-compact-tool-summary.py'
      - '.github/workflows/apply-compact-tool-summary.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply compact tool summary
        run: python .github/patch-compact-tool-summary.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          if not scripts:
              raise SystemExit('no inline script found')
          Path('/tmp/site-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/site-inline.js
      - name: Verify compact tool summary
        run: |
          grep -q 'COMPACT_TOOL_SUMMARY_V9' index.html
          grep -q 'class="toolCompactLine"' index.html
          grep -q 'class="toolSpend"' index.html
          grep -q 'class="toolHold"' index.html
          grep -q 'class="toolFree"' index.html
          grep -q 'compact-tool-summary-v9' index.html
      - name: Commit site update
        run: |
          if git diff --quiet -- index.html; then
            echo 'No site change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Compact Realm tool result layout'
          git push origin main
