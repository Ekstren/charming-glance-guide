name: Apply build class same-click no-op v1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_build_class_same_click_noop_v1.py'
      - '.github/workflows/apply-build-class-same-click-noop-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch build class clicks
        run: python3 scripts/patch_build_class_same_click_noop_v1.py

      - name: Verify same-class no-op guard
        run: |
          grep -Fq "if(b.dataset.class===currentClass)return;" index.html

      - name: Commit and push
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Stop build class re-render on same tab click'
          git push
