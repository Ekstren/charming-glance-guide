name: Use native field for projected level

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-projection-use-input-v4.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/fix_projection_native_field_v4.py
      - name: Validate syntax
        run: |
          node --check assets/runtime.js
          node --check scripts/site_smoke_test.mjs
          python3 scripts/check_timeline_duplicates.py index.html
      - name: Commit native projected field
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/runtime.js scripts/site_smoke_test.mjs
          git commit -m 'Reuse native input for projected level'
          git push
