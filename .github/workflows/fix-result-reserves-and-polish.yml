name: Fix result reserves and polish

on:
  push:
    paths:
      - '.github/workflows/fix-result-reserves-and-polish.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply and validate patch
        run: python .github/patch-result-reserves.py
      - name: Verify markers
        run: |
          grep -q 'RESERVE_REQUIREMENT_FIXED_V1' index.html
          grep -q 'RESERVE_REQUIREMENT_DISPLAY_V1' index.html
          grep -q 'RESULT_CARD_POLISH_AND_FIXED_RESERVES_V1' index.html
          grep -q 'Reserve target:' index.html
      - name: Commit calculator fix
        run: |
          rm -f .github/patch-result-reserves.py .github/workflows/fix-result-reserves-and-polish.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/patch-result-reserves.py .github/workflows/fix-result-reserves-and-polish.yml
          git commit -m 'Fix reserve counts and polish result card'
          git push
