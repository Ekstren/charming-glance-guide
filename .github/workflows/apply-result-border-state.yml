name: Apply result card state border

on:
  push:
    paths:
      - '.github/patch-result-border-state.py'
      - '.github/workflows/apply-result-border-state.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply result border states
        run: python .github/patch-result-border-state.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          if not scripts:
              raise SystemExit('no inline script found')
          Path('/tmp/site-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/site-inline.js
      - name: Verify result border states
        run: |
          grep -q 'RESULT_BORDER_STATE_V1' index.html
          grep -q 'calcResults:has(#targetMessage.caution)' index.html
          grep -q 'calcResults:has(#targetMessage.danger)' index.html
          grep -q 'calcResults:has(#targetStatus.notMet)' index.html
      - name: Commit site update
        run: |
          if git diff --quiet -- index.html; then
            echo 'No site change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Match result border to success warning state'
          git push origin main
