name: Season number summary label

on:
  push:
    paths:
      - '.github/workflows/season-number-summary-label.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update season day label
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""    const seasonDay=Math.max(1,serverDay-scope.current.start+1);\n    const milestoneName=fixedUpcoming?String(fixedUpcoming[3]):'No fixed milestone loaded';\n"""
          new="""    const seasonDay=Math.max(1,serverDay-scope.current.start+1);\n    const seasonNumber=Math.max(1,TIMELINE_SEASON_WINDOWS.indexOf(scope.current)+1);\n    const milestoneName=fixedUpcoming?String(fixedUpcoming[3]):'No fixed milestone loaded';\n"""
          if old not in s:
              raise SystemExit('Season-day calculation block not found')
          s=s.replace(old,new,1)
          old2='''<div><span>Season day</span><strong class="summaryNumber">${seasonDay}</strong></div>'''
          new2='''<div><span>Season ${seasonNumber} day</span><strong class="summaryNumber">${seasonDay}</strong></div>'''
          if old2 not in s:
              raise SystemExit('Season-day summary label not found')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate inline JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          if not scripts:
              raise SystemExit('No inline scripts found')
          Path('/tmp/charming-inline.js').write_text('\n;\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/charming-inline.js

      - name: Commit patch and cleanup
        shell: bash
        run: |
          rm .github/workflows/season-number-summary-label.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/season-number-summary-label.yml
          git commit -m 'Show season number in summary label'
          git pull --rebase origin main
          git push origin HEAD:main
