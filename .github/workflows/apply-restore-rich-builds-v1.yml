name: Restore rich Builds layout

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_restore_rich_builds_v1.py'
      - '.github/workflows/apply-restore-rich-builds-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Restore maintained Aug 29 loadout/Fantomon source
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin 995ba58d9d4cfc8865b2f163800f18d53d72d473
          git show 995ba58d9d4cfc8865b2f163800f18d53d72d473:.github/build-fantomons-inject.html > .github/build-fantomons-inject.html
          grep -q 'BUILD_ARENA_TOURNAMENT_SPLIT_V1' .github/build-fantomons-inject.html
          grep -q "role('Tournament'" .github/build-fantomons-inject.html
      - name: Apply rich Builds restoration
        run: python scripts/patch_restore_rich_builds_v1.py
      - name: Verify restored structure
        shell: bash
        run: |
          grep -q 'RESTORE_RICH_BUILDS_V1' index.html
          grep -q 'BUILD_ARENA_TOURNAMENT_SPLIT_V1' index.html
          grep -q 'Stat priorities' index.html
          grep -q 'priorityPair' index.html
          grep -q 'fantomonPair' index.html
          grep -q "role('Arena'" index.html
          grep -q "role('Tournament'" index.html
      - name: Commit generated Builds restoration
        shell: bash
        run: |
          if git diff --quiet -- index.html .github/build-fantomons-inject.html; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/build-fantomons-inject.html
          git commit -m 'Restore rich Builds presentation and loadouts'
          git push origin HEAD:main
