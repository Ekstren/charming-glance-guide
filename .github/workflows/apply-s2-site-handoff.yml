name: Apply S2 site handoff
on:
  push:
    paths:
      - '.github/scripts/s2_site_handoff.py'
      - '.github/workflows/apply-s2-site-handoff.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Season 2 handoff
        run: python .github/scripts/s2_site_handoff.py
      - name: Commit updated site
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Switch public guide to Season 2 only'
          git push
