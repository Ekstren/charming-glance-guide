name: Remove Realm After plan rows

on:
  push:
    paths:
      - 'scripts/patch_remove_after_plan_v1.py'
      - '.github/workflows/apply-remove-after-plan-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Remove After plan rows
        run: python scripts/patch_remove_after_plan_v1.py
      - name: Verify removal
        run: |
          grep -q 'REMOVE_REALM_AFTER_PLAN_V1' index.html
          ! grep -q 'id="hammerAfterPlan"' index.html
          ! grep -q 'id="knucklesAfterPlan"' index.html
          ! grep -q 'id="shovelAfterPlan"' index.html
      - name: Commit generated index
        run: |
          git config user.name 'ekstren'
          git config user.email '38091958+Ekstren@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Remove Material Realm After plan rows'
          git push
