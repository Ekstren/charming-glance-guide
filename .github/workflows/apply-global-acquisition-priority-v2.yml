name: Apply global acquisition priority v2

on:
  push:
    paths:
      - '.github/patch-global-acquisition-priority-v2.py'
      - '.github/workflows/apply-global-acquisition-priority-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python .github/patch-global-acquisition-priority-v2.py
      - name: Verify global acquisition ranking
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile

          text = Path('index.html').read_text(encoding='utf-8')
          checks = [
              ('global ranking marker', 'GLOBAL_ACQUISITION_PRIORITY_V2'),
              ('base optimizer marker', 'S2_ACQUISITION_OPTIMIZER_V1'),
              ('feasible global comparator', 'const effortFirst=compareAcquisitionEffort(candidate,best);'),
              ('diagnostic global comparator', 'const diagnosticEffortFirst=compareAcquisitionEffort(candidate,best);'),
              ('global UI explanation', 'paid refresh can be recommended when it materially lowers the total acquisition burden'),
              ('Lv120 Realm values', 'realmMaxLevel:120,realm:{ore:1200,essence:1500,sand:1000,rolla:11800}'),
              ('S2 score constants', 'scoreFloor:130,relicFloor:13,starBase:45,scorePerStar:27,weights:{character:100,gear:18,skill:7,relic:33,fanto:8}'),
              ('S2 benchmark', 'S2_PRIMO_BENCHMARK_V2'),
              ('zero-score starter relic', 'relicLevel:13'),
              ('Bed reserve default', 'reserveHours:34'),
          ]
          for label, needle in checks:
              assert needle in text, f'missing {label}: {needle}'

          assert 'STRICT GATES: raw-only beats existing Realm-tool use' not in text
          assert text.count('compareAcquisitionEffort(candidate,best)') >= 5

          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S|re.I)
          checked = 0
          for i, script in enumerate(scripts):
              if not script.strip():
                  continue
              with tempfile.NamedTemporaryFile('w', suffix='.js', encoding='utf-8', delete=False) as f:
                  f.write(script)
                  name = f.name
              result = subprocess.run(['node', '--check', name], capture_output=True, text=True)
              if result.returncode != 0:
                  raise SystemExit(f'inline script {i} failed node --check:\n{result.stderr}')
              checked += 1
          print(f'Verified {checked} inline JS blocks')
          PY
      - name: Commit ranking change
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Rank S2 upgrade paths by global efficiency'
          git push origin main
