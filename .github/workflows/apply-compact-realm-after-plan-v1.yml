name: Apply compact Realm after-plan labels

on:
  push:
    paths:
      - '.github/workflows/apply-compact-realm-after-plan-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Compact Realm after-plan labels
        run: python .github/patch-compact-realm-after-plan-v1.py
      - name: Verify
        run: |
          grep -q 'COMPACT_REALM_AFTER_PLAN_V1' index.html
          grep -q 'After plan:' index.html
          ! grep -q 'After recommended plan:' index.html
          ! grep -q 'spendable left' index.html
          ! grep -q 'S2 reserve' index.html
      - name: Commit generated index
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Compact Realm after-plan labels'
          git push
