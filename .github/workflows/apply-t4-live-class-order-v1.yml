name: Apply live T4 class order normalization

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_t4_live_class_order_v1.py'
      - '.github/workflows/apply-t4-live-class-order-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize live class order
        run: python3 scripts/patch_t4_live_class_order_v1.py
      - name: Verify
        run: |
          grep -Fq "const S2_BUILD_CLASSES=['Destroyer','Dominator','Conqueror','Guardian'];" index.html
          grep -Fq "const S2_BUILD_CLASSES_LIVE=['Destroyer','Dominator','Conqueror','Guardian'];" index.html
          grep -Fq "const S2_CLASSES=['Destroyer','Dominator','Conqueror','Guardian'];" index.html
          grep -Fq "S2_BUILD_CLASSES_LIVE={ORDER_OLD}" scripts/patch_t4_class_order_dominator_roles_v1.py
          python3 -m py_compile scripts/patch_t4_live_class_order_v1.py scripts/patch_t4_class_order_dominator_roles_v1.py
          python3 scripts/validate_pandarial_build_prep_v1.py
          python3 scripts/validate_warlords_rest_roll_guide_v1.py
      - name: Commit and push
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html scripts/patch_t4_class_order_dominator_roles_v1.py
          git commit -m 'Match live T4 class tabs to in-game order'
          git push
