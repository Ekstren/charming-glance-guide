name: Fix duplicate timeline Details

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_duplicate_timeline_details.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix duplicate Details and verify build layout
        run: python .github/scripts/fix_duplicate_timeline_details.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          if not scripts:
            raise SystemExit('No inline scripts found')
          Path('/tmp/sxs.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/sxs.js
      - name: Verify requested changes
        run: |
          grep -q 'function dedupeTimelineDetails' index.html
          grep -q 'BUILD_LAYOUT_V2' index.html
          grep -q 'function splitBerserkerPriorities' index.html
          grep -q 'function polishBuildLayout' index.html
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then
            echo 'No change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix duplicate timeline details controls'
          git push origin main
