name: Compact calculator layout

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/compact_calculator_layout.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply compact calculator layout
        run: python .github/scripts/compact_calculator_layout.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          if not scripts: raise SystemExit('No inline scripts')
          Path('/tmp/sxs.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/sxs.js
      - name: Verify compact layout
        run: |
          grep -q 'CALCULATOR_COMPACT_LAYOUT_V1' index.html
          grep -q 'id="refinedOreCurrent" type="hidden"' index.html
          ! grep -q 'Optional Refined Ore tracking' index.html
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Remove refined ore tracking and compact calculator spacing'
          git push origin main
