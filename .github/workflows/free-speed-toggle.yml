name: Free daily speed-up toggle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/free-speed-toggle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Convert free speed-up to a default-on checkbox
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          if 'Use free 2-hour boost every reset' not in text:
              pattern = r'<label>Free speed-up hours / reset<input id="freeSpeed" type="number" value="[^"]*"></label>'
              replacement = '<label class="freeSpeedToggle">Daily free speed-up<span class="freeSpeedCheck"><input id="freeSpeed" type="checkbox" checked> Use free 2-hour boost every reset</span></label>'
              text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit('Could not find the old freeSpeed number input')

          css = '.freeSpeedToggle .freeSpeedCheck{align-items:center;gap:8px;color:var(--body-text);letter-spacing:0;text-transform:none;font-size:10px;font-weight:750;display:flex}.calcGrid .freeSpeedToggle input[type=checkbox]{accent-color:var(--green);width:auto;min-height:0;padding:0;box-shadow:none}'
          if css not in text:
              text = text.replace('</style>', css + '\n</style>', 1)

          old_inputs = "'targetStars','historicalStars','charLevel','charExp','bedExp','freeSpeed','reserveHours','skillLevel','relicLevel','fantomonLevel'"
          new_inputs = "'targetStars','historicalStars','charLevel','charExp','bedExp','reserveHours','skillLevel','relicLevel','fantomonLevel'"
          if old_inputs in text:
              text = text.replace(old_inputs, new_inputs, 1)
          elif new_inputs not in text:
              raise SystemExit('Could not update INPUT_IDS for freeSpeed')

          old_checks = "const CHECK_IDS = ['holdExp','grace12','reserveS2Essence','reserveS2Sand','reserveS2Treats'];"
          new_checks = "const CHECK_IDS = ['freeSpeed','holdExp','grace12','reserveS2Essence','reserveS2Sand','reserveS2Treats'];"
          if old_checks in text:
              text = text.replace(old_checks, new_checks, 1)
          elif new_checks not in text:
              raise SystemExit('Could not update CHECK_IDS for freeSpeed')

          # Preserve old saved numeric values cleanly: 2 => checked, 0 => unchecked.
          migration_anchor = "if(hadState && state.reserveS2Treats===undefined) state.reserveS2Treats=true;"
          migration = migration_anchor + "\n      if(hadState && state.freeSpeed!==undefined && typeof state.freeSpeed!=='boolean') state.freeSpeed=Number(state.freeSpeed)>0;"
          if migration not in text:
              if migration_anchor not in text:
                  raise SystemExit('Could not find saved-state migration anchor')
              text = text.replace(migration_anchor, migration, 1)

          # Every enabled reset is the fixed, free 2-hour boost.
          text, count = re.subn(r"Math\.max\(0,n\('freeSpeed',2\)\)\*", "($('freeSpeed')?.checked ? 2 : 0)*", text)
          if count < 3:
              raise SystemExit(f'Expected at least 3 freeSpeed calculations, changed {count}')

          # freeSpeed is no longer a numeric S2 default; the checkbox resets ON instead.
          text = re.sub(r'freeSpeed:\s*\d+(?:\.\d+)?,', '', text, count=1)
          s2_reset_anchor = "$('holdExp').checked=true; $('grace12').checked=true; $('reserveS2Essence').checked=true; $('reserveS2Sand').checked=true; $('reserveS2Treats').checked=true;"
          s2_reset_new = "$('freeSpeed').checked=true; " + s2_reset_anchor
          if s2_reset_new not in text:
              if s2_reset_anchor not in text:
                  raise SystemExit('Could not find S2 checkbox reset block')
              text = text.replace(s2_reset_anchor, s2_reset_new, 1)

          text = text.replace('free speed-up hours are counted only when an actual reset occurs.', 'the free 2-hour speed-up is counted only when its checkbox is enabled and an actual reset occurs.')
          text = text.replace('free speed-ups are discrete, not prorated.', 'the free 2-hour speed-up is discrete, not prorated.')
          text = text.replace('Free speed-ups are discrete reset events, not a fractional daily rate: every actual reset before the cutoff contributes the entered boost hours to Bed EXP, Cart production and Stamina regeneration.', 'The free speed-up is a discrete 2-hour reset event, not a fractional daily rate: when enabled, every actual reset before the cutoff contributes 2 boost hours to Bed EXP, Cart production and Stamina regeneration.')

          path.write_text(text, encoding='utf-8')

      - name: Validate inline JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S|re.I)
          if not scripts:
              raise SystemExit('No inline script found')
          Path('/tmp/charming-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/charming-inline.js

      - name: Commit change
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Make free daily speed-up a default-on toggle'
          git push origin main
