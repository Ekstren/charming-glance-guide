name: Apply Sand spacing match Treats v1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_sand_spacing_match_treats_v1.py'
      - 'scripts/sand_spacing_match_treats_smoke_v1.mjs'
      - '.github/workflows/apply-sand-spacing-match-treats-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Sand spacing patch
        run: python3 scripts/apply_sand_spacing_match_treats_v1.py

      - name: Verify intended CSS
        run: |
          grep -Fq 'sand-spacing-match-treats-v1' index.html
          grep -Fq '.sandResourceFields{' index.html
          grep -Fq 'grid-template-columns:repeat(2,minmax(0,1fr))!important' index.html

      - name: Validate inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          out=Path('/tmp/inline-js'); out.mkdir(exist_ok=True)
          for i,body in enumerate(scripts):
              (out/f'{i}.js').write_text(body,encoding='utf-8')
          print(f'extracted {len(scripts)} inline scripts')
          PY
          for f in /tmp/inline-js/*.js; do node --check "$f"; done

      - name: Install browser smoke dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Run Sand spacing regression smoke
        run: node scripts/sand_spacing_match_treats_smoke_v1.mjs

      - name: Run full site browser smoke
        run: node scripts/site_smoke_test.mjs

      - name: Commit and push
        run: |
          if git diff --quiet -- index.html; then
            echo 'Sand spacing is already current.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Match Chrono Sand field spacing to Treats'
            git push
          fi
