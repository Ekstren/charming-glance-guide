name: Apply consistent page spacing

on:
  push:
    paths:
      - '.github/workflows/apply-consistent-page-spacing.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply spacing patch
        run: python .github/patch-consistent-page-spacing.py
      - name: Verify spacing rules
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks=[
            'CONSISTENT_PAGE_SPACING_V1',
            '--page-stack-gap:12px;',
            '.siteSection{',
            '#buildsSection > .classTabs,',
            '#companionsSection > .companionClassTabs{',
            '#buildContent,',
            '#companionContent{',
            '#calculatorSection .calculatorLayout{',
            '#timelineSection > .timelineNow{'
          ]
          for x in checks:
            assert x in s, x
          print('consistent page spacing verified')
          PY
      - name: Commit
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Normalize spacing across all pages'
          git push
