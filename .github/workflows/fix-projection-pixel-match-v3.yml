name: Match projected level pixel height

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-projection-pixel-match-v3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Match field geometry and add regression
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css_path=Path('assets/site.css')
          css=css_path.read_text()
          marker='/* PROJECTION_FIELD_PIXEL_MATCH_V3 */'
          if marker not in css:
              css += '\n\n' + '\n'.join([
                  marker,
                  '/* Screenshot measurement: Bed EXP = 48 rendered px; projected = 46 px. */',
                  '.projectionCallout.projectionInline.projectionGridCell>strong{',
                  '  min-height:44px!important;',
                  '  height:44px!important;',
                  '}',
                  '@media(max-width:760px){',
                  '  .projectionCallout.projectionInline.projectionGridCell>strong{',
                  '    min-height:44px!important;',
                  '    height:44px!important;',
                  '  }',
                  '}',
                  ''
              ])
              css_path.write_text(css)

          smoke_path=Path('scripts/site_smoke_test.mjs')
          smoke=smoke_path.read_text()
          anchor='assert(calcYieldMs < 5000, `calculator blocked the browser for ${calcYieldMs}ms`);'
          if 'projectionGeometry' not in smoke:
              lines=[
                  anchor,
                  '',
                  '// Pixel geometry regression: projected level must exactly match Bed EXP.',
                  'const projectionGeometry = await page.evaluate(()=>{',
                  "  const bed=document.getElementById('bedExp')?.getBoundingClientRect();",
                  "  const projected=document.getElementById('projectedCharacter')?.getBoundingClientRect();",
                  '  return bed&&projected?{bed:{top:bed.top,height:bed.height},projected:{top:projected.top,height:projected.height}}:null;',
                  '});',
                  "assert(projectionGeometry, 'projection/Bed EXP geometry unavailable');",
                  'assert(Math.abs(projectionGeometry.bed.height-projectionGeometry.projected.height)<0.51,',
                  '  `projected field height mismatch: Bed ${projectionGeometry.bed.height}px vs projected ${projectionGeometry.projected.height}px`);',
                  'assert(Math.abs(projectionGeometry.bed.top-projectionGeometry.projected.top)<0.51,',
                  '  `projected field top mismatch: Bed ${projectionGeometry.bed.top}px vs projected ${projectionGeometry.projected.top}px`);'
              ]
              if anchor not in smoke:
                  raise SystemExit('calculator smoke anchor missing')
              smoke=smoke.replace(anchor,'\n'.join(lines),1)
              smoke_path.write_text(smoke)
          PY
          node --check scripts/site_smoke_test.mjs
      - name: Commit pixel match
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/site.css scripts/site_smoke_test.mjs
          git commit -m 'Pixel-match projected level field'
          git push
