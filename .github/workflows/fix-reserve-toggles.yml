name: Fix S2 reserve toggles

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-reserve-toggles.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch reserve toggle handling
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="CHECK_IDS.forEach(id=>$(id)?.addEventListener('change',()=>{markManualSnapshot(id);scheduleCalculatorUpdate(0);}));"
          new="""CHECK_IDS.forEach(id=>$(id)?.addEventListener('change',()=>{\n      markManualSnapshot(id);\n      // Checkbox state must be persisted before recalculation so S2 reserve toggles\n      // immediately add/remove their protected resource pools.\n      saveState();\n      if(calculatorInitialized) updateCalculator();\n      else initializeCalculatorIfNeeded();\n    }));"""
          if old not in s:
              raise SystemExit('checkbox listener pattern not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          if not scripts: raise SystemExit('No inline scripts')
          Path('/tmp/sxs.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/sxs.js
      - name: Verify reserve hooks
        run: |
          grep -q "if(calculatorInitialized) updateCalculator();" index.html
          grep -q "reserveS2Essence" index.html
          grep -q "reserveS2Sand" index.html
      - name: Commit and self-clean
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-reserve-toggles.yml
          git add index.html
          git commit -m 'Fix S2 reserve checkbox recalculation'
          git push origin main
