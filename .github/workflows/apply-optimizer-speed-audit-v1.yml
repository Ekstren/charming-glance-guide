name: Apply optimizer speed audit v1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_acquisition_kernel_v1.py'
      - 'scripts/patch_raw_funded_search_fast_v1.py'
      - 'scripts/patch_treat_funded_search_fast_v1.py'
      - 'scripts/patch_affordable_treat_feasible_v1.py'
      - '.github/workflows/apply-optimizer-speed-audit-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact Auto Stamina state search
        run: python scripts/patch_auto_stamina_exact_three_v1.py
      - name: Apply allocation-free acquisition kernel
        run: python scripts/patch_acquisition_kernel_v1.py
      - name: Apply exact raw-funded search fast path
        run: python scripts/patch_raw_funded_search_fast_v1.py
      - name: Apply exact Treat-funded search fast path
        run: python scripts/patch_treat_funded_search_fast_v1.py
      - name: Apply affordable-Treat feasible presearch
        run: python scripts/patch_affordable_treat_feasible_v1.py
      - name: Verify exact speed paths
        shell: bash
        run: |
          grep -q 'AUTO_STAMINA_EXACT_THREE_V1' index.html
          grep -q 'ACQUISITION_KERNEL_V1' index.html
          grep -q 'RAW_FUNDED_SEARCH_FAST_V1' index.html
          grep -q 'TREAT_FUNDED_SEARCH_FAST_V1' index.html
          grep -q 'AFFORDABLE_TREAT_FEASIBLE_V1' index.html
          ! grep -q 'for(let pass=0;pass<5;pass++)' index.html
      - name: Install Playwright
        run: |
          npm install --no-save playwright@latest
          npx playwright install --with-deps chromium
      - name: Runtime smoke
        run: node scripts/site_smoke_test.mjs
      - name: Calculator efficiency and performance audit
        run: node scripts/calculator_perf_check.mjs
      - name: Commit generated optimizer improvements
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Speed up exact Primostar optimization'
          git push origin HEAD:main
