name: Add score safety margin

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-score-safety-margin.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Add 5 percent score safety margin
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="    const desired=Math.max(0,(targetStars-historical-cfg.starBase)*cfg.scorePerStar);"
          new=("    const thresholdScore=Math.max(0,(targetStars-historical-cfg.starBase)*cfg.scorePerStar);\n"
               "    // Plan 5% above the exact score threshold so rounding/data drift does not leave the target barely missed.\n"
               "    const scoreSafetyMargin=0.05;\n"
               "    const desired=Math.ceil(thresholdScore*(1+scoreSafetyMargin));")
          if old in s:
              s=s.replace(old,new,1)
          elif 'const scoreSafetyMargin=0.05;' not in s:
              raise SystemExit('score target formula anchor not found')
          old_label='<label>Target Primostars<input id="targetStars" type="number" value="200"></label>'
          new_label='<label>Target Primostars <small style="color:var(--status-positive);font-weight:800">+5% score safety</small><input id="targetStars" type="number" value="200"></label>'
          if old_label in s:
              s=s.replace(old_label,new_label,1)
          old_note='Stamina covers verified score-material bottlenecks first; once the requested target is funded, surplus verified nodes bank Raw Ore for next-season Gear.'
          new_note='The optimizer deliberately targets 5% above the exact score threshold for the requested Primostar goal as a safety margin. Stamina covers verified score-material bottlenecks first; once that safety-adjusted target is funded, surplus verified nodes bank Raw Ore for next-season Gear.'
          if old_note in s:
              s=s.replace(old_note,new_note,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate calculator JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          required=['const thresholdScore=Math.max(0,(targetStars-historical-cfg.starBase)*cfg.scorePerStar);','const scoreSafetyMargin=0.05;','const desired=Math.ceil(thresholdScore*(1+scoreSafetyMargin));','+5% score safety']
          for item in required:
              if item not in text:
                  raise SystemExit(f'Missing expected safety-margin change: {item}')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,flags=re.S|re.I)
          if not scripts:
              raise SystemExit('No inline scripts found')
          Path('/tmp/sxs.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/sxs.js

      - name: Commit and self-clean
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/add-score-safety-margin.yml
          git add index.html
          git commit -m 'Add 5 percent Primostar score safety margin'
          git push origin main
