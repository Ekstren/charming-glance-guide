name: Fix post-target stamina split v3
"on":
  push:
    paths:
      - .github/workflows/patch-post-target-stamina-split-v3.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch runtime
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('assets/runtime.js')
          s = p.read_text()
          a = "const start=Math.max(Date.now(),Math.min(Number(reached)||end,end));"
          b = "const now=Date.now();\n    const start=Math.max(now,Math.min(Number(reached)||end,end));"
          if a not in s:
              raise SystemExit('start pattern missing')
          s = s.replace(a, b, 1)
          a = "const staminaGenerated=Math.max(0,Math.floor(Math.max(0,Number(staminaCarry)||0)+(wallHours*5)));\n    const staminaNodes=Math.floor(staminaGenerated/Math.max(1,Number(yields.staminaPerNode)||5));"
          b = "const staminaPerNode=Math.max(1,Number(yields.staminaPerNode)||5);\n    const regenPerHour=5;\n    const preWallHours=Math.max(0,(start-now)/3_600_000);\n    const fullWallHours=Math.max(0,(end-now)/3_600_000);\n    const preGenerated=Math.max(0,Math.floor(preWallHours*regenPerHour));\n    const fullGenerated=Math.max(0,Math.floor(fullWallHours*regenPerHour));\n    const preNodes=Math.floor(preGenerated/staminaPerNode);\n    const fullNodes=Math.floor(fullGenerated/staminaPerNode);\n    const staminaNodes=Math.max(0,fullNodes-preNodes);"
          if a not in s:
              raise SystemExit('stamina pattern missing')
          s = s.replace(a, b, 1)
          p.write_text(s)
          PY
      - name: Verify JS
        run: node --check assets/runtime.js
      - name: Verify math
        run: grep -Fq "const staminaNodes=Math.max(0,fullNodes-preNodes);" assets/runtime.js
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898258+github-actions[bot]@users.noreply.github.com
          git add assets/runtime.js
          git commit -m "Fix post-target stamina split rounding"
          git push
