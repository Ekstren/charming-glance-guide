name: Apply Nexus 4v4 timeline entries

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-nexus-4v4-timeline-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply Nexus timeline patch
        run: python .github/patch-nexus-4v4-timeline-v1.py
      - name: Verify
        run: |
          grep -q "Server Tournament · Nexus qualifier" index.html
          grep -q "Nexus Tournament · 4v4" index.html
          grep -q "Sep 6" index.html
      - name: Commit generated index
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add projected Nexus 4v4 timeline'
          git push
