name: Apply post-target surplus top-up

on:
  push:
    branches: [main]
    paths:
      - '.github/patch-post-target-surplus.py'
      - '.github/workflows/apply-post-target-surplus.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply post-target surplus patch
        run: python .github/patch-post-target-surplus.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          for i,s in enumerate(scripts):
              Path(f'/tmp/inline-{i}.js').write_text(s,encoding='utf-8')
          print(len(scripts))
          PY
          for f in /tmp/inline-*.js; do node --check "$f"; done
      - name: Check diff
        run: git diff --check
      - name: Verify surplus top-up markers
        run: |
          grep -q 'POST_TARGET_SURPLUS_TOPUP_V1' index.html
          grep -q 'applyPostTargetSurplusTopups(plan,solution.resources,desired,p,cfg)' index.html
          grep -q "fill('skillLevels','essenceCost'" index.html
      - name: Commit post-target surplus top-up
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Ekstren@users.noreply.github.com'
          git add index.html
          git commit -m 'Use spendable capped surplus after target'
          git push origin main
