name: Restore projected field accent color

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-projected-field-color-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore old projected-field tint
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('assets/site.css')
          s=p.read_text()
          marker='PROJECTED_FIELD_ACCENT_RESTORE_V1'
          block='''\n\n/* PROJECTED_FIELD_ACCENT_RESTORE_V1
             Keep the projected level as a real native input so its geometry exactly matches
             the other calculator fields, but restore the darker info-tinted read-only color
             used by the old projection callout. */
          .projectionField #projectedCharacter{
            background:var(--ui-accent-soft)!important;
            border-color:var(--ui-accent-border)!important;
            cursor:default;
          }
          @supports (color:color-mix(in srgb, black, white)){
            .projectionField #projectedCharacter{
              background:color-mix(in srgb,var(--status-info) 8%,var(--surface))!important;
              border-color:color-mix(in srgb,var(--status-info) 38%,var(--line))!important;
            }
          }
          '''
          if marker not in s:
              p.write_text(s+block)

          p=Path('scripts/site_smoke_test.mjs')
          s=p.read_text()
          if 'projectionColors.projectedBg' not in s:
              anchor="""assert(Math.abs(projectionGeometry.bed.top-projectionGeometry.projected.top)<0.51,
            `projected field top mismatch: Bed ${projectionGeometry.bed.top}px vs projected ${projectionGeometry.projected.top}px`);"""
              extra=anchor+"""
          const projectionColors = await page.evaluate(()=>{
            const bed=getComputedStyle(document.getElementById('bedExp'));
            const projected=getComputedStyle(document.getElementById('projectedCharacter'));
            return {bedBg:bed.backgroundColor,projectedBg:projected.backgroundColor,bedBorder:bed.borderTopColor,projectedBorder:projected.borderTopColor};
          });
          assert(projectionColors.projectedBg!==projectionColors.bedBg,
            `projected field should keep its distinct read-only tint: ${JSON.stringify(projectionColors)}`);"""
              if anchor not in s:
                  raise SystemExit('projection geometry anchor missing')
              p.write_text(s.replace(anchor,extra,1))
          PY
          node --check scripts/site_smoke_test.mjs
      - name: Commit color restore
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Ekstren@users.noreply.github.com'
          git add assets/site.css scripts/site_smoke_test.mjs
          git commit -m 'Restore projected level accent tint'
          git push
