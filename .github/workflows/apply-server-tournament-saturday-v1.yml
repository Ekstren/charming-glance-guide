name: Apply Server Tournament Saturday correction

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_server_tournament_saturday_v1.py'
      - '.github/workflows/apply-server-tournament-saturday-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch timeline
        run: python3 scripts/patch_server_tournament_saturday_v1.py

      - name: Verify
        run: |
          grep -Fq "['2026-09-05',53,'Event','Server Tournament'" index.html
          ! grep -Fq "['2026-09-04',52,'Event','4v4 Tournament registration opens'" index.html
          grep -Fq "['2026-09-12',60,'Event','Nexus Tournament · 4v4'" index.html
          grep -Fq "['2026-09-05',53,'Event','Server Tournament'" scripts/patch_confirm_charming_glance_tournament_times_v1.py

      - name: Commit and push
        run: |
          if git diff --quiet -- index.html scripts/patch_confirm_charming_glance_tournament_times_v1.py; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html scripts/patch_confirm_charming_glance_tournament_times_v1.py
          git commit -m 'Show Server Tournament on Saturday'
          git push
