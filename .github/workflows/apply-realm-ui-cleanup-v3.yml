name: Apply Realm UI cleanup v3

on:
  push:
    paths:
      - 'scripts/patch_realm_ui_cleanup_v3.py'
      - '.github/workflows/apply-realm-ui-cleanup-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply Realm UI cleanup
        run: python scripts/patch_realm_ui_cleanup_v3.py
      - name: Verify Realm UI cleanup
        run: |
          grep -q 'REALM_UI_CLEANUP_V3' index.html
          grep -q 'Hammers owned' index.html
          grep -q 'Knuckles owned' index.html
          grep -q 'Shovels owned' index.html
          grep -q 'Ore Purchases / Day' index.html
          grep -q 'Essence Purchases / Day' index.html
          grep -q 'Sand Purchases / Day' index.html
          grep -q 'grid-column:2 / 4!important' index.html
          grep -q 'margin-top:-6px!important' index.html
      - name: Commit generated index
        run: |
          git config user.name 'ekstren'
          git config user.email '38091958+Ekstren@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Clean up Realm labels and card sizing'
          git push
