name: Apply Fantasia Ascent builds

on:
  push:
    branches: [main]
    paths:
      - '.github/fantasia-ascent-builds-v1.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply Fantasia Ascent builds
        run: python .github/patch-fantasia-ascent-builds-v3.py
      - name: Validate diff
        run: |
          git diff --check
          grep -q "const META_MODES=\['Dungeon','Crucible / Conquest','Arena','Fantasia Ascent','Tournament'\]" .github/build-fantomons-inject.html
          grep -q "role('Fantasia Ascent','Solo push: high-DEF floors and mixed packs'" .github/build-fantomons-inject.html
          grep -q "role('Fantasia Ascent · Tank'" .github/build-fantomons-inject.html
          grep -q "role('Fantasia Ascent · DPS'" .github/build-fantomons-inject.html
          grep -q "role('Fantasia Ascent · Heals'" .github/build-fantomons-inject.html
          grep -q "if(t==='fantasia ascent') return 'Solo'" .github/build-fantomons-inject.html
          grep -q "role==='Solo'.*cls==='Dominator'.*dominatorBuildMode()==='heals'" .github/build-fantomons-inject.html
          grep -q "grid.querySelectorAll('.metaTournamentTabs').forEach(x=>x.remove())" .github/build-fantomons-inject.html
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/build-fantomons-inject.html scripts/site_smoke_test.mjs
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add Fantasia Ascent builds and nest Tournament size controls"
          git push origin HEAD:main
