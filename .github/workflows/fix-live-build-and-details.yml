name: Fix live build layout and timeline details

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_live_build_and_details.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix live build layout and duplicate timeline details
        run: python .github/scripts/fix_live_build_and_details.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          if not scripts:
            raise SystemExit('No inline scripts found')
          Path('/tmp/sxs.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/sxs.js
      - name: Verify fixes
        run: |
          grep -q "const buildName=root.querySelector(':scope > .guideSummary strong')" index.html
          grep -q '.entry .timelineCardDetails{display:none!important}' index.html
          grep -q "card.querySelector('details.entryMore')" index.html
          grep -q 'function polishBuildLayout' index.html
          grep -q '.priorityPair{display:grid' index.html
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then
            echo 'No change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix live build layout and duplicate timeline details'
          git push origin main
