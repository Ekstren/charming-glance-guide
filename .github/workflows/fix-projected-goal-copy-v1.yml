name: Fix projected goal copy v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-projected-goal-copy-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align calculator explanation with projected Lv131 gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="<b>Planning now starts at Player Lv.120</b>, because that is the verified maximum S2 Material Realm/open-map economy bracket, while <b>Season Power scoring still starts at the Lv.130 baseline</b>. From Lv.120–130 the calculator can run a <b>Lv.131 full-seasonal unlock preview</b> for upgrade availability, allowing stockpiled resources to be evaluated before the live gate opens; this preview does not award fake Character score below Lv.130."
          new="The verified S2 Material Realm/open-map economy reaches its maximum bracket at <b>Player Lv.120</b>, while <b>Season Power scoring starts at the Lv.130 baseline</b>. The heavy preparation optimizer now runs only when the <b>projected season-end Character reaches Lv.131 or higher</b>. If the season-end projection remains Lv.130 or lower, the calculator shows the projection but skips the Gear / Skill / Relic / Fantomon search entirely."
          assert old in s, 'S2 calculator explanation anchor missing'
          s=s.replace(old,new,1)
          old="<b>Lv.120 maximum S2 Realm/open-map material bracket and planner start</b>, <b>Lv.130 Season Power scoring baseline / second-dungeon milestone</b>, and a <b>Lv.131 full-seasonal unlock preview</b> used only for pre-gate planning."
          new="<b>Lv.120 maximum S2 Realm/open-map material bracket</b>, <b>Lv.130 Season Power scoring baseline / second-dungeon milestone</b>, and <b>Lv.131 projected season-end Character</b> as the point where preparation-goal optimization begins."
          assert old in s, 'S2 progression gate explanation anchor missing'
          s=s.replace(old,new,1)
          old="<b>Lv.120</b> is the S2 maximum Material Realm resource bracket; <b>Lv.130</b> is the S2 Season Power scoring unlock/floor. At the Lv.120 max bracket,"
          new="<b>Lv.120</b> is the S2 maximum Material Realm resource bracket; <b>Lv.130</b> is the S2 Season Power scoring unlock/floor. A projected season-end of Lv.130 or lower intentionally performs no preparation-goal optimization; Lv.131+ enables it. At the Lv.120 max bracket,"
          assert old in s, 'S2 resource breakpoint anchor missing'
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit copy correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Ekstren@users.noreply.github.com'
          git add index.html
          git commit -m 'Align calculator copy with projected Lv131 gate'
          git push
