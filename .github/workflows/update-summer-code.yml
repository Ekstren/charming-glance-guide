name: Update Summer gift code

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-summer-code.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update Summer code timeline entry
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_entry = "['2026-08-25',42,'Global Gift','Gift code · Summer','UNCONFIRMED community lead: current Aug 25 code trackers report Summer working and one tracker reports validity through Sep 1. Reward and exact cutoff have not been independently confirmed; try it promptly and treat the window as provisional.','event','2026-09-02','unconfirmed'],"
          new_entry = "['2026-08-25',42,'Global Gift','Gift code · Summer','UNCONFIRMED cutoff: GamesRadar reports Summer rewards 160 Dawnium and expires Sep 1; Redeem Code Tracker independently lists Sep 1 and labels it as added from an official source. No direct Boltray post with the exact cutoff time has been found, so redeem promptly.','event','2026-09-02','unconfirmed'],"

          old_summary = "if(title==='Gift code · Summer') return 'UNCONFIRMED: code Summer is reported working through Sep 1; reward and exact cutoff are not independently confirmed, so redeem promptly.';"
          new_summary = "if(title==='Gift code · Summer') return 'UNCONFIRMED cutoff: Summer gives 160 Dawnium and is reported valid through Sep 1; redeem promptly.';"

          if old_entry not in s:
              raise SystemExit('Summer timeline entry anchor not found')
          if old_summary not in s:
              raise SystemExit('Summer summary anchor not found')

          s = s.replace(old_entry, new_entry, 1)
          s = s.replace(old_summary, new_summary, 1)
          p.write_text(s, encoding='utf-8')

      - name: Validate inline JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          if "Summer gives 160 Dawnium" not in text:
              raise SystemExit('Updated Summer summary missing')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, re.S | re.I)
          if not scripts:
              raise SystemExit('No inline scripts found')
          Path('/tmp/sxs.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/sxs.js

      - name: Commit and self-clean
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/update-summer-code.yml
          git add index.html
          git commit -m 'Confirm Summer code reward details'
          git push origin main
