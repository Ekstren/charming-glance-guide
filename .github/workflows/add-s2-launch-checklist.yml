name: Add S2 launch checklist

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-s2-launch-checklist.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch timeline
        run: python .github/scripts/add_s2_launch_checklist.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S|re.I)
          Path('/tmp/sxs.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/sxs.js
      - name: Commit and self-clean
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/add-s2-launch-checklist.yml .github/scripts/add_s2_launch_checklist.py
          git add index.html
          git commit -m 'Add Season 2 launch checklist to timeline'
          git push origin main
