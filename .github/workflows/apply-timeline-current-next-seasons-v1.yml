name: Limit timeline to current and next season

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_timeline_current_next_seasons_v1.py'
      - '.github/workflows/apply-timeline-current-next-seasons-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply current and next season timeline scope
        run: python scripts/patch_timeline_current_next_seasons_v1.py
      - name: Verify scope patch
        shell: bash
        run: |
          grep -q 'TIMELINE_CURRENT_NEXT_SEASONS_V1' index.html
          grep -q 'Current + next season only' index.html
          grep -q 'timelineDataForScope' index.html
      - name: Check inline script syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          for i,code in enumerate(scripts):
              Path(f'/tmp/inline-{i}.js').write_text(code,encoding='utf-8')
          print(len(scripts))
          PY
          for f in /tmp/inline-*.js; do node --check "$f"; done
      - name: Commit generated page
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Limit timeline to current and next season'
          git push origin HEAD:main
