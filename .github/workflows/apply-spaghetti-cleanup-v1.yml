name: Apply safe spaghetti cleanup v1

on:
  push:
    branches: [main]
    paths:
      - '.github/patch-spaghetti-cleanup-v1.py'
      - '.github/workflows/apply-spaghetti-cleanup-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply safe cleanup
        run: python .github/patch-spaghetti-cleanup-v1.py

      - name: Verify cleanup and behavior guards
        shell: bash
        run: |
          set -euo pipefail
          grep -q "SPAGHETTI_CLEANUP_V1" index.html
          grep -q 'id="bed-exp-hold-layout-v4"' index.html
          ! grep -q 'id="resource-tool-card-seam-v3"' index.html
          ! grep -q 'id="v57-tool-usage-polish"' index.html
          ! grep -q 'id="compact-tool-summary-v9"' index.html
          ! grep -q 'buildRoleTabs' index.html
          ! grep -q 'const ROLE_KEYS=' index.html
          grep -q 'PVP_ROLE_PRESETS' index.html
          grep -q "alwaysVisible=role==='arena'||role==='tournament'" index.html
          grep -q 'S2_PRIMO_BENCHMARK_V2' index.html
          grep -q 'S2_SCORING_START_DEFAULTS' index.html
          grep -q 'relicLevel:13' index.html
          grep -q 'Arena and Tournament stay visible in both modes' .github/build-maintenance.md

          python - <<'PY'
          from pathlib import Path
          import re, subprocess

          s = Path('index.html').read_text(encoding='utf-8')
          assert s.count('<style') == s.count('</style>'), 'unbalanced style tags'
          assert s.count('<script') == s.count('</script>'), 'unbalanced script tags'

          compact = "document.querySelectorAll('#timelineNow .timelineNowCard').forEach(compactNow);"
          assert s.count(compact) == 1, f'duplicate timeline compact pass: {s.count(compact)}'

          assert "new MutationObserver(queueApply).observe(root,{subtree:true,childList:true,attributes:true" not in s
          assert "new MutationObserver(queue).observe(root,{subtree:true,childList:true,attributes:true" not in s
          assert s.count("role('Arena'") >= 8, 'Arena presets missing'
          assert s.count("role('Tournament'") >= 8, 'Tournament presets missing'

          scripts = re.findall(r'<script([^>]*)>(.*?)</script>', s, re.S | re.I)
          checked = 0
          for i, (attrs, js) in enumerate(scripts):
              if not js.strip() or 'application/ld+json' in attrs.lower():
                  continue
              path = Path(f'/tmp/inline-{i}.js')
              path.write_text(js, encoding='utf-8')
              subprocess.run(['node', '--check', str(path)], check=True)
              checked += 1
          print(f'checked {checked} inline JavaScript blocks')
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/build-maintenance.md
          git commit -m "Clean dead UI code and observer overlap"
          git push
