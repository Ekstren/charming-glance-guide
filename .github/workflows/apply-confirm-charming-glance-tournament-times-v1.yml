name: Apply confirmed Charming Glance tournament times

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_confirm_charming_glance_tournament_times_v1.py'
      - '.github/workflows/apply-confirm-charming-glance-tournament-times-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch timeline
        run: python3 scripts/patch_confirm_charming_glance_tournament_times_v1.py

      - name: Verify confirmed timings
        run: |
          grep -Fq "['2026-09-04',52,'Event','4v4 Tournament registration opens'" index.html
          grep -Fq "['2026-09-12',60,'Event','Nexus Tournament · 4v4','CONFIRMED FOR CHARMING GLANCE" index.html
          grep -Fq 'about Sat Sep. 12, 8:00 PM PDT' index.html
          ! grep -Fq "['2026-09-13',61,'Event','Nexus Tournament · 4v4'" index.html
          ! grep -Fq "Server Tournament · Nexus qualifier" index.html

      - name: Commit and push
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Confirm Charming Glance tournament and Nexus times'
          git push
