name: Build layout v2

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/build_layout_v2.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply build layout v2
        run: python .github/scripts/build_layout_v2.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, re.S|re.I)
          Path('/tmp/sxs.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/sxs.js
      - name: Verify layout markers
        run: |
          grep -q 'BUILD_LAYOUT_V2' index.html
          grep -q 'function polishBuildLayout' index.html
          grep -q 'Core technique investment' index.html
          grep -q 'Core charm investment' index.html
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then
            echo 'No change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Refine build priorities and quick stats layout'
          git push origin main
