name: Apply resource tool card spacing v2

on:
  push:
    paths:
      - '.github/workflows/apply-resource-tool-card-spacing-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply resource card spacing fix
        run: python .github/patch-resource-tool-card-spacing-v2.py
      - name: Verify
        run: |
          grep -q 'RESOURCE_TOOL_CARD_SPACING_V2' index.html
          grep -q 'rawRemaining:has(+ small.toolBalance:not(\[hidden\]))' index.html
          grep -q 'min-height:0!important' index.html
          grep -q 'reserveRequirementLine' index.html
      - name: Commit generated index
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Tighten resource tool card spacing'
          git push
