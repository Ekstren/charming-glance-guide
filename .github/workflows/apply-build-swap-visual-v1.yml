name: Apply build swap visual polish

on:
  push:
    branches: [main]
    paths:
      - '.github/build-swap-visual.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply build swap visual polish
        run: python .github/patch-build-swap-visual-v1.py
      - name: Validate diff
        run: |
          git diff --check
          grep -q "grid-template-columns:96px minmax(0,1fr)" .github/build-fantomons-inject.html
          grep -q "class=\\\"swapText\\\"" .github/build-fantomons-inject.html
          grep -q "font-size:10px" .github/build-fantomons-inject.html
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install chromium
      - name: Run full site browser smoke
        run: node scripts/site_smoke_test.mjs
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/build-fantomons-inject.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Polish build swap spacing and text size"
          git push origin HEAD:main
