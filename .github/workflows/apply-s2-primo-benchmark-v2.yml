name: Apply Season 2 Primostar benchmark

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-s2-primo-benchmark-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Add 920-star regression benchmark
        run: python .github/patch-s2-primo-benchmark-v2.py
      - name: Verify benchmark and Season 1 preservation
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks=[
            'S2_PRIMO_READY_V1','S2_PRIMO_BENCHMARK_V2','expectedTotalStars:920',
            "scoreFloor:130,relicFloor:13,starBase:45,scorePerStar:27",
            "weights:{character:100,gear:18,skill:7,relic:33,fanto:8}",
            "s1:{key:'s1',name:'Season 1'",
            "const seasonKeyAt = (ms=Date.now()) => ms < S1_END.getTime() ? 's1' : 's2';"
          ]
          missing=[x for x in checks if x not in s]
          if missing: raise SystemExit('Missing: '+repr(missing))
          # Independent arithmetic check for the published 920 S2 end-state.
          score=(60.8*100) + (5*65*18) + (8*50*7) + ((2*45+2*43)*8) + (20*6*33)
          total=131+45+int(score//27)
          if total!=920: raise SystemExit(f'920 benchmark arithmetic failed: score={score}, total={total}')
          print(f'920 benchmark verified: progression score={score:.0f}, total Primostars={total}')
          PY
      - name: Commit generated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Validate Season 2 Primostar model"
          git push
