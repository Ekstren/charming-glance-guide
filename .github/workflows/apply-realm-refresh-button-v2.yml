name: Apply Realm refresh button delegation
on:
  push:
    branches: [main]
    paths:
      - '.github/patch-apply-realm-refresh-button-v2.py'
      - '.github/workflows/apply-realm-refresh-button-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/patch-apply-realm-refresh-button-v2.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          js='\n'.join(scripts)
          with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False) as f:
            f.write(js); path=f.name
          subprocess.run(['node','--check',path],check=True)
          PY
      - name: Verify delegated handler
        run: |
          grep -q "targetMessage')?.addEventListener('click'" index.html
          grep -q 'class="applyRealmRecommendation"' index.html
          ! grep -q 'onclick="applyRecommendedRealmRefreshes(this)"' index.html
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Fix one-click recommended Realm refreshes"
          git push
