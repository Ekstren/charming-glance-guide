name: Target timing v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/target-timing-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply target timing patch
        run: |
          python3 scripts/apply_target_timing_v1.py
          node --check assets/runtime.js
          node --check scripts/site_smoke_test.mjs
      - name: Commit target timing
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/site.css assets/runtime.js scripts/site_smoke_test.mjs
          git commit -m 'Add projected target reach timing'
          git push
