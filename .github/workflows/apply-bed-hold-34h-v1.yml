name: Apply 34-hour Bed EXP hold

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-bed-hold-34h-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply 34-hour Bed EXP hold
        run: python .github/patch-bed-hold-34h-v1.py
      - name: Verify
        run: |
          grep -q 'BED_HOLD_34H_V1' index.html
          grep -q 'Aug 28, 8:00 PM PDT' index.html
          grep -q 'value="34" hidden' index.html
          grep -q "clamp(n('reserveHours',34),0,36)" index.html
          grep -q 'A 34-hour EXP reserve' index.html
          grep -q 'Collect the banked 34 hours now' index.html
      - name: Commit generated index
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Set Bed EXP hold to 34 hours'
          git push
