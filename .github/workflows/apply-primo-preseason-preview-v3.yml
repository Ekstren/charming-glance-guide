name: Apply pre-season Primostar preview v3

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_primo_preseason_preview_and_ore_v3.py'
      - 'scripts/primo_preseason_preview_smoke_v3.mjs'
      - '.github/workflows/apply-primo-preseason-preview-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply calculator patch
        run: python3 scripts/patch_primo_preseason_preview_and_ore_v3.py

      - name: Validate inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          out=Path('/tmp/inline-js')
          out.mkdir(exist_ok=True)
          for i,body in enumerate(scripts):
              (out/f'{i}.js').write_text(body,encoding='utf-8')
          print(f'extracted {len(scripts)} inline scripts')
          PY
          for f in /tmp/inline-js/*.js; do node --check "$f"; done

      - name: Verify intended calculator changes
        run: |
          grep -Fq 'const S2_FULL_SEASONAL_PREVIEW_LEVEL = 131;' index.html
          grep -Fq 'function optimizerPlanningLevel' index.html
          grep -Fq 'const projectedCaps=optimizerCategoryCaps(p,cfg);' index.html
          grep -Fq '<small id="oreToolBalance" class="toolBalance" hidden>—</small>' index.html
          grep -Fq "setRawRemaining('oreBalance',0,resources.ore);" index.html
          grep -Fq "$('currentStars').textContent=fmt(targetStars);" index.html
          grep -Fq 'Lv.131 full-seasonal unlock preview' index.html

      - name: Install browser smoke dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Run pre-season calculator regression smoke
        run: node scripts/primo_preseason_preview_smoke_v3.mjs

      - name: Run full site browser smoke
        run: node scripts/site_smoke_test.mjs

      - name: Commit and push
        run: |
          if git diff --quiet -- index.html; then
            echo 'Pre-season Primostar preview is already current.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Fix pre-season Primostar preview and Ore card'
            git push
          fi
