name: Apply max helper text v2

on:
  push:
    branches: [main]
    paths:
      - '.github/patch-max-helper-text-v2.py'
      - '.github/workflows/apply-max-helper-text-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove helper text
        run: python .github/patch-max-helper-text-v2.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          js='\n'.join(blocks)
          with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
              f.write(js); name=f.name
          subprocess.run(['node','--check',name],check=True)
          PY
      - name: Verify change
        run: |
          grep -q 'MAX_HELPER_TEXT_V2' index.html
          ! grep -q 'Checks your selected daily Realm plan and the hard Realm-cap ceiling.' index.html
      - name: Commit site update
        run: |
          if git diff --quiet -- index.html; then
            echo 'No site changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Remove max finder helper text'
          git push
