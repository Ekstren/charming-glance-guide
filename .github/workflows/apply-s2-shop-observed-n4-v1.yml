name: Apply observed S2 shop averages n4

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_s2_shop_observed_n4_v1.py'
      - '.github/workflows/apply-s2-shop-observed-n4-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply observed shop sample
        run: python3 scripts/apply_s2_shop_observed_n4_v1.py

      - name: Validate observed averages
        run: |
          grep -Fq 'CG_S2_SHOP_OBSERVED_N4_V1' index.html
          grep -Fq 'Object.freeze({ore:3450,essence:1200,sand:1500,rareSand:270,treat:180})' index.html
          grep -Fq 'Object.freeze({ore:5250,essence:1650,sand:0,rareSand:330,treat:110})' index.html
          grep -Fq 'Object.freeze({ore:3000,essence:3000,sand:1500,rareSand:0,treat:135})' index.html
          grep -Fq 'Object.freeze({ore:1650,essence:1800,sand:1800,rareSand:270,treat:245})' index.html
          grep -Fq 'sand:a.sand+a.rareSand*SAND_BLUE_EQ' index.html
          grep -Fq '2,287.5 Sand-equivalent per page' index.html
          grep -Fq 'Chrono Sand eq.' index.html

      - name: Validate inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          out=Path('/tmp/inline-js')
          out.mkdir(exist_ok=True)
          for i,body in enumerate(scripts):
              (out/f'{i}.js').write_text(body,encoding='utf-8')
          print(f'extracted {len(scripts)} inline scripts')
          PY
          for f in /tmp/inline-js/*.js; do node --check "$f"; done

      - name: Install browser smoke dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Run full site browser smoke
        run: node scripts/site_smoke_test.mjs

      - name: Commit and push
        run: |
          if git diff --quiet -- index.html; then
            echo 'Observed S2 shop averages are already current.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Use observed S2 shop material averages'
            git push
          fi
