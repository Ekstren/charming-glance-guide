name: Compact calculator projection row

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compact-projection-row.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move projection beside Bed EXP
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index=Path('index.html')
          s=index.read_text()
          old='''          <label>Bed EXP per hour<input id="bedExp" type="number" value="0"></label>\n        </div>\n        <!-- MOVE_PROJECTION_BEFORE_PROGRESSION_V1 -->\n        <div class="projectionCallout projectionInline"><span>Projected season-end level</span><strong id="projectedCharacter">—</strong><small id="projectionNote" hidden></small></div>'''
          new='''          <label>Bed EXP per hour<input id="bedExp" type="number" value="0"></label>\n          <!-- COMPACT_PROJECTION_BED_ROW_V1 -->\n          <div class="projectionCallout projectionInline projectionGridCell"><span>Projected season-end level</span><strong id="projectedCharacter">—</strong><small id="projectionNote" hidden></small></div>\n        </div>'''
          if old not in s:
              raise SystemExit('projection markup anchor missing')
          index.write_text(s.replace(old,new,1))

          css=Path('assets/site.css')
          c=css.read_text()
          marker='/* COMPACT_PROJECTION_BED_ROW_V1 */'
          if marker in c:
              raise SystemExit('projection compact CSS already present')
          c += '''\n\n/* COMPACT_PROJECTION_BED_ROW_V1\n   Keep the season-end projection in the unused second column beside Bed EXP. */\n.projectionCallout.projectionInline.projectionGridCell{\n  margin-top:0!important;\n  align-self:stretch;\n  min-height:0!important;\n  padding:8px 11px!important;\n}\n@media(max-width:520px){\n  .projectionCallout.projectionInline.projectionGridCell{\n    grid-template-columns:1fr auto!important;\n    align-items:center;\n    gap:4px 8px;\n  }\n  .projectionCallout.projectionInline.projectionGridCell strong{\n    grid-area:auto!important;\n    font-size:14px!important;\n    white-space:nowrap;\n  }\n}\n'''
          css.write_text(c)
          PY
          node --check assets/runtime.js
          python3 scripts/check_timeline_duplicates.py index.html
      - name: Commit layout change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/site.css
          git commit -m 'Place projected level beside Bed EXP'
          git push
