name: Apply post-plan reserves

on:
  push:
    paths:
      - '.github/patch-post-plan-reserves.py'
      - '.github/workflows/apply-post-plan-reserves.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply post-plan reserve patch
        run: python .github/patch-post-plan-reserves.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          if not scripts:
              raise SystemExit('no inline script found')
          Path('/tmp/site-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/site-inline.js
      - name: Verify post-plan reserve behavior
        run: |
          grep -q 'POST_PLAN_RAW_RESERVE_V2' index.html
          grep -q 'reserveAwareRealmTopupFor' index.html
          grep -q 'POST_PLAN_RESERVE_BALANCE_LINES_V2' index.html
          grep -q 'S2 reserve gap' index.html
          if grep -q 'projectedRawReserveSupply' index.html; then
            echo 'stale pre-plan raw reserve helper still present'
            exit 1
          fi
      - name: Commit update
        run: |
          if git diff --quiet -- index.html; then
            echo 'No site change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Use raw first then fill reserve gaps'
          git push origin main
