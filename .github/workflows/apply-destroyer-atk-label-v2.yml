name: Normalize Destroyer ATK labels

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_destroyer_atk_label_v2.py'
      - '.github/workflows/apply-destroyer-atk-label-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize Destroyer ATK wording
        run: python scripts/patch_destroyer_atk_label_v2.py
      - name: Verify Destroyer labels
        shell: bash
        run: |
          grep -q "ATK ≥ Elemental Mastery > Crit > SPD" index.html
          ! grep -q "Flat ATK" index.html
          grep -q "ATK ≥ Elemental Mastery > Crit > SPD" scripts/patch_restore_rich_builds_v1.py
      - name: Commit generated update
        shell: bash
        run: |
          if git diff --quiet -- index.html scripts/patch_restore_rich_builds_v1.py scripts/patch_destroyer_stat_prio_v1.py; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html scripts/patch_restore_rich_builds_v1.py scripts/patch_destroyer_stat_prio_v1.py
          git commit -m 'Use ATK wording in Destroyer stat priorities'
          git push origin HEAD:main
