name: Clarify Sand cost label
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clarify-sand-cost.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch label
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          style='<style id="sand-cost-clarity-v1">#sandCost::after{content:" S1 relic cost"!important}</style>\n'
          if 'sand-cost-clarity-v1' not in s:
              s=s.replace('</head>',style+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          Path('/tmp/sxs.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/sxs.js
      - name: Commit and clean
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/clarify-sand-cost.yml
          git add index.html
          git commit -m 'Clarify Chrono Sand S1 relic cost'
          git push origin main
