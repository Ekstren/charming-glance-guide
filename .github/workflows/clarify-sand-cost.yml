name: Clarify Sand cost and reserve

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clarify-sand-cost.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Clarify Chrono Sand cost and protected reserve
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          marker='</head>'
          style='''<style id="sand-cost-clarity-v1">
#sandCost::after{content:" S1 relic cost"!important}
.planCosts small.toolBalance .toolReserveLine{color:var(--status-info)!important;font-weight:800!important}
</style>\n'''
          if 'sand-cost-clarity-v1' not in s:
              s=s.replace(marker,style+marker,1)

          old="""    setToolBalance('sandToolBalance',plan.realm?.sand,sandHardShort,sandYield,'Shovels',resources.s2RelicSandReserve?.shovelsReserved||0);

    renderRealmDailyRecommendations(plan,resources,cfg);
"""
          new="""    setToolBalance('sandToolBalance',plan.realm?.sand,sandHardShort,sandYield,'Shovels',resources.s2RelicSandReserve?.shovelsReserved||0);
    const sandReserveInfo=resources.s2RelicSandReserve;
    const sandToolEl=$('sandToolBalance');
    if(sandToolEl && (sandReserveInfo?.target||0)>0){
      const rawReserve=Math.max(0,Math.floor(Number(sandReserveInfo.rawSand)||0));
      const shovelReserve=Math.max(0,Math.floor(Number(sandReserveInfo.shovelsReserved)||0));
      sandToolEl.insertAdjacentHTML('afterbegin',`<span class="toolUsageRow toolReserveLine"><i>S2 reserve protected</i><b>${rawReserve?`${fmt(rawReserve)} raw`:''}</b><em>${shovelReserve?`${fmt(shovelReserve)} Shovels · ${fmt(sandReserveInfo.target)} S2 Sand-equivalent`:''}</em></span>`);
    }

    renderRealmDailyRecommendations(plan,resources,cfg);
"""
          if old not in s:
              raise SystemExit('sand tool balance call not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          if not scripts: raise SystemExit('No inline scripts found')
          Path('/tmp/sxs.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/sxs.js
      - name: Commit and self-clean
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/clarify-sand-cost.yml
          git add index.html
          git commit -m 'Clarify Sand cost versus S2 reserve'
          git push origin main
