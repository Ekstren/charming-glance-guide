name: Apply corrected T4 class order and Dominator role audit

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_t4_class_order_dominator_roles_v2.py'
      - '.github/workflows/apply-t4-class-order-dominator-roles-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply audited changes
        run: |
          python3 scripts/patch_t4_class_order_dominator_roles_v2.py
          python3 scripts/patch_build_skill_tooltips_v1.py

      - name: Verify
        run: |
          grep -Fq "const S2_BUILD_CLASSES=['Destroyer','Dominator','Conqueror','Guardian'];" index.html
          grep -Fq "const S2_CLASSES=['Destroyer','Dominator','Conqueror','Guardian'];" index.html
          grep -Fq "role('Dungeon · DPS','AoE Dark / Erosion clear'" index.html
          grep -Fq "role('Crucible / Conquest · DPS','Single-target direct / Erosion hybrid'" index.html
          grep -Fq "role('Dungeon · Heals','Hard-dungeon healer'" index.html
          grep -Fq "role('Tournament · 4v4 · Heals','Hybrid team support'" index.html
          grep -Fq 'data-build-role' index.html
          grep -Fq "cls==='Dominator'?dominatorMode" index.html
          grep -Fq "const dominatorBuildMode=()=>" .github/build-fantomons-inject.html
          grep -Fq "const dominatorBtn=e.target.closest?.('[data-dominator-mode]');" .github/build-fantomons-inject.html
          grep -Fq "role('Crucible / Conquest · DPS','Single-target direct / Erosion hybrid'" scripts/patch_meta_build_modes_v1.py
          grep -Fq 'data-build-role' scripts/patch_guardian_tank_dps_toggle_v1.py
          grep -Fq "'Chaos Rune':I(" scripts/patch_build_skill_tooltips_v1.py
          grep -Fq "'Mana Blast':I(" index.html
          grep -Fq "'Shadow Impact':I(" index.html
          python3 -m py_compile scripts/patch_t4_class_order_dominator_roles_v1.py scripts/patch_t4_class_order_dominator_roles_v2.py scripts/patch_meta_build_modes_v1.py scripts/patch_guardian_tank_dps_toggle_v1.py scripts/patch_build_skill_tooltips_v1.py .github/patch-companion-current-season.py
          python3 scripts/validate_pandarial_build_prep_v1.py
          python3 scripts/validate_warlords_rest_roll_guide_v1.py

      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/build-fantomons-inject.html .github/patch-companion-current-season.py scripts/patch_t4_class_order_dominator_roles_v1.py scripts/patch_meta_build_modes_v1.py scripts/patch_guardian_tank_dps_toggle_v1.py scripts/patch_build_skill_tooltips_v1.py
          git commit -m 'Reorder T4 classes and split Dominator role builds'
          git push
