name: Apply acquisition optimizer

on:
  push:
    branches: [main]
    paths:
      - '.github/patch-acquisition-optimizer.py'
      - '.github/workflows/apply-acquisition-optimizer.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply acquisition optimizer patch
        run: python .github/patch-acquisition-optimizer.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          import re, pathlib, subprocess, tempfile
          html=pathlib.Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I)
          for i,src in enumerate(scripts):
              if not src.strip():
                  continue
              p=pathlib.Path(tempfile.gettempdir())/f'inline-{i}.js'
              p.write_text(src,encoding='utf-8')
              subprocess.run(['node','--check',str(p)],check=True)
          print(f'Validated {len(scripts)} inline scripts')
          PY
      - name: Check diff
        run: git diff --check
      - name: Verify optimizer markers
        run: |
          grep -q 'ACQUISITION_OPTIMIZER_V1' index.html
          grep -q 'Acquisition Efficient' index.html
          grep -q 'ORE_PRESERVE_PREMIUM=0.75' index.html
          grep -q 'acquisitionEffortFor' index.html
      - name: Commit acquisition optimizer
        run: |
          if git diff --quiet -- index.html; then
            echo "No index change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Replace balanced mode with acquisition efficiency"
          git push
