name: Apply tool reserve wording

on:
  push:
    branches: [main]
    paths:
      - '.github/patch-tool-reserve-wording.py'
      - '.github/workflows/apply-tool-reserve-wording.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply tool reserve wording patch
        run: python .github/patch-tool-reserve-wording.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          if not scripts:
              raise SystemExit('no inline script found')
          Path('/tmp/site-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/site-inline.js
      - name: Verify wording split
        run: |
          grep -q 'TOOL_RESERVE_HOLD_LABEL_V7' index.html
          grep -q '<i>Use</i><b>${fmt(planRuns)}' index.html
          grep -q '<i>S2 reserve</i><b>Hold ${fmt(reserveRuns)}' index.html
          grep -q '<i>Left</i><b>${fmt(left)}' index.html
      - name: Commit site update
        run: |
          if git diff --quiet -- index.html; then
            echo 'No site change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Clarify S1 use vs S2 reserved tools'
          git push origin main
