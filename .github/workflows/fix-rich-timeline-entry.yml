name: Fix rich timeline entry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-rich-timeline-entry.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Fix rich checklist rendering
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          marker='''    const summary=timelineSummaryText(e);\n'''
          insert='''    // Rich timeline bodies already contain complete layout markup. Do not send\n    // them through the plain-text summarizer because truncating HTML can corrupt\n    // this card and the timeline DOM that follows it.\n    if(/class=["']launchChecklist["']/.test(full)) return `<div class="timelineRichBody">${full}</div>`;\n'''
          if 'return `<div class="timelineRichBody">${full}</div>`' not in s:
              pos=s.find('  function timelineDetailHtml(e){')
              if pos<0: raise SystemExit('timelineDetailHtml not found')
              anchor=s.find(marker,pos)
              if anchor<0: raise SystemExit('timelineDetailHtml summary anchor not found')
              s=s[:anchor]+insert+s[anchor:]

          start=s.find('<style id="s2-launch-checklist-layout-fix">')
          if start<0: raise SystemExit('checklist layout style not found')
          end=s.find('</style>',start)
          if end<0: raise SystemExit('checklist layout style end not found')
          end+=len('</style>')
          new_css='''<style id="s2-launch-checklist-layout-fix">
.entry:has(.launchChecklist){grid-template-columns:160px minmax(0,1fr)}
.entry:has(.launchChecklist)>div:last-child{min-width:0;width:100%}
.timelineRichBody{display:block;min-width:0;width:100%}
.entry .launchChecklist{display:grid;width:100%;max-width:none;min-width:0}
@media(width<=720px){.entry:has(.launchChecklist){grid-template-columns:1fr}}
</style>'''
          s=s[:start]+new_css+s[end:]

          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate fix and inline JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          if 'return `<div class="timelineRichBody">${full}</div>`' not in text:
              raise SystemExit('Rich timeline bypass missing')
          if '.timelineRichBody{display:block;min-width:0;width:100%}' not in text:
              raise SystemExit('Rich timeline layout CSS missing')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,flags=re.S|re.I)
          if not scripts: raise SystemExit('No inline scripts found')
          Path('/tmp/sxs.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/sxs.js

      - name: Commit and self-clean
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-rich-timeline-entry.yml
          git add index.html
          git commit -m 'Fix rich Season 2 checklist rendering'
          git push origin main
