name: Finish Early Max locked state v1

on:
  push:
    paths:
      - '.github/workflows/patch-finish-early-max-locked-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply Finish Early Max locked-state patch
        run: python3 scripts/patch_finish_early_max_locked_v1.py
      - name: Verify runtime JavaScript syntax
        run: node --check assets/runtime.js
      - name: Verify UI hooks
        run: |
          grep -q 'finishEarlyMaxHint' index.html
          grep -q 'lockFinishEarlyMaxForPurchasePlan' assets/runtime.js
          grep -q 'FINISH_EARLY_MAX_LOCKED_V1' assets/site.css
      - name: Commit verified site changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898258+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/runtime.js assets/site.css
          git diff --cached --quiet && exit 0
          git commit -m 'Disable Finish Early Max when purchase plan blocks it'
          git push origin HEAD:main
