name: S2 breakpoint reward labels v1

on:
  push:
    paths:
      - '.github/workflows/patch-s2-breakpoint-reward-labels-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply S2 breakpoint reward labels
        run: python scripts/patch_s2_breakpoint_reward_labels_v1.py
      - name: Verify labels
        run: |
          grep -q '680 <span>EXP</span>' index.html
          grep -q '800 <span>GEM</span>' index.html
          grep -q '990 <span>ASC</span>' index.html
          grep -q 'S2_BREAKPOINT_REWARD_LABELS_V1' assets/site.css
      - name: Commit verified site changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/site.css
          git diff --cached --quiet && exit 0
          git commit -m 'Label S2 breakpoint rewards inline'
          git push
