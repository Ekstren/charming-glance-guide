name: Apply exact three-way Auto Stamina speed patch

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_auto_stamina_exact_three_v1.py'
      - '.github/workflows/apply-auto-stamina-exact-three-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Auto Stamina optimizer speed patch
        run: python scripts/patch_auto_stamina_exact_three_v1.py
      - name: Verify optimizer structure
        shell: bash
        run: |
          grep -q 'AUTO_STAMINA_EXACT_THREE_V1' index.html
          ! grep -q 'for(let pass=0;pass<5;pass++)' index.html
          ! grep -q 'Minimize-tools 10%/20% hurdles' index.html
      - name: Install Playwright
        run: |
          npm install --no-save playwright@latest
          npx playwright install --with-deps chromium
      - name: Run runtime smoke
        run: node scripts/site_smoke_test.mjs
      - name: Run calculator efficiency performance check
        run: node scripts/calculator_perf_check.mjs
      - name: Commit generated page
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Speed up exact Auto Stamina optimization'
          git push origin HEAD:main
