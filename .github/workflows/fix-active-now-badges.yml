name: Fix active now badges

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-active-now-badges.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Add badges to Active now cards
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="const cards=activeEvents.map(e=>`<div class=\"timelineNowCard\"><strong>${e[3]}</strong><small>${timelineSummaryText(e)}</small></div>`).join('');"
          new="const cards=activeEvents.map(e=>`<div class=\"timelineNowCard\"><strong>${e[3]}<span class=\"activePill\">ACTIVE</span>${e[7]==='unconfirmed'?'<span class=\"unconfirmedPill\">UNCONFIRMED</span>':''}</strong><small>${timelineSummaryText(e)}</small></div>`).join('');"
          if old not in s:
              if new in s:
                  raise SystemExit('Already patched')
              raise SystemExit('Active now renderer anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

      - name: Validate inline JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          if 'timelineNowCard\"><strong>${e[3]}<span class=\"activePill\">ACTIVE</span>' not in text:
              raise SystemExit('Active-now badge renderer missing')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          if not scripts: raise SystemExit('No inline scripts found')
          Path('/tmp/sxs.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/sxs.js

      - name: Commit and self-clean
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-active-now-badges.yml
          git add index.html
          git commit -m 'Show status badges on Active now cards'
          git push origin main
