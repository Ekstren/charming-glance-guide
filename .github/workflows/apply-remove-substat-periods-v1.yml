name: Apply substat punctuation cleanup

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_remove_substat_periods_v1.py'
      - '.github/workflows/apply-remove-substat-periods-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch substat punctuation
        run: python3 scripts/patch_remove_substat_periods_v1.py

      - name: Verify
        run: |
          ! grep -Fq "substats:'Crit Rate / Crit DMG > Accuracy > Elemental Mastery > SPD > ATK.'" index.html
          ! grep -Fq "substats:'Block Rate > DEF > SPD > HP.'" index.html
          ! grep -Fq "substats:'Crit Rate / Crit DMG > ATK ≈ Elemental Mastery > Accuracy > SPD.'" index.html
          ! grep -Fq "substats:'Effect Hit Rate > Crit Rate / Crit DMG > Elemental Mastery > ATK > SPD.'" index.html
          ! grep -Fq "substats:'Healing Boost > SPD > HP > DMG RES.'" index.html

      - name: Commit and push
        run: |
          if git diff --quiet -- index.html scripts/patch_restore_rich_builds_v1.py; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html scripts/patch_restore_rich_builds_v1.py
          git commit -m 'Remove periods from build substat priorities'
          git push
