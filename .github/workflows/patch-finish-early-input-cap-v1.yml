name: Finish Early input cap v1

on:
  push:
    paths:
      - '.github/workflows/patch-finish-early-input-cap-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Finish Early input cap
        run: python scripts/patch_finish_early_input_cap_v1.py
      - name: Verify runtime JavaScript syntax
        run: node --check assets/runtime.js
      - name: Verify cap hooks
        run: |
          grep -F 'function maxFinishEarlyDays' assets/runtime.js
          grep -F 'FINISH_EARLY_INPUT_CAP_V1' assets/runtime.js
          grep -F 'syncFinishEarlyInputLimit(activeCalcConfig(),true);' assets/runtime.js
      - name: Commit verified site changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/runtime.js
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Cap Finish Early to remaining season time'
          git push
