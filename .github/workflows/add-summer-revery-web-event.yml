name: Add Summer Revery timeline lead
on:
  push:
    paths:
      - .github/workflows/add-summer-revery-web-event.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add web event lead and refresh timeline date
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          title='Summer Revery Invite · web event'
          if title in s:
              raise SystemExit('already present')
          marker="    ['2026-08-19',36,'Global Gift','Weekly gift code · 4P7Y2R9M'"
          if marker not in s:
              raise SystemExit('timeline insertion marker missing')
          row="    ['2026-08-18',35,'Web Event','Summer Revery Invite · web event','UNCONFIRMED Oceanic companion web event: LDShop reports guaranteed 300 Dawnium at 1 boost, 5 Bond Trinkets at 2 boosts, and 15 Destiny Fruits at 3 boosts, plus lucky draws. Exact Global window and Charming Glance eligibility were not independently verified; claim it during Oceanic if the web invite is available to you.','event','2026-09-01','unconfirmed'],\n"
          s=s.replace(marker,row+marker,1)
          s=s.replace('Timeline refreshed Aug 25, 2026','Timeline refreshed Aug 26, 2026',1)
          p.write_text(s)
          PY
      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/inline.js').write_text('\n;\n'.join(blocks))
          PY
          node --check /tmp/inline.js
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Add Summer Revery web event lead"
          git push
