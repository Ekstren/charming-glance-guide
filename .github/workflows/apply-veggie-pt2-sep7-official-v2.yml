name: Confirm Sep 7 Vegetables Fairy Pt 2

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_veggie_pt2_sep7_official_v2.py'
      - '.github/workflows/apply-veggie-pt2-sep7-official-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply timeline patch
        run: python3 scripts/patch_veggie_pt2_sep7_official_v2.py

      - name: Validate inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          out=Path('/tmp/inline-js')
          out.mkdir(exist_ok=True)
          for i,body in enumerate(scripts):
              (out/f'{i}.js').write_text(body,encoding='utf-8')
          print(f'extracted {len(scripts)} inline scripts')
          PY
          for f in /tmp/inline-js/*.js; do node --check "$f"; done

      - name: Verify intended timeline change
        run: |
          grep -Fq "['2026-09-07',55,'Collab','Vegetables Fairy Collab Pt. 2'" index.html
          grep -Fq 'CONFIRMED GLOBAL DATE from the official Sword x Staff announcements feed on Sep. 4' index.html
          grep -Fq 'Veggie Shuffle' index.html
          grep -Fq 'Lemon Whale purification 3 times' index.html
          if grep -Fq "Vegetables Fairy Collab Pt. 2 · projected launch" index.html; then
            echo 'Old projected title still present' >&2
            exit 1
          fi

      - name: Install browser smoke dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Run site browser smoke
        run: node scripts/site_smoke_test.mjs

      - name: Commit and push
        run: |
          if git diff --quiet -- index.html; then
            echo 'Vegetables Fairy Pt. 2 row is already current.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Confirm Sep 7 Vegetables Fairy Pt. 2 timeline'
            git push
          fi
