name: Apply Daily Shop panel v2

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/patch-daily-shop-panel-v2.py'
      - '.github/workflows/apply-daily-shop-panel-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply Daily Shop panel v2
        run: python .github/scripts/patch-daily-shop-panel-v2.py
      - name: Verify panel and model
        run: |
          grep -q 'class="realmInventory shopEstimatePanel"' index.html
          grep -q "const active=cfg.key==='s1'||cfg.key==='s2';" index.html
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert s.index('Material Realm plan') < s.index('Daily Shop material estimate')
          assert s.count('id="shopRefreshesDaily"') == 1
          PY
      - name: Commit generated index
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Move Daily Shop below Realm and enable S1'
          git push
