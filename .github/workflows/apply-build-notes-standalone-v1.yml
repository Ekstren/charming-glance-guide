name: Apply standalone build notes

on:
  push:
    branches: [main]
    paths:
      - '.github/build-notes-standalone.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rewrite active build notes
        run: python .github/patch-build-notes-standalone-v1.py
      - name: Validate player-facing wording
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/build-fantomons-inject.html').read_text()
          start=text.index('    Conqueror:[')
          end=text.index('\n  };\n\n  const FANTO={', start)
          block=text[start:end].lower()
          banned=[
            'arena is one target',
            'drop howling hurricane',
            'this setup',
            'this build',
            'this card',
            'whole bar',
            'the rest of the bar',
            'use the tank setup instead',
            'use the dps 2v2 setup',
            'dps arena setup is stronger',
            'favor the single-target setup over',
            'not a pure healer',
            'stop chasing its own recount',
          ]
          hits=[x for x in banned if x in block]
          if hits:
              raise SystemExit('editorial/change-log wording remains: '+', '.join(hits))
          required=[
            'formation breaker accelerates actions while tempest sphere',
            'dark bullet, dark starburst, chaos rune, and shadow of termination focus dark pressure',
            'build-card notes must read as standalone player guidance',
          ]
          corpus=(text+'\n'+Path('.github/build-maintenance.md').read_text()).lower()
          missing=[x for x in required if x not in corpus]
          if missing:
              raise SystemExit('required rewrite missing: '+', '.join(missing))
          print('standalone build-note wording validated')
          PY
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Run browser smoke
        run: node scripts/site_smoke_test.mjs
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/build-fantomons-inject.html .github/build-maintenance.md scripts .github/*.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Rewrite build notes as standalone player guidance"
          git push origin HEAD:main
