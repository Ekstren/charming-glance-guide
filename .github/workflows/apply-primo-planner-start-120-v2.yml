name: Apply Lv120 Primostar planner start

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_primo_planner_start_120_v2.py'
      - '.github/workflows/apply-primo-planner-start-120-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply calculator patch
        run: python3 scripts/patch_primo_planner_start_120_v2.py

      - name: Validate inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          out=Path('/tmp/inline-js'); out.mkdir(exist_ok=True)
          for i,body in enumerate(scripts):
              (out/f'{i}.js').write_text(body,encoding='utf-8')
          print(f'extracted {len(scripts)} inline scripts')
          PY
          for f in /tmp/inline-js/*.js; do node --check "$f"; done

      - name: Verify Lv120 planning / Lv130 scoring split
        run: |
          grep -Fq 'const S2_PLANNER_START_LEVEL = 120;' index.html
          grep -Fq "currentCharacter.level<S2_PLANNER_START_LEVEL" index.html
          grep -Fq "characterSnapshot(cfg).level<S2_PLANNER_START_LEVEL" index.html
          grep -Fq '<b>Planning now starts at Player Lv.120</b>' index.html
          grep -Fq '<b>Season Power scoring still starts at the Lv.130 baseline</b>' index.html
          grep -Fq 'scoreFloor:130' index.html
          grep -Fq 'relicFloor:13' index.html
          if grep -Fq "characterSnapshot(cfg).level<cfg.scoreFloor){ clearS2PreScoring" index.html; then
            echo 'Old Lv130 hard-lock still present' >&2
            exit 1
          fi

      - name: Install browser smoke dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Run site browser smoke
        run: node scripts/site_smoke_test.mjs

      - name: Commit and push
        run: |
          if git diff --quiet -- index.html; then
            echo 'Lv120 planner behavior already applied.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Enable Primostar planning from level 120'
            git push
          fi
