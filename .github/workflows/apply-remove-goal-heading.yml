name: Apply remove goal heading

on:
  push:
    branches: [main]
    paths:
      - '.github/patch-remove-goal-heading.py'
      - '.github/workflows/apply-remove-goal-heading.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/patch-remove-goal-heading.py
      - name: Verify heading removed
        run: |
          if grep -q 'Goal and current character' index.html; then
            echo 'Heading still present'
            exit 1
          fi
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Remove calculator goal heading'
            git push
          fi
