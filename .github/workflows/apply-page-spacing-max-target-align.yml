name: Apply page spacing and max target alignment

on:
  push:
    paths:
      - '.github/patch-page-spacing-max-target-align.py'
      - '.github/workflows/apply-page-spacing-max-target-align.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python .github/patch-page-spacing-max-target-align.py
      - name: Verify layout
        run: |
          grep -q 'PAGE_SPACING_MAX_TARGET_ALIGN_V1' index.html
          grep -q '.siteSection > :first-child{margin-top:10px!important}' index.html
          grep -q 'min-height:40px!important' index.html
          grep -q 'align-items:center!important' index.html
      - name: Commit
        run: |
          if git diff --quiet; then
            echo 'No changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Tighten page spacing and align max target row'
          git push
