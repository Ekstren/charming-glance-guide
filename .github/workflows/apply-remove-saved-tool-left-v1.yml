name: Remove saved Realm tool remainder

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_remove_saved_tool_left_v1.py'
      - '.github/workflows/apply-remove-saved-tool-left-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove saved-tool remainder line
        run: python scripts/patch_remove_saved_tool_left_v1.py
      - name: Verify
        shell: bash
        run: |
          grep -q 'REMOVE_SAVED_TOOL_LEFT_V1' index.html
          ! grep -q '<i>Saved left:</i>' index.html
      - name: Commit generated page
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Remove saved Realm tool remainder from results'
          git push origin HEAD:main
