name: Fix Primostar reward projection display

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_primostar_reward_projection_v1.py'
      - 'scripts/primostar_reward_projection_test.mjs'
      - '.github/workflows/apply-primostar-reward-projection-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply reward projection display fix
        run: python scripts/patch_primostar_reward_projection_v1.py
      - name: Verify static markers
        shell: bash
        run: |
          grep -q 'PRIMOSTAR_REWARD_PROJECTION_V1' index.html
          grep -q 'next after projection' index.html
          grep -q "content:' ↗'" index.html
      - name: Install Playwright
        run: |
          npm install --no-save playwright@latest
          npx playwright install --with-deps chromium
      - name: Runtime smoke
        run: node scripts/site_smoke_test.mjs
      - name: Reward projection regression
        run: node scripts/primostar_reward_projection_test.mjs
      - name: Commit generated page
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Clarify current and projected Primostar rewards'
          git push origin HEAD:main
