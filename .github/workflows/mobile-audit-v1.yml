name: Mobile audit v1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/mobile_audit_v1.mjs'
      - '.github/workflows/mobile-audit-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install browser dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Run mobile audit
        run: node scripts/mobile_audit_v1.mjs
