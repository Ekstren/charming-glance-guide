name: Apply contained max target

on:
  push:
    paths:
      - '.github/patch-max-target-contained.py'
      - '.github/workflows/apply-max-target-contained.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python .github/patch-max-target-contained.py
      - name: Verify contained layout
        run: |
          grep -q 'MAX_TARGET_CONTAINED_V1' index.html
          grep -q 'class="maxTargetControl"' index.html
      - name: Commit
        run: |
          if git diff --quiet; then
            echo 'No changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Keep max-target plan info inside control'
          git push
