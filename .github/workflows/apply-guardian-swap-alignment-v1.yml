name: Apply Guardian swap alignment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-guardian-swap-alignment-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate patch assets
        run: |
          python3 -m py_compile scripts/patch_guardian_valor_every_build_v1.py
          node --check scripts/guardian_valor_smoke.mjs

      - name: Apply Guardian alignment
        run: python3 scripts/patch_guardian_valor_every_build_v1.py

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Run full site smoke
        run: node scripts/site_smoke_test.mjs

      - name: Run Guardian invariant smoke
        run: node scripts/guardian_valor_smoke.mjs

      - name: Commit and push
        run: |
          if git diff --quiet -- index.html .github/build-fantomons-inject.html scripts/patch_meta_build_modes_v1.py scripts/patch_guardian_tank_dps_toggle_v1.py; then
            echo 'Guardian alignment already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/build-fantomons-inject.html scripts/patch_meta_build_modes_v1.py scripts/patch_guardian_tank_dps_toggle_v1.py
          git commit -m 'Fix Guardian swap source alignment'
          git pull --rebase origin main
          git push origin main
