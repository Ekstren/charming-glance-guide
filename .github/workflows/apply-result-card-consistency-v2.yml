name: Apply result card consistency v2

on:
  push:
    paths:
      - 'scripts/patch_result_card_consistency_v2.py'
      - '.github/workflows/apply-result-card-consistency-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply result-card consistency patch
        run: python scripts/patch_result_card_consistency_v2.py
      - name: Verify result-card consistency
        run: |
          grep -q 'RESULT_CARD_CONSISTENCY_V2' index.html
          grep -q 'background:var(--ui-subpanel,var(--bg))!important' index.html
          grep -q 'grid-template-columns:auto minmax(0,1fr)!important' index.html
      - name: Commit generated index
        run: |
          git config user.name 'ekstren'
          git config user.email '38091958+Ekstren@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Normalize gear and resource result cards'
          git push
