name: Apply resource shortfall card cleanup

on:
  push:
    paths:
      - '.github/workflows/apply-resource-shortfall-card-cleanup-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply cleanup
        run: python .github/patch-resource-shortfall-card-cleanup-v1.py
      - name: Verify
        run: |
          grep -q 'RESOURCE_SHORTFALL_CARD_CLEANUP_V1' index.html
          grep -q "suffix=' · hard cap'" index.html
          grep -q 'can cover' index.html
          ! grep -q '<i>Still short:</i>' index.html
      - name: Commit generated index
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Simplify resource shortfall cards'
          git push
