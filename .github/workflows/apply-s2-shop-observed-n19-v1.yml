name: Apply observed S2 shop averages n19

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_s2_shop_observed_n19_v1.py'
      - '.github/workflows/apply-s2-shop-observed-n19-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply observed shop sample
        run: python3 scripts/apply_s2_shop_observed_n19_v1.py

      - name: Validate observed averages
        run: |
          grep -Fq 'CG_S2_SHOP_OBSERVED_N19_V1' index.html
          grep -Fq 'Object.freeze({ore:4500,essence:0,sand:1200,rareSand:330,treat:180})' index.html
          grep -Fq 'Object.freeze({ore:2400,essence:1200,sand:1800,rareSand:0,treat:330})' index.html
          grep -Fq 'Object.freeze({ore:1800,essence:1500,sand:4500,rareSand:0,treat:165})' index.html
          grep -Fq 'Object.freeze({ore:1350,essence:0,sand:3150,rareSand:300,treat:245})' index.html
          grep -Fq '19 observed shop pages' index.html
          grep -Fq '2,534.2 Raw Ore' index.html
          grep -Fq '1,792.1 Battle Essence' index.html
          grep -Fq '1,744.7 regular Chrono Sand' index.html
          grep -Fq '187.9 Rare Chrono Sand' index.html
          grep -Fq '198.2 Basic Treats' index.html
          grep -Fq '2,684.2 Sand-equivalent per page' index.html
          grep -Fq 'sand:a.sand+a.rareSand*SAND_BLUE_EQ' index.html

      - name: Validate exact n19 arithmetic
        run: |
          python3 - <<'PY'
          rows=[
            (3450,1200,1500,270,180),(5250,1650,0,330,110),(3000,3000,1500,0,135),
            (1650,1800,1800,270,245),(3000,3150,1650,0,110),(1350,4950,0,270,180),
            (4050,1200,1350,0,135),(1350,1800,0,330,510),(1650,2850,0,600,180),
            (3000,2400,1500,0,135),(1350,3150,2850,0,110),(1650,0,3000,600,180),
            (1350,1650,2850,270,180),(3000,1200,1650,0,345),(3000,1350,2850,0,110),
            (4500,0,1200,330,180),(2400,1200,1800,0,330),(1800,1500,4500,0,165),
            (1350,0,3150,300,245),
          ]
          totals=[sum(r[i] for r in rows) for i in range(5)]
          avgs=[x/len(rows) for x in totals]
          sand_eq=avgs[2]+avgs[3]*5
          print('totals',totals,'averages',avgs,'sand_eq',sand_eq)
          assert totals == [48150,34050,33150,3570,3765]
          assert [round(x,1) for x in avgs] == [2534.2,1792.1,1744.7,187.9,198.2]
          assert round(sand_eq,1) == 2684.2
          PY

      - name: Validate timeline duplicates
        run: python3 scripts/check_timeline_duplicates.py index.html

      - name: Validate inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          out=Path('/tmp/inline-js'); out.mkdir(exist_ok=True)
          for i,body in enumerate(scripts): (out/f'{i}.js').write_text(body,encoding='utf-8')
          print(f'extracted {len(scripts)} inline scripts')
          PY
          for f in /tmp/inline-js/*.js; do node --check "$f"; done

      - name: Install browser smoke dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Run calculator performance regression
        run: node scripts/calculator_perf_check.mjs

      - name: Run full site browser smoke
        run: node scripts/site_smoke_test.mjs

      - name: Commit and push
        run: |
          if git diff --quiet -- index.html; then
            echo 'Observed S2 shop averages are already current.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Expand observed S2 shop averages to n19'
            git pull --rebase origin main
            git push origin main
          fi
