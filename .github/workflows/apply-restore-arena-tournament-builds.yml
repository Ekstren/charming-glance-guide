name: Restore Arena and Tournament builds

on:
  push:
    paths:
      - '.github/workflows/apply-restore-arena-tournament-builds.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Arena and Tournament cards
        run: python .github/patch-restore-arena-tournament-builds.py
      - name: Verify restored build modes
        run: |
          python - <<'PY'
          from pathlib import Path
          for fn in ['index.html','.github/build-fantomons-inject.html']:
              s=Path(fn).read_text(encoding='utf-8')
              assert 'ARENA_TOURNAMENT_RESTORE_V2' in s
              for cls in ['Berserker','Paladin','Archmage','Arcanist','Conqueror','Guardian','Destroyer','Dominator']:
                  start=s.index(f'    {cls}:[')
                  end=s.find('\n    ]',start)
                  block=s[start:end]
                  assert "role('Arena'" in block, (fn,cls,'Arena')
                  assert "role('Tournament'" in block, (fn,cls,'Tournament')
              assert "role('Tournament','Hybrid team pressure / revive utility'" in s
              assert "role('Tournament','Hybrid support / anti-tank pressure'" in s
          print('Arena/Tournament builds restored and Sage hybrid variants preserved')
          PY
      - name: Commit
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/build-fantomons-inject.html
          git commit -m 'Restore Arena and Tournament builds'
          git push
