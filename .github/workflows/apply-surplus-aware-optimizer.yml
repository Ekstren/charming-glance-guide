name: Apply surplus-aware optimizer

on:
  push:
    branches: [main]
    paths:
      - '.github/patch-surplus-aware-optimizer.py'
      - '.github/workflows/apply-surplus-aware-optimizer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply surplus-aware optimizer patch
        run: python .github/patch-surplus-aware-optimizer.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          for i,s in enumerate(scripts):
              Path(f'/tmp/inline-{i}.js').write_text(s,encoding='utf-8')
          print(len(scripts))
          PY
          for f in /tmp/inline-*.js; do node --check "$f"; done
      - name: Check diff
        run: git diff --check
      - name: Verify optimizer markers
        run: |
          grep -q 'SURPLUS_AWARE_OPTIMIZER_V2' index.html
          grep -q 'SURPLUS_ACQUISITION_WEIGHTS={ore:1.00,essence:0.10,sand:0.35,treat:0.35}' index.html
          grep -q 'const ORE_PRESERVE_PREMIUM=0.50' index.html
      - name: Commit surplus-aware optimizer
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Tune optimizer for spendable surplus'
          git push origin main
