name: Confirm Acme Nexus Global name v1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/confirm_acme_nexus_global_name_v1.py'
      - '.github/workflows/confirm-acme-nexus-global-name-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply timeline correction
        run: python3 scripts/confirm_acme_nexus_global_name_v1.py

      - name: Validate timeline wording
        run: |
          grep -Fq "OFFICIAL GLOBAL NAME confirmed by the Sword x Staff Global announcements feed on Sep. 7" index.html
          grep -Fq "TIMING REMAINS PROJECTED" index.html
          grep -Fq "Reach the top of Acme Nexus, and Aethyris awaits" index.html

      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          out=Path('/tmp/js-acme-nexus');out.mkdir(exist_ok=True)
          for i,b in enumerate(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)):
              (out/f'{i}.js').write_text(b,encoding='utf-8')
          PY
          for f in /tmp/js-acme-nexus/*.js; do node --check "$f"; done

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Full browser smoke
        run: node scripts/site_smoke_test.mjs

      - name: Commit and push
        run: |
          if git diff --quiet -- index.html; then
            echo 'Acme Nexus timeline wording already current.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Confirm Acme Nexus Global name'
            git pull --rebase origin main
            git push origin main
          fi
