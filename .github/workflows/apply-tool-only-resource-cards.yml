name: Apply tool-only resource cards

on:
  push:
    paths:
      - '.github/patch-clear-reserve-cards.py'
      - '.github/workflows/apply-tool-only-resource-cards.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply tool-only resource-card patch
        run: python .github/patch-clear-reserve-cards.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          if not scripts:
              raise SystemExit('no inline script found')
          Path('/tmp/site-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/site-inline.js
      - name: Verify UI markers
        run: |
          grep -q 'TOOL_ONLY_RESOURCE_GAPS_V4' index.html
          grep -q 'toolRemainingLine' index.html
          grep -q '#s2SkillReserveHint,#s2RelicReserveHint,#s2TreatReserveHint' index.html
      - name: Commit update
        run: |
          if git diff --quiet -- index.html; then
            echo 'No site change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Show only tool usage and remaining value'
          git push origin main
