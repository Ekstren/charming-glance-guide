name: Add S2 pull banking tip
on:
  push:
    paths:
      - '.github/workflows/add-s2-pull-banking-tip.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch final-day prep
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="Dungeon runs: buy 2 extra attempts and use none so you enter S2 at 4/2, then buy 2 more after reset for up to 6 day-one runs. The planner starts the Bed EXP hold 34h before reset."
          new="Dungeon runs: buy 2 extra attempts and use none so you enter S2 at 4/2, then buy 2 more after reset for up to 6 day-one runs. Summons: bank Stellatie / skill pulls until the Lv.106 Tier IV class unlock, and hold relic pulls until the Loong Haven relic pool is available; current Prydwen guidance and repeated S2-transition reports both favor waiting for the new tier/region instead of spending into the outgoing pool. The planner starts the Bed EXP hold 34h before reset."
          if old not in s:
              raise SystemExit('final-day prep detail anchor not found')
          s=s.replace(old,new,1)
          old2="if(title==='Season 2 final-day prep') return 'Aug 29: sell unused S1 dungeon shards unless they buy another Primostar tier, and save dungeon attempts for S2. Bed EXP hold begins 34h before reset; full 36h banking remains unconfirmed.';"
          new2="if(title==='Season 2 final-day prep') return 'Aug 29: sell unused S1 dungeon shards unless they buy another Primostar tier; bank dungeon attempts plus skill/relic pulls for S2. Bed EXP hold begins 34h before reset; full 36h banking remains unconfirmed.';"
          if old2 not in s:
              raise SystemExit('final-day compact summary anchor not found')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
      - name: Validate inline JavaScript
        shell: python
        run: |
          import re, subprocess, pathlib
          text=pathlib.Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          if not scripts:
              raise SystemExit('No inline scripts found')
          for i,js in enumerate(scripts):
              f=pathlib.Path(f'/tmp/inline-{i}.js')
              f.write_text(js,encoding='utf-8')
              subprocess.run(['node','--check',str(f)],check=True)
          print(f'Validated {len(scripts)} inline scripts')
      - name: Verify and commit
        run: |
          grep -q 'bank Stellatie / skill pulls until the Lv.106 Tier IV class unlock' index.html
          grep -q 'bank dungeon attempts plus skill/relic pulls for S2' index.html
          rm -f .github/workflows/add-s2-pull-banking-tip.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/add-s2-pull-banking-tip.yml
          git commit -m 'Add S2 pull banking prep tip'
          git push