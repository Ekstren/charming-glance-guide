name: Apply compact Daily Shop panel

on:
  push:
    paths:
      - 'scripts/patch_shop_panel_compact_v3.py'
      - '.github/workflows/apply-shop-panel-compact-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply Daily Shop layout polish
        run: python scripts/patch_shop_panel_compact_v3.py
      - name: Verify shop layout
        run: |
          grep -q 'DAILY_SHOP_LAYOUT_POLISH_V7' index.html
          grep -q 'shopGainOre' index.html
          grep -q 'shopGainEssence' index.html
          grep -q 'shopGainSand' index.html
          grep -q 'shopGainTreat' index.html
      - name: Commit generated index
        run: |
          git config user.name 'ekstren'
          git config user.email '38091958+Ekstren@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Polish Daily Shop card layout'
          git push
