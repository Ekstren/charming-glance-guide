name: Set Daily Shop default to zero

on:
  push:
    paths:
      - 'scripts/patch_shop_default_zero_v1.py'
      - '.github/workflows/apply-shop-default-zero-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Set Daily Shop default to zero
        run: python scripts/patch_shop_default_zero_v1.py
      - name: Verify zero default
        run: |
          grep -q 'id="shopRefreshesDaily" type="number" min="0" max="20" step="1" value="0"' index.html
          grep -q 'shopRefreshesDaily:0' index.html
          grep -q 'SHOP_REFRESH_DEFAULT_ZERO_V1' index.html
      - name: Commit generated update
        run: |
          git config user.name 'ekstren'
          git config user.email '38091958+Ekstren@users.noreply.github.com'
          git add index.html scripts/patch_shop_panel_final_v4.py scripts/patch_shop_grounded_estimate_v5.py
          git diff --cached --quiet && exit 0
          git commit -m 'Default Daily Shop refreshes to zero'
          git push
