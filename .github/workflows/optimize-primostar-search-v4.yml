name: Optimize Primostar search v4

on:
  push:
    branches: [main]
    paths:
      - 'scripts/optimize_primostar_search_v4.py'
      - '.github/workflows/optimize-primostar-search-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply coarse exact seed pass
        run: python3 scripts/optimize_primostar_search_v4.py
      - name: Validate optimizer patch
        run: |
          grep -Fq 'COARSE_EXACT_SEED_V1' index.html
          grep -Fq 'const sampledIndices=(start,length,count=10)=>{' index.html
      - name: Validate timeline duplicates
        run: python3 scripts/check_timeline_duplicates.py index.html
      - name: Validate inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          out=Path('/tmp/inline-js'); out.mkdir(exist_ok=True)
          for i,body in enumerate(scripts): (out/f'{i}.js').write_text(body,encoding='utf-8')
          print(f'extracted {len(scripts)} inline scripts')
          PY
          for f in /tmp/inline-js/*.js; do node --check "$f"; done
      - name: Install browser dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Run full site browser smoke
        run: node scripts/site_smoke_test.mjs
      - name: Benchmark and verify all guarded results
        env:
          EXPECT_BASELINE_FINGERPRINTS: '1'
        run: node scripts/optimizer_perf_benchmark_v1.mjs
      - name: Commit and push
        run: |
          if git diff --quiet -- index.html; then
            echo 'Optimizer v4 patch already applied.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Seed Primostar branch-and-bound search'
            git pull --rebase origin main
            git push origin main
          fi
