name: Align calculator tool usage

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/align-tool-usage.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch tool usage layout and caps
        run: python .github/patch_tool_usage.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          if not scripts: raise SystemExit('No inline scripts found')
          Path('/tmp/sxs.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/sxs.js
      - name: Commit and self-clean
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/align-tool-usage.yml .github/patch_tool_usage.py
          git add index.html
          git commit -m 'Align Realm inputs and clarify tool usage'
          git push origin main
