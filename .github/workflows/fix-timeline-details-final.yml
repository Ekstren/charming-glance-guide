name: Fix Timeline Details Final
on:
  push:
    paths:
      - .github/workflows/fix-timeline-details-final.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch index
        env:
          CSS_B64: 
        run: |
          python3 -c "from pathlib import Path; import os,base64; p=Path('index.html'); s=p.read_text(); marker='/* TIMELINE_DETAILS_FINAL_V2 */'; css=base64.b64decode(os.environ['CSS_B64']).decode(); assert marker not in s; assert '</body>' in s; p.write_text(s.replace('</body>',css+'</body>',1))"
      - name: Validate JavaScript
        run: |
          python3 -c "from pathlib import Path; import re; s=Path('index.html').read_text(); Path('/tmp/inline.js').write_text('\n;\n'.join(re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',s,re.S|re.I)))"
          node --check /tmp/inline.js
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Fix timeline detail colors and expanded text size"
          git push
