name: Apply official Crystal Spiral Tree timeline update

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_official_crystal_spiral_tree_v1.py'
      - '.github/workflows/apply-official-crystal-spiral-tree-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply timeline correction
        run: python3 scripts/apply_official_crystal_spiral_tree_v1.py

      - name: Validate timeline correction
        run: |
          grep -Fq "'Crystal Spiral Tree'" index.html
          grep -Fq "OFFICIAL GLOBAL NAME confirmed by the Sword x Staff Global announcements feed on Sep. 7" index.html
          ! grep -Fq "'Crystalline Spiralwood'" index.html

      - name: Validate inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          out=Path('/tmp/inline-js')
          out.mkdir(exist_ok=True)
          for i,body in enumerate(scripts):
              (out/f'{i}.js').write_text(body,encoding='utf-8')
          print(f'extracted {len(scripts)} inline scripts')
          PY
          for f in /tmp/inline-js/*.js; do node --check "$f"; done

      - name: Install browser smoke dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Run full site browser smoke
        run: node scripts/site_smoke_test.mjs

      - name: Commit and push
        run: |
          if git diff --quiet -- index.html; then
            echo 'Crystal Spiral Tree timeline row is already current.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Use official Crystal Spiral Tree dungeon name'
            git push
          fi
