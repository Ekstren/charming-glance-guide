name: Add timeline season day labels

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_timeline_season_day_v1.py'
      - '.github/workflows/apply-timeline-season-day-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply season day labels
        run: python scripts/patch_timeline_season_day_v1.py
      - name: Verify patch
        run: |
          grep -q 'TIMELINE_SEASON_DAY_V1' index.html
          grep -q 'Season Day ${seasonDay}' index.html
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert "{key:'s2',label:'Season 2 · Crossed Paths',start:47,end:113}" in s
          assert 'Number(first[1])-entrySeason.start+1' in s
          print('timeline season-day label verified')
          PY
      - name: Check inline script syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/all-inline.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/all-inline.js
      - name: Commit generated page
        run: |
          if git diff --quiet -- index.html; then
            echo 'No generated change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Show season day under server day'
          git push
