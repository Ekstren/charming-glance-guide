name: Apply Ore result spacing fix

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_ore_tool_spacing_v1.py'
      - '.github/workflows/apply-ore-tool-spacing-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Ore spacing patch
        run: python3 scripts/patch_ore_tool_spacing_v1.py

      - name: Validate inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          out=Path('/tmp/inline-js')
          out.mkdir(exist_ok=True)
          for i,body in enumerate(scripts):
              (out/f'{i}.js').write_text(body,encoding='utf-8')
          print(f'extracted {len(scripts)} inline scripts')
          PY
          for f in /tmp/inline-js/*.js; do node --check "$f"; done

      - name: Verify Ore spacing override
        run: |
          grep -Fq 'ORE_TOOL_SPACING_FIX_V1' index.html
          grep -Fq 'small.rawRemaining[hidden] + small.toolBalance:not([hidden])' index.html
          grep -Fq 'margin-top:5px!important' index.html

      - name: Install browser smoke dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Run site browser smoke
        run: node scripts/site_smoke_test.mjs

      - name: Commit and push
        run: |
          if git diff --quiet -- index.html; then
            echo 'Ore result spacing is already current.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Fix Ore result card spacing'
            git push
          fi
