name: Apply S3 timeline deep-dive v2
on:
  push:
    paths:
      - '.github/workflows/apply-s3-timeline-deep-dive-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Patch timeline
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="['2026-11-05',114,'Region','Aethyris opens','Projected Season 3 start from the current ~67-day S2 anchor · QY merge reference: servers 01–08 and 09–16. Season-day offsets below use QY; absolute date remains merger-sensitive until telescope confirms.','region'],"
          new="['2026-11-05',114,'Region','Aethyris opens','UNCONFIRMED Charming Glance projection for Season 3 / Tier 5. Aethyris is independently supported as the next region/T5 destination, and Prydwen confirms the seasonal reset floor advances to Account Lv.160 in Season 3. The Nov. 5 date remains a projection from the current ~67-day S2/QY cadence; Boltray has not announced an exact Global S3 date yet, so keep the date unconfirmed until in-game countdown or official notice confirms it.','region',null,'unconfirmed'],"
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('Aethyris anchor not found')
          anchor="['2026-11-05',114,'Dungeon','Crystalline Spiralwood','Normal · Hard 9M · pre-release English/data name until Global reaches S3','dungeon'],"
          prism="['2026-12-08',147,'Fantomon','Prismora','UNCONFIRMED mid-Season 3 projection. Current Sage/Dominator guidance from Loot & Waifus identifies Prismora as a Mythic Fantomon aimed specifically at healer builds and says it releases mid Season 3. Dec. 8 is only a midpoint estimate based on the projected Nov. 5 Charming Glance S3 start and should move if the S3 anchor changes or a server-day release is confirmed.','fantomon',null,'unconfirmed'],"
          if prism not in s:
              if anchor not in s:
                  raise SystemExit('S3 dungeon anchor not found')
              s=s.replace(anchor,anchor+'\n    '+prism,1)
          p.write_text(s)
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          if not scripts: raise SystemExit('no scripts')
          Path('/tmp/inline.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/inline.js
      - name: Commit and push
        run: |
          git config user.name 'ekstren'
          git config user.email '38091958+Ekstren@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Expand Season 3 timeline projections'
          git pull --rebase origin main
          git push origin main
