name: Add build season toggle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-season-toggle.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch build season toggle
        shell: bash
        run: |
          echo '  zInOyB9XG4gIGZ1bmN0aW9uIGxpdmVCdWlsZENsYXNzZXMoKXsgcmV0dXJuIGxpdmVCdWlsZFNlYXNvbigpPT09J3MxJz9TMV9CVUlMRF9DTEFTU0VTX0xJVkU6UzJfQlVJTERfQ0xBU1NFU19MSVZFOyB9XG4gIGZ1bmN0aW9uIGxpdmVCdWlsZFN0b3JhZ2VLZXkoKXsgcmV0dXJuIEJVSUxEX1NFQVNPTl9TVE9SQUdFX0tFWVNb bGl2ZUJ1aWxkU2Vhc29uKCldOyB9IgpuZXdfbGl2ZT0iICBmdW5jdGlvbiBsaXZlQnVpbGRTZWFzb24oKXsgcmV0dXJuIGJ1aWxkU2Vhc29uS2V5KCk9PT0nczInPydzMic6KGN1cnJlbnRCdWlsZFNlYXNvbj09PSdzMic/J3MyJzonc  idXR0b25bZGF0YS1idWlsZC1zZWFzb25dJyk   idWlsZFNlYXNvblRvZ2dsZScpPy5hZGRFdmVudExpc3RlbmVyKCdjbGljaycsZT0+e1xuICAgICAgY29uc3QgYj1lLnRhcmdldC5jbG9zZXN0KCd  ' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          required=['id="buildSeasonToggle"',"BUILD_SEASON_VIEW_STORAGE_KEY='sxs-build-season-view'",'function selectBuildSeason(key)',"btn.hidden=forcedS2&&key==='s1'","document.querySelectorAll('.sectionSwitch button[data-section]')",'build-season-nav-toggle-v1']
          for marker in required:
              if marker not in text: raise SystemExit('missing '+marker)
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,flags=re.S|re.I)
          Path('/tmp/sxs.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/sxs.js
      - name: Commit and cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/build-season-toggle.yml
          git add index.html
          git commit -m 'Add S1 S2 toggle to Builds navigation'
          git push origin main
