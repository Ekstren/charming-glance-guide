name: Add build season toggle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-season-toggle.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          nav='<nav aria-label="Site sections" class="sectionSwitch" role="tablist">\n  <button class="active" role="tab" aria-selected="true" data-section="timeline">Timeline</button>\n  <div class="buildsNavCell">\n    <button role="tab" aria-selected="false" data-section="builds">Builds</button>\n    <span class="buildSeasonToggle" id="buildSeasonToggle" role="group" aria-label="Build season">\n      <button type="button" data-build-season="s1" aria-pressed="true">S1</button>\n      <button type="button" data-build-season="s2" aria-pressed="false">S2</button>\n    </span>\n  </div>\n  <button role="tab" aria-selected="false" data-section="calculator">Primostar Calculator</button>\n</nav>'
          s,n=re.subn(r'<nav aria-label="Site sections" class="sectionSwitch" role="tablist">.*?</nav>',nav,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('nav patch failed')
          key="  const BUILD_CLASS_STORAGE_KEYS={s1:'sxs-build-class-s1',s2:'sxs-build-class-s2'};"
          if key not in s: raise SystemExit('key anchor missing')
          s=s.replace(key,key+"\n  const BUILD_SEASON_VIEW_STORAGE_KEY='sxs-build-season-view';",1)
          old="  let currentBuildSeason=buildSeasonKey();\n  let currentClass=currentBuildSeason==='s1'?'Berserker':'Conqueror';"
          new="  let currentBuildSeason=buildSeasonKey();\n  try{\n    if(currentBuildSeason==='s1'){\n      const savedSeason=localStorage.getItem(BUILD_SEASON_VIEW_STORAGE_KEY);\n      if(savedSeason==='s1'||savedSeason==='s2') currentBuildSeason=savedSeason;\n    }\n  }catch(_){}\n  let currentClass=currentBuildSeason==='s1'?'Berserker':'Conqueror';"
          if old not in s: raise SystemExit('season init missing')
          s=s.replace(old,new,1)
          old="  function liveBuildSeason(){ return currentResetIso()<'2026-08-30'?'s1':'s2'; }\n  function liveBuildClasses(){ return liveBuildSeason()==='s1'?S1_BUILD_CLASSES_LIVE:S2_BUILD_CLASSES_LIVE; }\n  function liveBuildStorageKey(){ return BUILD_SEASON_STORAGE_KEYS[liveBuildSeason()]; }"
          new="  function liveBuildSeason(){ return buildSeasonKey()==='s2'?'s2':(currentBuildSeason==='s2'?'s2':'s1'); }\n  function liveBuildClasses(){ return liveBuildSeason()==='s1'?S1_BUILD_CLASSES_LIVE:S2_BUILD_CLASSES_LIVE; }\n  function liveBuildStorageKey(){ return BUILD_SEASON_STORAGE_KEYS[liveBuildSeason()]; }\n  function renderBuildSeasonToggle(){\n    const toggle=$('buildSeasonToggle');\n    if(!toggle) return;\n    const forcedS2=buildSeasonKey()==='s2';\n    const season=liveBuildSeason();\n    toggle.classList.toggle('s2Only',forcedS2);\n    toggle.querySelectorAll('button[data-build-season]').forEach(btn=>{\n      const key=btn.dataset.buildSeason;\n      btn.hidden=forcedS2&&key==='s1';\n      const active=key===season;\n      btn.classList.toggle('active',active);\n      btn.setAttribute('aria-pressed',String(active));\n    });\n  }\n  function selectBuildSeason(key){\n    if(buildSeasonKey()==='s2') key='s2';\n    if(key!=='s1'&&key!=='s2') return;\n    currentBuildSeason=key;\n    try{localStorage.setItem(BUILD_SEASON_VIEW_STORAGE_KEY,key);}catch(_){}\n    currentClass='';\n    normalizeLiveBuildClass();\n    renderBuilds();\n    setSection('builds');\n  }"
          if old not in s: raise SystemExit('live season block missing')
          s=s.replace(old,new,1)
          old="  renderBuilds=function(){\n    normalizeLiveBuildClass();\n    const list=liveBuildClasses();"
          new="  renderBuilds=function(){\n    if(buildSeasonKey()==='s2') currentBuildSeason='s2';\n    normalizeLiveBuildClass();\n    renderBuildSeasonToggle();\n    const list=liveBuildClasses();"
          if old not in s: raise SystemExit('render anchor missing')
          s=s.replace(old,new,1)
          old="  setupBuilds=function(){\n    $('classTabs').addEventListener('click',e=>{"
          new="  setupBuilds=function(){\n    $('buildSeasonToggle')?.addEventListener('click',e=>{\n      const b=e.target.closest('button[data-build-season]');\n      if(!b)return;\n      e.preventDefault();\n      e.stopPropagation();\n      selectBuildSeason(b.dataset.buildSeason);\n    });\n    $('classTabs').addEventListener('click',e=>{"
          if old not in s: raise SystemExit('setup anchor missing')
          s=s.replace(old,new,1)
          old="document.querySelectorAll('.sectionSwitch button').forEach(b=>{const active=b.dataset.section===name;b.classList.toggle('active',active);b.setAttribute('aria-selected',String(active));});"
          new="document.querySelectorAll('.sectionSwitch button[data-section]').forEach(b=>{const active=b.dataset.section===name;b.classList.toggle('active',active);b.setAttribute('aria-selected',String(active));});"
          if old not in s: raise SystemExit('section selector missing')
          s=s.replace(old,new,1)
          css='<style id="build-season-nav-toggle-v1">\n.buildsNavCell{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:5px;flex:1;min-width:0}\n.buildsNavCell>button[data-section]{width:100%;min-width:0}\n.buildSeasonToggle{display:inline-flex;align-items:center;gap:2px;padding:2px;border:1px solid var(--line);background:var(--ui-subpanel,var(--surface));border-radius:9px;flex:0 0 auto}\n.buildSeasonToggle button{flex:0 0 auto!important;min-height:28px!important;min-width:31px!important;padding:4px 7px!important;border:0!important;border-radius:7px!important;background:transparent!important;color:var(--muted)!important;font-size:9px!important;font-weight:900!important;letter-spacing:.04em!important;line-height:1!important;box-shadow:none!important}\n.buildSeasonToggle button:hover{background:var(--ui-hover)!important;color:var(--ink)!important}\n.buildSeasonToggle button.active{background:var(--accent-strong)!important;color:#fffaf3!important}\n.buildSeasonToggle button[hidden]{display:none!important}\n@media(max-width:720px){.buildsNavCell{gap:3px}.buildSeasonToggle button{min-width:28px!important;padding-inline:5px!important;font-size:8px!important}.buildsNavCell>button[data-section]{padding-inline:5px!important}}\n@media(max-width:520px){.buildSeasonToggle button{min-width:25px!important;padding-inline:4px!important}}\n</style>\n'
          if 'build-season-nav-toggle-v1' not in s: s=s.replace('</head>',css+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('index.html').read_text(encoding='utf-8')
          for m in ['id="buildSeasonToggle"',"BUILD_SEASON_VIEW_STORAGE_KEY='sxs-build-season-view'",'function selectBuildSeason(key)',"btn.hidden=forcedS2&&key==='s1'","document.querySelectorAll('.sectionSwitch button[data-section]')",'build-season-nav-toggle-v1']:
            if m not in t: raise SystemExit('missing '+m)
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',t,flags=re.S|re.I)
          Path('/tmp/sxs.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/sxs.js
      - name: Commit and cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/build-season-toggle.yml
          git add index.html
          git commit -m 'Add S1 S2 toggle to Builds navigation'
          git push origin main
