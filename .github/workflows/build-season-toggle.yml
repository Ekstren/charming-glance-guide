name: Add build season toggle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-season-toggle.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Add S1 S2 build toggle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old_nav='''<nav aria-label="Site sections" class="sectionSwitch" role="tablist">
  <button class="active" role="tab" aria-selected="true" data-section="timeline">Timeline</button>
  <button role="tab" aria-selected="false" data-section="builds">Builds</button>
  <button role="tab" aria-selected="false" data-section="calculator">Primostar Calculator</button>
</nav>'''
          new_nav='''<nav aria-label="Site sections" class="sectionSwitch" role="tablist">
  <button class="active" role="tab" aria-selected="true" data-section="timeline">Timeline</button>
  <div class="buildsNavCell">
    <button role="tab" aria-selected="false" data-section="builds">Builds</button>
    <span class="buildSeasonToggle" id="buildSeasonToggle" role="group" aria-label="Build season">
      <button type="button" data-build-season="s1" aria-pressed="true">S1</button>
      <button type="button" data-build-season="s2" aria-pressed="false">S2</button>
    </span>
  </div>
  <button role="tab" aria-selected="false" data-section="calculator">Primostar Calculator</button>
</nav>'''
          if old_nav not in s:
              raise SystemExit('section nav block not found')
          s=s.replace(old_nav,new_nav,1)

          old_key="  const BUILD_CLASS_STORAGE_KEYS={s1:'sxs-build-class-s1',s2:'sxs-build-class-s2'};"
          new_key=old_key+"\n  const BUILD_SEASON_VIEW_STORAGE_KEY='sxs-build-season-view';"
          if old_key not in s:
              raise SystemExit('build storage key anchor not found')
          s=s.replace(old_key,new_key,1)

          old_init="""  let currentBuildSeason=buildSeasonKey();
  let currentClass=currentBuildSeason==='s1'?'Berserker':'Conqueror';"""
          new_init="""  let currentBuildSeason=buildSeasonKey();
  try{
    if(currentBuildSeason==='s1'){
      const savedSeason=localStorage.getItem(BUILD_SEASON_VIEW_STORAGE_KEY);
      if(savedSeason==='s1'||savedSeason==='s2') currentBuildSeason=savedSeason;
    }
  }catch(_){}
  let currentClass=currentBuildSeason==='s1'?'Berserker':'Conqueror';"""
          if old_init not in s:
              raise SystemExit('build season init block not found')
          s=s.replace(old_init,new_init,1)

          old_live="""  function liveBuildSeason(){ return currentResetIso()<'2026-08-30'?'s1':'s2'; }
  function liveBuildClasses(){ return liveBuildSeason()==='s1'?S1_BUILD_CLASSES_LIVE:S2_BUILD_CLASSES_LIVE; }
  function liveBuildStorageKey(){ return BUILD_SEASON_STORAGE_KEYS[liveBuildSeason()]; }"""
          new_live="""  function liveBuildSeason(){ return buildSeasonKey()==='s2'?'s2':(currentBuildSeason==='s2'?'s2':'s1'); }
  function liveBuildClasses(){ return liveBuildSeason()==='s1'?S1_BUILD_CLASSES_LIVE:S2_BUILD_CLASSES_LIVE; }
  function liveBuildStorageKey(){ return BUILD_SEASON_STORAGE_KEYS[liveBuildSeason()]; }
  function renderBuildSeasonToggle(){
    const toggle=$('buildSeasonToggle');
    if(!toggle) return;
    const forcedS2=buildSeasonKey()==='s2';
    const season=liveBuildSeason();
    toggle.classList.toggle('s2Only',forcedS2);
    toggle.querySelectorAll('button[data-build-season]').forEach(btn=>{
      const key=btn.dataset.buildSeason;
      btn.hidden=forcedS2&&key==='s1';
      const active=key===season;
      btn.classList.toggle('active',active);
      btn.setAttribute('aria-pressed',String(active));
    });
  }
  function selectBuildSeason(key){
    if(buildSeasonKey()==='s2') key='s2';
    if(key!=='s1'&&key!=='s2') return;
    currentBuildSeason=key;
    try{localStorage.setItem(BUILD_SEASON_VIEW_STORAGE_KEY,key);}catch(_){}
    currentClass='';
    normalizeLiveBuildClass();
    renderBuilds();
    setSection('builds');
  }"""
          if old_live not in s:
              raise SystemExit('live build season functions not found')
          s=s.replace(old_live,new_live,1)

          old_render="""  renderBuilds=function(){
    normalizeLiveBuildClass();
    const list=liveBuildClasses();"""
          new_render="""  renderBuilds=function(){
    if(buildSeasonKey()==='s2') currentBuildSeason='s2';
    normalizeLiveBuildClass();
    renderBuildSeasonToggle();
    const list=liveBuildClasses();"""
          if old_render not in s:
              raise SystemExit('renderBuilds anchor not found')
          s=s.replace(old_render,new_render,1)

          old_setup="""  setupBuilds=function(){
    $('classTabs').addEventListener('click',e=>{"""
          new_setup="""  setupBuilds=function(){
    $('buildSeasonToggle')?.addEventListener('click',e=>{
      const b=e.target.closest('button[data-build-season]');
      if(!b)return;
      e.preventDefault();
      e.stopPropagation();
      selectBuildSeason(b.dataset.buildSeason);
    });
    $('classTabs').addEventListener('click',e=>{"""
          if old_setup not in s:
              raise SystemExit('setupBuilds anchor not found')
          s=s.replace(old_setup,new_setup,1)

          old_section="document.querySelectorAll('.sectionSwitch button').forEach(b=>{const active=b.dataset.section===name;b.classList.toggle('active',active);b.setAttribute('aria-selected',String(active));});"
          new_section="document.querySelectorAll('.sectionSwitch button[data-section]').forEach(b=>{const active=b.dataset.section===name;b.classList.toggle('active',active);b.setAttribute('aria-selected',String(active));});"
          if old_section not in s:
              raise SystemExit('section active selector not found')
          s=s.replace(old_section,new_section,1)

          css='''
<style id="build-season-nav-toggle-v1">
/* Temporary S1/S2 build preview control. S1 disappears automatically once S2 is live. */
.buildsNavCell{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:5px;flex:1;min-width:0}
.buildsNavCell>button[data-section]{width:100%;min-width:0}
.buildSeasonToggle{display:inline-flex;align-items:center;gap:2px;padding:2px;border:1px solid var(--line);background:var(--ui-subpanel,var(--surface));border-radius:9px;flex:0 0 auto}
.buildSeasonToggle button{flex:0 0 auto!important;min-height:28px!important;min-width:31px!important;padding:4px 7px!important;border:0!important;border-radius:7px!important;background:transparent!important;color:var(--muted)!important;font-size:9px!important;font-weight:900!important;letter-spacing:.04em!important;line-height:1!important;box-shadow:none!important}
.buildSeasonToggle button:hover{background:var(--ui-hover)!important;color:var(--ink)!important}
.buildSeasonToggle button.active{background:var(--accent-strong)!important;color:#fffaf3!important}
.buildSeasonToggle button[hidden]{display:none!important}
.buildSeasonToggle.s2Only{padding:2px}
@media(max-width:720px){.buildsNavCell{gap:3px}.buildSeasonToggle button{min-width:28px!important;padding-inline:5px!important;font-size:8px!important}.buildsNavCell>button[data-section]{padding-inline:5px!important}}
@media(max-width:520px){.buildsNavCell{grid-template-columns:minmax(0,1fr) auto}.buildSeasonToggle{gap:1px}.buildSeasonToggle button{min-width:25px!important;padding-inline:4px!important}}
</style>
'''
          if 'build-season-nav-toggle-v1' not in s:
              if '</head>' not in s:
                  raise SystemExit('head close not found')
              s=s.replace('</head>',css+'\n</head>',1)

          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate build toggle and JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          required=[
            'id="buildSeasonToggle"',
            "BUILD_SEASON_VIEW_STORAGE_KEY='sxs-build-season-view'",
            'function selectBuildSeason(key)',
            "btn.hidden=forcedS2&&key==='s1'",
            "document.querySelectorAll('.sectionSwitch button[data-section]')",
            'build-season-nav-toggle-v1'
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f'missing marker: {marker}')
          if text.count('id="buildSeasonToggle"')!=1:
              raise SystemExit('build season toggle must appear exactly once')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,flags=re.S|re.I)
          if not scripts:
              raise SystemExit('No inline scripts found')
          Path('/tmp/sxs.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/sxs.js

      - name: Commit and self-clean
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/build-season-toggle.yml
          git add index.html
          git commit -m 'Add S1 S2 toggle to Builds navigation'
          git push origin main
