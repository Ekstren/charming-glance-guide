name: Apply Vegetables Fairy Pt. 2 Sep 7 projection

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_veggie_pt2_sep7_projection_v1.py'
      - '.github/workflows/apply-veggie-pt2-sep7-projection-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply timeline correction
        run: |
          python3 -m py_compile scripts/patch_veggie_pt2_sep7_projection_v1.py
          python3 scripts/patch_veggie_pt2_sep7_projection_v1.py

      - name: Verify timeline row
        run: |
          grep -Fq "['2026-09-07',55,'Collab','Vegetables Fairy Collab Pt. 2 · projected launch'" index.html
          ! grep -Fq "['2026-09-09',57,'Collab','Vegetables Fairy Collab Pt. 2 · projected launch'" index.html
          grep -Fq "LDShop’s current Oceanic Festival guide independently expects Vegetables Fairy Part Two on Sep. 7" index.html

      - name: Install browser smoke dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Run full site browser smoke
        run: node scripts/site_smoke_test.mjs

      - name: Commit and push
        run: |
          if git diff --quiet -- index.html; then
            echo 'Timeline correction already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Project Vegetables Fairy Pt. 2 for Sep 7'
          git push
