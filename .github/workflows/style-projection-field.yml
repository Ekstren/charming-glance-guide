name: Style projection field

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/style-projection-field.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Match projection styling to calculator fields
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/site.css')
          s=p.read_text()
          marker='/* PROJECTION_FIELD_MATCH_V1 */'
          if marker in s:
              raise SystemExit('projection field style already present')
          s += '''\n\n/* PROJECTION_FIELD_MATCH_V1\n   Make the projected season-end level look like the neighboring calculator fields. */\n.projectionCallout.projectionInline.projectionGridCell{\n  border:0!important;\n  background:transparent!important;\n  border-radius:0!important;\n  padding:0!important;\n  margin:0!important;\n  display:grid!important;\n  grid-template-columns:1fr!important;\n  gap:4px!important;\n  align-self:stretch;\n}\n.projectionCallout.projectionInline.projectionGridCell>span{\n  color:var(--muted)!important;\n  letter-spacing:.06em!important;\n  text-transform:uppercase!important;\n  font-size:9px!important;\n  font-weight:850!important;\n  line-height:1.5!important;\n}\n.projectionCallout.projectionInline.projectionGridCell>strong{\n  grid-area:auto!important;\n  border:1px solid var(--line)!important;\n  background:var(--bg)!important;\n  width:100%!important;\n  min-height:38px!important;\n  color:var(--ink)!important;\n  border-radius:10px!important;\n  padding:7px 10px!important;\n  font-size:14px!important;\n  font-weight:750!important;\n  display:flex!important;\n  align-items:center!important;\n  justify-content:flex-start!important;\n  white-space:nowrap;\n}\n@media(max-width:700px){\n  .projectionCallout.projectionInline.projectionGridCell{gap:4px!important}\n  .projectionCallout.projectionInline.projectionGridCell>span{font-size:10px!important;letter-spacing:.045em!important}\n  .projectionCallout.projectionInline.projectionGridCell>strong{min-height:44px!important;font-size:14px!important;padding:9px 11px!important}\n}\n'''
          p.write_text(s)
          PY
          node --check assets/runtime.js
          python3 scripts/check_timeline_duplicates.py index.html
      - name: Commit styling change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/site.css
          git commit -m 'Match projected level field styling'
          git push
