name: Fix calculator status colors

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_status_colors.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply semantic status colors
        run: python .github/scripts/fix_status_colors.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          if not scripts: raise SystemExit('No inline scripts')
          Path('/tmp/sxs.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/sxs.js
      - name: Verify status palette
        run: |
          grep -q 'STATUS_COLOR_SEMANTICS_V1' index.html
          grep -q -- '--status-positive:#9ccfd8' index.html
          grep -q 'realmCurrentValue{color:var(--secondary-text)!important}' index.html
          grep -q 'toolBalance.toolLeft{color:var(--status-positive)!important}' index.html
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Clarify positive and negative calculator colors'
          git push origin main
