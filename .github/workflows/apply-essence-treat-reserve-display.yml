name: Apply unified resource Remaining display

on:
  push:
    paths:
      - '.github/patch-essence-treat-reserve-display.py'
      - '.github/workflows/apply-essence-treat-reserve-display.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply unified resource Remaining display
        run: python .github/patch-essence-treat-reserve-display.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          if not scripts:
              raise SystemExit('no inline script found')
          Path('/tmp/site-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/site-inline.js
      - name: Verify unified Remaining display
        run: |
          grep -q 'ALL_RESOURCE_REMAINING_V4' index.html
          grep -q 'Remaining: ${fmt(left)}' index.html
          grep -q '${fmt(reserveTarget)}${unit} reserved' index.html
          grep -q "setReservedRawRemaining(id,cost,resources,'essence')" index.html
          grep -q "setReservedRawRemaining(id,cost,resources,'sand')" index.html
          grep -q "setReservedRawRemaining(id,cost,resources,'treat','basic-eq.')" index.html
          grep -q 'const reserveTarget=Math.max(0,Math.floor(reserveTargetFor(key,resources)+1e-9));' index.html
      - name: Commit site update
        run: |
          if git diff --quiet -- index.html; then
            echo 'No site change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Use compact reserved labels on resource cards'
          git push origin main
