name: Apply calculator raw-impossibility fast path v3

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_raw_impossibility_fastpath_v3.py'
      - '.github/workflows/apply-raw-impossibility-fastpath-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Benchmark before v3
        continue-on-error: true
        run: node scripts/calculator_perf_check.mjs | tee /tmp/perf-v3-before.txt
      - name: Apply v3
        run: python3 scripts/apply_raw_impossibility_fastpath_v3.py
      - name: Validate marker and inline JS
        run: |
          grep -Fq 'RAW_IMPOSSIBILITY_FASTPATH_V3' index.html
          grep -Fq 'rawOnlyRoutePossible' index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          out=Path('/tmp/jsv3');out.mkdir(exist_ok=True)
          for i,b in enumerate(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)):
              (out/f'{i}.js').write_text(b,encoding='utf-8')
          PY
          for f in /tmp/jsv3/*.js; do node --check "$f"; done
      - name: Scarcity regression
        run: node scripts/scarcity_adjusted_acquisition_smoke_v1.mjs
      - name: Goal-stop regression
        run: node scripts/smart_balance_goal_stop_smoke_v2.mjs
      - name: Benchmark after v3
        run: node scripts/calculator_perf_check.mjs | tee /tmp/perf-v3-after.txt
      - name: Full browser smoke
        run: node scripts/site_smoke_test.mjs
      - name: Commit and push
        run: |
          if git diff --quiet -- index.html; then
            echo 'v3 already current'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Skip impossible raw-only calculator rescans'
            git pull --rebase origin main
            git push origin main
          fi
