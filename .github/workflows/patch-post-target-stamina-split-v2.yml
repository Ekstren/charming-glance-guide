name: Fix post-target stamina split v2
on:
  push:
    paths:
      - '.github/workflows/patch-post-target-stamina-split-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact post-target stamina split
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/runtime.js')
          s=p.read_text()
          old="""  function postTargetRawGains(reached,cfg,state=selectedPostTargetToolState(),staminaCarry=0){
    const end=cfg.end.getTime();
    const start=Math.max(Date.now(),Math.min(Number(reached)||end,end));
    if(!(end>start)) return {ore:0,essence:0,sand:0,treat:0,resets:0,resourceHours:0};
    const wallHours=(end-start)/3_600_000;
    const resets=countFuturePacificResets(start,end);
    const resourceHours=wallHours+(2*resets);
"""
          new="""  function postTargetRawGains(reached,cfg,state=selectedPostTargetToolState(),staminaCarry=0){
    const end=cfg.end.getTime();
    const now=Date.now();
    const start=Math.max(now,Math.min(Number(reached)||end,end));
    if(!(end>start)) return {ore:0,essence:0,sand:0,treat:0,resets:0,resourceHours:0};
    const wallHours=(end-start)/3_600_000;
    const resets=countFuturePacificResets(start,end);
    const resourceHours=wallHours+(2*resets);
"""
          if old not in s: raise SystemExit('header pattern not found')
          s=s.replace(old,new,1)
          old2="""    // Stamina regenerates from real elapsed time; daily 2h idle boosts do not create Stamina.
    const staminaGenerated=Math.max(0,Math.floor(Math.max(0,Number(staminaCarry)||0)+(wallHours*5)));
    const staminaNodes=Math.floor(staminaGenerated/Math.max(1,Number(yields.staminaPerNode)||5));
"""
          new2="""    // Stamina regenerates from real elapsed time only. Split it by cumulative wall-clock totals
    // so pre-target + post-target nodes exactly equal the full-season node count (no lost node at the split).
    const staminaPerNode=Math.max(1,Number(yields.staminaPerNode)||5);
    const regenPerHour=5;
    const preWallHours=Math.max(0,(start-now)/3_600_000);
    const fullWallHours=Math.max(0,(end-now)/3_600_000);
    const preGenerated=Math.max(0,Math.floor(preWallHours*regenPerHour));
    const fullGenerated=Math.max(0,Math.floor(fullWallHours*regenPerHour));
    const preNodes=Math.floor(preGenerated/staminaPerNode);
    const fullNodes=Math.floor(fullGenerated/staminaPerNode);
    const staminaNodes=Math.max(0,fullNodes-preNodes);
"""
          if old2 not in s: raise SystemExit('stamina pattern not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Verify runtime JavaScript syntax
        run: node --check assets/runtime.js
      - name: Verify split math patch
        run: |
          grep -q "fullNodes-preNodes" assets/runtime.js
          grep -q "const resourceHours=wallHours+(2\*resets)" assets/runtime.js
      - name: Commit verified site changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898258+github-actions[bot]@users.noreply.github.com"
          git add assets/runtime.js
          git diff --cached --quiet || git commit -m "Fix post-target stamina split rounding"
          git push
