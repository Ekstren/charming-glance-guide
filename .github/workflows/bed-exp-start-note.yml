name: Bed EXP reserve start note

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bed-exp-start-note.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add conditional Bed EXP start note
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          if 'bedReserveStartNote' not in s:
              pattern=re.compile(r'(<label\b[^>]*>(?:(?!</label>).)*?Hold Bed EXP for Season 2(?:(?!</label>).)*?)(</label>)', re.S|re.I)
              m=pattern.search(s)
              if not m:
                  raise SystemExit('Hold Bed EXP label not found')
              note='<small class="bedReserveStartNote">Start holding by <b>Aug 28, 6:00 PM PDT</b> to bank the full <b>36 hours</b> of Bed EXP for Season 2.</small>'
              s=s[:m.start()]+m.group(1)+note+m.group(2)+s[m.end():]

          if '<style id="bed-exp-start-note">' not in s:
              css='''\n<style id="bed-exp-start-note">\n.bedReserveStartNote{display:block;margin:5px 0 0 24px;color:var(--status-info,var(--secondary-text));font-size:9.5px;line-height:1.4;font-weight:650;letter-spacing:0;text-transform:none}\n.bedReserveStartNote b{color:var(--status-info,var(--blue));font-weight:850}\ninput[type="checkbox"]:not(:checked)~.bedReserveStartNote{display:none}\n</style>\n'''
              s=s.replace('</head>',css+'</head>',1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          if not scripts: raise SystemExit('No inline scripts found')
          Path('/tmp/sxs.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/sxs.js
      - name: Commit and self-clean
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/bed-exp-start-note.yml
          git add index.html
          git commit -m 'Show Bed EXP banking start time when enabled'
          git push origin main
