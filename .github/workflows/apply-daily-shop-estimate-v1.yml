name: Apply Daily Shop estimate

on:
  push:
    paths:
      - '.github/workflows/apply-daily-shop-estimate-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply Daily Shop material estimate
        run: python .github/patch-daily-shop-estimate-v1.py
      - name: Verify Daily Shop model
        run: |
          grep -q 'DAILY_SHOP_ESTIMATE_V1' index.html
          grep -q 'shopRefreshesDaily:3' index.html
          grep -q 'DAILY_SHOP_MATS_PER_REFRESH' index.html
          grep -q 'shopEstimate.total.ore' index.html
          grep -q 'current day excluded to avoid double-counting live Saved mats' index.html
      - name: Commit generated index
        run: |
          if git diff --quiet -- index.html; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add S2 Daily Shop material estimate'
          git push
