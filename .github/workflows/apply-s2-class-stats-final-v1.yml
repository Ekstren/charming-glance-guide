name: Final S2 class stat audit

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_s2_class_stats_final_v1.py'
      - '.github/workflows/apply-s2-class-stats-final-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final S2 class stat audit
        run: python scripts/patch_s2_class_stats_final_v1.py
      - name: Verify audited profiles
        shell: bash
        run: |
          grep -q "PvE: Crit Rate + Crit DMG > Crit Rate + Accuracy" index.html
          grep -q "Helmet','DEF ≥ Physical RES = Elemental RES > HP > Effect RES" index.html
          grep -q "Staff','Elemental Mastery > Crit > ATK > SPD > Effect Hit Rate" index.html
          grep -q "ATK/ATK% are only average affixes" index.html
          grep -q "Effect Hit Rate is only average as a healer reroll affix" index.html
          grep -q "Staff','Elemental Mastery > Crit > ATK > SPD > Effect Hit Rate" scripts/patch_restore_rich_builds_v1.py
      - name: Commit generated update
        shell: bash
        run: |
          if git diff --quiet -- index.html scripts/patch_restore_rich_builds_v1.py; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html scripts/patch_restore_rich_builds_v1.py
          git commit -m 'Finalize Season 2 class stat priorities'
          git push origin HEAD:main
