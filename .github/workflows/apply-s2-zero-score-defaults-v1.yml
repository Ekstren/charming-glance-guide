name: Apply zero-score S2 defaults

on:
  push:
    paths:
      - '.github/workflows/apply-s2-zero-score-defaults-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply zero-score starter defaults
        run: python .github/patch-s2-zero-score-defaults-v1.py
      - name: Verify
        run: |
          grep -q 'S2_ZERO_SCORE_DEFAULTS_V1' index.html
          grep -q 'skillLevel:130,relicLevel:13,fantomonLevel:130' index.html
          grep -q 'assumed progression contributes 0 Season Power' index.html
          grep -q 'validateS2ScoringStartDefaults' index.html
          grep -q "s2:{key:'s2'.*scoreFloor:130,relicFloor:13" index.html
      - name: Commit generated calculator
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Make S2 starter progression score neutral'
          git push
