name: S2 breakpoint shortcuts full v2

on:
  push:
    paths:
      - '.github/workflows/patch-s2-breakpoints-full-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply full S2 breakpoint shortcuts
        run: python scripts/patch_s2_breakpoints_full_v2.py
      - name: Verify breakpoint set
        run: |
          grep -q 'data-s2-target="740">740 <span>ASC</span>' index.html
          grep -q 'data-s2-target="860">860 <span>2X</span>' index.html
          grep -q 'data-s2-target="1130">1130 <span>2X</span>' index.html
          grep -q 'data-s2-target="1280">1280 <span>ASC</span>' index.html
      - name: Commit verified site changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Expand S2 breakpoint shortcuts"
            git push
          fi
