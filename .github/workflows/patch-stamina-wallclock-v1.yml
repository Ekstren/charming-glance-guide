name: Fix stamina wall-clock projection

on:
  push:
    paths:
      - .github/workflows/patch-stamina-wallclock-v1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply stamina projection patch
        run: python3 scripts/patch_stamina_wallclock_v1.py
      - name: Verify runtime JavaScript syntax
        run: node --check assets/runtime.js
      - name: Verify stamina wall-clock logic
        run: |
          grep -q 'Math.floor(wallResourceHours\*5)' assets/runtime.js
          grep -q 'carry.staminaUnused' assets/runtime.js
      - name: Commit verified site changes
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898258+github-actions[bot]@users.noreply.github.com'
          git add assets/runtime.js
          git commit -m 'Fix stamina projection to use wall-clock time'
          git push origin HEAD:main
