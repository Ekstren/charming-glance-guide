name: Snapshot mined SxS game data

# DATA_REFRESH_2026_09_11_V1: refresh the normalized factual snapshot before the calculator accuracy audit.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/snapshot_mined_game_data.py'
      - 'scripts/augment_mined_game_data.py'
      - '.github/workflows/snapshot-mined-game-data.yml'

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout guide
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone public datamine-backed sources
        run: |
          git clone --depth 1 https://github.com/0xNobodyYT/0xNobodyYT.github.io.git /tmp/0xnobody
          git clone --depth 1 https://github.com/Mystonats/sxs_skills.git /tmp/mystonats

      - name: Build normalized game-data snapshot
        run: |
          python3 scripts/snapshot_mined_game_data.py \
            --upstream /tmp/0xnobody \
            --mystonats /tmp/mystonats \
            --output data/mined
          python3 scripts/augment_mined_game_data.py \
            --upstream /tmp/0xnobody \
            --output data/mined

      - name: Validate snapshot and site runtime
        run: |
          test -s data/mined/manifest.json
          test -s data/mined/0xnobody/sxs-loadout-builder/combat-data.json
          test -s data/mined/0xnobody/sxs-loadout-builder/data.json
          test -s data/mined/0xnobody/sxs-loadout-builder/fantomons.json
          test -s data/mined/0xnobody/sxs-primo-calculator/server-data.json
          test -s data/mined/0xnobody/sxs-companions/data.json
          test -s data/mined/0xnobody/sxs-stellaris/data.json
          test -s data/mined/0xnobody/wardrobe-assets/catalog.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/mined/manifest.json')
          m=json.loads(p.read_text())
          assert m['outputs'], 'no mined outputs produced'
          skipped={x.get('source') for x in m.get('skipped', [])}
          assert 'sxs-loadout-builder/fantomons.js' not in skipped
          assert 'sxs-primo-calculator/server-data.js' not in skipped
          print('datasets:', len(m['outputs']))
          print('remaining skipped:', sorted(skipped))
          print('source commits:', {k:v['commit'] for k,v in m['sources'].items()})
          PY
          node --check assets/runtime.js

      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mined
          if git diff --cached --quiet; then
            echo "No mined-data changes."
            exit 0
          fi
          git commit -m "Snapshot mined Sword x Staff game data"
          git push
