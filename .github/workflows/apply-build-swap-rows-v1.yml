name: Apply compact build swap rows

on:
  push:
    branches: [main]
    paths:
      - '.github/build-swap-rows.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply compact Technique and Charm swap rows
        run: python .github/patch-build-swap-rows-v1.py
      - name: Validate diff
        run: |
          git diff --check
          ! grep -q "<b>Offensive:</b>" .github/build-fantomons-inject.html
          ! grep -q "<b>Defensive:</b>" .github/build-fantomons-inject.html
          grep -q "Technique Swap:" .github/build-fantomons-inject.html
          grep -q "Charm Swap:" .github/build-fantomons-inject.html
          grep -q "Need cleanse + damage buff" .github/build-fantomons-inject.html
          grep -q "Taking too much burst" .github/build-fantomons-inject.html
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium
      - name: Run full site browser smoke
        run: node scripts/site_smoke_test.mjs
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/build-fantomons-inject.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Replace build notes with compact swap guidance"
          git push origin HEAD:main
