name: Apply scarcity-adjusted acquisition v1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_scarcity_adjusted_acquisition_v1.py'
      - 'scripts/scarcity_adjusted_acquisition_smoke_v1.mjs'
      - '.github/workflows/apply-scarcity-adjusted-acquisition-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply scarcity-adjusted acquisition patch
        run: python3 scripts/apply_scarcity_adjusted_acquisition_v1.py

      - name: Verify optimizer rules
        run: |
          grep -Fq 'SCARCITY_ADJUSTED_ACQUISITION_V1' index.html
          grep -Fq 'ore:0.25,essence:0.25,sand:0.25,treat:0.00' index.html
          grep -Fq "ore:marginalWeightedSpend(costs?.ore,'ore',resources)" index.html
          grep -Fq "ore:plannedToolAcquisitionSupply('ore',resources,cfg)" index.html
          grep -Fq 'const nonOreRawFunded=false;' index.html
          grep -Fq 'scarcity-adjusted acquisition efficiency' index.html

      - name: Validate inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          out=Path('/tmp/inline-js');out.mkdir(exist_ok=True)
          for i,body in enumerate(scripts):
              (out/f'{i}.js').write_text(body,encoding='utf-8')
          print(f'extracted {len(scripts)} inline scripts')
          PY
          for f in /tmp/inline-js/*.js; do node --check "$f"; done

      - name: Install browser smoke dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Run scarcity regression smoke
        run: node scripts/scarcity_adjusted_acquisition_smoke_v1.mjs

      - name: Run Smart Balance goal-stop smoke
        run: node scripts/smart_balance_goal_stop_smoke_v2.mjs

      - name: Run full site browser smoke
        run: node scripts/site_smoke_test.mjs

      - name: Commit and push
        run: |
          if git diff --quiet -- index.html; then
            echo 'Scarcity-adjusted acquisition is already current.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Use scarcity-adjusted acquisition economics'
            git push
          fi
