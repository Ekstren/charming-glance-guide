name: Mobile polish v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-polish-v1.yml'
      - 'scripts/apply_mobile_polish_v1.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply mobile polish
        run: |
          python3 scripts/apply_mobile_polish_v1.py
          node --check scripts/mobile_audit_v1.mjs
      - name: Commit mobile pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Ekstren@users.noreply.github.com'
          git add assets/site.css scripts/mobile_audit_v1.mjs .github/workflows/site-ci.yml
          git commit -m 'Polish mobile layout and touch targets'
          git push
