name: Make top resources target-time snapshot v2
on:
  push:
    paths:
      - '.github/workflows/patch-target-snapshot-split-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch runtime
        run: |
          echo ' xKS5yZXBsYWNlKCJ4KSIsIjEsMSkiKQo=' | base64 -d > /tmp/placeholder.py
          rm /tmp/placeholder.py
          python - <<'PY'
          import base64
          from pathlib import Path
          data = '''PLACEHOLDER'''
          PY
      - name: Apply encoded patch
        run: |
          echo 'REPLACE_B64' | base64 -d | python
      - name: Verify runtime JavaScript syntax
        run: node --check assets/runtime.js
      - name: Verify target split behavior hooks
        run: |
          grep -q "function renderTargetResourceSnapshot" assets/runtime.js
          grep -q "Projected to target:" assets/runtime.js
          grep -q "renderTargetResourceSnapshot(postTargetLastReachMs,plan,p,cfg)" assets/runtime.js
          grep -q "resourceSnapshot:resources" assets/runtime.js
      - name: Commit verified site changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898258+github-actions[bot]@users.noreply.github.com"
          git add assets/runtime.js
          git diff --cached --quiet || git commit -m "Split target-time resources from post-target totals"
          git push
