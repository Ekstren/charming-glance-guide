name: Fix Acme Nexus Day 71 Sep 9

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_acme_nexus_day71_sep9_v1.py'
      - '.github/workflows/fix-acme-nexus-day71-sep9-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Acme Nexus correction
        run: python3 scripts/fix_acme_nexus_day71_sep9_v1.py

      - name: Validate corrected timeline row
        run: |
          grep -Fq 'ACME_NEXUS_DAY71_CORRECTION_SEP9_V1' index.html
          grep -Fq "['2026-09-23',71,'Seasonal Map','Acme Nexus'" index.html
          ! grep -Fq "['2026-09-13',61,'Seasonal Map','Acme Nexus'" index.html
          grep -Fq 'TIMELINE_SUMMARY_ONLY_V1' index.html
          ! grep -Fq '<details class="entryMore"' index.html

      - name: Validate timeline duplicates
        run: |
          if [ -f scripts/check_timeline_duplicates.py ]; then
            python3 scripts/check_timeline_duplicates.py index.html
          fi

      - name: Validate inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          out=Path('/tmp/inline-js'); out.mkdir(exist_ok=True)
          for i,body in enumerate(scripts): (out/f'{i}.js').write_text(body,encoding='utf-8')
          print(f'extracted {len(scripts)} inline scripts')
          PY
          for f in /tmp/inline-js/*.js; do node --check "$f"; done

      - name: Install browser smoke dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Run full site browser smoke
        run: node scripts/site_smoke_test.mjs

      - name: Commit and push
        run: |
          if git diff --quiet -- index.html; then
            echo 'Acme Nexus timing is already current.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Move Acme Nexus to Server Day 71'
            git pull --rebase origin main
            git push origin main
          fi
