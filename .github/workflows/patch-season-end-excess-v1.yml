name: Season-end excess display v1
on:
  push:
    paths:
      - '.github/workflows/patch-season-end-excess-v1.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply season-end excess display patch
        run: python scripts/patch_season_end_excess_v1.py
      - name: Verify runtime JavaScript syntax
        run: node --check assets/runtime.js
      - name: Verify UI hooks
        run: |
          grep -q 'id="seasonEndExcessStars"' index.html
          grep -q 'id="seasonEndExcessScore"' index.html
          grep -q 'id="seasonEndExcessNote"' index.html
          grep -q 'SEASON_END_EXCESS_V1' assets/runtime.js
          grep -q 'SEASON_END_EXCESS_V1' assets/site.css
      - name: Commit verified site changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898258+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/runtime.js assets/site.css
          git diff --cached --quiet || git commit -m "Show season-end excess score and Primostars"
          git push
