name: Confirm Charming Glance S2
on:
  push:
    paths:
      - .github/workflows/fix-active-now-details.yml
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Confirm Charming Glance S2 timing
        env:
          PATCH_B64: 
        run: |
          echo "$PATCH_B64" | base64 -d >/tmp/patch.py
          python3 /tmp/patch.py
      - name: Validate inline JavaScript
        run: |
          python3 -c "from pathlib import Path; import re; s=Path('index.html').read_text(); Path('/tmp/inline.js').write_text('\n;\n'.join(re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',s,re.S|re.I)))"
          node --check /tmp/inline.js
      - name: Commit update and remove temporary workflows
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/fix-active-now-details.yml .github/workflows/confirm-charming-glance-s2.yml
          git add index.html
          git commit -m "Confirm Charming Glance Season 2 reset"
          git push
