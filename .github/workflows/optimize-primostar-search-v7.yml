name: Optimize Primostar search v7

on:
  push:
    branches: [main]
    paths:
      - 'scripts/optimize_primostar_search_v7.py'
      - '.github/workflows/optimize-primostar-search-v7.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install browser dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Benchmark before
        shell: bash
        run: |
          set -o pipefail
          node scripts/optimizer_perf_benchmark_v1.mjs | tee /tmp/optimizer-before-v7.log

      - name: Apply optimizer v7
        run: python3 scripts/optimize_primostar_search_v7.py

      - name: Validate optimizer markers
        run: |
          grep -Fq 'REFINED_FASTPATH_GUARD_V3' index.html
          grep -Fq 'JOINT_HOURS_NO_CLOSURE_V2' index.html
          grep -Fq 'MONOTONE_BOUND_BINARY_PRUNE_V2' index.html
          grep -Fq 'SKILL_GEAR_BREAKPOINT_JUMP_V4' index.html

      - name: Validate timeline duplicates
        run: python3 scripts/check_timeline_duplicates.py index.html

      - name: Validate inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          out=Path('/tmp/inline-js'); out.mkdir(exist_ok=True)
          for i,body in enumerate(scripts): (out/f'{i}.js').write_text(body,encoding='utf-8')
          print(f'extracted {len(scripts)} inline scripts')
          PY
          for f in /tmp/inline-js/*.js; do node --check "$f"; done

      - name: Guard exact results and benchmark after
        env:
          EXPECT_BASELINE_FINGERPRINTS: '1'
        shell: bash
        run: |
          set -o pipefail
          node scripts/optimizer_perf_benchmark_v1.mjs | tee /tmp/optimizer-after-v7.log

      - name: Run calculator performance regression
        run: node scripts/calculator_perf_check.mjs

      - name: Run full site browser smoke
        run: node scripts/site_smoke_test.mjs

      - name: Print benchmark comparison
        run: |
          echo '--- BEFORE V7 ---'
          cat /tmp/optimizer-before-v7.log
          echo '--- AFTER V7 ---'
          cat /tmp/optimizer-after-v7.log

      - name: Commit and push
        run: |
          if git diff --quiet -- index.html; then
            echo 'Optimizer v7 already applied.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Jump Primostar Skill Gear breakpoints'
            git pull --rebase origin main
            git push origin main
          fi
