name: Apply compact progression layout

on:
  push:
    paths:
      - '.github/patch-compact-progression.py'
      - '.github/workflows/apply-compact-progression.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/patch-compact-progression.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('index.html').read_text()
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          for i,b in enumerate(blocks):
              with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False) as f:
                  f.write(b); name=f.name
              subprocess.run(['node','--check',name],check=True)
          print(f'validated {len(blocks)} inline script blocks')
          PY
      - name: Verify compact merge
        run: |
          grep -q 'COMPACT_PROGRESSION_TOP_V1' index.html
          ! grep -q 'id="gearLockButton"' index.html
          ! grep -q 'id="currentLevelsDetails"' index.html
          grep -q 'id="materialsDetails"' index.html
          grep -q 'id="skillLevel"' index.html
          grep -q 'id="gearWeapon"' index.html
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Merge progression inputs into top calculator card'
          git push
