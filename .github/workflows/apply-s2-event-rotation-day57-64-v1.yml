name: Apply S2 Day 57/64 event rotations

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_s2_event_rotation_day57_64_v1.py'
      - '.github/workflows/apply-s2-event-rotation-day57-64-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply timeline patch
        run: python3 scripts/patch_s2_event_rotation_day57_64_v1.py

      - name: Validate inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          out=Path('/tmp/inline-js')
          out.mkdir(exist_ok=True)
          for i,body in enumerate(scripts):
              (out/f'{i}.js').write_text(body,encoding='utf-8')
          print(f'extracted {len(scripts)} inline scripts')
          PY
          for f in /tmp/inline-js/*.js; do node --check "$f"; done

      - name: Verify intended timeline changes
        run: |
          grep -Fq "['2026-09-09',57,'Event','Treasure Hunt 8 + Bingo Draw 3'" index.html
          grep -Fq "['2026-09-16',64,'Event','Treasure Hunt 9 + Lucky Scratch 3'" index.html
          grep -Fq 'Primal Gem as the highlighted relic reward' index.html
          grep -Fq 'Miracle Relic Box choice' index.html

      - name: Install browser smoke dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Run site browser smoke
        run: node scripts/site_smoke_test.mjs

      - name: Commit and push
        run: |
          if git diff --quiet -- index.html; then
            echo 'S2 event rotation rows are already current.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Add projected S2 recurring event rotations'
            git push
          fi
