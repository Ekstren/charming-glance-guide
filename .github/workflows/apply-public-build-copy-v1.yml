name: Apply public build copy cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/public-build-copy.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply final build copy cleanup
        run: python .github/patch-public-build-copy-final-v1.py
      - name: Validate diff
        run: |
          git diff --check
          grep -q "Frigid Aura','Frigid Glint','Iron Fortress','Oath of Vigil" .github/build-fantomons-inject.html
          ! grep -qi "shell" .github/build-fantomons-inject.html
          ! grep -qi "synthesis" .github/build-fantomons-inject.html
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/build-fantomons-inject.html scripts .github/*.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Finish player-facing build copy cleanup"
          git push origin HEAD:main
