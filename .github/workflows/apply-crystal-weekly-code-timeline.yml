name: Apply CRYSTAL weekly code timeline

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_crystal_weekly_code_timeline.py'
      - '.github/workflows/apply-crystal-weekly-code-timeline.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply CRYSTAL timeline row
        run: python3 scripts/apply_crystal_weekly_code_timeline.py

      - name: Validate CRYSTAL row
        run: |
          grep -Fq "'Gift code · CRYSTAL'" index.html
          grep -Fq '300 Raw Ore + 1 Stellatie' index.html
          grep -Fq "'2026-09-15'" index.html

      - name: Validate timeline duplicates
        run: python3 scripts/check_timeline_duplicates.py index.html

      - name: Validate inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          out=Path('/tmp/inline-js')
          out.mkdir(exist_ok=True)
          for i,body in enumerate(scripts):
              (out/f'{i}.js').write_text(body,encoding='utf-8')
          print(f'extracted {len(scripts)} inline scripts')
          PY
          for f in /tmp/inline-js/*.js; do node --check "$f"; done

      - name: Install browser smoke dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Run full site browser smoke
        run: node scripts/site_smoke_test.mjs

      - name: Commit and push
        run: |
          if git diff --quiet -- index.html; then
            echo 'CRYSTAL timeline row is already current.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Add CRYSTAL weekly gift code to timeline'
            git pull --rebase origin main
            git push origin main
          fi
