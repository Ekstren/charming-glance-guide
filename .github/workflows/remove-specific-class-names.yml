name: Remove class-specific timeline wording

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-specific-class-names.yml'
      - '.github/scripts/remove_specific_class_names.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove class-specific wording
        run: python .github/scripts/remove_specific_class_names.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, re.S|re.I)
          Path('/tmp/site.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/site.js
      - name: Commit change
        run: |
          if git diff --quiet -- index.html; then
            echo "No change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make T4 advancement timeline class-neutral"
          git push origin main
# trigger
