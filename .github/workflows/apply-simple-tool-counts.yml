name: Apply simple Realm tool counts

on:
  push:
    paths:
      - '.github/patch-simple-tool-counts.py'
      - '.github/workflows/apply-simple-tool-counts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply simple tool counts
        run: python .github/patch-simple-tool-counts.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          if not scripts:
              raise SystemExit('no inline script found')
          Path('/tmp/site-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/site-inline.js
      - name: Verify simple tool display
        run: |
          grep -q 'SIMPLE_TOOL_COUNTS_V11' index.html
          grep -q 'Used:' index.html
          grep -q 'Remaining:' index.html
          grep -q 'reserved)' index.html
      - name: Commit site update
        run: |
          if git diff --quiet -- index.html; then
            echo 'No site change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Simplify Realm tool counts'
          git push origin main
