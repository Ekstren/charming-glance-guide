name: Apply partial-shortfall remaining display

on:
  push:
    paths:
      - '.github/patch-show-remaining-on-partial-shortfall.py'
      - '.github/workflows/apply-partial-shortfall-remaining.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply partial-shortfall remaining display
        run: python .github/patch-show-remaining-on-partial-shortfall.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          if not scripts:
              raise SystemExit('no inline script found')
          Path('/tmp/site-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/site-inline.js
      - name: Verify partial-shortfall display
        run: |
          grep -q 'PARTIAL_SHORTFALL_SHOW_REMAINING_V1' index.html
          grep -q "else setEssenceBalance('essenceBalance'" index.html
          grep -q "else setSandBalance('sandBalance'" index.html
          grep -q "else setRawRemaining('oreBalance'" index.html
      - name: Commit site update
        run: |
          if git diff --quiet -- index.html; then
            echo 'No site change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Show remaining resources on partial shortfalls'
          git push origin main
