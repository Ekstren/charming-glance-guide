name: Apply S2 scoring input floor correction

on:
  push:
    paths:
      - '.github/workflows/apply-s2-scoring-start-input-floor-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Correct S2 scoring input floors
        run: python .github/patch-s2-scoring-start-input-floor-v2.py
      - name: Verify
        run: |
          grep -q 'S2_SCORING_INPUT_FLOOR_V2' index.html
          grep -q "const normalInputFloor=100;" index.html
          grep -q "const relicInputFloor=10;" index.html
          grep -q "characterSnapshot(cfg).level<cfg.scoreFloor" index.html
          grep -q 'lagging slots are allowed and their future catch-up costs are counted' index.html
          grep -q 'targetStars:800' index.html
          grep -q 'charLevel:130' index.html
          grep -q 'scoreFloor:130,relicFloor:13,starBase:45,scorePerStar:27' index.html
          grep -q 'expectedTotalStars:920' index.html
          ! grep -q "skillLevel').min=String(cfg.scoreFloor)" index.html
      - name: Commit generated calculator
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Allow real S2 scoring-start progression inputs'
          git push
