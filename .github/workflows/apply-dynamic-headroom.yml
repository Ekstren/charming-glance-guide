name: Apply dynamic resource headroom

on:
  push:
    branches: [main]
    paths:
      - '.github/patch-dynamic-headroom.py'
      - '.github/workflows/apply-dynamic-headroom.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply dynamic headroom patch
        run: python .github/patch-dynamic-headroom.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          for i,s in enumerate(scripts):
              if s.strip(): Path(f'/tmp/inline-{i}.js').write_text(s,encoding='utf-8')
          print(len(scripts))
          PY
          for f in /tmp/inline-*.js; do node --check "$f"; done
      - name: Check diff
        run: git diff --check
      - name: Verify dynamic weighting
        run: |
          grep -q 'DYNAMIC_HEADROOM_WEIGHTS_V1' index.html
          grep -q 'dynamicAcquisitionWeights' index.html
          grep -q 'acquisitionHeadroomCosts' index.html
          grep -q 'acquisitionSupplyEquiv' index.html
          grep -q "realmInventoryFor('essence',cfg)" index.html
          grep -q "realmInventoryFor('sand',cfg)" index.html
          ! grep -q 'const SURPLUS_ACQUISITION_WEIGHTS=' index.html
      - name: Commit dynamic headroom optimizer
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Use dynamic resource headroom weights'
          git push origin main
