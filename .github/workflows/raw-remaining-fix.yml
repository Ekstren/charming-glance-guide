name: Apply raw remaining reserve fix

on:
  push:
    paths:
      - '.github/patch-raw-remaining-v5.py'
      - '.github/workflows/raw-remaining-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply raw remaining patch
        run: python .github/patch-raw-remaining-v5.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          if not scripts:
              raise SystemExit('no inline script found')
          Path('/tmp/site-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/site-inline.js
      - name: Verify raw-only remaining marker
        run: |
          grep -q 'RAW_FIRST_RESERVE_DISPLAY_V5' index.html
          grep -q 'const rawReserved=Math.min(left,reserveTarget);' index.html
      - name: Commit update
        run: |
          if git diff --quiet -- index.html; then
            echo 'No site change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix raw remaining reserve accounting'
          git push origin main
