name: Fix confirmed S2 compact copy
on:
  push:
    paths:
      - .github/workflows/fix-confirmed-s2-compact.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch stale compact S2 wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old1="Expected S2 reset is Aug 30, but verify the in-game Telescope/countdown because QY warns server mergers can shift Loong Haven timing. Finish S1 scoring early and preserve your S2 reserves."
          new1="Aug 29 is the confirmed final prep day before Charming Glance Season 2 begins Aug 30 at the 6:00 AM PDT reset. Finish S1 scoring early and preserve your S2 reserves."
          old2="Expected Aug 30 from the common Day-47 model; QY warns mergers can shift Loong Haven entry, so verify Telescope/countdown. After rollover, update the planner before spending saved resources."
          new2="Confirmed for Charming Glance: Season 2 begins Aug 30 at the 6:00 AM PDT reset, based on the in-game season countdown. After rollover, update the planner before spending saved resources."
          if old1 not in s or old2 not in s:
              raise SystemExit('Expected stale compact strings not found; refusing blind edit')
          s=s.replace(old1,new1,1).replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html=Path('index.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I)
          for i,script in enumerate(scripts):
              if not script.strip(): continue
              fn=f'/tmp/inline-{i}.js'
              Path(fn).write_text(script)
              subprocess.run(['node','--check',fn],check=True)
          print(f'Validated {len(scripts)} inline script blocks')
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Fix confirmed S2 compact timeline copy"
          git push origin main
