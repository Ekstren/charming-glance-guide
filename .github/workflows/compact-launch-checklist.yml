name: Compact Season 2 checklist

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compact-launch-checklist.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Compact rich checklist rendering
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          summary_anchor = "    if(title==='Vegetable Fairy Part Two') return 'Expected Sep 7 from a secondary event guide; no official Global or Charming Glance confirmation yet.';"
          checklist_summary = "    if(title==='Season 2 launch checklist') return 'At S2 reset: claim rollover rewards, rank up first, push reachable statues, then spend saved Bed boosts, Stamina and Material Realm resources.';\n"
          if checklist_summary.strip() not in text:
              if summary_anchor not in text:
                  raise SystemExit('summary helper anchor not found')
              text = text.replace(summary_anchor, checklist_summary + summary_anchor, 1)

          if '<summary>Checklist</summary>' not in text:
              pattern = r"    // Rich entries contain complete markup; do not truncate their raw HTML\.\n    if\(full\.includes\('launchChecklist'\)\) return .*?;\n"
              replacement = "    // Rich entries contain complete markup. Keep them intact behind Details instead of\n    // passing raw HTML through the text truncator or leaving a long card visible by default.\n    if(full.includes('launchChecklist')){\n      const summary=timelineSummaryText(e);\n      return `<p>${summary}</p><details class=\"entryMore\"><summary>Checklist</summary><div class=\"timelineRichBody\">${full}</div></details>`;\n    }\n"
              text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit('rich checklist renderer anchor not found')

          path.write_text(text, encoding='utf-8')

      - name: Validate inline JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          if "if(title==='Season 2 launch checklist')" not in text:
              raise SystemExit('checklist summary missing')
          if '<summary>Checklist</summary>' not in text:
              raise SystemExit('checklist details wrapper missing')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          if not scripts:
              raise SystemExit('No inline scripts found')
          Path('/tmp/sxs.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/sxs.js

      - name: Commit and self-clean
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/compact-launch-checklist.yml
          git add index.html
          git commit -m 'Compact Season 2 launch checklist card'
          git push origin main
