name: One-shot Vegetables Fairy Pt. 2 timeline projection

on:
  push:
    paths:
      - '.github/workflows/one-shot-veggie-pt2-projection.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add projected Vegetables Fairy Pt. 2 launch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='Vegetables Fairy Collab Pt. 2 · projected launch'
          if marker not in s:
              row="    ['2026-09-09',57,'Event','Vegetables Fairy Collab Pt. 2 · projected launch','Projected/expected date, not a confirmed Global launch date. The mirrored official Global Discord announced Pt. 2 on Sep. 2 and confirmed collab-exclusive Visages including Spicy Chick Plush, Rose Dog Plush, Violet Kitty, Chili/Eggplant/Rose weapons, and themed headwear, but did not publish a start date. Sep. 9 is a useful projection because the original CN Pt. 2 was teased Aug. 11, 2025 and launched Aug. 18 (7 days later), while Global code VEGGIE is reported to expire Sep. 8. Re-date this row as soon as Global posts the exact event window.','event'],\n"
              anchor="    ['2026-09-12',60,'Dungeon','Warlord’s Rest'"
              i=s.find(anchor)
              if i < 0:
                  raise SystemExit('Warlord Rest anchor not found')
              s=s[:i]+row+s[i:]
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate inline JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          if not scripts:
              raise SystemExit('No inline scripts found')
          Path('/tmp/charming-inline.js').write_text('\n;\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/charming-inline.js

      - name: Confirm timeline row exists once
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          marker='Vegetables Fairy Collab Pt. 2 · projected launch'
          count=s.count(marker)
          if count != 1:
              raise SystemExit(f'Expected exactly one Pt. 2 projection row, found {count}')
          PY

      - name: Commit patch and cleanup
        shell: bash
        run: |
          rm .github/workflows/one-shot-veggie-pt2-projection.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/one-shot-veggie-pt2-projection.yml
          git commit -m 'Add Vegetables Fairy Pt. 2 timeline projection'
          git pull --rebase origin main
          git push origin HEAD:main