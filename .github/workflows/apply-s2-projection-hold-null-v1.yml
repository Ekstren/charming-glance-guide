name: Apply S2 projection Bed hold null fix

on:
  push:
    paths:
      - 'scripts/patch_s2_projection_hold_null_v1.py'
      - '.github/workflows/apply-s2-projection-hold-null-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply S2 projection fix
        run: python scripts/patch_s2_projection_hold_null_v1.py
      - name: Verify removed hold control is null-safe
        run: |
          grep -Fq "const reserve=\$('holdExp')?.checked?clamp(n('reserveHours',34),0,36):0;" index.html
          ! grep -Fq "const reserve=\$('holdExp').checked?clamp(n('reserveHours',34),0,36):0;" index.html
      - name: Commit generated index
        run: |
          git config user.name 'ekstren'
          git config user.email '38091958+Ekstren@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix S2 calculator projection after Bed hold removal'
          git push
