name: Sync build fallback structure
on:
  push:
    paths:
      - .github/workflows/sync-build-fallback-structure.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch fallback build cards
        run: python .github/patch-build-fallback-structure.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('index.html').read_text()
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          for i,b in enumerate(blocks):
              if not b.strip(): continue
              f=Path(tempfile.gettempdir())/f'inline-{i}.js'
              f.write_text(b)
              subprocess.run(['node','--check',str(f)],check=True)
          print(f'validated {len(blocks)} inline script blocks')
          PY
      - name: Commit completed change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No index change required.'
          else
            git commit -m 'Align fallback T4 build cards with maintenance policy'
            git push origin main
          fi
# retry after patch matcher fix
