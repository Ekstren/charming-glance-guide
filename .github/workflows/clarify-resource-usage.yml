name: Clarify calculator resource usage

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clarify-resource-usage.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Clarify resource usage cards
        env:
          PATCH_B64:  mFyKC0tbGluZSkpO2JhY2tncm91bmQ6Y29sb3ItbWl4KGluIHNyZ2IsdmFyKC0tc3RhdHVzLW5lZ2F0aXZlKSAxMSUsd    ...
        run: |
          echo "$PATCH_B64" | tr -d ' ' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          if not scripts: raise SystemExit('No inline scripts found')
          Path('/tmp/sxs.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/sxs.js
      - name: Verify changes
        run: |
          grep -q 'GOAL_ACHIEVABILITY_CLEANUP_V2' index.html
          grep -q 'planCosts>span>b::after' index.html
          grep -q 'toolSeparator' index.html
          grep -q "classList.add('warning','danger')" index.html
      - name: Commit and self-clean
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/clarify-resource-usage.yml
          git add index.html
          git commit -m 'Clarify resource usage and tool balances'
          git push origin main
