name: Apply S2 Primostar breakpoints

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_s2_primo_breakpoints_v1.py'
      - '.github/workflows/apply-s2-primo-breakpoints-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply S2 breakpoint shortcuts
        run: python3 scripts/patch_s2_primo_breakpoints_v1.py

      - name: Validate breakpoint shortcuts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for n in (680,800,920,990,1060,1200,1280):
              assert f'data-s2-target="{n}">{n}</button>' in s, n
          for old in ('680 · Basic','800 · F2P/Light','920 · Light/Mid','1060 · Stop'):
              assert old not in s, old
          print('S2 numeric-only breakpoint shortcuts validated')
          PY

      - name: Validate timeline duplicates
        run: python3 scripts/check_timeline_duplicates.py index.html

      - name: Validate inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          out=Path('/tmp/inline-js')
          out.mkdir(exist_ok=True)
          for i,body in enumerate(scripts):
              (out/f'{i}.js').write_text(body,encoding='utf-8')
          print(f'extracted {len(scripts)} inline scripts')
          PY
          for f in /tmp/inline-js/*.js; do node --check "$f"; done

      - name: Install browser smoke dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Run full site browser smoke
        run: node scripts/site_smoke_test.mjs

      - name: Commit and push
        run: |
          if git diff --quiet -- index.html; then
            echo 'S2 Primostar breakpoints are already current.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Add S2 Primostar breakpoint shortcuts'
            git pull --rebase origin main
            git push origin main
          fi
