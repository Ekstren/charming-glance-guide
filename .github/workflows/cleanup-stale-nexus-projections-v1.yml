name: Cleanup stale Nexus projections

on:
  push:
    branches: [main]
    paths:
      - 'scripts/cleanup_stale_nexus_projection_rows_v1.py'
      - '.github/workflows/cleanup-stale-nexus-projections-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove stale projected tournament rows
        run: python3 scripts/cleanup_stale_nexus_projection_rows_v1.py

      - name: Validate inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          out=Path('/tmp/inline-js')
          out.mkdir(exist_ok=True)
          for i,body in enumerate(scripts):
              (out/f'{i}.js').write_text(body,encoding='utf-8')
          print(f'extracted {len(scripts)} inline scripts')
          PY
          for f in /tmp/inline-js/*.js; do node --check "$f"; done

      - name: Verify intended tournament cleanup
        run: |
          ! grep -Fq "First S2 Server Tournament · Nexus qualifier" index.html
          ! grep -Fq "First S2 Nexus Tournament" index.html
          grep -Fq "['2026-09-12',60,'Event','Nexus Tournament · 4v4'" index.html
          grep -Fq "['2026-09-05',53,'Event','Server Tournament'" index.html

      - name: Install browser smoke dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Run site browser smoke
        run: node scripts/site_smoke_test.mjs

      - name: Commit and push
        run: |
          if git diff --quiet -- index.html; then
            echo 'Timeline already clean.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Remove stale projected Nexus tournament rows'
            git push
          fi
