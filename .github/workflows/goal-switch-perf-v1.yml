name: Goal switch perf v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/goal-switch-perf-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install browser dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Benchmark before
        run: node scripts/goal_switch_perf_v1.mjs | tee /tmp/goal-before.log
      - name: Apply optimization
        run: |
          python3 scripts/patch_goal_switch_perf_v1.py
          node --check assets/runtime.js
      - name: Benchmark after
        run: node scripts/goal_switch_perf_v1.mjs | tee /tmp/goal-after.log
      - name: Validate performance and behavior
        run: |
          python3 - <<'PY'
          import json
          def load(path):
              line=next(x for x in open(path,encoding='utf-8') if x.startswith('GOAL_SWITCH_PERF='))
              return json.loads(line.split('=',1)[1])
          before=load('/tmp/goal-before.log'); after=load('/tmp/goal-after.log')
          b=before['rows']; a=after['rows']
          print('BEFORE',b)
          print('AFTER ',a)
          repeat=a[-2:]
          assert max(x['solve'] for x in repeat) < 120, repeat
          assert after['floor']['projected'].startswith('Lv.130'), after['floor']
          assert 'paused' in after['floor']['summary'].lower(), after['floor']
          assert after['floor']['lastSolve']=='0.0', after['floor']
          before_first=sum(x['solve'] for x in b[:4])/4
          after_first=sum(x['solve'] for x in a[:4])/4
          print(f'first-target avg: {before_first:.1f} -> {after_first:.1f} ms')
          assert after_first <= before_first*1.08, (before_first,after_first)
          PY
      - name: Full regressions
        run: |
          python3 scripts/check_timeline_duplicates.py index.html
          node scripts/calculator_perf_check.mjs
          node scripts/build_swap_smoke.mjs
          node scripts/site_smoke_test.mjs
          node scripts/mobile_audit_v1.mjs
      - name: Commit optimized calculator
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Ekstren@users.noreply.github.com'
          git add assets/runtime.js index.html
          git commit -m 'Speed up Primostar goal changes on mobile'
          git pull --rebase origin main
          git push

# v5: final cache + projected-Lv130 zero-solve validation.
