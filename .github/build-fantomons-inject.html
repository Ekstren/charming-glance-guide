/* META_BUILD_MODES_V1 */
.builds .buildRoleTabs{display:none!important}
.buildCard .fantomonPair{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.buildCard .fantomonPair>span{color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:7px;font-size:9px;font-weight:850;display:block}
.buildCard .fantomonPairNote{color:var(--muted);font-size:8px;line-height:1.35;margin:-2px 0 7px}
.buildCard .fantomonRankList{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.buildCard .fantomonPick{border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 88%,var(--accent-strong) 12%);border-radius:9px;padding:8px 9px;min-width:0}
.buildCard .fantomonPick small{color:var(--muted);display:block;font-size:8px;font-weight:850;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.buildCard .fantomonPick b{color:var(--ink);display:block;font-size:10px;line-height:1.3}
.buildCard .fantomonPick p{color:var(--muted);font-size:9px;line-height:1.35;margin:4px 0 0}
.buildCard .fantomonPick.main{border-color:color-mix(in srgb,var(--accent-strong) 48%,var(--line))}
.buildCard .roleBadge{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:2px 6px;margin-left:6px;color:var(--muted);font-size:7px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;vertical-align:2px}
@media(max-width:620px){.buildCard .fantomonRankList{grid-template-columns:1fr}}

/* META_BUILD_MODES_V1 */
/* GUARDIAN_ROLE_TOGGLE_V1 */
.builds .guardianHeadingRow{display:flex;align-items:center;gap:9px;margin-top:3px;min-width:0;flex-wrap:wrap}
.builds .guardianHeadingRow>strong{margin-top:0;flex:0 0 auto}
.builds .guardianModeTabs{display:inline-flex;align-items:center;gap:3px;margin:0;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--surface);flex:0 0 auto}
.builds .guardianModeTabs button{min-height:30px;min-width:52px;padding:4px 9px;border:0;border-radius:7px;background:transparent;color:var(--muted);cursor:pointer;font-size:10px;font-weight:850}
.builds .guardianModeTabs button:hover{color:var(--green)}
.builds .guardianModeTabs button.active{background:var(--accent-strong);color:#fff}
@media(max-width:520px){.builds .guardianHeadingRow{gap:7px}.builds .guardianModeTabs button{min-height:30px;min-width:50px}}
.builds .metaBuildControls{display:flex;align-items:center;gap:7px;margin:10px 0;padding:5px;border:1px solid var(--line);border-radius:13px;background:var(--surface)}
.builds .metaBuildTabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;flex:1;min-width:0}
.builds .metaBuildTabs button,.builds .metaTournamentTabs button{border:0;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer;font-size:10px;font-weight:850;min-height:36px;padding:8px 10px}
.builds .metaBuildTabs button.active,.builds .metaTournamentTabs button.active{background:var(--accent-strong);color:#fff}
.builds .metaTournamentTabs{display:flex;gap:4px;padding-left:7px;border-left:1px solid var(--line)}
.builds .metaTournamentTabs[hidden]{display:none!important}
.builds .buildGrid.metaModeGrid{grid-template-columns:1fr!important;margin-top:0}
.builds .buildGrid.metaModeGrid>.buildCard[hidden]{display:none!important}
@media(min-width:761px){
  .builds .buildGrid.metaModeGrid>.buildCard:not([hidden]){display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:18px;align-items:start}
  .builds .buildGrid.metaModeGrid>.buildCard:not([hidden])>header,
  .builds .buildGrid.metaModeGrid>.buildCard:not([hidden])>ul,
  .builds .buildGrid.metaModeGrid>.buildCard:not([hidden])>.fantomonPair{grid-column:1/-1}
}
@media(max-width:620px){
  .builds .metaBuildControls{display:block}
  .builds .metaBuildTabs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .builds .metaTournamentTabs{border-left:0;border-top:1px solid var(--line);padding:5px 0 0;margin-top:5px}
  .builds .metaTournamentTabs button{flex:1}
}

<script>
(function(){
  const role=(name,subtitle,techniques,charms,offensive,defensive,confidence='Guide core')=>({name,subtitle,techniques,charms,offensive,defensive,confidence});
  const pick=(name,why)=>({name,why});

  const ROLE_PRESETS={
    Berserker:[
      role('Generic PvE','Default S1 progression and general PvE',["Hunter's Judgment",'Sunset Sword','Eclipse Slash','Lion Combo'],['Insightful Eye','Blade of Judgment','Blade Siphon','Indomitable Will'],'If survival is already solved, Indomitable Will → a damage charm.','Low Crit: Blade Siphon → Blade of Lament.','Guide consensus'),
      role('Dragon','Long single-target / Dragon damage',['Flame Aura','Sunset Sword','Eclipse Slash','Lion Combo'],['Insightful Eye','Blade of Judgment','Blazing Clash','Crit Mastery'],'This is the dedicated damage setup for Dragon and similar long single-target fights.','If the boss can actually kill you, replace one greed charm with Indomitable Will.','Guide consensus'),
      role('Arena','Solo PvP burst / mobility',['Darkness Descends','Lion Combo','Eclipse Slash','Sunset Sword'],['Insightful Eye','Blade of Judgment','Frame of Battles','Indomitable Will'],'This is the published solo-PvP core: mobility, multi-hit pressure and cheat-death.','Keep Indomitable Will. Into reflect/block tanks, reduce multi-hit exposure with the Flash Dash / Heavy Impact / Doom Blade / Darkness Descends anti-tank shell.','Prydwen Arena'),
      role('Tournament','Team PvP grouping / area pressure',["Hunter's Judgment",'Flame Aura','Eclipse Slash','Sunset Sword'],['Insightful Eye','Blade of Judgment','Frame of Battles','Indomitable Will'],'Hunter’s Judgment groups targets for teammates while Flame Aura adds team-fight pressure; if your comp already controls targets, Hunter’s Judgment → Lion Combo.','Keep Indomitable Will; the team build should not greed away its survival layer.','Multi-guide team PvP')
    ],
    Paladin:[
      role('Dungeon Tank','Primary party-tank setup',['Valor Surge','Heart of Challenge','Luminous Shield','Desperate Protection'],['Iron Fortress','Block Mastery','Block Awareness','Stone Skin'],'If survival is comfortable, Luminous Shield → Lunarwater Threads for damage and pull utility.','This is the defense-first setup for difficult dungeons and also maps well to team PvP.','Guide consensus'),
      role('Water Offensive','AoE-oriented Water / counter damage',['Guardian Ring','Lunarwater Threads','Frostbite Blossom','Heart of Challenge'],['Ripple Impact','Defensive Assault','Pursuit of Victory','Insightful Eye'],'Use when you need real damage instead of maximum party protection.','If you die too easily, move back toward the Dungeon Tank shell or add Potential Rebirth.','Prydwen core'),
      role('Boss DPS / Off-Tank','Damage-oriented boss setup',['Valor Surge','Leap Attack','Heavy Impact','Star Shattering Slash'],['Strength Rules','Insightful Eye','Pursuit of Victory',"Warrior's Essence"],'Use when another tank or your gear already handles survival and the group needs more damage.','If survival becomes the limiter, use Dungeon Tank instead.','Multi-guide'),
      role('Arena','Solo reflect / block bruiser',['Luminous Shield','Leap Attack','Star Shattering Slash','Valor Surge'],['Rebound','Block Mastery','Block Awareness','Stone Skin'],'Arena is about surviving the burst window and letting Block/Rebound punish repeated hits before Star Shattering Slash comes online.','If the opponent cannot pressure you, Stone Skin can flex to a damage charm; do not sacrifice Block consistency just for sheet power.','Community Arena'),
      role('Tournament','Team protection / frontline',['Valor Surge','Heart of Challenge','Luminous Shield','Desperate Protection'],['Iron Fortress','Block Mastery','Block Awareness','Stone Skin'],'Use the full tank shell in team PvP: buff, hold aggro/control space and keep allies alive instead of chasing solo damage.','If the team is already safe, Luminous Shield can flex to Lunarwater Threads for pull pressure.','Guide-derived team PvP')
    ],
    Archmage:[
      role('AoE','Best general wave-clear and mixed-group setup',['Divine Wrath','Howling Hurricane','Meteoric Flames','Lightning Chain'],['Rapid Cast','Void Bubble','Mana Surge','Radiant Sear'],'Mana Surge can flex to Repelling Wind, Lightning Mystery, or Elemental Harmony if one tests better for your account.','Keep Void Bubble unless you completely outgear the content.','Guide consensus'),
      role('Single Target','Boss / concentrated damage',['Divine Wrath','Howling Hurricane','Meteoric Flames',"Wind's Delight"],['Rapid Cast','Void Bubble','Mana Surge','Radiant Sear'],'On smaller bosses, Divine Wrath → Tempest Sphere. The Tempest Sphere version is also the better PvP adaptation.','Keep Void Bubble unless survival is irrelevant.','Guide consensus'),
      role('Arena','Fast solo burst without Divine Wrath RNG',['Tempest Sphere','Howling Hurricane','Meteoric Flames',"Wind's Delight"],['Rapid Cast','Void Bubble','Mana Surge','Radiant Sear'],'Prydwen specifically recommends the single-target shell without Divine Wrath for PvP; Tempest Sphere is more reliable on player-sized targets.','Keep Void Bubble; Mana Surge → Repelling Wind when melee pressure is the matchup problem.','Prydwen Arena'),
      role('Tournament','Team AoE pressure',['Tempest Sphere','Howling Hurricane','Meteoric Flames','Lightning Chain'],['Rapid Cast','Void Bubble','Mana Surge','Radiant Sear'],'Tournament rewards wider coverage more than solo Arena, so keep the reliable PvP core but trade the single-target finisher for Lightning Chain.','Keep Void Bubble. Do not force Divine Wrath into small-player targeting just because it is strong on bosses.','Guide-derived team PvP')
    ],
    Arcanist:[
      role('AoE DPS','Dark Erosion for groups and mixed waves',['Mana Blast','Dark Bullet','Abyssal Hand','Shadow Impact'],['Shadow Vengeance',"Night's Blessing",'Shadow Erosion','Linked Misfortune'],'This is the standard T3 AoE Erosion package.','Effect Hit Rate matters; fix EHR before breaking the Erosion core.','Guide consensus'),
      role('Single Target DPS','Boss-focused Dark Erosion',['Mana Blast','Dark Bullet','Abyssal Hand','Shadow of Termination'],['Shadow Vengeance',"Night's Blessing",'Shadow Erosion','Linked Misfortune'],'Use for bosses and other concentrated targets.','If Erosion is unreliable, the problem is usually insufficient Effect Hit Rate.','Guide consensus'),
      role('Healing','Dungeon / group healer',['Void Blessing','Waterling Summon','Radiant Restoration','Frenzy Totem'],['Resurrection','Healing Mastery','Overhealing','Gale Shield'],'Gale Shield is the practical default flex from AllClash; replace it with encounter-specific utility when needed.','This is the dedicated healer/support setup, not a DPS variation.','Guide consensus'),
      role('Arena','Solo Dark burst / Erosion cash-out',['Mana Blast','Dark Bullet','Abyssal Hand','Shadow of Termination'],['Shadow Vengeance',"Night's Blessing",'Shadow Erosion','Linked Misfortune'],'Solo Arena favors actually killing the target: build Erosion, cash it out with Shadow of Termination and let Shadow Vengeance buy the finishing turn.','Do not default to the healer bar in solo PvP; PvP healing is reduced and needs real Healing Boost/SPD investment to justify it.','Guide-derived Arena'),
      role('Tournament','Hybrid team pressure / revive utility',['Mana Blast','Abyssal Hand','Radiant Restoration','Frenzy Totem'],['Resurrection','Shadow Vengeance','Shadow Erosion','Linked Misfortune'],'Tournament should not default to full healing: Mana Blast + Abyssal Hand provide Dark pressure, Erosion and Slow while Frenzy Totem buffs the team and Radiant Restoration gives one efficient group-heal slot.','PvP healing is heavily reduced. Only move toward the dedicated Healing card when your Healing Boost/SPD are genuinely built for it; otherwise keep Resurrection + damage/debuff utility.','Community hybrid PvP')
    ],
    Conqueror:[
      role('Dungeon','Fast-clear S2 dungeon meta',['Flash Fire','Flame Aura','Flickering Blade','Blade Storm'],['Piercing Assault','Tactical Adaptation','Soul Splash','Insightful Eye'],'High Crit: Insightful Eye → Soul Breaker. If a room is too dangerous, Soul Splash → Indomitable Will. Darkness Descends can replace Flame Aura when Dispel or extra movement matters.','Nyxarchon is the damage default; use Aegiswing only when dying is the real limiter.','Current Global meta'),
      role('Crucible / Conquest','Single-target score / raid-boss meta',['Flame Aura','Blade Storm','Flash Fire','Flickering Blade'],['Piercing Assault','Tactical Adaptation','Blazing Clash','Insightful Eye'],'At high enough Crit, Insightful Eye → Crit Mastery. This is the greedier Dragon-style score bar: no Indomitable unless survival is actually costing attempts.','Keep the four-Technique rotation intact; rank/ascension can matter more than tiny theoretical swaps.','Prydwen score core'),
      role('Arena','Solo PvP / anti-Guardian pressure',['Darkness Descends','Doom Blade','Flickering Blade','Blade Storm'],['Piercing Assault','Tactical Adaptation','Soul Breaker','Indomitable Will'],'Darkness Descends is the key Dispel/mobility slot. If you need sustain more than Doom Blade pressure, Doom Blade → Soul Piercer. Low Crit: Soul Breaker → Insightful Eye.','Accuracy is premium into high-Block Guardians. Keep Indomitable Will even when you outpower the target.','Current PvP synthesis'),
      role('Tournament · 2v2','Duo PvP: sustain + kill pressure',['Darkness Descends','Soul Piercer','Flickering Blade','Blade Storm'],['Piercing Assault','Tactical Adaptation','Soul Breaker','Indomitable Will'],'Soul Piercer gives the duo bar more self-sustain while Darkness keeps Dispel. Low Crit: Soul Breaker → Insightful Eye. If your partner already supplies enough control, Soul Piercer can flex back to Doom Blade for harder burst.','Do not greed away Indomitable in 2v2; one death is half the team.','Current Global PvP'),
      role('Tournament · 4v4','Team PvP: reach, Dispel and coordinated tempo',['Flash Fire','Darkness Descends','Flickering Blade','Blade Storm'],['Insightful Eye','Piercing Assault','Tactical Adaptation','Indomitable Will'],'High Crit: Insightful Eye → Soul Breaker. With two Conquerors, the higher-rank Gale Dance user can flex it in for the team SPD boost while the other keeps the full damage bar.','Flash Fire keeps reach in a spread-out fight; Darkness is retained for buff removal. Indomitable stays mandatory under focus fire.','Current Global PvP')
    ],
    Guardian:[
      role('Dungeon · Tank','Primary S2 party-tank meta',['Valor Surge','Heart of Challenge','Luminous Shield','Desperate Protection'],['Iron Will','Holy Aegis','Block Awareness','Soul Protection'],'Need more Taunt: Valor Surge → Hamper Strike. If the group is already safe, Desperate Protection → Swirling Blade or Star Shattering Slash for faster clears.','If the team still dies, Iron Fortress is the first extra defensive flex. Aegiswing is the default lead.','Prydwen dungeon core'),
      role('Crucible / Conquest · Tank','Carry-support / boss-score meta',['Valor Surge','Leap Attack','Holy Purification','Lunarwater Threads'],['Frigid Aura','Frigid Glint','Iron Fortress','Oath of Vigil'],'This bar exists to make the strongest carry better. If there is no buff worth dispelling, Holy Purification → damage. Lunarwater Threads → Seismic Tide for steadier Cold stacking.','Kels is the default boss-support Fantomon when Dispel/DEF Down matters; Nyxarchon is the greedier damage-amplification option.','Prydwen support core'),
      role('Arena · Tank','Solo block / reflect wall',['Luminous Shield','Forceful Charge','Star Shattering Slash','Desperate Protection'],['Rebound','Holy Aegis','Block Mastery','Soul Protection'],'If your natural Block is not high enough, Soul Protection → Block Awareness. The goal is to survive the opening burst and punish repeated hits rather than imitate a DPS class.','Aegiswing is the safest Arena lead. Against weak pressure, one defensive slot can flex to offense.','Meta reflect synthesis'),
      role('Tournament · 2v2 · Tank','Duo frontline: protect one carry and still threaten',['Hamper Strike','Heart of Challenge','Luminous Shield','Desperate Protection'],['Iron Will','Rebound','Iron Fortress','Oath of Vigil'],'Oath of Vigil is much stronger here than in Arena because there is exactly one partner to protect. Rebound gives the smaller fight real punishment while Hamper Strike + Heart control targeting.','If focus fire is overwhelming, Rebound → Soul Protection. If your partner is the tankier unit, Holy Aegis is a valid self-survival flex.','Team-PvP synthesis'),
      role('Tournament · 4v4 · Tank','Full-team tank: Taunt + ally protection',['Hamper Strike','Heart of Challenge','Luminous Shield','Desperate Protection'],['Iron Will','Soul Protection','Iron Fortress','Oath of Vigil'],'This is the maximum team-protection shell: reliable Taunt, opening effective HP, group mitigation and Oath protection on the ally most likely to be bursted.','Do not swap into the Water damage bar unless your team already has another real frontline.','Prydwen + Global PvP'),
      role('Dungeon · DPS','Water AoE / fast-clear bruiser',['Swirling Blade','Lunarwater Threads','Seismic Tide','Raging Maelstrom'],['Frigid Aura','Defensive Assault','Frigid Glint','Potential Rebirth'],'This is the published offensive Water Guardian shell: fast Cold stacking, strong AoE and enough single-target damage to stay useful on elites. If you completely outgear the room, Potential Rebirth → Pursuit of Victory or another damage charm.','Keep enough Block/DEF to stay active. DPS Guardian is a bruiser conversion, not a glass cannon.','Prydwen Water core'),
      role('Crucible / Conquest · DPS','Personal-damage Water score build',['Swirling Blade','Lunarwater Threads','Seismic Tide','Raging Maelstrom'],['Frigid Aura','Defensive Assault','Frigid Glint','Pursuit of Victory'],'Use the Water shell when Guardian itself is the damage slot: drop the safety charm for Pursuit of Victory and lean into repeated Cold/Water pressure. If your team has a much stronger carry, Tank mode’s support bar will usually produce the better team score.','On bosses where Raging Maelstrom loses value, test a high-rank Star Shattering Slash in that flex slot rather than forcing AoE.','Prydwen Water + score logic'),
      role('Arena · DPS','Offensive block / counter bruiser',['Swirling Blade','Luminous Shield','Forceful Charge','Star Shattering Slash'],['Rebound','Holy Aegis','Block Mastery','Eye for an Eye'],'This keeps the proven Block/Rebound PvP shell but spends the flex slots on actual kill pressure. If Pandarial and your ranks support it, Luminous Shield → Light Sword Array is the aggressive flex; keep Block stats high.','If the opponent can burst through you, Eye for an Eye → Soul Protection or Potential Rebirth before changing the whole bar.','Prydwen secondary + PvP synthesis'),
      role('Tournament · 2v2 · DPS','Duo bruiser: survive focus while threatening kills',['Swirling Blade','Luminous Shield','Forceful Charge','Star Shattering Slash'],['Rebound','Holy Aegis','Block Mastery','Eye for an Eye'],'2v2 still rewards the counter/bruiser shell because you cannot afford to be deleted, but DPS mode keeps the fourth charm offensive instead of protecting the partner with Oath.','If you become the enemy team’s obvious first target, Eye for an Eye → Soul Protection; otherwise keep the pressure.','Current Guardian PvP synthesis'),
      role('Tournament · 4v4 · DPS','Water AoE team-pressure build',['Swirling Blade','Lunarwater Threads','Seismic Tide','Raging Maelstrom'],['Frigid Aura','Defensive Assault','Frigid Glint','Potential Rebirth'],'Four enemy bodies give the Water shell its best chance to stack Cold and spread pressure. If your team already has a real frontline and you are not being focused, Potential Rebirth → Pursuit of Victory for the greedier version.','If your team lacks a tank, switch the role toggle back to Tank rather than trying to make this bar absorb coordinated focus.','Prydwen Water + team-PvP logic')
    ],
    Destroyer:[
      role('Dungeon','Fire AoE horde-clear meta',['Formation Breaker','Fiery Star Trail','Fireball','Meteoric Flames'],['Rapid Cast','Void Bubble','Explosive Spirit','Fiery Burst'],'Fire is the dedicated dungeon/horde build because Fiery Burst scales off repeated Fire triggers across packs. If the room is boss-heavy and packs survive poorly, swap to the mixed AoE core instead.','Strong accounts can drop Void Bubble for offense, but a dead Destroyer loses more time than the greed gains.','Prydwen + Global testing'),
      role('Crucible / Conquest','Single-target score meta',['Formation Breaker','Divine Wrath','Wind Blade Spiral','Thunder of Judgment'],['Rapid Cast','Mana Surge','Radiant Sear','Incarnation of Light'],'Formation Breaker is non-negotiable and also accelerates a stronger carry. Wind Blade Spiral → Wind\'s Delight or Tempest Sphere if your ranks/dummy tests win; high-hit Wind\'s Delight can overperform through Radiant Sear procs.','If survival matters, Incarnation of Light → Void Bubble. On small bosses, Divine Wrath → Meteoric Flames can test better.','Guide + score testing'),
      role('Arena','Wind control / solo tempo',['Tempest Sphere','Wind Blade Spiral',"Wind's Delight",'Howling Hurricane'],['Cyclone Lament','Repelling Wind',"Wind's Shadow",'Void Bubble'],'Mono-Wind gives the cleanest solo-PvP identity: movement pressure, Laceration, knockback/delay and enough repeated hits to keep pressure on one target.','Keep Void Bubble unless you massively outgear the opponent; fragile casters usually need the extra turn.','Guide + community PvP'),
      role('Tournament · 2v2','Duo control + Formation Breaker tempo',['Formation Breaker','Tempest Sphere','Wind Blade Spiral',"Wind's Delight"],['Rapid Cast','Void Bubble','Repelling Wind','Cyclone Lament'],'Formation Breaker gains value because its action acceleration can swing your partner\'s turn order, while the rest of the bar keeps reliable player-sized Wind pressure.','If your teammate already supplies control, Repelling Wind can flex to Radiant Sear for more kill pressure.','Meta synthesis'),
      role('Tournament · 4v4','Team AoE + Formation Breaker acceleration',['Formation Breaker','Howling Hurricane','Meteoric Flames','Wind Blade Spiral'],['Rapid Cast','Void Bubble','Cyclone Lament','Radiant Sear'],'Formation Breaker is the centerpiece in 4v4: buff/advance allies, then layer broad AoE and Laceration pressure across the enemy team.','Keep Void Bubble under coordinated focus. If another source already covers team tempo, the fourth Technique is the first flex slot.','Prydwen team core')
    ],
    Dominator:[
      role('Dungeon','Hard-dungeon healer/support meta',['Waterling Summon','Rejuvenating Rain','Radiant Restoration','Frenzy Totem'],['Phantom Light','Healing Mastery','Overhealing','Resurrection'],'Need more raw healing: Frenzy Totem → Healing Touch. If nobody is dying, Resurrection → Mantra of Blessings. Phantom Light is mandatory for the T4 healer shell.','Use the Heals stat profile for this card. Mandragora is the pure-heal lead until Pandarial becomes live and validated.','Prydwen healer core'),
      role('Crucible / Conquest','Booster support for a stronger carry',['Radiant Restoration','Decoy Clone','Frenzy Totem','Dark Bullet'],['Phantom Light','Healing Mastery','Overhealing','Mantra of Blessings'],'This is team-score optimization, not personal recount chasing: Decoy + Totem + Mantra amplify the carry while Dark Bullet still contributes Erosion/debuff value. Coordinate duplicates—multiple Decoy/Mantra effects may not stack efficiently.','If you are actually the damage carry or playing solo, use the high-EHR ST Dark bar instead of this booster setup.','Loot & Waifus + Global testing'),
      role('Arena','Solo Dark burst / Erosion cash-out',['Abyssal Hand','Dark Starburst','Dark Bullet','Shadow of Termination'],['Linked Misfortune','Shadow Erosion','Mantra of Blessings','Shadow Vengeance'],'This is the simple current solo-PvP burst shell: apply Erosion, keep reliable direct Dark damage, then Termination cashes out. Mantra buffs you in solo play; Shadow Vengeance buys the finishing turn.','Do not force a pure-healer Arena bar unless your Healing Boost/SPD gear is unusually optimized; PvP healing is reduced.','Loot & Waifus Arena'),
      role('Tournament · 2v2','Duo anti-tank pressure + revive utility',['Dark Bullet','Dark Starburst','Abyssal Hand','Shadow of Termination'],['Linked Misfortune','Shadow Erosion','Resurrection','Shadow Vengeance'],'2v2 needs more kill pressure than 4v4. Keep the Erosion/Termination threat, but trade the selfish Arena buff slot for Resurrection because restoring your only teammate can flip the match.','If your partner is a much stronger carry, Linked Misfortune or Abyssal Hand can flex to Mantra/Frenzy support instead.','PvP synthesis'),
      role('Tournament · 4v4','Hybrid support / anti-tank utility',['Decoy Clone','Frenzy Totem','Dark Starburst','Abyssal Hand'],['Mantra of Blessings','Resurrection','Shadow Vengeance','Aberrancy'],'Do not default to full healing: Decoy pressures shield-heavy tanks, Totem + Mantra amplify the carry, Resurrection steals rounds, and Aberrancy is much better in broad debuff-heavy team fights than Arena.','If your team truly lacks sustain, Abyssal Hand → Radiant Restoration. Full-heal Tournament only makes sense on dedicated Healing Boost/SPD gear.','Community + guide PvP')
    ]
  };

  const FANTO={
    Berserker:{
      Solo:[pick('Nyxarchon','Main damage choice: extra damage plus DEF shred works in every S1 fight.'),pick('Aegiswing','S1 Assist survival/recovery is excellent for pushing stages above your power.'),pick('Sylvaerie','Permanent ATK + SPD improves both damage and turn tempo.'),pick('Zeioletus','Straightforward recurring burst when you want more damage instead of safety.')],
      Dungeon:[pick('Nyxarchon','Best overall clear lead: damage plus DEF shred benefits every target you focus.'),pick('Sylvaerie','ATK + SPD is consistent across every dungeon room.'),pick('Zeioletus','Extra AoE burst helps clean packs quickly.'),pick('Terragon','Physical-friendly damage with a chance to cut enemy ATK; useful when rooms hit hard.')],
      Boss:[pick('Nyxarchon','Best long-fight damage lead thanks to repeated damage and DEF shred.'),pick('Sylvaerie','Permanent ATK + SPD scales your whole boss rotation.'),pick('Terragon','Physical-friendly extra damage plus an ATK-down chance on the boss.'),pick('Zeioletus','Reliable extra burst if it outperforms Sylvaerie on your stats.')],
      PvP:[pick('Aegiswing','Main PvP pick: its S1 Assist survival/recovery buys another life without relying on Materialization.'),pick('Nyxarchon','Greedy option when you can trade safety for damage and DEF shred.'),pick('Sylvaerie','Speed can help you win action tempo while still adding ATK.'),pick('Terragon','ATK reduction can blunt enemy burst while still adding damage.')]
    },
    Paladin:{
      Solo:[pick('Aegiswing','Main S1 tank pick: survival/recovery adds a strong durability layer.'),pick('Armopi','Its S1 Assist already cycles DEF into a personal shield; good for DEF-heavy counter builds.'),pick('Boaro','Budget shield option that repeatedly triggers as you lose HP.'),pick('Kels','Useful when solo enemies have buffs worth dispelling.')],
      Dungeon:[pick('Aegiswing','Best general tank lead for surviving repeated party-dungeon pressure.'),pick('Armopi','DEF stacking and its personal shield work in S1 without Materialization.'),pick('Kels','Bring it when dungeon enemies use important buffs you want to dispel.'),pick('Boaro','Cheap repeated shielding when you need raw durability.')],
      Boss:[pick('Aegiswing','Safest default boss lead and Prydwen’s primary Paladin tank recommendation.'),pick('Kels','Excellent situational boss pick when dispel matters; its S1 value does not require Materialization.'),pick('Armopi','DEF + personal shield is strong when the boss repeatedly tests your tankiness.'),pick('Boaro','Budget defensive alternative with repeated shields.')],

    },
    Archmage:{

      Dungeon:[pick('Nyxarchon','Best premium damage lead for deleting rooms quickly.'),pick('Sylvaerie','ATK + SPD is ideal for fast dungeon clears.'),pick('Zeioletus','Additional AoE burst helps finish packs.'),pick('Armopi','Take the personal DEF/shield cycle if you are dying before the room is cleared.')],
      Boss:[pick('Nyxarchon','Best premium boss damage option with DEF shred.'),pick('Sylvaerie','Permanent ATK + SPD scales every cast.'),pick('Zeioletus','Good recurring damage when it tests better on your account.'),pick('Armopi','Safety option if the boss survives long enough to threaten you.')],
      PvP:[pick('Aegiswing','Main survival-first PvP pick; its base Assist buys extra life before Materialization exists.'),pick('Nyxarchon','Greedy damage/DEF-shred alternative.'),pick('Armopi','Pre-Materialization DEF + personal shield can buy a critical extra turn.'),pick('Sylvaerie','SPD helps contest turn order while adding ATK.')]
    },
    Arcanist:{
      Tournament:[pick('Nyxarchon','Main hybrid Tournament pick: damage plus DEF shred contributes even while you spend slots on team utility.'),pick('Sylvaerie','Alt for ATK + SPD; speed is especially valuable for getting support/debuff actions out early.')],
      Solo:[pick('Nyxarchon','Main DPS lead: Dark damage and the debuff line up naturally with Arcanist.'),pick('Zeioletus','Best simple F2P damage stopgap before Nyx.'),pick('Sylvaerie','Permanent SPD + ATK can beat Zei depending on your stats.'),pick('Aegiswing','Use its S1 survival/recovery when staying alive is more important than max DPS.')],
      Dungeon:[pick('Mandragora','Main healer pick: every ally-targeted Technique can trigger extra healing, with no Materialization needed.'),pick('Sylvaerie','SPD means more turns to heal and support.'),pick('Aegiswing','Keeps the healer alive through dangerous rooms using only its S1 Assist effect.'),pick('Herbote','Fallback self-heal/cleanse option, but unevolved S1 Herbote is weaker for pure healing than Mandragora.')],
      Boss:[pick('Nyxarchon','Main boss DPS choice: Dark damage plus a useful debuff.'),pick('Zeioletus','Straightforward damage alternative before Nyx.'),pick('Sylvaerie','SPD + ATK scales the whole DoT rotation.'),pick('Terragon','Can reduce boss ATK while still contributing damage.')],
      PvP:[pick('Aegiswing','Main support PvP choice: base survival/recovery helps you keep healing through burst.'),pick('Mandragora','More raw healing whenever you target allies.'),pick('Nyxarchon','Offensive option when you can afford to pressure instead of purely sustain.'),pick('Sylvaerie','Extra SPD improves support tempo.')]
    },
    Conqueror:{
      Solo:[pick('Nyxarchon','Main current S2 pick: Prydwen still rates its damage + DEF shred as BIS for generic content.'),pick('Aegiswing','Excellent high-push alternative when survival is the limiter.'),pick('Sylvaerie','Permanent ATK + SPD is the best currently available general damage alternative.'),pick('Zeioletus','Extra recurring burst if your stats make it outperform Sylvaerie.')],
      Dungeon:[pick('Nyxarchon','Best default damage lead for fast clears and DEF-shred stacking.'),pick('Aegiswing','Use when a high dungeon is killing you before your damage comes online.'),pick('Sylvaerie','ATK + SPD improves room-clearing speed.'),pick('Zeioletus','Adds direct burst to help finish packs.')],
      Boss:[pick('Nyxarchon','Main long-fight choice: DEF shred remains extremely valuable on hard bosses.'),pick('Sylvaerie','Permanent ATK + SPD scales the full boss rotation.'),pick('Zeioletus','Reliable extra damage if it tests better on your account.'),pick('Aegiswing','Defensive fallback for bosses where dying is the actual DPS loss.')],
      PvP:[pick('Aegiswing','Main PvP choice: extra survival plus its S2 Materialization utility is more valuable here than pure damage.'),pick('Nyxarchon','Greedy damage/DEF-shred alternative.'),pick('Sylvaerie','SPD can help win action tempo while still boosting ATK.'),pick('Zeioletus','Pure damage alternative when survivability is already covered.')]
    },
    Guardian:{
      Solo:[pick('Aegiswing','Main Guardian investment: Prydwen calls it the priority Mythic for the class, with survival and Taunt synergy.'),pick('Nyxarchon','Best offensive support alternative when you need more damage and debuffs.'),pick('Kels','Useful dispel/DEF-down utility when the stage benefits from it.'),pick('Boaro','Budget defensive option with shielding and S2 knockback utility.')],
      Dungeon:[pick('Aegiswing','Main tank lead: survival, extra Taunt and reduced damage from taunted enemies fit the dungeon job perfectly.'),pick('Kels','Strong party utility through dispel and Materialized DEF Down.'),pick('Nyxarchon','Offensive support option when your team wants faster kills.'),pick('Terragon','ATK/DMG reduction utility when enemy damage is the bigger problem.')],
      Boss:[pick('Kels','Main boss-support pick: Prydwen specifically highlights its dispel + Materialized DEF Down for team support.'),pick('Nyxarchon','Amplifies team damage with reliable debuffs and its own damage.'),pick('Terragon','Great when the raid needs enemy ATK/DMG reduction more than another damage debuff.'),pick('Aegiswing','Use when your personal survival or Taunt uptime is the limiting factor.')],
      PvP:[pick('Aegiswing','Main PvP Guardian pet: extra Taunt, survival and anti-Taunt damage reduction match the class role.'),pick('Kels','Utility alternative for dispelling buffs and adding DEF Down.'),pick('Nyxarchon','Greedy pressure option when your team already has enough protection.'),pick('Boaro','Budget control/survival alternative with shielding and knockback utility.')]
    },
    Destroyer:{
      Solo:[pick('Nyxarchon','Main premium choice: DEF shred plus strong damage suits a glass-cannon Destroyer.'),pick('Armopi','Prydwen’s survival alternative; its DEF/shield cycle can buy one extra turn.'),pick('Sylvaerie','Permanent ATK + SPD improves damage and action order.'),pick('Zeioletus','Simple recurring burst when you do not need extra safety.')],
      Dungeon:[pick('Nyxarchon','Main damage lead for clearing difficult rooms quickly.'),pick('Sylvaerie','ATK + SPD is excellent for speed-clearing dungeons.'),pick('Zeioletus','Extra AoE burst complements the Fire/AoE setup.'),pick('Armopi','Take the shield/DEF option if you are dying before your turn.')],
      Boss:[pick('Nyxarchon','Main premium boss option with damage and DEF shred.'),pick('Sylvaerie','Permanent ATK + SPD scales every cast.'),pick('Zeioletus','Additional recurring damage when it tests better on your stats.'),pick('Armopi','Safety fallback when the boss survives long enough to threaten you.')],
      PvP:[pick('Aegiswing','Main PvP survival pick: cheat-death style utility is more valuable than another pure damage pet here.'),pick('Nyxarchon','Greedy damage/DEF-shred option.'),pick('Armopi','DEF + shield gives a fragile caster another way to survive focus.'),pick('Sylvaerie','SPD helps contest turn order and still adds ATK.')]
    },
    Dominator:{
      Tournament:[pick('Nyxarchon','Main hybrid Tournament pick: adds real damage and DEF shred while the Dominator handles buffs and utility.'),pick('Terragon','Alt team-utility pick when reducing enemy ATK/pressure matters more than personal damage.')],
      Solo:[pick('Nyxarchon','Main DPS choice: Prydwen calls Nyx Dominator’s BIS thanks to Dark AoE damage and its supportive effect.'),pick('Zeioletus','Best straightforward F2P damage stopgap.'),pick('Sylvaerie','ATK + SPD can outperform Zei on some accounts.'),pick('Aegiswing','Use when surviving solo progression is more important than max damage.')],
      Dungeon:[pick('Mandragora','Main pure-healing pick: directly adds healing whenever you use ally-targeted Techniques.'),pick('Herbote','Strong S2 healing alternative once Materialized because it can extend its healing to allies.'),pick('Sylvaerie','SPD gives you more actions to heal/support.'),pick('Terragon','Support alternative when reducing enemy ATK/DMG helps the whole party more than extra healing.')],
      Boss:[pick('Nyxarchon','Main DPS lead for single-target Dark builds and team damage support.'),pick('Zeioletus','Direct damage alternative before or instead of Nyx.'),pick('Sylvaerie','Permanent SPD + ATK scales the whole boss rotation.'),pick('Terragon','Useful support option when lowering the boss’s ATK matters.')],
      PvP:[pick('Mandragora','Main support/healing pick when your job is keeping teammates alive.'),pick('Aegiswing','Survival-first alternative when you are being focused.'),pick('Terragon','Debuffing option that can reduce enemy pressure while you support.'),pick('Sylvaerie','SPD improves support tempo when raw healing is already sufficient.')]
    }
  };


  const META_CLASSES=new Set(['Conqueror','Guardian','Destroyer','Dominator']);
  const META_MODES=['Dungeon','Crucible / Conquest','Arena','Tournament'];
  const metaRead=(key,fallback)=>{try{return localStorage.getItem(key)||fallback}catch(_){return fallback}};
  const metaWrite=(key,val)=>{try{localStorage.setItem(key,val)}catch(_){}};
  const metaMode=()=>META_MODES.includes(metaRead('sxs-build-meta-mode','Dungeon'))?metaRead('sxs-build-meta-mode','Dungeon'):'Dungeon';
  const metaTournamentSize=()=>metaRead('sxs-build-tournament-size','4v4')==='2v2'?'2v2':'4v4';
  const guardianBuildMode=()=>metaRead('sxs-build-guardian-mode','tank')==='dps'?'dps':'tank';
  function ensureGuardianRoleControl(cls){
    if(cls!=='Guardian') return;
    const guide=document.querySelector('.builds .guideSummary');
    const strong=guide?.querySelector(':scope > div > strong');
    if(!guide||!strong) return;
    let row=guide.querySelector('.guardianHeadingRow');
    if(!row){
      row=document.createElement('div');
      row.className='guardianHeadingRow';
      strong.before(row);
      row.append(strong);
      const tabs=document.createElement('div');
      tabs.className='guardianModeTabs';
      tabs.setAttribute('role','group');
      tabs.setAttribute('aria-label','Guardian build role');
      tabs.innerHTML='<button type="button" data-guardian-mode="tank">Tank</button><button type="button" data-guardian-mode="dps">DPS</button>';
      row.append(tabs);
    }
    const active=guardianBuildMode();
    row.querySelectorAll('[data-guardian-mode]').forEach(btn=>{
      const on=btn.dataset.guardianMode===active;
      btn.classList.toggle('active',on);
      btn.setAttribute('aria-pressed',String(on));
    });
  }
  function ensureMetaControls(cls){
    const grid=document.querySelector('.builds .buildGrid');
    if(!grid) return;
    ensureGuardianRoleControl(cls);
    let box=document.querySelector('.builds .metaBuildControls');
    if(!META_CLASSES.has(cls)){
      box?.remove();
      grid.classList.remove('metaModeGrid');
      grid.querySelectorAll('.buildCard[hidden]').forEach(c=>c.hidden=false);
      return;
    }
    if(!box){
      box=document.createElement('div');
      box.className='metaBuildControls';
      box.innerHTML='<div class="metaBuildTabs">'+META_MODES.map(m=>'<button type="button" data-meta-mode="'+esc(m)+'">'+esc(m)+'</button>').join('')+'</div><div class="metaTournamentTabs"><button type="button" data-tournament-size="2v2">2v2</button><button type="button" data-tournament-size="4v4">4v4</button></div>';
      grid.before(box);
    }
    grid.classList.add('metaModeGrid');
  }
  function applyMetaVisibility(cls){
    const grid=document.querySelector('.builds .buildGrid');
    if(!grid||!META_CLASSES.has(cls)) return;
    ensureMetaControls(cls);
    const mode=metaMode(), size=metaTournamentSize(), guardianMode=guardianBuildMode();
    document.querySelectorAll('.builds .guardianModeTabs [data-guardian-mode]').forEach(b=>{const on=b.dataset.guardianMode===guardianMode;b.classList.toggle('active',on);b.setAttribute('aria-pressed',String(on));});
    const wanted=mode==='Tournament'?'Tournament · '+size:mode;
    document.querySelectorAll('.builds .metaBuildTabs button').forEach(b=>b.classList.toggle('active',b.dataset.metaMode===mode));
    const tour=document.querySelector('.builds .metaTournamentTabs');
    if(tour){
      tour.hidden=mode!=='Tournament';
      tour.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.tournamentSize===size));
    }
    grid.querySelectorAll(':scope > .buildCard').forEach(card=>{
      const wrongActivity=card.dataset.role!==wanted;
      const wrongGuardianRole=cls==='Guardian'&&card.dataset.guardianRole!==guardianMode;
      card.hidden=wrongActivity||wrongGuardianRole;
    });
  }

  function activeClass(){
    const b=document.querySelector('.builds .classTabs button.active');
    return b ? b.textContent.trim() : '';
  }
  function esc(s){
    return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function roleKey(title){
    const t=(title||'').toLowerCase();
    if(t==='dungeon') return 'Dungeon';
    if(t==='crucible / conquest') return 'Boss';
    if(t.startsWith('arena')) return 'Arena';
    if(t.startsWith('tournament')) return 'Tournament';
    if(t.startsWith('pvp')) return 'PvP';
    if(t.includes('dragon') || t.includes('single target') || t.includes('boss dps') || t.includes('support / boss')) return 'Boss';
    if(t.includes('dungeon tank') || t==='healing' || t.includes('fire aoe')) return 'Dungeon';
    return 'Solo';
  }
  function buildCardHtml(r){
    const gm=String(r.name||'').match(/^(.*?) · (Tank|DPS)$/);
    const displayName=gm?gm[1]:r.name;
    const guardianAttr=gm?' data-guardian-role="'+gm[2].toLowerCase()+'"':'';
    return '<article class="buildCard" data-role="'+esc(displayName)+'"'+guardianAttr+'>'
      +'<header><div><h3>'+esc(displayName)+'<span class="roleBadge">'+esc(r.confidence)+'</span></h3><p>'+esc(r.subtitle)+'</p></div></header>'
      +'<div class="skillGroup"><span>Techniques</span><div>'+r.techniques.map(x=>'<b>'+esc(x)+'</b>').join('')+'</div></div>'
      +'<div class="skillGroup"><span>Charms</span><div>'+r.charms.map(x=>'<b>'+esc(x)+'</b>').join('')+'</div></div>'
      +'<ul><li><b>Offensive:</b> '+esc(r.offensive)+'</li><li><b>Defensive:</b> '+esc(r.defensive)+'</li></ul>'
      +'</article>';
  }
  function applyRoleLoadouts(cls){
    const presets=ROLE_PRESETS[cls];
    const grid=document.querySelector('.builds .buildGrid');
    if(!presets||!grid) return;
    const sig=cls+'|'+presets.map(r=>[r.name,...r.techniques,...r.charms,r.offensive,r.defensive].join('~')).join('|');
    if(grid.dataset.rolePresetSig===sig) return;
    grid.dataset.rolePresetSig=sig;
    grid.innerHTML=presets.map(buildCardHtml).join('');
  }
  function picksFor(cls,title){
    const role=roleKey(title);
    const pools=FANTO[cls]||{};
    // Guardian DPS role prefers the offensive pet order; this automatically promotes Pandarial once the staged release patch adds it.
    const guardianDps=cls==='Guardian'&&typeof guardianBuildMode==='function'&&guardianBuildMode()==='dps';
    if(role==='Arena'){const base=pools.Arena||pools.PvP||[];if(guardianDps){const order=['Pandarial','Nyxarchon','Kels','Aegiswing','Terragon','Boaro'];return [...base].sort((a,b)=>(order.indexOf(a.name)<0?99:order.indexOf(a.name))-(order.indexOf(b.name)<0?99:order.indexOf(b.name)));}return base;}
    if(role==='Tournament'){
      const base=pools.Tournament||pools.PvP||pools.Dungeon||[];if(guardianDps){const order=['Pandarial','Nyxarchon','Kels','Aegiswing','Terragon','Boaro'];return [...base].sort((a,b)=>(order.indexOf(a.name)<0?99:order.indexOf(a.name))-(order.indexOf(b.name)<0?99:order.indexOf(b.name)));}return base;
    }
    const base=pools[role]||[];
    if(guardianDps){
      const order=['Pandarial','Nyxarchon','Kels','Aegiswing','Terragon','Boaro'];
      return [...base].sort((a,b)=>{const ai=order.indexOf(a.name),bi=order.indexOf(b.name);return (ai<0?99:ai)-(bi<0?99:bi);});
    }
    return base;
  }
  function applyFantos(cls){
    document.querySelectorAll('.builds .buildCard').forEach(card=>{
      const h3=card.querySelector('h3');
      const title=h3?.childNodes?.[0]?.textContent?.trim() || h3?.textContent.trim() || '';
      const picks=picksFor(cls,title);
      if(!picks.length) return;
      let box=card.querySelector('.fantomonPair');
      if(!box){
        box=document.createElement('div');
        box.className='fantomonPair';
        card.appendChild(box);
      }
      const sig=[cls,roleKey(title),...picks.flatMap(p=>[p.name,p.why])].join('|');
      if(box.dataset.sig===sig) return;
      box.dataset.sig=sig;
      const pair=picks.slice(0,2);
      box.innerHTML='<span>Combat Fantomons</span>'
        +'<div class="fantomonRankList">'
        +pair.map((p,i)=>'<div class="fantomonPick'+(i===0?' main':'')+'"><small>'+(i===0?'Main':'Alt')+'</small><b>'+esc(p.name)+'</b><p>'+esc(p.why)+'</p></div>').join('')
        +'</div>';
    });
  }
  function apply(){
    const cls=activeClass();
    if(!cls) return;
    document.querySelectorAll('.builds .buildRoleTabs').forEach(x=>x.remove());
    applyRoleLoadouts(cls);
    applyFantos(cls);
    ensureMetaControls(cls);
    applyMetaVisibility(cls);
  }
  let queued=false;
  function queueApply(){
    if(queued) return;
    queued=true;
    requestAnimationFrame(()=>{queued=false;apply();});
  }
  document.addEventListener('DOMContentLoaded',()=>{
    queueApply();
    const root=document.querySelector('.builds');
    if(root) new MutationObserver(queueApply).observe(root,{subtree:true,childList:true,attributes:true,attributeFilter:['class','aria-pressed']});
    root?.addEventListener('click',e=>{
      const guardianBtn=e.target.closest?.('[data-guardian-mode]');
      if(guardianBtn&&activeClass()==='Guardian'){metaWrite('sxs-build-guardian-mode',guardianBtn.dataset.guardianMode==='dps'?'dps':'tank');applyMetaVisibility('Guardian');queueApply();return;}
      const modeBtn=e.target.closest?.('[data-meta-mode]');
      if(modeBtn){metaWrite('sxs-build-meta-mode',modeBtn.dataset.metaMode);applyMetaVisibility(activeClass());return;}
      const sizeBtn=e.target.closest?.('[data-tournament-size]');
      if(sizeBtn){metaWrite('sxs-build-tournament-size',sizeBtn.dataset.tournamentSize);applyMetaVisibility(activeClass());}
    });
  });
  window.addEventListener('load',queueApply);
})();
</script>
