<!-- BUILD_FANTOMON_PAIRS_START -->
<style>
/* BUILD_FANTOMON_PAIRS_V1 */
.buildCard .fantomonPair{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.buildCard .fantomonPair>span{color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:7px;font-size:9px;font-weight:850;display:block}
.buildCard .fantomonPairRow{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.buildCard .fantomonPick{border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 88%,var(--accent-strong) 12%);border-radius:9px;padding:8px 9px;min-width:0}
.buildCard .fantomonPick small{color:var(--muted);display:block;font-size:8px;font-weight:850;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.buildCard .fantomonPick b{color:var(--ink);display:block;font-size:10px;line-height:1.3}
.buildCard .fantomonPick p{color:var(--muted);font-size:9px;line-height:1.35;margin:4px 0 0}
.buildCard .fantomonPick.main{border-color:color-mix(in srgb,var(--accent-strong) 48%,var(--line))}
@media(max-width:620px){.buildCard .fantomonPairRow{grid-template-columns:1fr}}
</style>
<script>
(function(){
  const pair=(main,alt,mainWhy,altWhy)=>({main,alt,mainWhy,altWhy});
  function activeClass(){
    const b=document.querySelector('.builds .classTabs button.active');
    return b ? b.textContent.trim() : '';
  }
  function healsMode(){
    return Array.from(document.querySelectorAll('.builds button.active'))
      .some(b=>b.textContent.trim().toLowerCase()==='heals');
  }
  function picksFor(cls,title,isHeals){
    const t=(title||'').toLowerCase();
    const pvp=/pvp|arena|mobility/.test(t);
    const boss=/boss|dragon|chaos|guild|raid|crucible|single/.test(t);
    const support=/support|team|tank/.test(t);

    // S1/T3 recommendations intentionally use Assist skills only. Do not give
    // Berserker, Paladin, Archmage or Arcanist credit for Materialization/Battle skills.
    if(cls==='Berserker') return pvp
      ? pair('Aegiswing','Nyxarchon','Safer S1 PvP lead: its opening survival/recovery effect helps you live through burst.','Aggressive swap: extra damage plus DEF shred when you can afford less safety.')
      : pair('Nyxarchon','Sylvaerie','Best damage lead: adds strong damage and stacks DEF shred for the whole fight.','Stable damage alt: permanent ATK + SPD buffs improve every turn.');
    if(cls==='Paladin'){
      if(pvp) return pair('Aegiswing','Armopi','Best S1 tank lead: its survival/recovery effect gives you another durability layer.','DEF stacking can outperform Aegis recovery on DEF-heavy or still-developing tank builds.');
      if(boss||support) return pair('Kels','Aegiswing','S1 Crucible support pick: dispels enemy buffs and contributes utility without relying on Materialization.','Use when personal survival/recovery matters more than dispel utility.');
      return pair('Aegiswing','Armopi','Most reliable general S1 tank pet thanks to its built-in survival and recovery effect.','Strong S1 fallback when repeated DEF stacking fits your build better than Aegis recovery.');
    }
    if(cls==='Archmage') return pvp
      ? pair('Aegiswing','Nyxarchon','Survival-first S1 PvP pick: its base survival/recovery effect buys extra turns for a fragile damage dealer.','Greedy alternative: DEF shred and extra damage if you can stay alive without Aegis.')
      : pair('Nyxarchon','Sylvaerie','Top offensive choice: strong pet damage plus DEF shred improves burst.','Permanent ATK + SPD is a simple, consistent damage boost.');
    if(cls==='Arcanist'){
      if(isHeals) return pvp
        ? pair('Aegiswing','Mandragora','Keeps the healer alive longer in S1 through its base survival/recovery effect.','More raw healing whenever your ally-targeted techniques trigger its heal.')
        : pair('Mandragora','Sylvaerie','Pure healing choice: repeatedly adds healing when you use techniques on allies.','Speed-focused alt: more actions means more chances to heal and support.');
      return pvp
        ? pair('Aegiswing','Nyxarchon','Safer S1 PvP option when surviving long enough to stack Erosion matters most.','Aggressive Dark option with AoE damage and a strong supportive debuff.')
        : pair('Nyxarchon','Zeioletus','Best DPS fit: Dark damage lines up with the class and adds a valuable debuff.','F2P damage alt: reliable extra AoE bursts when Nyx is unavailable.');
    }
    if(cls==='Conqueror') return pvp
      ? pair('Aegiswing','Nyxarchon','PvP safety: cheat-death, recovery and later Taunt help a melee DPS survive focus fire.','Higher-damage swap: DEF shred is excellent when your team already keeps you alive.')
      : pair('Nyxarchon','Sylvaerie','Current PvE best: extra damage plus DEF shred fits T4 DEF-shred stacking.','Best currently available general alt: permanent ATK + SPD until Pandarial releases.');
    if(cls==='Guardian'){
      if(pvp) return pair('Aegiswing','Kels','Priority Guardian pet: extra Taunt, survival and less damage from Taunted enemies after Materialization.','Utility swap: dispel enemy buffs and add a chance of DEF Down.');
      if(boss||support) return pair('Kels','Nyxarchon','Excellent team support: dispel plus Materialized DEF Down; Water damage also helps Cold setups.','More offensive support: reliable debuffs and extra damage for the group.');
      return pair('Aegiswing','Kels','Best general tank lead: survival plus additional Taunt/control.','Support alternative when dispel and DEF Down matter more than personal durability.');
    }
    if(cls==='Destroyer') return pvp
      ? pair('Aegiswing','Nyxarchon','Fragile caster safety: cheat-death and recovery buy the turns needed to cast.','Greedy damage option: DEF shred plus extra pet damage when survivability is covered.')
      : pair('Nyxarchon','Sylvaerie','Best offensive lead: adds damage and up to strong DEF shred for harder targets.','Consistent alt: permanent ATK + SPD improves both damage and action tempo.');
    if(cls==='Dominator'){
      if(isHeals) return pvp
        ? pair('Aegiswing','Mandragora','Survival-first healer choice so you can keep supporting through enemy burst.','Raw-healing swap that adds extra healing from ally-targeted techniques.')
        : pair('Mandragora','Sylvaerie','Best current pure-healing pick: directly adds more healing throughput.','Speed utility alt: more actions for heals/support when raw healing is already sufficient.');
      return pvp
        ? pair('Aegiswing','Nyxarchon','Use when survivability is the limiting factor in PvP.','Aggressive Dark swap with AoE damage and a useful debuff.')
        : pair('Nyxarchon','Zeioletus','Best DPS fit: strong AoE Dark damage plus a supportive debuff.','F2P damage alternative with reliable extra AoE bursts.');
    }
    return pair('Nyxarchon','Sylvaerie','Strong universal offensive option with damage and DEF shred.','Simple permanent ATK + SPD alternative.');
  }
  function apply(){
    const cls=activeClass();
    if(!cls) return;
    const isHeals=healsMode();
    document.querySelectorAll('.builds .buildCard').forEach(card=>{
      const title=card.querySelector('h3')?.textContent.trim()||'';
      const pick=picksFor(cls,title,isHeals);
      let box=card.querySelector('.fantomonPair');
      if(!box){
        box=document.createElement('div');
        box.className='fantomonPair';
        card.appendChild(box);
      }
      const sig=[cls,title,isHeals,pick.main,pick.alt,pick.mainWhy,pick.altWhy].join('|');
      if(box.dataset.sig===sig) return;
      box.dataset.sig=sig;
      box.innerHTML='<span>Combat Fantomon</span><div class="fantomonPairRow">'
        +'<div class="fantomonPick main"><small>Main</small><b>'+pick.main+'</b><p>'+pick.mainWhy+'</p></div>'
        +'<div class="fantomonPick"><small>Alt</small><b>'+pick.alt+'</b><p>'+pick.altWhy+'</p></div>'
        +'</div>';
    });
  }
  let queued=false;
  function queueApply(){
    if(queued) return;
    queued=true;
    requestAnimationFrame(()=>{queued=false;apply();});
  }
  document.addEventListener('DOMContentLoaded',()=>{
    queueApply();
    const root=document.querySelector('.builds');
    if(root) new MutationObserver(queueApply).observe(root,{subtree:true,childList:true,attributes:true,attributeFilter:['class','aria-pressed']});
  });
  window.addEventListener('load',queueApply);
})();
</script>
<!-- BUILD_FANTOMON_PAIRS_END -->
