<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Runtime Test</title></head>
<body>
<h1>Runtime Optimizer Test</h1>
<pre id="output"></pre>
<script type="module">
  import { runOptimizer } from './assets/runtime.js';
  const cfg = { cfg: 'test' };
  const projected = { level: 120, score: 2000 };
  const target = { targetStars: 800 };
  async function test() {
    const out = await runOptimizer(cfg, projected, target);
    document.getElementById('output').textContent = JSON.stringify(out, null, 2);
  }
  test();
</script>
</body>
</html>
